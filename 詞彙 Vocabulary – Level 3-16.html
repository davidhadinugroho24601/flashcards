<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 3-16 Flashcards (Click Hanzi for Pinyin)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: #f4f2ef;
            min-height: 100vh;
            padding: 2rem 1.5rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #1e1e2a;
        }

        .header h1 span {
            background: #d9c9b4;
            padding: 0.1rem 0.8rem;
            border-radius: 12px;
            color: #2c2c3a;
        }

        .header .sub {
            font-size: 1rem;
            color: #6b5f52;
            margin-top: 0.3rem;
            font-weight: 400;
        }

        .header .badge {
            display: inline-block;
            margin-top: 0.6rem;
            background: #2c2c3a;
            color: white;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            background: #ffffffd9;
            backdrop-filter: blur(6px);
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 2.2rem;
            border: 1px solid #e8e0d6;
        }

        .stats {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c2c3a;
            white-space: nowrap;
        }

        .stats strong {
            background: #ece6de;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-weight: 600;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f3efe9;
            padding: 0.1rem 0.1rem 0.1rem 1.2rem;
            border-radius: 40px;
            transition: 0.2s;
            border: 1px solid transparent;
            flex: 1;
            min-width: 180px;
        }

        .search-box:focus-within {
            background: #ffffff;
            border-color: #b8aa98;
            box-shadow: 0 0 0 3px rgba(184, 170, 152, 0.2);
        }

        .search-box input {
            border: none;
            background: transparent;
            font-size: 0.9rem;
            padding: 0.5rem 0;
            width: 100%;
            outline: none;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #1e1e2a;
        }

        .search-box input::placeholder {
            color: #a89b8c;
            font-weight: 400;
        }

        .search-box button {
            background: #2c2c3a;
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .search-box button:hover {
            background: #1a1a26;
        }

        .pinyin-global-toggle {
            background: #ece6de;
            border: 1px solid #d5cbbc;
            border-radius: 40px;
            padding: 0.3rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .pinyin-global-toggle:hover {
            background: #d5cbbc;
            border-color: #b8aa98;
        }

        .pinyin-global-toggle .icon {
            font-size: 1rem;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.2rem;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 0.6rem 1.2rem;
            background: #ffffffd9;
            border-radius: 40px;
            border: 1px solid #e8e0d6;
            font-size: 0.75rem;
            font-weight: 500;
            color: #2c2c3a;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .vocab-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid #ebe5dd;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .vocab-card:hover {
            border-color: #d0c3b2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .vocab-card .char-row {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.2rem;
        }

        .vocab-card .char {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1e1e2a;
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.2;
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease;
            padding: 0.1rem 0.4rem;
            border-radius: 8px;
            user-select: none;
        }

        .vocab-card .char:hover {
            color: #4a3f33;
            background: #f0ebe4;
        }

        .vocab-card .char:active {
            transform: scale(0.95);
        }

        .pinyin-container {
            display: inline-flex;
            align-items: center;
            min-width: 2.2rem;
            justify-content: center;
        }

        .pinyin-container .pinyin-value {
            font-size: 1rem;
            color: #6b5f52;
            font-weight: 400;
            letter-spacing: 0.3px;
            display: none;
        }

        .pinyin-container.revealed .pinyin-value {
            display: inline;
        }

        .vocab-card .pos {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            align-self: flex-start;
            margin-top: 0.6rem;
            background: #f0ebe4;
            color: #4a4037;
        }

        .pos-N {
            background: #dbe9f0;
            color: #1f5a7a;
        }
        .pos-V {
            background: #e6f0db;
            color: #3d6b2b;
        }
        .pos-Vs {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Vst {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Adv {
            background: #f0e6db;
            color: #7a5a2b;
        }
        .pos-Prep {
            background: #f0dbe6;
            color: #7a2b4a;
        }
        .pos-M {
            background: #e6dbf0;
            color: #4a2b7a;
        }
        .pos-Ptc {
            background: #f0e8db;
            color: #7a6b2b;
        }
        .pos-N\/V {
            background: #dbe8f0;
            color: #1f5a7a;
        }
        .pos-Conj {
            background: #f0e0d0;
            color: #7a5a3a;
        }
        .pos-Det {
            background: #f0d4d4;
            color: #7a3a3a;
        }
        .pos-V-sep {
            background: #d4e8d4;
            color: #2d6b2d;
        }
        .pos-Vpt {
            background: #d4d8e8;
            color: #3a4a7a;
        }
        .pos-Vi {
            background: #d4e0e0;
            color: #2d5a5a;
        }
        .pos-Vp {
            background: #d4d0d8;
            color: #3a3a5a;
        }
        .pos-Vaux {
            background: #d4d8e0;
            color: #3a4a5a;
        }
        .pos-Vs-attr {
            background: #d0e0d0;
            color: #2d6b3d;
        }
        .pos-Det\/N {
            background: #d0c0d0;
            color: #4a3a6a;
        }

        .details-toggle {
            margin-top: 1.2rem;
            background: none;
            border: 1px solid #d5cbbc;
            border-radius: 30px;
            padding: 0.5rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #4a4037;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
            align-self: flex-start;
            background: #faf8f5;
        }

        .details-toggle:hover {
            background: #e8e0d6;
            border-color: #b8aa98;
        }

        .details-toggle .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .details-toggle.active .arrow {
            transform: rotate(180deg);
        }

        .details-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
        }

        .details-content.open {
            max-height: 900px;
            opacity: 1;
            margin-top: 1.2rem;
        }

        .details-content .explanation {
            background: #f8f6f2;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #2c2c3a;
            border-left: 4px solid #d0c3b2;
            margin-bottom: 1rem;
        }

        .details-content .explanation strong {
            color: #1e1e2a;
        }

        .details-content .explanation .meaning-line {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e1e2a;
            background: #e8e0d6;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 0.4rem;
        }

        .dialogue-box {
            background: #f0f4f8;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.8;
        }

        .dialogue-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 0.3rem;
        }

        .dialogue-toggle-btn {
            background: #e8e0d6;
            border: none;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .dialogue-toggle-btn:hover {
            background: #d5cbbc;
        }

        .dialogue-box .speaker-a {
            color: #1f5a7a;
            font-weight: 600;
        }

        .dialogue-box .speaker-b {
            color: #3d6b2b;
            font-weight: 600;
        }

        .dialogue-box .line {
            margin-bottom: 0.2rem;
        }
        .dialogue-box .line:last-child {
            margin-bottom: 0;
        }

        .dialogue-box .zh {
            font-family: 'Noto Sans SC', sans-serif;
            margin-right: 0.3rem;
        }

        .dialogue-details {
            display: none;
            margin-left: 0.3rem;
        }

        .dialogue-details .pinyin-text {
            font-weight: 400;
            color: #6b5f52;
        }

        .dialogue-details .en-text {
            font-style: italic;
            color: #4a4037;
        }

        .dialogue-details .sep {
            color: #b8aa98;
            margin: 0 0.2rem;
        }

        .dialogue-box.show-translation .dialogue-details {
            display: inline;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1.1rem;
            color: #8f8172;
            background: #faf8f5;
            border-radius: 30px;
            border: 1px dashed #d5cbbc;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.8rem 3rem;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                border-radius: 28px;
                padding: 1rem 1.2rem;
                gap: 0.8rem;
            }
            .stats {
                text-align: center;
            }
            .search-box {
                padding: 0.1rem 0.1rem 0.1rem 1rem;
            }
            .search-box button {
                padding: 0.4rem 1rem;
                font-size: 0.8rem;
            }
            .vocab-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .vocab-card .char {
                font-size: 1.8rem;
            }
            .pinyin-global-toggle {
                justify-content: center;
            }
        }

        @media (min-width: 641px) and (max-width: 900px) {
            .vocab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 詞彙 <span>Level 3-16</span></h1>
            <div class="sub">Flashcard Mode · <strong>Click the Hanzi</strong> to reveal Pinyin</div>
            <div class="badge">🔍 Click the character to show pinyin · "Show Details" for meaning & dialogue</div>
        </div>

        <div class="toolbar">
            <div class="stats">
                <strong id="countDisplay">0</strong> words
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Chinese, Pinyin, or English..." autocomplete="off" />
                <button id="clearBtn">✕</button>
            </div>
            <button class="pinyin-global-toggle" id="pinyinGlobalToggle">
                <span class="icon">🔊</span>
                <span id="pinyinToggleLabel">Show All Pinyin</span>
            </button>
        </div>

        <div class="legend" id="legendContainer"></div>

        <div class="vocab-grid" id="vocabGrid"></div>
    </div>

    <script>
        // ------------------------------------------------------------
        // DATA — Level 3-16 Vocabulary (Traditional Hanzi)
        // ------------------------------------------------------------
        const vocabData = [{
            char: '航空',
            pinyin: 'hángkōng',
            pos: 'N',
            en: 'Aviation',
            explanation: 'Refers to the operation of aircraft, including commercial airlines and military aviation.',
            dialogue: [
                { speaker: 'A', chinese: '他從事航空業。', pinyin: 'Tā cóngshì hángkōng yè.', english: 'He works in the aviation industry.' },
                { speaker: 'B', chinese: '是飛行員嗎？', pinyin: 'Shì fēixíngyuán ma?', english: 'Is he a pilot?' }
            ]
        }, {
            char: '漢語',
            pinyin: 'hànyǔ',
            pos: 'N',
            en: 'Chinese language',
            explanation: 'The language spoken by the Han Chinese, usually referring to Mandarin Chinese (Standard Chinese).',
            dialogue: [
                { speaker: 'A', chinese: '你在學漢語嗎？', pinyin: 'Nǐ zài xué hànyǔ ma?', english: 'Are you learning Chinese?' },
                { speaker: 'B', chinese: '對，我學了一年了。', pinyin: 'Duì, wǒ xué le yī nián le.', english: 'Yes, I\'ve been learning for a year.' }
            ]
        }, {
            char: '好',
            pinyin: 'hǎo',
            pos: 'Vs',
            en: 'Good / Fine',
            explanation: 'A common stative verb meaning good, well, or fine. Can also be used as an adverb meaning "well."',
            dialogue: [
                { speaker: 'A', chinese: '這個主意很好。', pinyin: 'Zhège zhǔyi hěn hǎo.', english: 'This idea is very good.' },
                { speaker: 'B', chinese: '對，我們就照做吧。', pinyin: 'Duì, wǒmen jiù zhào zuò ba.', english: 'Yes, let\'s do that.' }
            ]
        }, {
            char: '好好',
            pinyin: 'hǎohāo',
            pos: 'Adv',
            en: 'Properly / Well (emphatic)',
            explanation: 'Used to emphasize doing something carefully, properly, or thoroughly. Often used in advice or instructions.',
            dialogue: [
                { speaker: 'A', chinese: '你要好好學習。', pinyin: 'Nǐ yào hǎohāo xuéxí.', english: 'You should study properly.' },
                { speaker: 'B', chinese: '我會的，謝謝你。', pinyin: 'Wǒ huì de, xièxie nǐ.', english: 'I will, thank you.' }
            ]
        }, {
            char: '好了',
            pinyin: 'hǎole',
            pos: 'Ptc',
            en: 'All right / Done / OK',
            explanation: 'A particle used to indicate completion or to signal that something is settled, often used to end a topic or confirm agreement.',
            dialogue: [
                { speaker: 'A', chinese: '我們出發吧！', pinyin: 'Wǒmen chūfā ba!', english: 'Let\'s set off!' },
                { speaker: 'B', chinese: '好了，我準備好了。', pinyin: 'Hǎole, wǒ zhǔnbèi hǎo le.', english: 'OK, I\'m ready.' }
            ]
        }, {
            char: '和',
            pinyin: 'hé',
            pos: 'Prep',
            en: 'With / And (conjunction)',
            explanation: 'As a preposition, means "with" (e.g., 和他一起). As a conjunction, means "and" (e.g., 我和你).',
            dialogue: [
                { speaker: 'A', chinese: '我和朋友一起去。', pinyin: 'Wǒ hé péngyou yīqǐ qù.', english: 'I\'m going with my friend.' },
                { speaker: 'B', chinese: '那你們路上小心。', pinyin: 'Nà nǐmen lùshàng xiǎoxīn.', english: 'Take care on the road.' }
            ]
        }, {
            char: '合',
            pinyin: 'hé',
            pos: 'Adv',
            en: 'Together / Combined',
            explanation: 'An adverb meaning "together" or "combined." Often used in compounds like 合作 (cooperate) or 合唱 (chorus).',
            dialogue: [
                { speaker: 'A', chinese: '我們合租一個公寓。', pinyin: 'Wǒmen hézū yī gè gōngyù.', english: 'We share an apartment together.' },
                { speaker: 'B', chinese: '這樣可以省錢。', pinyin: 'Zhèyàng kěyǐ shěng qián.', english: 'That way we can save money.' }
            ]
        }, {
            char: '合唱',
            pinyin: 'héchàng',
            pos: 'V',
            en: 'To sing together (chorus)',
            explanation: 'Refers to singing in a group or choir, where multiple voices perform together.',
            dialogue: [
                { speaker: 'A', chinese: '我們來合唱一首歌吧。', pinyin: 'Wǒmen lái héchàng yī shǒu gē ba.', english: 'Let\'s sing a song together.' },
                { speaker: 'B', chinese: '好，唱什麼歌？', pinyin: 'Hǎo, chàng shénme gē?', english: 'OK, what song?' }
            ]
        }, {
            char: '黑',
            pinyin: 'hēi',
            pos: 'Vs',
            en: 'Black',
            explanation: 'Describes the color black, or things that are dark in color.',
            dialogue: [
                { speaker: 'A', chinese: '他穿了一件黑色的外套。', pinyin: 'Tā chuān le yī jiàn hēisè de wàitào.', english: 'He wore a black coat.' },
                { speaker: 'B', chinese: '很適合他。', pinyin: 'Hěn shìhé tā.', english: 'It suits him well.' }
            ]
        }, {
            char: '恨',
            pinyin: 'hèn',
            pos: 'Vst',
            en: 'To hate / To regret',
            explanation: 'To feel strong dislike or animosity. Also used to express regret (恨自己).',
            dialogue: [
                { speaker: 'A', chinese: '他恨那些欺負他的人。', pinyin: 'Tā hèn nàxiē qīfù tā de rén.', english: 'He hates those who bully him.' },
                { speaker: 'B', chinese: '沒有人喜歡被欺負。', pinyin: 'Méiyǒu rén xǐhuān bèi qīfù.', english: 'No one likes to be bullied.' }
            ]
        }, {
            char: '恨不得',
            pinyin: 'hènbudé',
            pos: 'Vst',
            en: 'To wish (one could) / To be eager to',
            explanation: 'An expression meaning "can\'t wait to" or "wish one could," often used with a strong desire.',
            dialogue: [
                { speaker: 'A', chinese: '我恨不得馬上回家。', pinyin: 'Wǒ hènbudé mǎshàng huí jiā.', english: 'I can\'t wait to go home right now.' },
                { speaker: 'B', chinese: '再等一會吧，快結束了。', pinyin: 'Zài děng yīhuì ba, kuài jiéshù le.', english: 'Wait a bit longer, it\'s almost over.' }
            ]
        }, {
            char: '紅',
            pinyin: 'hóng',
            pos: 'Vs',
            en: 'Red',
            explanation: 'The color red, which is traditionally associated with good fortune and celebration in Chinese culture.',
            dialogue: [
                { speaker: 'A', chinese: '過年時要穿紅衣服。', pinyin: 'Guònián shí yào chuān hóng yīfu.', english: 'You should wear red clothes during New Year.' },
                { speaker: 'B', chinese: '對，紅色代表吉祥。', pinyin: 'Duì, hóngsè dàibiǎo jíxiáng.', english: 'Yes, red represents good luck.' }
            ]
        }, {
            char: '紅包',
            pinyin: 'hóngbāo',
            pos: 'N',
            en: 'Red envelope (with money)',
            explanation: 'A traditional gift of money in a red envelope, given during holidays or special occasions like Chinese New Year.',
            dialogue: [
                { speaker: 'A', chinese: '過年孩子們喜歡收紅包。', pinyin: 'Guònián háizimen xǐhuān shōu hóngbāo.', english: 'Children love to receive red envelopes during New Year.' },
                { speaker: 'B', chinese: '對，我也給他們紅包。', pinyin: 'Duì, wǒ yě gěi tāmen hóngbāo.', english: 'Yes, I also give them red envelopes.' }
            ]
        }, {
            char: '紅豆',
            pinyin: 'hóngdòu',
            pos: 'N',
            en: 'Red bean / Adzuki bean',
            explanation: 'A small red bean used in many East Asian desserts, like red bean soup or paste.',
            dialogue: [
                { speaker: 'A', chinese: '我喜歡喝紅豆湯。', pinyin: 'Wǒ xǐhuān hē hóngdòu tāng.', english: 'I like to drink red bean soup.' },
                { speaker: 'B', chinese: '甜而不膩，很好喝。', pinyin: 'Tián ér bù nì, hěn hǎohē.', english: 'It\'s sweet but not cloying, very tasty.' }
            ]
        }, {
            char: '紅綠燈',
            pinyin: 'hónglǜdēng',
            pos: 'N',
            en: 'Traffic light',
            explanation: 'The signal lights at an intersection that control traffic flow, with red, green, and yellow lights.',
            dialogue: [
                { speaker: 'A', chinese: '前面有紅綠燈，我們要停車。', pinyin: 'Qiánmiàn yǒu hónglǜdēng, wǒmen yào tíngchē.', english: 'There\'s a traffic light ahead, we need to stop.' },
                { speaker: 'B', chinese: '好的，現在是紅燈。', pinyin: 'Hǎo de, xiànzài shì hóngdēng.', english: 'OK, it\'s red now.' }
            ]
        }, {
            char: '厚',
            pinyin: 'hòu',
            pos: 'Vs',
            en: 'Thick',
            explanation: 'Describes the thickness of an object, or can mean "generous" or "deep" in a metaphorical sense.',
            dialogue: [
                { speaker: 'A', chinese: '這本書很厚。', pinyin: 'Zhè běn shū hěn hòu.', english: 'This book is very thick.' },
                { speaker: 'B', chinese: '要花很多時間讀。', pinyin: 'Yào huā hěnduō shíjiān dú.', english: 'It will take a lot of time to read.' }
            ]
        }, {
            char: '後',
            pinyin: 'hòu',
            pos: 'Det / N',
            en: 'Back / Behind / Later',
            explanation: 'As a determiner/noun, it indicates the back side or later time (e.g., 後天 = day after tomorrow).',
            dialogue: [
                { speaker: 'A', chinese: '我坐在他的後面。', pinyin: 'Wǒ zuò zài tā de hòumiàn.', english: 'I sit behind him.' },
                { speaker: 'B', chinese: '那你看得清楚嗎？', pinyin: 'Nà nǐ kàn de qīngchu ma?', english: 'Can you see clearly?' }
            ]
        }, {
            char: '忽然',
            pinyin: 'hūrán',
            pos: 'Adv',
            en: 'Suddenly',
            explanation: 'Indicates that something happens quickly and unexpectedly.',
            dialogue: [
                { speaker: 'A', chinese: '忽然下起大雨了。', pinyin: 'Hūrán xià qǐ dàyǔ le.', english: 'Suddenly it started raining heavily.' },
                { speaker: 'B', chinese: '我們快找地方躲雨。', pinyin: 'Wǒmen kuài zhǎo dìfang duǒ yǔ.', english: 'Let\'s find a place to take shelter.' }
            ]
        }, {
            char: '糊塗',
            pinyin: 'hútú',
            pos: 'Vs',
            en: 'Confused / Muddy-headed',
            explanation: 'Describes a person who is not clear-minded, forgetful, or confused about a situation.',
            dialogue: [
                { speaker: 'A', chinese: '我今天很糊塗，忘了帶鑰匙。', pinyin: 'Wǒ jīntiān hěn hútú, wàng le dài yàoshi.', english: 'I\'m so confused today, I forgot my keys.' },
                { speaker: 'B', chinese: '沒關係，我也有備用鑰匙。', pinyin: 'Méi guānxi, wǒ yě yǒu bèiyòng yàoshi.', english: 'It\'s okay, I have a spare key.' }
            ]
        }, {
            char: '互相',
            pinyin: 'hùxiāng',
            pos: 'Adv',
            en: 'Mutually / Each other',
            explanation: 'Indicates a reciprocal action or relationship between two or more parties.',
            dialogue: [
                { speaker: 'A', chinese: '我們要互相幫助。', pinyin: 'Wǒmen yào hùxiāng bāngzhù.', english: 'We should help each other.' },
                { speaker: 'B', chinese: '對，團結力量大。', pinyin: 'Duì, tuánjié lìliang dà.', english: 'Yes, unity makes us strong.' }
            ]
        }];

        // ------------------------------------------------------------
        // RENDER ENGINE
        // ------------------------------------------------------------
        const grid = document.getElementById('vocabGrid');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const countDisplay = document.getElementById('countDisplay');
        const legendContainer = document.getElementById('legendContainer');
        const pinyinGlobalToggle = document.getElementById('pinyinGlobalToggle');
        const pinyinToggleLabel = document.getElementById('pinyinToggleLabel');

        let globalPinyinRevealed = false;

        // Legend
        const posSet = new Set(vocabData.map(d => d.pos));
        const posLabels = {
            'N': 'Noun',
            'V': 'Verb',
            'Vs': 'Stative Verb',
            'Vst': 'Stative/Transitive Verb',
            'Adv': 'Adverb',
            'Prep': 'Preposition',
            'M': 'Measure Word',
            'Ptc': 'Particle',
            'N/V': 'Noun / Verb',
            'Conj': 'Conjunction',
            'Det': 'Determiner',
            'V-sep': 'Separable Verb',
            'Vpt': 'Verb Particle (Trans.)',
            'Vi': 'Intransitive Verb',
            'Vp': 'Verb Particle',
            'Vaux': 'Auxiliary Verb',
            'Vs-attr': 'Attributive Stative Verb',
            'Det/N': 'Determiner / Noun'
        };
        const dotColorMap = {
            'N': '#7ba9c9',
            'V': '#7fb06a',
            'Vs': '#5ba884',
            'Vst': '#5ba884',
            'Adv': '#c9a86a',
            'Prep': '#c97a9a',
            'M': '#9a7ac9',
            'Ptc': '#c9b86a',
            'N/V': '#7ba9c9',
            'Conj': '#f0d0b0',
            'Det': '#f0b0b0',
            'V-sep': '#6ab06a',
            'Vpt': '#6a7ab0',
            'Vi': '#6a9a9a',
            'Vp': '#7a7a9a',
            'Vaux': '#6a7a8a',
            'Vs-attr': '#80b080',
            'Det/N': '#d0c0d0'
        };

        function buildLegend() {
            const sorted = Array.from(posSet).sort();
            let html = '';
            sorted.forEach(label => {
                const display = posLabels[label] || label;
                const color = dotColorMap[label] || '#b8aa98';
                html += `<span class="legend-item"><span class="legend-dot" style="background:${color};"></span>${display}</span>`;
            });
            legendContainer.innerHTML = html;
        }
        buildLegend();

        // Render function
        function render(filter = '') {
            const term = filter.trim().toLowerCase();
            let filtered = vocabData;

            if (term) {
                filtered = vocabData.filter(item => {
                    let dialogueSearch = '';
                    item.dialogue.forEach(line => {
                        dialogueSearch += line.chinese + ' ' + line.pinyin + ' ' + line.english + ' ';
                    });
                    const searchable = item.char + ' ' + item.pinyin + ' ' + item.en + ' ' + item.explanation + ' ' + dialogueSearch;
                    return searchable.toLowerCase().includes(term);
                });
            }

            countDisplay.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty">🔍 No matches found.</div>`;
                return;
            }

            let html = '';
            filtered.forEach((item, index) => {
                const posClass = 'pos-' + item.pos.replace('/', '-');
                const posDisplay = posLabels[item.pos] || item.pos;

                // Build dialogue HTML
                let dialogueHtml = '';
                dialogueHtml += `
                        <div class="dialogue-toggle-wrapper">
                            <strong>💬 Dialogue:</strong>
                            <button class="dialogue-toggle-btn" data-dialogue-idx="${index}">Show Pinyin & Translation</button>
                        </div>
                        <div class="dialogue-lines">
                    `;

                item.dialogue.forEach(line => {
                    const speakerClass = line.speaker === 'A' ? 'speaker-a' : 'speaker-b';
                    dialogueHtml += `
                            <div class="line">
                                <span class="${speakerClass}">${line.speaker}:</span>
                                <span class="zh">${line.chinese}</span>
                                <span class="dialogue-details">
                                    <span class="sep">·</span>
                                    <span class="pinyin-text">${line.pinyin}</span>
                                    <span class="sep">·</span>
                                    <span class="en-text">${line.english}</span>
                                </span>
                            </div>
                        `;
                });

                dialogueHtml += `</div>`;

                html += `
                        <div class="vocab-card" data-index="${index}">
                            <div class="char-row">
                                <span class="char">${item.char}</span>
                                <span class="pinyin-container" data-pinyin="${item.pinyin}" data-revealed="false">
                                    <span class="pinyin-value">${item.pinyin}</span>
                                </span>
                            </div>
                            <span class="pos ${posClass}">${posDisplay}</span>

                            <button class="details-toggle" data-target="details-${index}">
                                <span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)
                            </button>

                            <div id="details-${index}" class="details-content">
                                <div class="explanation">
                                    <div class="meaning-line">📘 ${item.en}</div>
                                    <br />
                                    <strong>📖 Usage:</strong> ${item.explanation}
                                </div>
                                <div class="dialogue-box" id="dialogue-box-${index}">
                                    ${dialogueHtml}
                                </div>
                            </div>
                        </div>
                    `;
            });

            grid.innerHTML = html;

            // ---- Click on the Hanzi toggles its pinyin ----
            document.querySelectorAll('.char').forEach(charEl => {
                charEl.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const row = this.closest('.char-row');
                    const pinyinContainer = row ? row.querySelector('.pinyin-container') : null;
                    if (!pinyinContainer) return;
                    const isRevealed = pinyinContainer.dataset.revealed === 'true';
                    const newState = !isRevealed;
                    pinyinContainer.dataset.revealed = newState ? 'true' : 'false';
                    pinyinContainer.classList.toggle('revealed', newState);
                });
            });

            // ---- Apply global state to all pinyin containers ----
            document.querySelectorAll('.pinyin-container').forEach(el => {
                const shouldReveal = globalPinyinRevealed;
                el.dataset.revealed = shouldReveal ? 'true' : 'false';
                el.classList.toggle('revealed', shouldReveal);
            });

            // ---- Toggle main details (Meaning/Explanation) ----
            document.querySelectorAll('.details-toggle').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const targetId = this.dataset.target;
                    const content = document.getElementById(targetId);
                    if (!content) return;

                    const isOpen = content.classList.contains('open');
                    if (isOpen) {
                        content.classList.remove('open');
                        this.classList.remove('active');
                        this.innerHTML = '<span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)';
                    } else {
                        content.classList.add('open');
                        this.classList.add('active');
                        this.innerHTML = '<span class="arrow">▲</span> Hide Details';
                    }
                });
            });

            // ---- Toggle dialogue pinyin/translation ----
            document.querySelectorAll('.dialogue-toggle-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = this.dataset.dialogueIdx;
                    const dialogueBox = document.getElementById(`dialogue-box-${idx}`);
                    if (!dialogueBox) return;

                    const isShowing = dialogueBox.classList.contains('show-translation');
                    if (isShowing) {
                        dialogueBox.classList.remove('show-translation');
                        this.textContent = 'Show Pinyin & Translation';
                    } else {
                        dialogueBox.classList.add('show-translation');
                        this.textContent = 'Hide Pinyin & Translation';
                    }
                });
            });

            updateGlobalToggleLabel();
        }

        // ---- Global Pinyin Toggle ----
        function updateGlobalToggleLabel() {
            if (globalPinyinRevealed) {
                pinyinToggleLabel.textContent = 'Hide All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔓';
            } else {
                pinyinToggleLabel.textContent = 'Show All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔊';
            }
        }

        pinyinGlobalToggle.addEventListener('click', function() {
            globalPinyinRevealed = !globalPinyinRevealed;
            document.querySelectorAll('.pinyin-container').forEach(el => {
                el.dataset.revealed = globalPinyinRevealed ? 'true' : 'false';
                el.classList.toggle('revealed', globalPinyinRevealed);
            });
            updateGlobalToggleLabel();
        });

        // ---- Search & Clear ----
        searchInput.addEventListener('input', () => render(searchInput.value));
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            render('');
            searchInput.focus();
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') clearBtn.click();
        });

        // ---- Initial render ----
        render('');
    </script>
</body>
</html>
