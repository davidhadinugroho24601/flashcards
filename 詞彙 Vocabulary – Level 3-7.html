<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 3-7 Flashcards (Click Hanzi for Pinyin)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: #f4f2ef;
            min-height: 100vh;
            padding: 2rem 1.5rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #1e1e2a;
        }

        .header h1 span {
            background: #d9c9b4;
            padding: 0.1rem 0.8rem;
            border-radius: 12px;
            color: #2c2c3a;
        }

        .header .sub {
            font-size: 1rem;
            color: #6b5f52;
            margin-top: 0.3rem;
            font-weight: 400;
        }

        .header .badge {
            display: inline-block;
            margin-top: 0.6rem;
            background: #2c2c3a;
            color: white;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            background: #ffffffd9;
            backdrop-filter: blur(6px);
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 2.2rem;
            border: 1px solid #e8e0d6;
        }

        .stats {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c2c3a;
            white-space: nowrap;
        }

        .stats strong {
            background: #ece6de;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-weight: 600;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f3efe9;
            padding: 0.1rem 0.1rem 0.1rem 1.2rem;
            border-radius: 40px;
            transition: 0.2s;
            border: 1px solid transparent;
            flex: 1;
            min-width: 180px;
        }

        .search-box:focus-within {
            background: #ffffff;
            border-color: #b8aa98;
            box-shadow: 0 0 0 3px rgba(184, 170, 152, 0.2);
        }

        .search-box input {
            border: none;
            background: transparent;
            font-size: 0.9rem;
            padding: 0.5rem 0;
            width: 100%;
            outline: none;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #1e1e2a;
        }

        .search-box input::placeholder {
            color: #a89b8c;
            font-weight: 400;
        }

        .search-box button {
            background: #2c2c3a;
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .search-box button:hover {
            background: #1a1a26;
        }

        .pinyin-global-toggle {
            background: #ece6de;
            border: 1px solid #d5cbbc;
            border-radius: 40px;
            padding: 0.3rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .pinyin-global-toggle:hover {
            background: #d5cbbc;
            border-color: #b8aa98;
        }

        .pinyin-global-toggle .icon {
            font-size: 1rem;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.2rem;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 0.6rem 1.2rem;
            background: #ffffffd9;
            border-radius: 40px;
            border: 1px solid #e8e0d6;
            font-size: 0.75rem;
            font-weight: 500;
            color: #2c2c3a;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .vocab-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid #ebe5dd;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .vocab-card:hover {
            border-color: #d0c3b2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .vocab-card .char-row {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.2rem;
        }

        .vocab-card .char {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1e1e2a;
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.2;
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease;
            padding: 0.1rem 0.4rem;
            border-radius: 8px;
            user-select: none;
        }

        .vocab-card .char:hover {
            color: #4a3f33;
            background: #f0ebe4;
        }

        .vocab-card .char:active {
            transform: scale(0.95);
        }

        .pinyin-container {
            display: inline-flex;
            align-items: center;
            min-width: 2.2rem;
            justify-content: center;
        }

        .pinyin-container .pinyin-value {
            font-size: 1rem;
            color: #6b5f52;
            font-weight: 400;
            letter-spacing: 0.3px;
            display: none;
        }

        .pinyin-container.revealed .pinyin-value {
            display: inline;
        }

        .vocab-card .pos {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            align-self: flex-start;
            margin-top: 0.6rem;
            background: #f0ebe4;
            color: #4a4037;
        }

        .pos-N {
            background: #dbe9f0;
            color: #1f5a7a;
        }
        .pos-V {
            background: #e6f0db;
            color: #3d6b2b;
        }
        .pos-Vs {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Vst {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Adv {
            background: #f0e6db;
            color: #7a5a2b;
        }
        .pos-Prep {
            background: #f0dbe6;
            color: #7a2b4a;
        }
        .pos-M {
            background: #e6dbf0;
            color: #4a2b7a;
        }
        .pos-Ptc {
            background: #f0e8db;
            color: #7a6b2b;
        }
        .pos-N\/V {
            background: #dbe8f0;
            color: #1f5a7a;
        }
        .pos-Conj {
            background: #f0e0d0;
            color: #7a5a3a;
        }
        .pos-Det {
            background: #f0d4d4;
            color: #7a3a3a;
        }
        .pos-V-sep {
            background: #d4e8d4;
            color: #2d6b2d;
        }
        .pos-Vpt {
            background: #d4d8e8;
            color: #3a4a7a;
        }
        .pos-Vi {
            background: #d4e0e0;
            color: #2d5a5a;
        }

        .details-toggle {
            margin-top: 1.2rem;
            background: none;
            border: 1px solid #d5cbbc;
            border-radius: 30px;
            padding: 0.5rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #4a4037;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
            align-self: flex-start;
            background: #faf8f5;
        }

        .details-toggle:hover {
            background: #e8e0d6;
            border-color: #b8aa98;
        }

        .details-toggle .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .details-toggle.active .arrow {
            transform: rotate(180deg);
        }

        .details-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
        }

        .details-content.open {
            max-height: 900px;
            opacity: 1;
            margin-top: 1.2rem;
        }

        .details-content .explanation {
            background: #f8f6f2;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #2c2c3a;
            border-left: 4px solid #d0c3b2;
            margin-bottom: 1rem;
        }

        .details-content .explanation strong {
            color: #1e1e2a;
        }

        .details-content .explanation .meaning-line {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e1e2a;
            background: #e8e0d6;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 0.4rem;
        }

        .dialogue-box {
            background: #f0f4f8;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.8;
        }

        .dialogue-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 0.3rem;
        }

        .dialogue-toggle-btn {
            background: #e8e0d6;
            border: none;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .dialogue-toggle-btn:hover {
            background: #d5cbbc;
        }

        .dialogue-box .speaker-a {
            color: #1f5a7a;
            font-weight: 600;
        }

        .dialogue-box .speaker-b {
            color: #3d6b2b;
            font-weight: 600;
        }

        .dialogue-box .line {
            margin-bottom: 0.2rem;
        }
        .dialogue-box .line:last-child {
            margin-bottom: 0;
        }

        .dialogue-box .zh {
            font-family: 'Noto Sans SC', sans-serif;
            margin-right: 0.3rem;
        }

        .dialogue-details {
            display: none;
            margin-left: 0.3rem;
        }

        .dialogue-details .pinyin-text {
            font-weight: 400;
            color: #6b5f52;
        }

        .dialogue-details .en-text {
            font-style: italic;
            color: #4a4037;
        }

        .dialogue-details .sep {
            color: #b8aa98;
            margin: 0 0.2rem;
        }

        .dialogue-box.show-translation .dialogue-details {
            display: inline;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1.1rem;
            color: #8f8172;
            background: #faf8f5;
            border-radius: 30px;
            border: 1px dashed #d5cbbc;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.8rem 3rem;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                border-radius: 28px;
                padding: 1rem 1.2rem;
                gap: 0.8rem;
            }
            .stats {
                text-align: center;
            }
            .search-box {
                padding: 0.1rem 0.1rem 0.1rem 1rem;
            }
            .search-box button {
                padding: 0.4rem 1rem;
                font-size: 0.8rem;
            }
            .vocab-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .vocab-card .char {
                font-size: 1.8rem;
            }
            .pinyin-global-toggle {
                justify-content: center;
            }
        }

        @media (min-width: 641px) and (max-width: 900px) {
            .vocab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 詞彙 <span>Level 3-7</span></h1>
            <div class="sub">Flashcard Mode · <strong>Click the Hanzi</strong> to reveal Pinyin</div>
            <div class="badge">🔍 Click the character to show pinyin · "Show Details" for meaning & dialogue</div>
        </div>

        <div class="toolbar">
            <div class="stats">
                <strong id="countDisplay">0</strong> words
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Chinese, Pinyin, or English..." autocomplete="off" />
                <button id="clearBtn">✕</button>
            </div>
            <button class="pinyin-global-toggle" id="pinyinGlobalToggle">
                <span class="icon">🔊</span>
                <span id="pinyinToggleLabel">Show All Pinyin</span>
            </button>
        </div>

        <div class="legend" id="legendContainer"></div>

        <div class="vocab-grid" id="vocabGrid"></div>
    </div>

    <script>
        // ------------------------------------------------------------
        // DATA — Level 3-7 Vocabulary (Traditional Hanzi)
        // ------------------------------------------------------------
        const vocabData = [{
            char: '錯誤',
            pinyin: 'cuòwù',
            pos: 'N',
            en: 'Mistake / Error',
            explanation: 'Refers to an incorrect action, judgment, or belief. Used in various contexts, from grammar to serious faults.',
            dialogue: [
                { speaker: 'A', chinese: '我發現了一個錯誤。', pinyin: 'Wǒ fāxiàn le yī gè cuòwù.', english: 'I found a mistake.' },
                { speaker: 'B', chinese: '哪裡？我馬上改。', pinyin: 'Nǎlǐ? Wǒ mǎshàng gǎi.', english: 'Where? I\'ll fix it right away.' }
            ]
        }, {
            char: '挫折',
            pinyin: 'cuòzhé',
            pos: 'N',
            en: 'Setback / Frustration',
            explanation: 'A failure or disappointment that hinders progress. Often used to describe emotional reactions to obstacles.',
            dialogue: [
                { speaker: 'A', chinese: '他經歷了很多挫折。', pinyin: 'Tā jīnglì le hěnduō cuòzhé.', english: 'He has experienced many setbacks.' },
                { speaker: 'B', chinese: '但他從未放棄。', pinyin: 'Dàn tā cóng wèi fàngqì.', english: 'But he never gave up.' }
            ]
        }, {
            char: '達成',
            pinyin: 'dáchéng',
            pos: 'Vpt',
            en: 'To reach / To accomplish',
            explanation: 'To achieve a goal, agreement, or understanding. Often used with 協議 (agreement) or 目標 (target).',
            dialogue: [
                { speaker: 'A', chinese: '我們達成了共識。', pinyin: 'Wǒmen dáchéng le gòngshí.', english: 'We reached a consensus.' },
                { speaker: 'B', chinese: '太好了，這樣就可以繼續了。', pinyin: 'Tài hǎo le, zhèyàng jiù kěyǐ jìxù le.', english: 'Great, then we can continue.' }
            ]
        }, {
            char: '打架',
            pinyin: 'dǎjià',
            pos: 'V-sep',
            en: 'To fight (physically)',
            explanation: 'To engage in a physical altercation. Often used with children or arguments that escalate.',
            dialogue: [
                { speaker: 'A', chinese: '他們為什麼打架？', pinyin: 'Tāmen wèishénme dǎjià?', english: 'Why are they fighting?' },
                { speaker: 'B', chinese: '為了一件小事。', pinyin: 'Wèi le yī jiàn xiǎo shì.', english: 'Over a small matter.' }
            ]
        }, {
            char: '大多數',
            pinyin: 'dàduōshù',
            pos: 'Det',
            en: 'The majority / Most',
            explanation: 'A determiner meaning "the greater part" of a group. Used to indicate most people or things.',
            dialogue: [
                { speaker: 'A', chinese: '大多數人都同意。', pinyin: 'Dàduōshù rén dōu tóngyì.', english: 'Most people agree.' },
                { speaker: 'B', chinese: '那我們就執行吧。', pinyin: 'Nà wǒmen jiù zhíxíng ba.', english: 'Then let\'s implement it.' }
            ]
        }, {
            char: '大方',
            pinyin: 'dàfāng',
            pos: 'Vs',
            en: 'Generous / Elegant',
            explanation: 'Describes a person who is not stingy and is willing to give or share. Also can mean graceful and natural in behavior.',
            dialogue: [
                { speaker: 'A', chinese: '他對朋友很大方。', pinyin: 'Tā duì péngyou hěn dàfāng.', english: 'He is very generous to friends.' },
                { speaker: 'B', chinese: '是的，他常請客。', pinyin: 'Shì de, tā cháng qǐngkè.', english: 'Yes, he often treats others.' }
            ]
        }, {
            char: '大會',
            pinyin: 'dàhuì',
            pos: 'N',
            en: 'Plenary / General meeting',
            explanation: 'A formal large gathering or conference where many people come together to discuss important matters.',
            dialogue: [
                { speaker: 'A', chinese: '明天有年度大會。', pinyin: 'Míngtiān yǒu niándù dàhuì.', english: 'There is an annual general meeting tomorrow.' },
                { speaker: 'B', chinese: '我會準時參加。', pinyin: 'Wǒ huì zhǔnshí cānjiā.', english: 'I will attend on time.' }
            ]
        }, {
            char: '代表',
            pinyin: 'dàibiǎo',
            pos: 'N / V',
            en: 'Representative / To represent',
            explanation: 'As a noun, a person chosen to act on behalf of others. As a verb, to stand for or act on behalf of someone or something.',
            dialogue: [
                { speaker: 'A', chinese: '他是我們班的代表。', pinyin: 'Tā shì wǒmen bān de dàibiǎo.', english: 'He is the representative of our class.' },
                { speaker: 'B', chinese: '他代表大家發言。', pinyin: 'Tā dàibiǎo dàjiā fāyán.', english: 'He speaks on behalf of everyone.' }
            ]
        }, {
            char: '代替',
            pinyin: 'dàitì',
            pos: 'V',
            en: 'To replace / To substitute',
            explanation: 'To take the place of someone or something else. Often used with 人 (person) or 物 (thing).',
            dialogue: [
                { speaker: 'A', chinese: '誰能代替他？', pinyin: 'Shéi néng dàitì tā?', english: 'Who can replace him?' },
                { speaker: 'B', chinese: '暫時沒人，但我們會找。', pinyin: 'Zànshí méi rén, dàn wǒmen huì zhǎo.', english: 'No one for now, but we\'ll find someone.' }
            ]
        }, {
            char: '帶領',
            pinyin: 'dàilǐng',
            pos: 'V',
            en: 'To lead / To guide',
            explanation: 'To guide a group of people toward a goal or destination, often by providing direction and support.',
            dialogue: [
                { speaker: 'A', chinese: '他帶領我們完成任務。', pinyin: 'Tā dàilǐng wǒmen wánchéng rènwù.', english: 'He led us to complete the task.' },
                { speaker: 'B', chinese: '他是一個好領導。', pinyin: 'Tā shì yī gè hǎo lǐngdǎo.', english: 'He is a good leader.' }
            ]
        }, {
            char: '單純',
            pinyin: 'dānchún',
            pos: 'Vs',
            en: 'Simple / Pure',
            explanation: 'Describes something that is uncomplicated, or a person who is innocent and without deceit.',
            dialogue: [
                { speaker: 'A', chinese: '他的想法很單純。', pinyin: 'Tā de xiǎngfǎ hěn dānchún.', english: 'His thinking is very simple.' },
                { speaker: 'B', chinese: '也許這樣更好。', pinyin: 'Yěxǔ zhèyàng gèng hǎo.', english: 'Maybe that\'s better.' }
            ]
        }, {
            char: '淡',
            pinyin: 'dàn',
            pos: 'Vs',
            en: 'Light / Bland / Weak',
            explanation: 'Describes a taste that is not strong, a color that is pale, or a relationship that is not intense.',
            dialogue: [
                { speaker: 'A', chinese: '這湯太淡了。', pinyin: 'Zhè tāng tài dàn le.', english: 'This soup is too bland.' },
                { speaker: 'B', chinese: '加點鹽吧。', pinyin: 'Jiā diǎn yán ba.', english: 'Add some salt.' }
            ]
        }, {
            char: '當場',
            pinyin: 'dāngchǎng',
            pos: 'Adv',
            en: 'On the spot / Immediately',
            explanation: 'Indicates that something happens at the exact time and place of an event, without delay.',
            dialogue: [
                { speaker: 'A', chinese: '他當場承認了錯誤。', pinyin: 'Tā dāngchǎng chéngrèn le cuòwù.', english: 'He admitted his mistake on the spot.' },
                { speaker: 'B', chinese: '那很好，勇於承擔。', pinyin: 'Nà hěn hǎo, yǒngyú chéngdān.', english: 'That\'s good, brave to take responsibility.' }
            ]
        }, {
            char: '當地',
            pinyin: 'dāngdì',
            pos: 'N',
            en: 'Local / The place in question',
            explanation: 'Refers to the specific location being discussed, often used in news or travel contexts.',
            dialogue: [
                { speaker: 'A', chinese: '當地人很熱情。', pinyin: 'Dāngdì rén hěn rèqíng.', english: 'The locals are very warm.' },
                { speaker: 'B', chinese: '我很喜歡那裡的文化。', pinyin: 'Wǒ hěn xǐhuān nàlǐ de wénhuà.', english: 'I really like the culture there.' }
            ]
        }, {
            char: '當面',
            pinyin: 'dāngmiàn',
            pos: 'Adv',
            en: 'In person / Face to face',
            explanation: 'Indicates that an action is done directly in someone\'s presence, not through a third party or remotely.',
            dialogue: [
                { speaker: 'A', chinese: '你應該當面向他道歉。', pinyin: 'Nǐ yīnggāi dāngmiàn xiàng tā dàoqiàn.', english: 'You should apologize to him in person.' },
                { speaker: 'B', chinese: '我會的，這樣更有誠意。', pinyin: 'Wǒ huì de, zhèyàng gèng yǒu chéngyì.', english: 'I will, that\'s more sincere.' }
            ]
        }, {
            char: '當年',
            pinyin: 'dāngnián',
            pos: 'N',
            en: 'In those years / Back then',
            explanation: 'Refers to a particular time in the past, often with nostalgic or contrasting implications.',
            dialogue: [
                { speaker: 'A', chinese: '當年我們都很年輕。', pinyin: 'Dāngnián wǒmen dōu hěn niánqīng.', english: 'Back then we were all young.' },
                { speaker: 'B', chinese: '是啊，時間過得真快。', pinyin: 'Shì a, shíjiān guò de zhēn kuài.', english: 'Yes, time flies.' }
            ]
        }, {
            char: '當天',
            pinyin: 'dāngtiān',
            pos: 'N',
            en: 'That very day',
            explanation: 'Refers to the same day as a reference point, often used in scheduling or reporting.',
            dialogue: [
                { speaker: 'A', chinese: '當天我就完成了任務。', pinyin: 'Dāngtiān wǒ jiù wánchéng le rènwù.', english: 'I finished the task on that very day.' },
                { speaker: 'B', chinese: '你效率真高。', pinyin: 'Nǐ xiàolǜ zhēn gāo.', english: 'You are really efficient.' }
            ]
        }, {
            char: '當作',
            pinyin: 'dàngzuò',
            pos: 'Vst',
            en: 'To regard as / To treat as',
            explanation: 'To consider or treat something as something else. Often used with 把 structure. Also written as 當做.',
            dialogue: [
                { speaker: 'A', chinese: '別把我的話當作耳邊風。', pinyin: 'Bié bǎ wǒ de huà dàngzuò ěrbiānfēng.', english: 'Don\'t treat my words as wind passing by the ear (i.e., ignore them).' },
                { speaker: 'B', chinese: '我會記住的。', pinyin: 'Wǒ huì jìzhù de.', english: 'I will remember.' }
            ]
        }, {
            char: '擔任',
            pinyin: 'dānrèn',
            pos: 'V',
            en: 'To hold (a position)',
            explanation: 'To take on or hold a job, role, or responsibility. Often used with titles like 教師, 主席, etc.',
            dialogue: [
                { speaker: 'A', chinese: '他擔任公司經理。', pinyin: 'Tā dānrèn gōngsī jīnglǐ.', english: 'He holds the position of company manager.' },
                { speaker: 'B', chinese: '他很有能力。', pinyin: 'Tā hěn yǒu nénglì.', english: 'He is very capable.' }
            ]
        }, {
            char: '單身',
            pinyin: 'dānshēn',
            pos: 'Vs',
            en: 'Single / Unmarried',
            explanation: 'Describes a person who is not married and not in a romantic relationship. Often used for adults.',
            dialogue: [
                { speaker: 'A', chinese: '他還是單身。', pinyin: 'Tā háishì dānshēn.', english: 'He is still single.' },
                { speaker: 'B', chinese: '他想要找一個伴侶。', pinyin: 'Tā xiǎng yào zhǎo yī gè bànlǚ.', english: 'He wants to find a partner.' }
            ]
        }, {
            char: '島',
            pinyin: 'dǎo',
            pos: 'N',
            en: 'Island',
            explanation: 'A piece of land surrounded by water. Used for both natural and artificial islands.',
            dialogue: [
                { speaker: 'A', chinese: '我們去那個島度假吧。', pinyin: 'Wǒmen qù nàge dǎo dùjià ba.', english: 'Let\'s go to that island for vacation.' },
                { speaker: 'B', chinese: '好，那裡風景很美。', pinyin: 'Hǎo, nàlǐ fēngjǐng hěn měi.', english: 'OK, the scenery there is beautiful.' }
            ]
        }, {
            char: '倒',
            pinyin: 'dào',
            pos: 'V',
            en: 'To pour / To turn upside down',
            explanation: 'To pour liquid, or to fall over, collapse. Also used as an adverb meaning "instead" or "on the contrary" in some contexts.',
            dialogue: [
                { speaker: 'A', chinese: '請倒一杯水給我。', pinyin: 'Qǐng dào yī bēi shuǐ gěi wǒ.', english: 'Please pour a glass of water for me.' },
                { speaker: 'B', chinese: '好的，給你。', pinyin: 'Hǎo de, gěi nǐ.', english: 'OK, here you go.' }
            ]
        }, {
            char: '導演',
            pinyin: 'dǎoyǎn',
            pos: 'N',
            en: 'Director (film / theater)',
            explanation: 'A person who directs a film, play, or performance. Responsible for creative and technical aspects.',
            dialogue: [
                { speaker: 'A', chinese: '這位導演很有才華。', pinyin: 'Zhè wèi dǎoyǎn hěn yǒu cáihuá.', english: 'This director is very talented.' },
                { speaker: 'B', chinese: '我喜歡他的電影。', pinyin: 'Wǒ xǐhuān tā de diànyǐng.', english: 'I like his movies.' }
            ]
        }, {
            char: '到',
            pinyin: 'dào',
            pos: 'Conj / Prep',
            en: 'To (arrive) / Until',
            explanation: 'Can be a conjunction meaning "until" (e.g., 到...為止) or a preposition meaning "to" a place or time. Also a verb meaning "to arrive."',
            dialogue: [
                { speaker: 'A', chinese: '我們到北京了。', pinyin: 'Wǒmen dào Běijīng le.', english: 'We have arrived in Beijing.' },
                { speaker: 'B', chinese: '歡迎！旅途辛苦嗎？', pinyin: 'Huānyíng! Lǚtú xīnkǔ ma?', english: 'Welcome! Was the trip tiring?' }
            ]
        }];

        // ------------------------------------------------------------
        // RENDER ENGINE
        // ------------------------------------------------------------
        const grid = document.getElementById('vocabGrid');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const countDisplay = document.getElementById('countDisplay');
        const legendContainer = document.getElementById('legendContainer');
        const pinyinGlobalToggle = document.getElementById('pinyinGlobalToggle');
        const pinyinToggleLabel = document.getElementById('pinyinToggleLabel');

        let globalPinyinRevealed = false;

        // Legend
        const posSet = new Set(vocabData.map(d => d.pos));
        const posLabels = {
            'N': 'Noun',
            'V': 'Verb',
            'Vs': 'Stative Verb',
            'Vst': 'Stative/Transitive Verb',
            'Adv': 'Adverb',
            'Prep': 'Preposition',
            'M': 'Measure Word',
            'Ptc': 'Particle',
            'N/V': 'Noun / Verb',
            'Conj': 'Conjunction',
            'Det': 'Determiner',
            'V-sep': 'Separable Verb',
            'Vpt': 'Verb Particle (Trans.)',
            'Vi': 'Intransitive Verb'
        };
        const dotColorMap = {
            'N': '#7ba9c9',
            'V': '#7fb06a',
            'Vs': '#5ba884',
            'Vst': '#5ba884',
            'Adv': '#c9a86a',
            'Prep': '#c97a9a',
            'M': '#9a7ac9',
            'Ptc': '#c9b86a',
            'N/V': '#7ba9c9',
            'Conj': '#f0d0b0',
            'Det': '#f0b0b0',
            'V-sep': '#6ab06a',
            'Vpt': '#6a7ab0',
            'Vi': '#6a9a9a'
        };

        function buildLegend() {
            const sorted = Array.from(posSet).sort();
            let html = '';
            sorted.forEach(label => {
                const display = posLabels[label] || label;
                const color = dotColorMap[label] || '#b8aa98';
                html += `<span class="legend-item"><span class="legend-dot" style="background:${color};"></span>${display}</span>`;
            });
            legendContainer.innerHTML = html;
        }
        buildLegend();

        // Render function
        function render(filter = '') {
            const term = filter.trim().toLowerCase();
            let filtered = vocabData;

            if (term) {
                filtered = vocabData.filter(item => {
                    let dialogueSearch = '';
                    item.dialogue.forEach(line => {
                        dialogueSearch += line.chinese + ' ' + line.pinyin + ' ' + line.english + ' ';
                    });
                    const searchable = item.char + ' ' + item.pinyin + ' ' + item.en + ' ' + item.explanation + ' ' + dialogueSearch;
                    return searchable.toLowerCase().includes(term);
                });
            }

            countDisplay.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty">🔍 No matches found.</div>`;
                return;
            }

            let html = '';
            filtered.forEach((item, index) => {
                const posClass = 'pos-' + item.pos.replace('/', '-');
                const posDisplay = posLabels[item.pos] || item.pos;

                // Build dialogue HTML
                let dialogueHtml = '';
                dialogueHtml += `
                        <div class="dialogue-toggle-wrapper">
                            <strong>💬 Dialogue:</strong>
                            <button class="dialogue-toggle-btn" data-dialogue-idx="${index}">Show Pinyin & Translation</button>
                        </div>
                        <div class="dialogue-lines">
                    `;

                item.dialogue.forEach(line => {
                    const speakerClass = line.speaker === 'A' ? 'speaker-a' : 'speaker-b';
                    dialogueHtml += `
                            <div class="line">
                                <span class="${speakerClass}">${line.speaker}:</span>
                                <span class="zh">${line.chinese}</span>
                                <span class="dialogue-details">
                                    <span class="sep">·</span>
                                    <span class="pinyin-text">${line.pinyin}</span>
                                    <span class="sep">·</span>
                                    <span class="en-text">${line.english}</span>
                                </span>
                            </div>
                        `;
                });

                dialogueHtml += `</div>`;

                html += `
                        <div class="vocab-card" data-index="${index}">
                            <div class="char-row">
                                <span class="char">${item.char}</span>
                                <span class="pinyin-container" data-pinyin="${item.pinyin}" data-revealed="false">
                                    <span class="pinyin-value">${item.pinyin}</span>
                                </span>
                            </div>
                            <span class="pos ${posClass}">${posDisplay}</span>

                            <button class="details-toggle" data-target="details-${index}">
                                <span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)
                            </button>

                            <div id="details-${index}" class="details-content">
                                <div class="explanation">
                                    <div class="meaning-line">📘 ${item.en}</div>
                                    <br />
                                    <strong>📖 Usage:</strong> ${item.explanation}
                                </div>
                                <div class="dialogue-box" id="dialogue-box-${index}">
                                    ${dialogueHtml}
                                </div>
                            </div>
                        </div>
                    `;
            });

            grid.innerHTML = html;

            // ---- Click on the Hanzi toggles its pinyin ----
            document.querySelectorAll('.char').forEach(charEl => {
                charEl.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const row = this.closest('.char-row');
                    const pinyinContainer = row ? row.querySelector('.pinyin-container') : null;
                    if (!pinyinContainer) return;
                    const isRevealed = pinyinContainer.dataset.revealed === 'true';
                    const newState = !isRevealed;
                    pinyinContainer.dataset.revealed = newState ? 'true' : 'false';
                    pinyinContainer.classList.toggle('revealed', newState);
                });
            });

            // ---- Apply global state to all pinyin containers ----
            document.querySelectorAll('.pinyin-container').forEach(el => {
                const shouldReveal = globalPinyinRevealed;
                el.dataset.revealed = shouldReveal ? 'true' : 'false';
                el.classList.toggle('revealed', shouldReveal);
            });

            // ---- Toggle main details (Meaning/Explanation) ----
            document.querySelectorAll('.details-toggle').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const targetId = this.dataset.target;
                    const content = document.getElementById(targetId);
                    if (!content) return;

                    const isOpen = content.classList.contains('open');
                    if (isOpen) {
                        content.classList.remove('open');
                        this.classList.remove('active');
                        this.innerHTML = '<span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)';
                    } else {
                        content.classList.add('open');
                        this.classList.add('active');
                        this.innerHTML = '<span class="arrow">▲</span> Hide Details';
                    }
                });
            });

            // ---- Toggle dialogue pinyin/translation ----
            document.querySelectorAll('.dialogue-toggle-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = this.dataset.dialogueIdx;
                    const dialogueBox = document.getElementById(`dialogue-box-${idx}`);
                    if (!dialogueBox) return;

                    const isShowing = dialogueBox.classList.contains('show-translation');
                    if (isShowing) {
                        dialogueBox.classList.remove('show-translation');
                        this.textContent = 'Show Pinyin & Translation';
                    } else {
                        dialogueBox.classList.add('show-translation');
                        this.textContent = 'Hide Pinyin & Translation';
                    }
                });
            });

            updateGlobalToggleLabel();
        }

        // ---- Global Pinyin Toggle ----
        function updateGlobalToggleLabel() {
            if (globalPinyinRevealed) {
                pinyinToggleLabel.textContent = 'Hide All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔓';
            } else {
                pinyinToggleLabel.textContent = 'Show All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔊';
            }
        }

        pinyinGlobalToggle.addEventListener('click', function() {
            globalPinyinRevealed = !globalPinyinRevealed;
            document.querySelectorAll('.pinyin-container').forEach(el => {
                el.dataset.revealed = globalPinyinRevealed ? 'true' : 'false';
                el.classList.toggle('revealed', globalPinyinRevealed);
            });
            updateGlobalToggleLabel();
        });

        // ---- Search & Clear ----
        searchInput.addEventListener('input', () => render(searchInput.value));
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            render('');
            searchInput.focus();
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') clearBtn.click();
        });

        // ---- Initial render ----
        render('');
    </script>
</body>
</html>
