<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 3-25 Flashcards (Click Hanzi for Pinyin)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: #f4f2ef;
            min-height: 100vh;
            padding: 2rem 1.5rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #1e1e2a;
        }

        .header h1 span {
            background: #d9c9b4;
            padding: 0.1rem 0.8rem;
            border-radius: 12px;
            color: #2c2c3a;
        }

        .header .sub {
            font-size: 1rem;
            color: #6b5f52;
            margin-top: 0.3rem;
            font-weight: 400;
        }

        .header .badge {
            display: inline-block;
            margin-top: 0.6rem;
            background: #2c2c3a;
            color: white;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            background: #ffffffd9;
            backdrop-filter: blur(6px);
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 2.2rem;
            border: 1px solid #e8e0d6;
        }

        .stats {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c2c3a;
            white-space: nowrap;
        }

        .stats strong {
            background: #ece6de;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-weight: 600;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f3efe9;
            padding: 0.1rem 0.1rem 0.1rem 1.2rem;
            border-radius: 40px;
            transition: 0.2s;
            border: 1px solid transparent;
            flex: 1;
            min-width: 180px;
        }

        .search-box:focus-within {
            background: #ffffff;
            border-color: #b8aa98;
            box-shadow: 0 0 0 3px rgba(184, 170, 152, 0.2);
        }

        .search-box input {
            border: none;
            background: transparent;
            font-size: 0.9rem;
            padding: 0.5rem 0;
            width: 100%;
            outline: none;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #1e1e2a;
        }

        .search-box input::placeholder {
            color: #a89b8c;
            font-weight: 400;
        }

        .search-box button {
            background: #2c2c3a;
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .search-box button:hover {
            background: #1a1a26;
        }

        .pinyin-global-toggle {
            background: #ece6de;
            border: 1px solid #d5cbbc;
            border-radius: 40px;
            padding: 0.3rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .pinyin-global-toggle:hover {
            background: #d5cbbc;
            border-color: #b8aa98;
        }

        .pinyin-global-toggle .icon {
            font-size: 1rem;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.2rem;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 0.6rem 1.2rem;
            background: #ffffffd9;
            border-radius: 40px;
            border: 1px solid #e8e0d6;
            font-size: 0.75rem;
            font-weight: 500;
            color: #2c2c3a;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .vocab-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid #ebe5dd;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .vocab-card:hover {
            border-color: #d0c3b2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .vocab-card .char-row {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.2rem;
        }

        .vocab-card .char {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1e1e2a;
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.2;
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease;
            padding: 0.1rem 0.4rem;
            border-radius: 8px;
            user-select: none;
        }

        .vocab-card .char:hover {
            color: #4a3f33;
            background: #f0ebe4;
        }

        .vocab-card .char:active {
            transform: scale(0.95);
        }

        .pinyin-container {
            display: inline-flex;
            align-items: center;
            min-width: 2.2rem;
            justify-content: center;
        }

        .pinyin-container .pinyin-value {
            font-size: 1rem;
            color: #6b5f52;
            font-weight: 400;
            letter-spacing: 0.3px;
            display: none;
        }

        .pinyin-container.revealed .pinyin-value {
            display: inline;
        }

        .vocab-card .pos {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            align-self: flex-start;
            margin-top: 0.6rem;
            background: #f0ebe4;
            color: #4a4037;
        }

        .pos-N {
            background: #dbe9f0;
            color: #1f5a7a;
        }
        .pos-V {
            background: #e6f0db;
            color: #3d6b2b;
        }
        .pos-Vs {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Vst {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Adv {
            background: #f0e6db;
            color: #7a5a2b;
        }
        .pos-Prep {
            background: #f0dbe6;
            color: #7a2b4a;
        }
        .pos-M {
            background: #e6dbf0;
            color: #4a2b7a;
        }
        .pos-Ptc {
            background: #f0e8db;
            color: #7a6b2b;
        }
        .pos-N\/V {
            background: #dbe8f0;
            color: #1f5a7a;
        }
        .pos-Conj {
            background: #f0e0d0;
            color: #7a5a3a;
        }
        .pos-V-sep {
            background: #d4e8d4;
            color: #2d6b2d;
        }
        .pos-Vp {
            background: #d4d8e8;
            color: #3a4a7a;
        }
        .pos-Vp-sep {
            background: #d4d4d4;
            color: #3a3a5a;
        }
        .pos-Vi {
            background: #d4e0e0;
            color: #2d5a5a;
        }

        .details-toggle {
            margin-top: 1.2rem;
            background: none;
            border: 1px solid #d5cbbc;
            border-radius: 30px;
            padding: 0.5rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #4a4037;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
            align-self: flex-start;
            background: #faf8f5;
        }

        .details-toggle:hover {
            background: #e8e0d6;
            border-color: #b8aa98;
        }

        .details-toggle .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .details-toggle.active .arrow {
            transform: rotate(180deg);
        }

        .details-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
        }

        .details-content.open {
            max-height: 900px;
            opacity: 1;
            margin-top: 1.2rem;
        }

        .details-content .explanation {
            background: #f8f6f2;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #2c2c3a;
            border-left: 4px solid #d0c3b2;
            margin-bottom: 1rem;
        }

        .details-content .explanation strong {
            color: #1e1e2a;
        }

        .details-content .explanation .meaning-line {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e1e2a;
            background: #e8e0d6;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 0.4rem;
        }

        .dialogue-box {
            background: #f0f4f8;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.8;
        }

        .dialogue-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 0.3rem;
        }

        .dialogue-toggle-btn {
            background: #e8e0d6;
            border: none;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .dialogue-toggle-btn:hover {
            background: #d5cbbc;
        }

        .dialogue-box .speaker-a {
            color: #1f5a7a;
            font-weight: 600;
        }

        .dialogue-box .speaker-b {
            color: #3d6b2b;
            font-weight: 600;
        }

        .dialogue-box .line {
            margin-bottom: 0.2rem;
        }
        .dialogue-box .line:last-child {
            margin-bottom: 0;
        }

        .dialogue-box .zh {
            font-family: 'Noto Sans SC', sans-serif;
            margin-right: 0.3rem;
        }

        .dialogue-details {
            display: none;
            margin-left: 0.3rem;
        }

        .dialogue-details .pinyin-text {
            font-weight: 400;
            color: #6b5f52;
        }

        .dialogue-details .en-text {
            font-style: italic;
            color: #4a4037;
        }

        .dialogue-details .sep {
            color: #b8aa98;
            margin: 0 0.2rem;
        }

        .dialogue-box.show-translation .dialogue-details {
            display: inline;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1.1rem;
            color: #8f8172;
            background: #faf8f5;
            border-radius: 30px;
            border: 1px dashed #d5cbbc;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.8rem 3rem;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                border-radius: 28px;
                padding: 1rem 1.2rem;
                gap: 0.8rem;
            }
            .stats {
                text-align: center;
            }
            .search-box {
                padding: 0.1rem 0.1rem 0.1rem 1rem;
            }
            .search-box button {
                padding: 0.4rem 1rem;
                font-size: 0.8rem;
            }
            .vocab-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .vocab-card .char {
                font-size: 1.8rem;
            }
            .pinyin-global-toggle {
                justify-content: center;
            }
        }

        @media (min-width: 641px) and (max-width: 900px) {
            .vocab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 詞彙 <span>Level 3-25</span></h1>
            <div class="sub">Flashcard Mode · <strong>Click the Hanzi</strong> to reveal Pinyin</div>
            <div class="badge">🔍 Click the character to show pinyin · "Show Details" for meaning & dialogue</div>
        </div>

        <div class="toolbar">
            <div class="stats">
                <strong id="countDisplay">0</strong> words
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Chinese, Pinyin, or English..." autocomplete="off" />
                <button id="clearBtn">✕</button>
            </div>
            <button class="pinyin-global-toggle" id="pinyinGlobalToggle">
                <span class="icon">🔊</span>
                <span id="pinyinToggleLabel">Show All Pinyin</span>
            </button>
        </div>

        <div class="legend" id="legendContainer"></div>

        <div class="vocab-grid" id="vocabGrid"></div>
    </div>

    <script>
        // ------------------------------------------------------------
        // DATA — Level 3-25 Vocabulary (Traditional Hanzi)
        // ------------------------------------------------------------
        const vocabData = [{
            char: '淚',
            pinyin: 'lèi',
            pos: 'N',
            en: 'Tears',
            explanation: 'The drops of liquid that come from the eyes when a person cries.',
            dialogue: [
                { speaker: 'A', chinese: '她的眼淚流了下來。', pinyin: 'Tā de yǎnlèi liú le xiàlái.', english: 'Her tears flowed down.' },
                { speaker: 'B', chinese: '為什麼她哭了？', pinyin: 'Wèishénme tā kū le?', english: 'Why is she crying?' }
            ]
        }, {
            char: '冷淡',
            pinyin: 'lěngdàn',
            pos: 'Vs',
            en: 'Cold / Indifferent',
            explanation: 'Describes a person or attitude that is not warm, friendly, or enthusiastic.',
            dialogue: [
                { speaker: 'A', chinese: '他對我的態度很冷淡。', pinyin: 'Tā duì wǒ de tàidù hěn lěngdàn.', english: 'He is very cold toward me.' },
                { speaker: 'B', chinese: '你們吵架了嗎？', pinyin: 'Nǐmen chǎojià le ma?', english: 'Did you two have a fight?' }
            ]
        }, {
            char: '力',
            pinyin: 'lì',
            pos: 'N',
            en: 'Power / Strength',
            explanation: 'Physical or mental energy, or the ability to do something.',
            dialogue: [
                { speaker: 'A', chinese: '他用盡了全力。', pinyin: 'Tā yòng jìn le quánlì.', english: 'He used all his strength.' },
                { speaker: 'B', chinese: '他真的很努力。', pinyin: 'Tā zhēn de hěn nǔlì.', english: 'He really worked hard.' }
            ]
        }, {
            char: '里',
            pinyin: 'lǐ',
            pos: 'M',
            en: 'Measure word for distance (li)',
            explanation: 'A traditional Chinese unit of distance, approximately 500 meters. Also used as a measure word for things inside.',
            dialogue: [
                { speaker: 'A', chinese: '車站離這裡兩里路。', pinyin: 'Chēzhàn lí zhèlǐ liǎng lǐ lù.', english: 'The station is two li from here.' },
                { speaker: 'B', chinese: '那就是一公里左右。', pinyin: 'Nà jiù shì yī gōnglǐ zuǒyòu.', english: 'That\'s about one kilometer.' }
            ]
        }, {
            char: '戀',
            pinyin: 'liàn',
            pos: 'V',
            en: 'To love / To be attached to',
            explanation: 'To have strong affection for someone or something, often romantic.',
            dialogue: [
                { speaker: 'A', chinese: '她戀上了那個男孩。', pinyin: 'Tā liàn shàng le nàge nánhái.', english: 'She fell in love with that boy.' },
                { speaker: 'B', chinese: '他們很配。', pinyin: 'Tāmen hěn pèi.', english: 'They are a good match.' }
            ]
        }, {
            char: '戀愛',
            pinyin: 'liàn'ài',
            pos: 'Vp',
            en: 'To be in love / Romance',
            explanation: 'To have a romantic relationship with someone.',
            dialogue: [
                { speaker: 'A', chinese: '他們正在戀愛。', pinyin: 'Tāmen zhèngzài liàn'ài.', english: 'They are in love.' },
                { speaker: 'B', chinese: '真的很甜蜜。', pinyin: 'Zhēn de hěn tiánmì.', english: 'It\'s really sweet.' }
            ]
        }, {
            char: '亮',
            pinyin: 'liàng',
            pos: 'Vs',
            en: 'Bright / Shining',
            explanation: 'Describes light that is strong, or a person who is smart and clear.',
            dialogue: [
                { speaker: 'A', chinese: '今天陽光很亮。', pinyin: 'Jīntiān yángguāng hěn liàng.', english: 'The sunlight is very bright today.' },
                { speaker: 'B', chinese: '對，我們戴太陽眼鏡吧。', pinyin: 'Duì, wǒmen dài tàiyáng yǎnjìng ba.', english: 'Yes, let\'s wear sunglasses.' }
            ]
        }, {
            char: '良好',
            pinyin: 'liánghǎo',
            pos: 'Vs',
            en: 'Good / Fine',
            explanation: 'Describes a positive state of affairs, often used for health, habits, or relationships.',
            dialogue: [
                { speaker: 'A', chinese: '他的身體狀況良好。', pinyin: 'Tā de shēntǐ zhuàngkuàng liánghǎo.', english: 'His physical condition is good.' },
                { speaker: 'B', chinese: '那就放心了。', pinyin: 'Nà jiù fàngxīn le.', english: 'That\'s reassuring.' }
            ]
        }, {
            char: '聯絡',
            pinyin: 'liánluò',
            pos: 'V',
            en: 'To contact / To connect',
            explanation: 'To get in touch with someone, or to link things together.',
            dialogue: [
                { speaker: 'A', chinese: '我們保持聯絡。', pinyin: 'Wǒmen bǎochí liánluò.', english: 'Let\'s keep in touch.' },
                { speaker: 'B', chinese: '好的，我會打電話給你。', pinyin: 'Hǎo de, wǒ huì dǎ diànhuà gěi nǐ.', english: 'OK, I will call you.' }
            ]
        }, {
            char: '連續劇',
            pinyin: 'liánxùjù',
            pos: 'N',
            en: 'TV series / Serial drama',
            explanation: 'A television show with a continuing storyline that airs in multiple episodes.',
            dialogue: [
                { speaker: 'A', chinese: '你最近在看什麼連續劇？', pinyin: 'Nǐ zuìjìn zài kàn shénme liánxùjù?', english: 'What TV series are you watching lately?' },
                { speaker: 'B', chinese: '我在看一部韓劇。', pinyin: 'Wǒ zài kàn yī bù Hánjù.', english: 'I\'m watching a Korean drama.' }
            ]
        }, {
            char: '了不起',
            pinyin: 'liǎobùqǐ',
            pos: 'Vs',
            en: 'Remarkable / Amazing',
            explanation: 'Used to describe something or someone that is very impressive or extraordinary.',
            dialogue: [
                { speaker: 'A', chinese: '他取得了不起的成就。', pinyin: 'Tā qǔdé le liǎobùqǐ de chéngjiù.', english: 'He achieved remarkable success.' },
                { speaker: 'B', chinese: '他真的很優秀。', pinyin: 'Tā zhēn de hěn yōuxiù.', english: 'He is really outstanding.' }
            ]
        }, {
            char: '離婚',
            pinyin: 'líhūn',
            pos: 'Vp-sep',
            en: 'To divorce',
            explanation: 'To legally end a marriage. Can be separated (e.g., 離了婚).',
            dialogue: [
                { speaker: 'A', chinese: '他們去年離婚了。', pinyin: 'Tāmen qùnián líhūn le.', english: 'They divorced last year.' },
                { speaker: 'B', chinese: '真可惜，他們本來很恩愛。', pinyin: 'Zhēn kěxí, tāmen běnlái hěn ēnài.', english: 'What a pity; they used to be very loving.' }
            ]
        }, {
            char: '裡邊',
            pinyin: 'lǐbian',
            pos: 'N',
            en: 'Inside / Within',
            explanation: 'The interior of a place or object.',
            dialogue: [
                { speaker: 'A', chinese: '書在櫃子裡邊。', pinyin: 'Shū zài guìzi lǐbian.', english: 'The book is inside the cabinet.' },
                { speaker: 'B', chinese: '我找到了，謝謝。', pinyin: 'Wǒ zhǎodào le, xièxie.', english: 'I found it, thanks.' }
            ]
        }, {
            char: '厲害',
            pinyin: 'lìhài',
            pos: 'Vs',
            en: 'Impressive / Severe',
            explanation: 'Describes something that is powerful, intense, or very skilled. Can be positive or negative.',
            dialogue: [
                { speaker: 'A', chinese: '他中文說得很厲害。', pinyin: 'Tā Zhōngwén shuō de hěn lìhài.', english: 'He speaks Chinese very well.' },
                { speaker: 'B', chinese: '他學了十年了。', pinyin: 'Tā xué le shí nián le.', english: 'He has been learning for ten years.' }
            ]
        }, {
            char: '理解',
            pinyin: 'lǐjiě',
            pos: 'Vst',
            en: 'To understand',
            explanation: 'To grasp the meaning of something, or to be empathetic toward someone.',
            dialogue: [
                { speaker: 'A', chinese: '你理解我的意思嗎？', pinyin: 'Nǐ lǐjiě wǒ de yìsi ma?', english: 'Do you understand what I mean?' },
                { speaker: 'B', chinese: '理解了，我完全明白。', pinyin: 'Lǐjiě le, wǒ wánquán míngbái.', english: 'Yes, I completely understand.' }
            ]
        }, {
            char: '理論',
            pinyin: 'lǐlùn',
            pos: 'N',
            en: 'Theory',
            explanation: 'A system of ideas or principles that explains a phenomenon, often based on evidence.',
            dialogue: [
                { speaker: 'A', chinese: '這個理論很有趣。', pinyin: 'Zhège lǐlùn hěn yǒuqù.', english: 'This theory is very interesting.' },
                { speaker: 'B', chinese: '但需要實踐來證明。', pinyin: 'Dàn xūyào shíjiàn lái zhèngmíng.', english: 'But it needs practice to prove.' }
            ]
        }, {
            char: '禮堂',
            pinyin: 'lǐtáng',
            pos: 'N',
            en: 'Auditorium / Hall',
            explanation: 'A large room or building used for public gatherings, ceremonies, or performances.',
            dialogue: [
                { speaker: 'A', chinese: '畢業典禮在禮堂舉行。', pinyin: 'Bìyè diǎnlǐ zài lǐtáng jǔxíng.', english: 'The graduation ceremony will be held in the auditorium.' },
                { speaker: 'B', chinese: '那裡可以容納很多人。', pinyin: 'Nàlǐ kěyǐ róngnà hěnduō rén.', english: 'It can accommodate many people.' }
            ]
        }, {
            char: '力量',
            pinyin: 'lìliàng',
            pos: 'N',
            en: 'Strength / Power',
            explanation: 'The physical or mental power to do something, or the influence of a group.',
            dialogue: [
                { speaker: 'A', chinese: '團結就是力量。', pinyin: 'Tuánjié jiù shì lìliàng.', english: 'Unity is strength.' },
                { speaker: 'B', chinese: '對，大家一起努力。', pinyin: 'Duì, dàjiā yīqǐ nǔlì.', english: 'Yes, let\'s all work together.' }
            ]
        }, {
            char: '領',
            pinyin: 'lǐng',
            pos: 'V',
            en: 'To lead / To receive',
            explanation: 'To guide, direct, or receive something (e.g., 領薪水).',
            dialogue: [
                { speaker: 'A', chinese: '他領著我們走。', pinyin: 'Tā lǐng zhe wǒmen zǒu.', english: 'He led us.' },
                { speaker: 'B', chinese: '他對這條路很熟。', pinyin: 'Tā duì zhè tiáo lù hěn shú.', english: 'He is familiar with this road.' }
            ]
        }, {
            char: '領導',
            pinyin: 'lǐngdǎo',
            pos: 'V',
            en: 'To lead / Leader',
            explanation: 'As a verb, to guide or direct a group. As a noun, a person in a leadership position.',
            dialogue: [
                { speaker: 'A', chinese: '他是我們的領導。', pinyin: 'Tā shì wǒmen de lǐngdǎo.', english: 'He is our leader.' },
                { speaker: 'B', chinese: '他很有能力。', pinyin: 'Tā hěn yǒu nénglì.', english: 'He is very capable.' }
            ]
        }, {
            char: '靈魂',
            pinyin: 'línghún',
            pos: 'N',
            en: 'Soul / Spirit',
            explanation: 'The spiritual or immaterial part of a human being, often believed to survive after death.',
            dialogue: [
                { speaker: 'A', chinese: '音樂是藝術的靈魂。', pinyin: 'Yīnyuè shì yìshù de línghún.', english: 'Music is the soul of art.' },
                { speaker: 'B', chinese: '我很同意。', pinyin: 'Wǒ hěn tóngyì.', english: 'I totally agree.' }
            ]
        }, {
            char: '領域',
            pinyin: 'lǐngyù',
            pos: 'N',
            en: 'Field / Domain',
            explanation: 'A particular area of activity, knowledge, or interest.',
            dialogue: [
                { speaker: 'A', chinese: '他在科技領域很有名。', pinyin: 'Tā zài kējì lǐngyù hěn yǒumíng.', english: 'He is famous in the field of technology.' },
                { speaker: 'B', chinese: '他發表了很多論文。', pinyin: 'Tā fābiǎo le hěnduō lùnwén.', english: 'He has published many papers.' }
            ]
        }, {
            char: '令',
            pinyin: 'lìng',
            pos: 'Vst',
            en: 'To cause / To make (someone)',
            explanation: 'To cause a person to feel or do something. Often used as a causative verb.',
            dialogue: [
                { speaker: 'A', chinese: '這個消息令人驚訝。', pinyin: 'Zhège xiāoxi lìng rén jīngyà.', english: 'This news is surprising.' },
                { speaker: 'B', chinese: '真的嗎？我也很驚訝。', pinyin: 'Zhēn de ma? Wǒ yě hěn jīngyà.', english: 'Really? I\'m also surprised.' }
            ]
        }, {
            char: '留言',
            pinyin: 'liúyán',
            pos: 'Vi',
            en: 'To leave a message',
            explanation: 'To leave a written or recorded message for someone.',
            dialogue: [
                { speaker: 'A', chinese: '他給你留了言。', pinyin: 'Tā gěi nǐ liú le yán.', english: 'He left a message for you.' },
                { speaker: 'B', chinese: '我馬上去聽。', pinyin: 'Wǒ mǎshàng qù tīng.', english: 'I\'ll go listen right away.' }
            ]
        }];

        // ------------------------------------------------------------
        // RENDER ENGINE
        // ------------------------------------------------------------
        const grid = document.getElementById('vocabGrid');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const countDisplay = document.getElementById('countDisplay');
        const legendContainer = document.getElementById('legendContainer');
        const pinyinGlobalToggle = document.getElementById('pinyinGlobalToggle');
        const pinyinToggleLabel = document.getElementById('pinyinToggleLabel');

        let globalPinyinRevealed = false;

        // Legend
        const posSet = new Set(vocabData.map(d => d.pos));
        const posLabels = {
            'N': 'Noun',
            'V': 'Verb',
            'Vs': 'Stative Verb',
            'Vst': 'Stative/Transitive Verb',
            'Adv': 'Adverb',
            'Prep': 'Preposition',
            'M': 'Measure Word',
            'Ptc': 'Particle',
            'N/V': 'Noun / Verb',
            'Conj': 'Conjunction',
            'V-sep': 'Separable Verb',
            'Vp': 'Verb Phrase',
            'Vp-sep': 'Separable Verb Phrase',
            'Vi': 'Intransitive Verb'
        };
        const dotColorMap = {
            'N': '#7ba9c9',
            'V': '#7fb06a',
            'Vs': '#5ba884',
            'Vst': '#5ba884',
            'Adv': '#c9a86a',
            'Prep': '#c97a9a',
            'M': '#9a7ac9',
            'Ptc': '#c9b86a',
            'N/V': '#7ba9c9',
            'Conj': '#f0d0b0',
            'V-sep': '#6ab06a',
            'Vp': '#6a7ab0',
            'Vp-sep': '#6a7a7a',
            'Vi': '#6a9a9a'
        };

        function buildLegend() {
            const sorted = Array.from(posSet).sort();
            let html = '';
            sorted.forEach(label => {
                const display = posLabels[label] || label;
                const color = dotColorMap[label] || '#b8aa98';
                html += `<span class="legend-item"><span class="legend-dot" style="background:${color};"></span>${display}</span>`;
            });
            legendContainer.innerHTML = html;
        }
        buildLegend();

        // Render function
        function render(filter = '') {
            const term = filter.trim().toLowerCase();
            let filtered = vocabData;

            if (term) {
                filtered = vocabData.filter(item => {
                    let dialogueSearch = '';
                    item.dialogue.forEach(line => {
                        dialogueSearch += line.chinese + ' ' + line.pinyin + ' ' + line.english + ' ';
                    });
                    const searchable = item.char + ' ' + item.pinyin + ' ' + item.en + ' ' + item.explanation + ' ' + dialogueSearch;
                    return searchable.toLowerCase().includes(term);
                });
            }

            countDisplay.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty">🔍 No matches found.</div>`;
                return;
            }

            let html = '';
            filtered.forEach((item, index) => {
                const posClass = 'pos-' + item.pos.replace('/', '-');
                const posDisplay = posLabels[item.pos] || item.pos;

                // Build dialogue HTML
                let dialogueHtml = '';
                dialogueHtml += `
                        <div class="dialogue-toggle-wrapper">
                            <strong>💬 Dialogue:</strong>
                            <button class="dialogue-toggle-btn" data-dialogue-idx="${index}">Show Pinyin & Translation</button>
                        </div>
                        <div class="dialogue-lines">
                    `;

                item.dialogue.forEach(line => {
                    const speakerClass = line.speaker === 'A' ? 'speaker-a' : 'speaker-b';
                    dialogueHtml += `
                            <div class="line">
                                <span class="${speakerClass}">${line.speaker}:</span>
                                <span class="zh">${line.chinese}</span>
                                <span class="dialogue-details">
                                    <span class="sep">·</span>
                                    <span class="pinyin-text">${line.pinyin}</span>
                                    <span class="sep">·</span>
                                    <span class="en-text">${line.english}</span>
                                </span>
                            </div>
                        `;
                });

                dialogueHtml += `</div>`;

                html += `
                        <div class="vocab-card" data-index="${index}">
                            <div class="char-row">
                                <span class="char">${item.char}</span>
                                <span class="pinyin-container" data-pinyin="${item.pinyin}" data-revealed="false">
                                    <span class="pinyin-value">${item.pinyin}</span>
                                </span>
                            </div>
                            <span class="pos ${posClass}">${posDisplay}</span>

                            <button class="details-toggle" data-target="details-${index}">
                                <span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)
                            </button>

                            <div id="details-${index}" class="details-content">
                                <div class="explanation">
                                    <div class="meaning-line">📘 ${item.en}</div>
                                    <br />
                                    <strong>📖 Usage:</strong> ${item.explanation}
                                </div>
                                <div class="dialogue-box" id="dialogue-box-${index}">
                                    ${dialogueHtml}
                                </div>
                            </div>
                        </div>
                    `;
            });

            grid.innerHTML = html;

            // ---- Click on the Hanzi toggles its pinyin ----
            document.querySelectorAll('.char').forEach(charEl => {
                charEl.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const row = this.closest('.char-row');
                    const pinyinContainer = row ? row.querySelector('.pinyin-container') : null;
                    if (!pinyinContainer) return;
                    const isRevealed = pinyinContainer.dataset.revealed === 'true';
                    const newState = !isRevealed;
                    pinyinContainer.dataset.revealed = newState ? 'true' : 'false';
                    pinyinContainer.classList.toggle('revealed', newState);
                });
            });

            // ---- Apply global state to all pinyin containers ----
            document.querySelectorAll('.pinyin-container').forEach(el => {
                const shouldReveal = globalPinyinRevealed;
                el.dataset.revealed = shouldReveal ? 'true' : 'false';
                el.classList.toggle('revealed', shouldReveal);
            });

            // ---- Toggle main details (Meaning/Explanation) ----
            document.querySelectorAll('.details-toggle').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const targetId = this.dataset.target;
                    const content = document.getElementById(targetId);
                    if (!content) return;

                    const isOpen = content.classList.contains('open');
                    if (isOpen) {
                        content.classList.remove('open');
                        this.classList.remove('active');
                        this.innerHTML = '<span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)';
                    } else {
                        content.classList.add('open');
                        this.classList.add('active');
                        this.innerHTML = '<span class="arrow">▲</span> Hide Details';
                    }
                });
            });

            // ---- Toggle dialogue pinyin/translation ----
            document.querySelectorAll('.dialogue-toggle-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = this.dataset.dialogueIdx;
                    const dialogueBox = document.getElementById(`dialogue-box-${idx}`);
                    if (!dialogueBox) return;

                    const isShowing = dialogueBox.classList.contains('show-translation');
                    if (isShowing) {
                        dialogueBox.classList.remove('show-translation');
                        this.textContent = 'Show Pinyin & Translation';
                    } else {
                        dialogueBox.classList.add('show-translation');
                        this.textContent = 'Hide Pinyin & Translation';
                    }
                });
            });

            updateGlobalToggleLabel();
        }

        // ---- Global Pinyin Toggle ----
        function updateGlobalToggleLabel() {
            if (globalPinyinRevealed) {
                pinyinToggleLabel.textContent = 'Hide All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔓';
            } else {
                pinyinToggleLabel.textContent = 'Show All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔊';
            }
        }

        pinyinGlobalToggle.addEventListener('click', function() {
            globalPinyinRevealed = !globalPinyinRevealed;
            document.querySelectorAll('.pinyin-container').forEach(el => {
                el.dataset.revealed = globalPinyinRevealed ? 'true' : 'false';
                el.classList.toggle('revealed', globalPinyinRevealed);
            });
            updateGlobalToggleLabel();
        });

        // ---- Search & Clear ----
        searchInput.addEventListener('input', () => render(searchInput.value));
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            render('');
            searchInput.focus();
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') clearBtn.click();
        });

        // ---- Initial render ----
        render('');
    </script>
</body>
</html>
