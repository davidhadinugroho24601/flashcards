<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 3-23 Flashcards (Click Hanzi for Pinyin)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: #f4f2ef;
            min-height: 100vh;
            padding: 2rem 1.5rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #1e1e2a;
        }

        .header h1 span {
            background: #d9c9b4;
            padding: 0.1rem 0.8rem;
            border-radius: 12px;
            color: #2c2c3a;
        }

        .header .sub {
            font-size: 1rem;
            color: #6b5f52;
            margin-top: 0.3rem;
            font-weight: 400;
        }

        .header .badge {
            display: inline-block;
            margin-top: 0.6rem;
            background: #2c2c3a;
            color: white;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            background: #ffffffd9;
            backdrop-filter: blur(6px);
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 2.2rem;
            border: 1px solid #e8e0d6;
        }

        .stats {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c2c3a;
            white-space: nowrap;
        }

        .stats strong {
            background: #ece6de;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-weight: 600;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f3efe9;
            padding: 0.1rem 0.1rem 0.1rem 1.2rem;
            border-radius: 40px;
            transition: 0.2s;
            border: 1px solid transparent;
            flex: 1;
            min-width: 180px;
        }

        .search-box:focus-within {
            background: #ffffff;
            border-color: #b8aa98;
            box-shadow: 0 0 0 3px rgba(184, 170, 152, 0.2);
        }

        .search-box input {
            border: none;
            background: transparent;
            font-size: 0.9rem;
            padding: 0.5rem 0;
            width: 100%;
            outline: none;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #1e1e2a;
        }

        .search-box input::placeholder {
            color: #a89b8c;
            font-weight: 400;
        }

        .search-box button {
            background: #2c2c3a;
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .search-box button:hover {
            background: #1a1a26;
        }

        .pinyin-global-toggle {
            background: #ece6de;
            border: 1px solid #d5cbbc;
            border-radius: 40px;
            padding: 0.3rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .pinyin-global-toggle:hover {
            background: #d5cbbc;
            border-color: #b8aa98;
        }

        .pinyin-global-toggle .icon {
            font-size: 1rem;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.2rem;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 0.6rem 1.2rem;
            background: #ffffffd9;
            border-radius: 40px;
            border: 1px solid #e8e0d6;
            font-size: 0.75rem;
            font-weight: 500;
            color: #2c2c3a;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .vocab-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid #ebe5dd;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .vocab-card:hover {
            border-color: #d0c3b2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .vocab-card .char-row {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.2rem;
        }

        .vocab-card .char {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1e1e2a;
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.2;
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease;
            padding: 0.1rem 0.4rem;
            border-radius: 8px;
            user-select: none;
        }

        .vocab-card .char:hover {
            color: #4a3f33;
            background: #f0ebe4;
        }

        .vocab-card .char:active {
            transform: scale(0.95);
        }

        .pinyin-container {
            display: inline-flex;
            align-items: center;
            min-width: 2.2rem;
            justify-content: center;
        }

        .pinyin-container .pinyin-value {
            font-size: 1rem;
            color: #6b5f52;
            font-weight: 400;
            letter-spacing: 0.3px;
            display: none;
        }

        .pinyin-container.revealed .pinyin-value {
            display: inline;
        }

        .vocab-card .pos {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            align-self: flex-start;
            margin-top: 0.6rem;
            background: #f0ebe4;
            color: #4a4037;
        }

        .pos-N {
            background: #dbe9f0;
            color: #1f5a7a;
        }
        .pos-V {
            background: #e6f0db;
            color: #3d6b2b;
        }
        .pos-Vs {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Vst {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Adv {
            background: #f0e6db;
            color: #7a5a2b;
        }
        .pos-Prep {
            background: #f0dbe6;
            color: #7a2b4a;
        }
        .pos-M {
            background: #e6dbf0;
            color: #4a2b7a;
        }
        .pos-Ptc {
            background: #f0e8db;
            color: #7a6b2b;
        }
        .pos-N\/V {
            background: #dbe8f0;
            color: #1f5a7a;
        }
        .pos-Conj {
            background: #f0e0d0;
            color: #7a5a3a;
        }
        .pos-Vaux {
            background: #d4d8e0;
            color: #3a4a5a;
        }
        .pos-Vpt {
            background: #d4d8e8;
            color: #3a4a7a;
        }
        .pos-Vs\/N {
            background: #b0c0d0;
            color: #2a4a6a;
        }
        .pos-Adv\/Vaux {
            background: #c0b0a0;
            color: #6a4a2a;
        }
        .pos-M\/V {
            background: #b0b0c0;
            color: #3a3a6a;
        }

        .details-toggle {
            margin-top: 1.2rem;
            background: none;
            border: 1px solid #d5cbbc;
            border-radius: 30px;
            padding: 0.5rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #4a4037;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
            align-self: flex-start;
            background: #faf8f5;
        }

        .details-toggle:hover {
            background: #e8e0d6;
            border-color: #b8aa98;
        }

        .details-toggle .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .details-toggle.active .arrow {
            transform: rotate(180deg);
        }

        .details-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
        }

        .details-content.open {
            max-height: 900px;
            opacity: 1;
            margin-top: 1.2rem;
        }

        .details-content .explanation {
            background: #f8f6f2;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #2c2c3a;
            border-left: 4px solid #d0c3b2;
            margin-bottom: 1rem;
        }

        .details-content .explanation strong {
            color: #1e1e2a;
        }

        .details-content .explanation .meaning-line {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e1e2a;
            background: #e8e0d6;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 0.4rem;
        }

        .dialogue-box {
            background: #f0f4f8;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.8;
        }

        .dialogue-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 0.3rem;
        }

        .dialogue-toggle-btn {
            background: #e8e0d6;
            border: none;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .dialogue-toggle-btn:hover {
            background: #d5cbbc;
        }

        .dialogue-box .speaker-a {
            color: #1f5a7a;
            font-weight: 600;
        }

        .dialogue-box .speaker-b {
            color: #3d6b2b;
            font-weight: 600;
        }

        .dialogue-box .line {
            margin-bottom: 0.2rem;
        }
        .dialogue-box .line:last-child {
            margin-bottom: 0;
        }

        .dialogue-box .zh {
            font-family: 'Noto Sans SC', sans-serif;
            margin-right: 0.3rem;
        }

        .dialogue-details {
            display: none;
            margin-left: 0.3rem;
        }

        .dialogue-details .pinyin-text {
            font-weight: 400;
            color: #6b5f52;
        }

        .dialogue-details .en-text {
            font-style: italic;
            color: #4a4037;
        }

        .dialogue-details .sep {
            color: #b8aa98;
            margin: 0 0.2rem;
        }

        .dialogue-box.show-translation .dialogue-details {
            display: inline;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1.1rem;
            color: #8f8172;
            background: #faf8f5;
            border-radius: 30px;
            border: 1px dashed #d5cbbc;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.8rem 3rem;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                border-radius: 28px;
                padding: 1rem 1.2rem;
                gap: 0.8rem;
            }
            .stats {
                text-align: center;
            }
            .search-box {
                padding: 0.1rem 0.1rem 0.1rem 1rem;
            }
            .search-box button {
                padding: 0.4rem 1rem;
                font-size: 0.8rem;
            }
            .vocab-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .vocab-card .char {
                font-size: 1.8rem;
            }
            .pinyin-global-toggle {
                justify-content: center;
            }
        }

        @media (min-width: 641px) and (max-width: 900px) {
            .vocab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 詞彙 <span>Level 3-23</span></h1>
            <div class="sub">Flashcard Mode · <strong>Click the Hanzi</strong> to reveal Pinyin</div>
            <div class="badge">🔍 Click the character to show pinyin · "Show Details" for meaning & dialogue</div>
        </div>

        <div class="toolbar">
            <div class="stats">
                <strong id="countDisplay">0</strong> words
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Chinese, Pinyin, or English..." autocomplete="off" />
                <button id="clearBtn">✕</button>
            </div>
            <button class="pinyin-global-toggle" id="pinyinGlobalToggle">
                <span class="icon">🔊</span>
                <span id="pinyinToggleLabel">Show All Pinyin</span>
            </button>
        </div>

        <div class="legend" id="legendContainer"></div>

        <div class="vocab-grid" id="vocabGrid"></div>
    </div>

    <script>
        // ------------------------------------------------------------
        // DATA — Level 3-23 Vocabulary (Traditional Hanzi)
        // ------------------------------------------------------------
        const vocabData = [{
            char: '開始',
            pinyin: 'kāishǐ',
            pos: 'N',
            en: 'Beginning / Start',
            explanation: 'The point in time when something commences. Also used as a verb (to start) but here as a noun.',
            dialogue: [
                { speaker: 'A', chinese: '比賽的開始很精彩。', pinyin: 'Bǐsài de kāishǐ hěn jīngcǎi.', english: 'The start of the game was very exciting.' },
                { speaker: 'B', chinese: '對，雙方都全力以赴。', pinyin: 'Duì, shuāngfāng dōu quánlì yǐfù.', english: 'Yes, both sides gave it their all.' }
            ]
        }, {
            char: '看不起',
            pinyin: 'kànbùqǐ',
            pos: 'Vst',
            en: 'To look down on / To despise',
            explanation: 'To regard someone as inferior or not worthy of respect.',
            dialogue: [
                { speaker: 'A', chinese: '他看不起那些沒錢的人。', pinyin: 'Tā kànbùqǐ nàxiē méi qián de rén.', english: 'He looks down on poor people.' },
                { speaker: 'B', chinese: '那樣不好，應該尊重每個人。', pinyin: 'Nàyàng bù hǎo, yīnggāi zūnzhòng měi gè rén.', english: 'That\'s not good; we should respect everyone.' }
            ]
        }, {
            char: '棵',
            pinyin: 'kē',
            pos: 'M',
            en: 'Measure word for trees / plants',
            explanation: 'Used for counting trees, plants, and sometimes other upright objects.',
            dialogue: [
                { speaker: 'A', chinese: '院子裡有一棵大樹。', pinyin: 'Yuànzi lǐ yǒu yī kē dà shù.', english: 'There is a big tree in the yard.' },
                { speaker: 'B', chinese: '那棵樹已經一百年了。', pinyin: 'Nà kē shù yǐjīng yībǎi nián le.', english: 'That tree is already a hundred years old.' }
            ]
        }, {
            char: '科',
            pinyin: 'kē',
            pos: 'M',
            en: 'Measure word for branches of study / subjects',
            explanation: 'Used for academic subjects, departments, or branches of study (e.g., 一科 = one subject).',
            dialogue: [
                { speaker: 'A', chinese: '他選了三科課程。', pinyin: 'Tā xuǎn le sān kē kèchéng.', english: 'He chose three subjects.' },
                { speaker: 'B', chinese: '都是什麼科？', pinyin: 'Dōu shì shénme kē?', english: 'What subjects are they?' }
            ]
        }, {
            char: '科技',
            pinyin: 'kējì',
            pos: 'N',
            en: 'Science and technology',
            explanation: 'A broad term referring to the application of scientific knowledge for practical purposes.',
            dialogue: [
                { speaker: 'A', chinese: '科技發展很快。', pinyin: 'Kējì fāzhǎn hěn kuài.', english: 'Technology develops very fast.' },
                { speaker: 'B', chinese: '對，人工智慧也很進步。', pinyin: 'Duì, réngōng zhìhuì yě hěn jìnbù.', english: 'Yes, artificial intelligence is also advancing.' }
            ]
        }, {
            char: '科學',
            pinyin: 'kēxué',
            pos: 'Vs / N',
            en: 'Science / Scientific',
            explanation: 'As a noun, it means "science"; as a stative verb, it means "scientific."',
            dialogue: [
                { speaker: 'A', chinese: '他對科學很感興趣。', pinyin: 'Tā duì kēxué hěn gǎn xìngqù.', english: 'He is very interested in science.' },
                { speaker: 'B', chinese: '他是科學家嗎？', pinyin: 'Tā shì kēxuéjiā ma?', english: 'Is he a scientist?' }
            ]
        }, {
            char: '可',
            pinyin: 'kě',
            pos: 'Adv / Vaux',
            en: 'Can / May (auxiliary)',
            explanation: 'Used as an auxiliary verb meaning "can" or "may," or as an adverb meaning "really" (emphatic).',
            dialogue: [
                { speaker: 'A', chinese: '你可以幫我嗎？', pinyin: 'Nǐ kěyǐ bāng wǒ ma?', english: 'Can you help me?' },
                { speaker: 'B', chinese: '當然可以。', pinyin: 'Dāngrán kěyǐ.', english: 'Of course I can.' }
            ]
        }, {
            char: '可靠',
            pinyin: 'kěkào',
            pos: 'Vs',
            en: 'Reliable / Trustworthy',
            explanation: 'Describes a person or thing that can be trusted and depended upon.',
            dialogue: [
                { speaker: 'A', chinese: '他是一個很可靠的朋友。', pinyin: 'Tā shì yī gè hěn kěkào de péngyou.', english: 'He is a very reliable friend.' },
                { speaker: 'B', chinese: '對，他從不遲到。', pinyin: 'Duì, tā cóng bù chídào.', english: 'Yes, he is never late.' }
            ]
        }, {
            char: '可憐',
            pinyin: 'kělián',
            pos: 'Vs',
            en: 'Poor / Pitiful',
            explanation: 'Describes someone or something that evokes sympathy or pity.',
            dialogue: [
                { speaker: 'A', chinese: '那隻流浪狗很可憐。', pinyin: 'Nà zhī liúlàng gǒu hěn kělián.', english: 'That stray dog is pitiful.' },
                { speaker: 'B', chinese: '我們給牠一些食物吧。', pinyin: 'Wǒmen gěi tā yīxiē shíwù ba.', english: 'Let\'s give it some food.' }
            ]
        }, {
            char: '渴望',
            pinyin: 'kěwàng',
            pos: 'Vst',
            en: 'To long for / To crave',
            explanation: 'To have a strong desire or longing for something.',
            dialogue: [
                { speaker: 'A', chinese: '他渴望成功。', pinyin: 'Tā kěwàng chénggōng.', english: 'He longs for success.' },
                { speaker: 'B', chinese: '他會很努力的。', pinyin: 'Tā huì hěn nǔlì de.', english: 'He will work very hard.' }
            ]
        }, {
            char: '可惡',
            pinyin: 'kěwù',
            pos: 'Vs',
            en: 'Hateful / Detestable',
            explanation: 'Describes something or someone that is very unpleasant and deserving of hatred.',
            dialogue: [
                { speaker: 'A', chinese: '那個人真可惡！', pinyin: 'Nàge rén zhēn kěwù!', english: 'That person is really hateful!' },
                { speaker: 'B', chinese: '冷靜一點，別生氣。', pinyin: 'Lěngjìng yīdiǎn, bié shēngqì.', english: 'Calm down, don\'t get angry.' }
            ]
        }, {
            char: '可以',
            pinyin: 'kěyǐ',
            pos: 'Vaux',
            en: 'Can / May',
            explanation: 'An auxiliary verb expressing ability, permission, or possibility.',
            dialogue: [
                { speaker: 'A', chinese: '我可以進來嗎？', pinyin: 'Wǒ kěyǐ jìnlái ma?', english: 'May I come in?' },
                { speaker: 'B', chinese: '請進，門沒鎖。', pinyin: 'Qǐng jìn, mén méi suǒ.', english: 'Come in, the door is unlocked.' }
            ]
        }, {
            char: '刻',
            pinyin: 'kè',
            pos: 'M / V',
            en: 'Quarter (of an hour) / To carve',
            explanation: 'As a measure word, it means a quarter hour (一刻鐘). As a verb, it means to carve or engrave.',
            dialogue: [
                { speaker: 'A', chinese: '我等了一刻鐘。', pinyin: 'Wǒ děng le yī kè zhōng.', english: 'I waited for a quarter of an hour.' },
                { speaker: 'B', chinese: '抱歉，我遲到了。', pinyin: 'Bàoqiàn, wǒ chídào le.', english: 'Sorry, I was late.' }
            ]
        }, {
            char: '克',
            pinyin: 'kè',
            pos: 'M',
            en: 'Gram',
            explanation: 'A metric unit of mass equal to one-thousandth of a kilogram.',
            dialogue: [
                { speaker: 'A', chinese: '這包鹽是五百克。', pinyin: 'Zhè bāo yán shì wǔbǎi kè.', english: 'This bag of salt is 500 grams.' },
                { speaker: 'B', chinese: '夠了，我們不用買太多。', pinyin: 'Gòu le, wǒmen bùyòng mǎi tài duō.', english: 'It\'s enough, we don\'t need to buy too much.' }
            ]
        }, {
            char: '課程',
            pinyin: 'kèchéng',
            pos: 'N',
            en: 'Course / Curriculum',
            explanation: 'A series of classes or a program of study on a particular subject.',
            dialogue: [
                { speaker: 'A', chinese: '你選了什麼課程？', pinyin: 'Nǐ xuǎn le shénme kèchéng?', english: 'What courses did you choose?' },
                { speaker: 'B', chinese: '我選了中文和歷史。', pinyin: 'Wǒ xuǎn le Zhōngwén hé lìshǐ.', english: 'I chose Chinese and history.' }
            ]
        }, {
            char: '課堂',
            pinyin: 'kètáng',
            pos: 'N',
            en: 'Classroom',
            explanation: 'A room where a class is taught, or the teaching session itself.',
            dialogue: [
                { speaker: 'A', chinese: '課堂上要保持安靜。', pinyin: 'Kètáng shàng yào bǎochí ānjìng.', english: 'You should keep quiet in the classroom.' },
                { speaker: 'B', chinese: '我知道，專心上課。', pinyin: 'Wǒ zhīdào, zhuānxīn shàngkè.', english: 'I know, focus on the class.' }
            ]
        }, {
            char: '課文',
            pinyin: 'kèwén',
            pos: 'N',
            en: 'Text (of a lesson)',
            explanation: 'The written material of a lesson, often found in textbooks.',
            dialogue: [
                { speaker: 'A', chinese: '請讀第三課的課文。', pinyin: 'Qǐng dú dì sān kè de kèwén.', english: 'Please read the text of Lesson 3.' },
                { speaker: 'B', chinese: '好的，我讀完了。', pinyin: 'Hǎo de, wǒ dú wán le.', english: 'OK, I\'ve finished reading.' }
            ]
        }, {
            char: '克服',
            pinyin: 'kèfú',
            pos: 'Vpt',
            en: 'To overcome / To surmount',
            explanation: 'To successfully deal with a problem, difficulty, or fear.',
            dialogue: [
                { speaker: 'A', chinese: '他克服了膽怯。', pinyin: 'Tā kèfú le dǎnqiè.', english: 'He overcame his timidity.' },
                { speaker: 'B', chinese: '他現在很有自信。', pinyin: 'Tā xiànzài hěn yǒu zìxìn.', english: 'He is very confident now.' }
            ]
        }, {
            char: '肯',
            pinyin: 'kěn',
            pos: 'Vaux',
            en: 'To be willing to / To agree to',
            explanation: 'Auxiliary verb indicating willingness or consent.',
            dialogue: [
                { speaker: 'A', chinese: '他肯幫我們嗎？', pinyin: 'Tā kěn bāng wǒmen ma?', english: 'Is he willing to help us?' },
                { speaker: 'B', chinese: '肯，他已經答應了。', pinyin: 'Kěn, tā yǐjīng dāyìng le.', english: 'Yes, he has already agreed.' }
            ]
        }, {
            char: '肯定',
            pinyin: 'kěndìng',
            pos: 'Vs',
            en: 'Certain / Definite',
            explanation: 'Describes something that is sure, definite, or positive.',
            dialogue: [
                { speaker: 'A', chinese: '他肯定會來。', pinyin: 'Tā kěndìng huì lái.', english: 'He will definitely come.' },
                { speaker: 'B', chinese: '你怎麼這麼肯定？', pinyin: 'Nǐ zěnme zhème kěndìng?', english: 'How can you be so sure?' }
            ]
        }, {
            char: '空間',
            pinyin: 'kōngjiān',
            pos: 'N',
            en: 'Space (physical)',
            explanation: 'A physical area or extent, often with a three-dimensional quality. Also used metaphorically.',
            dialogue: [
                { speaker: 'A', chinese: '這個房間的空間很大。', pinyin: 'Zhège fángjiān de kōngjiān hěn dà.', english: 'This room has a lot of space.' },
                { speaker: 'B', chinese: '可以放一張大桌子。', pinyin: 'Kěyǐ fàng yī zhāng dà zhuōzi.', english: 'We can put a large table here.' }
            ]
        }, {
            char: '空軍',
            pinyin: 'kōngjūn',
            pos: 'N',
            en: 'Air Force',
            explanation: 'The branch of a nation\'s military that operates aircraft and aerial warfare.',
            dialogue: [
                { speaker: 'A', chinese: '他是一名空軍飛行員。', pinyin: 'Tā shì yī míng kōngjūn fēixíngyuán.', english: 'He is an air force pilot.' },
                { speaker: 'B', chinese: '他的工作很危險。', pinyin: 'Tā de gōngzuò hěn wēixiǎn.', english: 'His job is very dangerous.' }
            ]
        }, {
            char: '恐怕',
            pinyin: 'kǒngpà',
            pos: 'Adv',
            en: 'I\'m afraid / Perhaps (worried)',
            explanation: 'Used to express concern or apprehension about a possible outcome.',
            dialogue: [
                { speaker: 'A', chinese: '恐怕會下雨。', pinyin: 'Kǒngpà huì xià yǔ.', english: 'I\'m afraid it might rain.' },
                { speaker: 'B', chinese: '那我們帶傘吧。', pinyin: 'Nà wǒmen dài sǎn ba.', english: 'Then let\'s bring umbrellas.' }
            ]
        }, {
            char: '口',
            pinyin: 'kǒu',
            pos: 'N',
            en: 'Mouth / Opening',
            explanation: 'The mouth as a body part, or an opening or entrance. Also used as a measure word for people (e.g., 三口人).',
            dialogue: [
                { speaker: 'A', chinese: '他說話時張開了口。', pinyin: 'Tā shuōhuà shí zhāng kāi le kǒu.', english: 'He opened his mouth when he spoke.' },
                { speaker: 'B', chinese: '他說話很清楚。', pinyin: 'Tā shuōhuà hěn qīngchu.', english: 'He speaks very clearly.' }
            ]
        }];

        // ------------------------------------------------------------
        // RENDER ENGINE
        // ------------------------------------------------------------
        const grid = document.getElementById('vocabGrid');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const countDisplay = document.getElementById('countDisplay');
        const legendContainer = document.getElementById('legendContainer');
        const pinyinGlobalToggle = document.getElementById('pinyinGlobalToggle');
        const pinyinToggleLabel = document.getElementById('pinyinToggleLabel');

        let globalPinyinRevealed = false;

        // Legend
        const posSet = new Set(vocabData.map(d => d.pos));
        const posLabels = {
            'N': 'Noun',
            'V': 'Verb',
            'Vs': 'Stative Verb',
            'Vst': 'Stative/Transitive Verb',
            'Adv': 'Adverb',
            'Prep': 'Preposition',
            'M': 'Measure Word',
            'Ptc': 'Particle',
            'N/V': 'Noun / Verb',
            'Conj': 'Conjunction',
            'Vaux': 'Auxiliary Verb',
            'Vpt': 'Verb Particle (Trans.)',
            'Vs/N': 'Stative Verb / Noun',
            'Adv/Vaux': 'Adverb / Auxiliary',
            'M/V': 'Measure Word / Verb'
        };
        const dotColorMap = {
            'N': '#7ba9c9',
            'V': '#7fb06a',
            'Vs': '#5ba884',
            'Vst': '#5ba884',
            'Adv': '#c9a86a',
            'Prep': '#c97a9a',
            'M': '#9a7ac9',
            'Ptc': '#c9b86a',
            'N/V': '#7ba9c9',
            'Conj': '#f0d0b0',
            'Vaux': '#6a7a8a',
            'Vpt': '#6a7ab0',
            'Vs/N': '#b0c0d0',
            'Adv/Vaux': '#c0b0a0',
            'M/V': '#b0b0c0'
        };

        function buildLegend() {
            const sorted = Array.from(posSet).sort();
            let html = '';
            sorted.forEach(label => {
                const display = posLabels[label] || label;
                const color = dotColorMap[label] || '#b8aa98';
                html += `<span class="legend-item"><span class="legend-dot" style="background:${color};"></span>${display}</span>`;
            });
            legendContainer.innerHTML = html;
        }
        buildLegend();

        // Render function
        function render(filter = '') {
            const term = filter.trim().toLowerCase();
            let filtered = vocabData;

            if (term) {
                filtered = vocabData.filter(item => {
                    let dialogueSearch = '';
                    item.dialogue.forEach(line => {
                        dialogueSearch += line.chinese + ' ' + line.pinyin + ' ' + line.english + ' ';
                    });
                    const searchable = item.char + ' ' + item.pinyin + ' ' + item.en + ' ' + item.explanation + ' ' + dialogueSearch;
                    return searchable.toLowerCase().includes(term);
                });
            }

            countDisplay.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty">🔍 No matches found.</div>`;
                return;
            }

            let html = '';
            filtered.forEach((item, index) => {
                const posClass = 'pos-' + item.pos.replace('/', '-');
                const posDisplay = posLabels[item.pos] || item.pos;

                // Build dialogue HTML
                let dialogueHtml = '';
                dialogueHtml += `
                        <div class="dialogue-toggle-wrapper">
                            <strong>💬 Dialogue:</strong>
                            <button class="dialogue-toggle-btn" data-dialogue-idx="${index}">Show Pinyin & Translation</button>
                        </div>
                        <div class="dialogue-lines">
                    `;

                item.dialogue.forEach(line => {
                    const speakerClass = line.speaker === 'A' ? 'speaker-a' : 'speaker-b';
                    dialogueHtml += `
                            <div class="line">
                                <span class="${speakerClass}">${line.speaker}:</span>
                                <span class="zh">${line.chinese}</span>
                                <span class="dialogue-details">
                                    <span class="sep">·</span>
                                    <span class="pinyin-text">${line.pinyin}</span>
                                    <span class="sep">·</span>
                                    <span class="en-text">${line.english}</span>
                                </span>
                            </div>
                        `;
                });

                dialogueHtml += `</div>`;

                html += `
                        <div class="vocab-card" data-index="${index}">
                            <div class="char-row">
                                <span class="char">${item.char}</span>
                                <span class="pinyin-container" data-pinyin="${item.pinyin}" data-revealed="false">
                                    <span class="pinyin-value">${item.pinyin}</span>
                                </span>
                            </div>
                            <span class="pos ${posClass}">${posDisplay}</span>

                            <button class="details-toggle" data-target="details-${index}">
                                <span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)
                            </button>

                            <div id="details-${index}" class="details-content">
                                <div class="explanation">
                                    <div class="meaning-line">📘 ${item.en}</div>
                                    <br />
                                    <strong>📖 Usage:</strong> ${item.explanation}
                                </div>
                                <div class="dialogue-box" id="dialogue-box-${index}">
                                    ${dialogueHtml}
                                </div>
                            </div>
                        </div>
                    `;
            });

            grid.innerHTML = html;

            // ---- Click on the Hanzi toggles its pinyin ----
            document.querySelectorAll('.char').forEach(charEl => {
                charEl.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const row = this.closest('.char-row');
                    const pinyinContainer = row ? row.querySelector('.pinyin-container') : null;
                    if (!pinyinContainer) return;
                    const isRevealed = pinyinContainer.dataset.revealed === 'true';
                    const newState = !isRevealed;
                    pinyinContainer.dataset.revealed = newState ? 'true' : 'false';
                    pinyinContainer.classList.toggle('revealed', newState);
                });
            });

            // ---- Apply global state to all pinyin containers ----
            document.querySelectorAll('.pinyin-container').forEach(el => {
                const shouldReveal = globalPinyinRevealed;
                el.dataset.revealed = shouldReveal ? 'true' : 'false';
                el.classList.toggle('revealed', shouldReveal);
            });

            // ---- Toggle main details (Meaning/Explanation) ----
            document.querySelectorAll('.details-toggle').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const targetId = this.dataset.target;
                    const content = document.getElementById(targetId);
                    if (!content) return;

                    const isOpen = content.classList.contains('open');
                    if (isOpen) {
                        content.classList.remove('open');
                        this.classList.remove('active');
                        this.innerHTML = '<span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)';
                    } else {
                        content.classList.add('open');
                        this.classList.add('active');
                        this.innerHTML = '<span class="arrow">▲</span> Hide Details';
                    }
                });
            });

            // ---- Toggle dialogue pinyin/translation ----
            document.querySelectorAll('.dialogue-toggle-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = this.dataset.dialogueIdx;
                    const dialogueBox = document.getElementById(`dialogue-box-${idx}`);
                    if (!dialogueBox) return;

                    const isShowing = dialogueBox.classList.contains('show-translation');
                    if (isShowing) {
                        dialogueBox.classList.remove('show-translation');
                        this.textContent = 'Show Pinyin & Translation';
                    } else {
                        dialogueBox.classList.add('show-translation');
                        this.textContent = 'Hide Pinyin & Translation';
                    }
                });
            });

            updateGlobalToggleLabel();
        }

        // ---- Global Pinyin Toggle ----
        function updateGlobalToggleLabel() {
            if (globalPinyinRevealed) {
                pinyinToggleLabel.textContent = 'Hide All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔓';
            } else {
                pinyinToggleLabel.textContent = 'Show All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔊';
            }
        }

        pinyinGlobalToggle.addEventListener('click', function() {
            globalPinyinRevealed = !globalPinyinRevealed;
            document.querySelectorAll('.pinyin-container').forEach(el => {
                el.dataset.revealed = globalPinyinRevealed ? 'true' : 'false';
                el.classList.toggle('revealed', globalPinyinRevealed);
            });
            updateGlobalToggleLabel();
        });

        // ---- Search & Clear ----
        searchInput.addEventListener('input', () => render(searchInput.value));
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            render('');
            searchInput.focus();
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') clearBtn.click();
        });

        // ---- Initial render ----
        render('');
    </script>
</body>
</html>
