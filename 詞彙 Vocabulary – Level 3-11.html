<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 3-11 Flashcards (Click Hanzi for Pinyin)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: #f4f2ef;
            min-height: 100vh;
            padding: 2rem 1.5rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #1e1e2a;
        }

        .header h1 span {
            background: #d9c9b4;
            padding: 0.1rem 0.8rem;
            border-radius: 12px;
            color: #2c2c3a;
        }

        .header .sub {
            font-size: 1rem;
            color: #6b5f52;
            margin-top: 0.3rem;
            font-weight: 400;
        }

        .header .badge {
            display: inline-block;
            margin-top: 0.6rem;
            background: #2c2c3a;
            color: white;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            background: #ffffffd9;
            backdrop-filter: blur(6px);
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 2.2rem;
            border: 1px solid #e8e0d6;
        }

        .stats {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c2c3a;
            white-space: nowrap;
        }

        .stats strong {
            background: #ece6de;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-weight: 600;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f3efe9;
            padding: 0.1rem 0.1rem 0.1rem 1.2rem;
            border-radius: 40px;
            transition: 0.2s;
            border: 1px solid transparent;
            flex: 1;
            min-width: 180px;
        }

        .search-box:focus-within {
            background: #ffffff;
            border-color: #b8aa98;
            box-shadow: 0 0 0 3px rgba(184, 170, 152, 0.2);
        }

        .search-box input {
            border: none;
            background: transparent;
            font-size: 0.9rem;
            padding: 0.5rem 0;
            width: 100%;
            outline: none;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #1e1e2a;
        }

        .search-box input::placeholder {
            color: #a89b8c;
            font-weight: 400;
        }

        .search-box button {
            background: #2c2c3a;
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .search-box button:hover {
            background: #1a1a26;
        }

        .pinyin-global-toggle {
            background: #ece6de;
            border: 1px solid #d5cbbc;
            border-radius: 40px;
            padding: 0.3rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .pinyin-global-toggle:hover {
            background: #d5cbbc;
            border-color: #b8aa98;
        }

        .pinyin-global-toggle .icon {
            font-size: 1rem;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.2rem;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 0.6rem 1.2rem;
            background: #ffffffd9;
            border-radius: 40px;
            border: 1px solid #e8e0d6;
            font-size: 0.75rem;
            font-weight: 500;
            color: #2c2c3a;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .vocab-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid #ebe5dd;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .vocab-card:hover {
            border-color: #d0c3b2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .vocab-card .char-row {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.2rem;
        }

        .vocab-card .char {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1e1e2a;
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.2;
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease;
            padding: 0.1rem 0.4rem;
            border-radius: 8px;
            user-select: none;
        }

        .vocab-card .char:hover {
            color: #4a3f33;
            background: #f0ebe4;
        }

        .vocab-card .char:active {
            transform: scale(0.95);
        }

        .pinyin-container {
            display: inline-flex;
            align-items: center;
            min-width: 2.2rem;
            justify-content: center;
        }

        .pinyin-container .pinyin-value {
            font-size: 1rem;
            color: #6b5f52;
            font-weight: 400;
            letter-spacing: 0.3px;
            display: none;
        }

        .pinyin-container.revealed .pinyin-value {
            display: inline;
        }

        .vocab-card .pos {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            align-self: flex-start;
            margin-top: 0.6rem;
            background: #f0ebe4;
            color: #4a4037;
        }

        .pos-N {
            background: #dbe9f0;
            color: #1f5a7a;
        }
        .pos-V {
            background: #e6f0db;
            color: #3d6b2b;
        }
        .pos-Vs {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Vst {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Adv {
            background: #f0e6db;
            color: #7a5a2b;
        }
        .pos-Prep {
            background: #f0dbe6;
            color: #7a2b4a;
        }
        .pos-M {
            background: #e6dbf0;
            color: #4a2b7a;
        }
        .pos-Ptc {
            background: #f0e8db;
            color: #7a6b2b;
        }
        .pos-N\/V {
            background: #dbe8f0;
            color: #1f5a7a;
        }
        .pos-Conj {
            background: #f0e0d0;
            color: #7a5a3a;
        }
        .pos-Det {
            background: #f0d4d4;
            color: #7a3a3a;
        }
        .pos-V-sep {
            background: #d4e8d4;
            color: #2d6b2d;
        }
        .pos-Vpt {
            background: #d4d8e8;
            color: #3a4a7a;
        }
        .pos-Vi {
            background: #d4e0e0;
            color: #2d5a5a;
        }
        .pos-Vp {
            background: #d4d0d8;
            color: #3a3a5a;
        }

        .details-toggle {
            margin-top: 1.2rem;
            background: none;
            border: 1px solid #d5cbbc;
            border-radius: 30px;
            padding: 0.5rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #4a4037;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
            align-self: flex-start;
            background: #faf8f5;
        }

        .details-toggle:hover {
            background: #e8e0d6;
            border-color: #b8aa98;
        }

        .details-toggle .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .details-toggle.active .arrow {
            transform: rotate(180deg);
        }

        .details-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
        }

        .details-content.open {
            max-height: 900px;
            opacity: 1;
            margin-top: 1.2rem;
        }

        .details-content .explanation {
            background: #f8f6f2;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #2c2c3a;
            border-left: 4px solid #d0c3b2;
            margin-bottom: 1rem;
        }

        .details-content .explanation strong {
            color: #1e1e2a;
        }

        .details-content .explanation .meaning-line {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e1e2a;
            background: #e8e0d6;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 0.4rem;
        }

        .dialogue-box {
            background: #f0f4f8;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.8;
        }

        .dialogue-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 0.3rem;
        }

        .dialogue-toggle-btn {
            background: #e8e0d6;
            border: none;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .dialogue-toggle-btn:hover {
            background: #d5cbbc;
        }

        .dialogue-box .speaker-a {
            color: #1f5a7a;
            font-weight: 600;
        }

        .dialogue-box .speaker-b {
            color: #3d6b2b;
            font-weight: 600;
        }

        .dialogue-box .line {
            margin-bottom: 0.2rem;
        }
        .dialogue-box .line:last-child {
            margin-bottom: 0;
        }

        .dialogue-box .zh {
            font-family: 'Noto Sans SC', sans-serif;
            margin-right: 0.3rem;
        }

        .dialogue-details {
            display: none;
            margin-left: 0.3rem;
        }

        .dialogue-details .pinyin-text {
            font-weight: 400;
            color: #6b5f52;
        }

        .dialogue-details .en-text {
            font-style: italic;
            color: #4a4037;
        }

        .dialogue-details .sep {
            color: #b8aa98;
            margin: 0 0.2rem;
        }

        .dialogue-box.show-translation .dialogue-details {
            display: inline;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1.1rem;
            color: #8f8172;
            background: #faf8f5;
            border-radius: 30px;
            border: 1px dashed #d5cbbc;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.8rem 3rem;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                border-radius: 28px;
                padding: 1rem 1.2rem;
                gap: 0.8rem;
            }
            .stats {
                text-align: center;
            }
            .search-box {
                padding: 0.1rem 0.1rem 0.1rem 1rem;
            }
            .search-box button {
                padding: 0.4rem 1rem;
                font-size: 0.8rem;
            }
            .vocab-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .vocab-card .char {
                font-size: 1.8rem;
            }
            .pinyin-global-toggle {
                justify-content: center;
            }
        }

        @media (min-width: 641px) and (max-width: 900px) {
            .vocab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 詞彙 <span>Level 3-11</span></h1>
            <div class="sub">Flashcard Mode · <strong>Click the Hanzi</strong> to reveal Pinyin</div>
            <div class="badge">🔍 Click the character to show pinyin · "Show Details" for meaning & dialogue</div>
        </div>

        <div class="toolbar">
            <div class="stats">
                <strong id="countDisplay">0</strong> words
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Chinese, Pinyin, or English..." autocomplete="off" />
                <button id="clearBtn">✕</button>
            </div>
            <button class="pinyin-global-toggle" id="pinyinGlobalToggle">
                <span class="icon">🔊</span>
                <span id="pinyinToggleLabel">Show All Pinyin</span>
            </button>
        </div>

        <div class="legend" id="legendContainer"></div>

        <div class="vocab-grid" id="vocabGrid"></div>
    </div>

    <script>
        // ------------------------------------------------------------
        // DATA — Level 3-11 Vocabulary (Traditional Hanzi)
        // ------------------------------------------------------------
        const vocabData = [{
            char: '方式',
            pinyin: 'fāngshì',
            pos: 'N',
            en: 'Way / Method',
            explanation: 'The manner or method in which something is done. Used in both daily and formal contexts.',
            dialogue: [
                { speaker: 'A', chinese: '你喜歡哪種學習方式？', pinyin: 'Nǐ xǐhuān nǎ zhǒng xuéxí fāngshì?', english: 'Which learning method do you prefer?' },
                { speaker: 'B', chinese: '我喜歡邊聽邊寫。', pinyin: 'Wǒ xǐhuān biān tīng biān xiě.', english: 'I like to listen and write at the same time.' }
            ]
        }, {
            char: '房客',
            pinyin: 'fángkè',
            pos: 'N',
            en: 'Tenant',
            explanation: 'A person who rents a room or property from a landlord.',
            dialogue: [
                { speaker: 'A', chinese: '我的房客很安靜。', pinyin: 'Wǒ de fángkè hěn ānjìng.', english: 'My tenant is very quiet.' },
                { speaker: 'B', chinese: '那很好，省了很多麻煩。', pinyin: 'Nà hěn hǎo, shěng le hěnduō máfan.', english: 'That\'s good, saves a lot of trouble.' }
            ]
        }, {
            char: '訪問',
            pinyin: 'fǎngwèn',
            pos: 'V',
            en: 'To visit (formal)',
            explanation: 'To pay a formal visit to a person or place, often for official or business purposes.',
            dialogue: [
                { speaker: 'A', chinese: '我們明天訪問一所大學。', pinyin: 'Wǒmen míngtiān fǎngwèn yī suǒ dàxué.', english: 'We are visiting a university tomorrow.' },
                { speaker: 'B', chinese: '需要準備什麼嗎？', pinyin: 'Xūyào zhǔnbèi shénme ma?', english: 'Do we need to prepare anything?' }
            ]
        }, {
            char: '煩惱',
            pinyin: 'fánnǎo',
            pos: 'Vs',
            en: 'Worried / Annoyed',
            explanation: 'Describes a state of being troubled, upset, or worried about problems or stress.',
            dialogue: [
                { speaker: 'A', chinese: '他最近很煩惱。', pinyin: 'Tā zuìjìn hěn fánnǎo.', english: 'He has been very troubled lately.' },
                { speaker: 'B', chinese: '怎麼了？需要幫助嗎？', pinyin: 'Zěnme le? Xūyào bāngzhù ma?', english: 'What\'s wrong? Need help?' }
            ]
        }, {
            char: '範圍',
            pinyin: 'fànwéi',
            pos: 'N',
            en: 'Scope / Range',
            explanation: 'The extent or limit of something, such as an area, activity, or influence.',
            dialogue: [
                { speaker: 'A', chinese: '這超出了我的職責範圍。', pinyin: 'Zhè chāochū le wǒ de zhízé fànwéi.', english: 'This is beyond my scope of responsibility.' },
                { speaker: 'B', chinese: '那請找主管吧。', pinyin: 'Nà qǐng zhǎo zhǔguǎn ba.', english: 'Then please ask the supervisor.' }
            ]
        }, {
            char: '翻譯',
            pinyin: 'fānyì',
            pos: 'V',
            en: 'To translate',
            explanation: 'To convert text or speech from one language into another. Often used as a noun for a translator as well.',
            dialogue: [
                { speaker: 'A', chinese: '請幫我把這封信翻譯成中文。', pinyin: 'Qǐng bāng wǒ bǎ zhè fēng xìn fānyì chéng Zhōngwén.', english: 'Please translate this letter into Chinese.' },
                { speaker: 'B', chinese: '沒問題，明天給你。', pinyin: 'Méi wèntí, míngtiān gěi nǐ.', english: 'No problem, I\'ll give it to you tomorrow.' }
            ]
        }, {
            char: '反應',
            pinyin: 'fǎnyìng',
            pos: 'N',
            en: 'Reaction / Response',
            explanation: 'A response to a stimulus, situation, or action. Can refer to physical, emotional, or social responses.',
            dialogue: [
                { speaker: 'A', chinese: '你對這個提議有什麼反應？', pinyin: 'Nǐ duì zhège tíyì yǒu shénme fǎnyìng?', english: 'What\'s your reaction to this proposal?' },
                { speaker: 'B', chinese: '我覺得很好，可以試試。', pinyin: 'Wǒ juéde hěn hǎo, kěyǐ shìshi.', english: 'I think it\'s good, we can try it.' }
            ]
        }, {
            char: '發票',
            pinyin: 'fāpiào',
            pos: 'N',
            en: 'Invoice / Receipt',
            explanation: 'A document that lists the details of a transaction, including the amount paid, used for accounting or tax purposes.',
            dialogue: [
                { speaker: 'A', chinese: '請給我開一張發票。', pinyin: 'Qǐng gěi wǒ kāi yī zhāng fāpiào.', english: 'Please give me an invoice.' },
                { speaker: 'B', chinese: '好的，請稍等。', pinyin: 'Hǎo de, qǐng shāo děng.', english: 'OK, please wait a moment.' }
            ]
        }, {
            char: '發脾氣',
            pinyin: 'fāpíqi',
            pos: 'Vi',
            en: 'To lose one\'s temper',
            explanation: 'To become angry and display it, often by shouting or complaining.',
            dialogue: [
                { speaker: 'A', chinese: '他為什麼發脾氣？', pinyin: 'Tā wèishénme fā píqi?', english: 'Why is he losing his temper?' },
                { speaker: 'B', chinese: '因為他的建議被拒絕了。', pinyin: 'Yīnwèi tā de jiànyì bèi jùjué le.', english: 'Because his suggestion was rejected.' }
            ]
        }, {
            char: '非',
            pinyin: 'fēi',
            pos: 'Adv / Vst',
            en: 'Not / Non- / Wrong',
            explanation: 'As an adverb, it means "not" (often in formal language). As a stative verb, it means "to be wrong" or "incorrect."',
            dialogue: [
                { speaker: 'A', chinese: '這件事非常重要。', pinyin: 'Zhè jiàn shì fēicháng zhòngyào.', english: 'This matter is very important.' },
                { speaker: 'B', chinese: '對，我們要認真對待。', pinyin: 'Duì, wǒmen yào rènzhēn duìdài.', english: 'Yes, we need to take it seriously.' }
            ]
        }, {
            char: '費用',
            pinyin: 'fèiyòng',
            pos: 'N',
            en: 'Cost / Expense',
            explanation: 'The amount of money required to pay for something, such as a service, product, or event.',
            dialogue: [
                { speaker: 'A', chinese: '這次旅行的費用很高。', pinyin: 'Zhè cì lǚxíng de fèiyòng hěn gāo.', english: 'The cost of this trip is very high.' },
                { speaker: 'B', chinese: '我們需要節省一些開支。', pinyin: 'Wǒmen xūyào jiéshěng yīxiē kāizhī.', english: 'We need to save some expenses.' }
            ]
        }, {
            char: '豐富',
            pinyin: 'fēngfù',
            pos: 'Vs',
            en: 'Rich / Abundant',
            explanation: 'Describes a large quantity of something, often in terms of knowledge, experience, resources, or variety.',
            dialogue: [
                { speaker: 'A', chinese: '他的學識很豐富。', pinyin: 'Tā de xuéshí hěn fēngfù.', english: 'He has rich knowledge.' },
                { speaker: 'B', chinese: '對，他讀了很多書。', pinyin: 'Duì, tā dú le hěnduō shū.', english: 'Yes, he has read many books.' }
            ]
        }, {
            char: '風格',
            pinyin: 'fēnggé',
            pos: 'N',
            en: 'Style',
            explanation: 'The distinctive way something is done, created, or performed, often in art, design, or architecture.',
            dialogue: [
                { speaker: 'A', chinese: '這幅畫的風格很獨特。', pinyin: 'Zhè fú huà de fēnggé hěn dútè.', english: 'The style of this painting is very unique.' },
                { speaker: 'B', chinese: '我很喜歡這種風格。', pinyin: 'Wǒ hěn xǐhuān zhè zhǒng fēnggé.', english: 'I really like this style.' }
            ]
        }, {
            char: '風俗',

        }, {

            dialogue: [
                { speaker: 'A', chinese: '我們把這堆書分開整理吧。', pinyin: 'Wǒmen bǎ zhè duī shū fēnkāi zhěnglǐ ba.', english: 'Let\'s separate these books and organize them.' },
                { speaker: 'B', chinese: '好，分成兩堆。', pinyin: 'Hǎo, fēnchéng liǎng duī.', english: 'OK, divide them into two piles.' }

        }, {
            char: '佛教',
            pinyin: 'Fójiào',
            pos: 'N',
            en: 'Buddhism',
            explanation: 'A major world religion founded in India by Buddha, emphasizing meditation, compassion, and the pursuit of enlightenment.',
            dialogue: [
                { speaker: 'A', chinese: '佛教在亞洲很普遍。', pinyin: 'Fójiào zài Yàzhōu hěn pǔbiàn.', english: 'Buddhism is very common in Asia.' },
                { speaker: 'B', chinese: '我對佛教的哲學很感興趣。', pinyin: 'Wǒ duì Fójiào de zhéxué hěn gǎn xìngqù.', english: 'I am interested in Buddhist philosophy.' }
            ]
        }, {
            char: '否則',
            pinyin: 'fǒuzé',
            pos: 'Conj',
            en: 'Otherwise',
            explanation: 'Used to indicate the consequence or alternative if a condition is not met. Often used in warnings or instructions.',
            dialogue: [
                { speaker: 'A', chinese: '你要早點起床，否則會遲到。', pinyin: 'Nǐ yào zǎodiǎn qǐchuáng, fǒuzé huì chídào.', english: 'You need to get up early, otherwise you\'ll be late.' },
                { speaker: 'B', chinese: '好的，我會設鬧鐘。', pinyin: 'Hǎo de, wǒ huì shè nàozhōng.', english: 'OK, I\'ll set an alarm.' }
            ]
        }, {
            char: '夫婦',
            pinyin: 'fūfù',
            pos: 'N',
            en: 'Husband and wife',
            explanation: 'A formal term for a married couple. Often used in official documents or polite speech.',
            dialogue: [
                { speaker: 'A', chinese: '那對夫婦已經結婚十年了。', pinyin: 'Nà duì fūfù yǐjīng jiéhūn shí nián le.', english: 'That couple has been married for ten years.' },
                { speaker: 'B', chinese: '他們的感情很好。', pinyin: 'Tāmen de gǎnqíng hěn hǎo.', english: 'They have a good relationship.' }
            ]
        }, {
            char: '符合',
            pinyin: 'fúhé',
            pos: 'Vst',
            en: 'To conform / To match',
            explanation: 'To be in accordance with standards, rules, or expectations. Often used in evaluations or requirements.',
            dialogue: [
                { speaker: 'A', chinese: '這份報告符合要求嗎？', pinyin: 'Zhè fèn bàogào fúhé yāoqiú ma?', english: 'Does this report meet the requirements?' },
                { speaker: 'B', chinese: '是的，完全符合。', pinyin: 'Shì de, wánquán fúhé.', english: 'Yes, it fully meets them.' }
            ]
        }, {
            char: '福利',
            pinyin: 'fúlì',
            pos: 'N',
            en: 'Benefits / Welfare',
            explanation: 'Money or services provided by an employer, government, or organization to improve the well-being of people.',
            dialogue: [
                { speaker: 'A', chinese: '這家公司的福利很好。', pinyin: 'Zhè jiā gōngsī de fúlì hěn hǎo.', english: 'This company has good benefits.' },
                { speaker: 'B', chinese: '對，有健康保險和年假。', pinyin: 'Duì, yǒu jiànkāng bǎoxiǎn hé niánjià.', english: 'Yes, they have health insurance and annual leave.' }
            ]
        }, {
            char: '服裝',
            pinyin: 'fúzhuāng',
            pos: 'N',
            en: 'Clothing / Apparel',
            explanation: 'A collective term for clothes, especially in a retail or fashion context.',
            dialogue: [
                { speaker: 'A', chinese: '這家店的服裝設計很時尚。', pinyin: 'Zhè jiā diàn de fúzhuāng shèjì hěn shíshàng.', english: 'The clothing designs in this store are very fashionable.' },
                { speaker: 'B', chinese: '我也這麼認為。', pinyin: 'Wǒ yě zhème rènwéi.', english: 'I think so too.' }
            ]
        }, {
            char: '腐敗',
            pinyin: 'fǔbài',
            pos: 'Vs',
            en: 'Corrupt / Rotten',
            explanation: 'Describes moral decay or the misuse of public power for private gain. Also used for organic decay.',
            dialogue: [
                { speaker: 'A', chinese: '腐敗會損害國家利益。', pinyin: 'Fǔbài huì sǔnhài guójiā lìyì.', english: 'Corruption harms national interests.' },
                { speaker: 'B', chinese: '我們堅決反對腐敗。', pinyin: 'Wǒmen jiānjué fǎnduì fǔbài.', english: 'We firmly oppose corruption.' }
            ]
        }, {
            char: '付出',
            pinyin: 'fùchū',
            pos: 'Vpt',
            en: 'To pay (effort/money)',
            explanation: 'To give or dedicate something, such as time, money, or energy, often in exchange for a result.',
            dialogue: [
                { speaker: 'A', chinese: '為了成功，他付出了很多努力。', pinyin: 'Wèi le chénggōng, tā fùchū le hěnduō nǔlì.', english: 'He put in a lot of effort to succeed.' },
                { speaker: 'B', chinese: '他的付出終於有了回報。', pinyin: 'Tā de fùchū zhōngyú yǒu le huíbào.', english: 'His efforts finally paid off.' }
            ]
        }, {
            char: '負擔',
            pinyin: 'fùdān',
            pos: 'N / V',
            en: 'Burden / To bear',
            explanation: 'As a noun, a heavy responsibility or load. As a verb, to bear a burden or cost.',
            dialogue: [
                { speaker: 'A', chinese: '這筆費用對他是個大負擔。', pinyin: 'Zhè bǐ fèiyòng duì tā shì gè dà fùdān.', english: 'This expense is a big burden for him.' },
                { speaker: 'B', chinese: '我們可以一起分擔。', pinyin: 'Wǒmen kěyǐ yīqǐ fēndān.', english: 'We can share it together.' }
            ]
        }];

        // ------------------------------------------------------------
        // RENDER ENGINE
        // ------------------------------------------------------------
        const grid = document.getElementById('vocabGrid');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const countDisplay = document.getElementById('countDisplay');
        const legendContainer = document.getElementById('legendContainer');
        const pinyinGlobalToggle = document.getElementById('pinyinGlobalToggle');
        const pinyinToggleLabel = document.getElementById('pinyinToggleLabel');

        let globalPinyinRevealed = false;

        // Legend
        const posSet = new Set(vocabData.map(d => d.pos));
        const posLabels = {
            'N': 'Noun',
            'V': 'Verb',
            'Vs': 'Stative Verb',
            'Vst': 'Stative/Transitive Verb',
            'Adv': 'Adverb',
            'Prep': 'Preposition',
            'M': 'Measure Word',
            'Ptc': 'Particle',
            'N/V': 'Noun / Verb',
            'Conj': 'Conjunction',
            'Det': 'Determiner',
            'V-sep': 'Separable Verb',
            'Vpt': 'Verb Particle (Trans.)',
            'Vi': 'Intransitive Verb',
            'Vp': 'Verb Particle'
        };
        const dotColorMap = {
            'N': '#7ba9c9',
            'V': '#7fb06a',
            'Vs': '#5ba884',
            'Vst': '#5ba884',
            'Adv': '#c9a86a',
            'Prep': '#c97a9a',
            'M': '#9a7ac9',
            'Ptc': '#c9b86a',
            'N/V': '#7ba9c9',
            'Conj': '#f0d0b0',
            'Det': '#f0b0b0',
            'V-sep': '#6ab06a',
            'Vpt': '#6a7ab0',
            'Vi': '#6a9a9a',
            'Vp': '#7a7a9a'
        };

        function buildLegend() {
            const sorted = Array.from(posSet).sort();
            let html = '';
            sorted.forEach(label => {
                const display = posLabels[label] || label;
                const color = dotColorMap[label] || '#b8aa98';
                html += `<span class="legend-item"><span class="legend-dot" style="background:${color};"></span>${display}</span>`;
            });
            legendContainer.innerHTML = html;
        }
        buildLegend();

        // Render function
        function render(filter = '') {
            const term = filter.trim().toLowerCase();
            let filtered = vocabData;

            if (term) {
                filtered = vocabData.filter(item => {
                    let dialogueSearch = '';
                    item.dialogue.forEach(line => {
                        dialogueSearch += line.chinese + ' ' + line.pinyin + ' ' + line.english + ' ';
                    });
                    const searchable = item.char + ' ' + item.pinyin + ' ' + item.en + ' ' + item.explanation + ' ' + dialogueSearch;
                    return searchable.toLowerCase().includes(term);
                });
            }

            countDisplay.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty">🔍 No matches found.</div>`;
                return;
            }

            let html = '';
            filtered.forEach((item, index) => {
                const posClass = 'pos-' + item.pos.replace('/', '-');
                const posDisplay = posLabels[item.pos] || item.pos;

                // Build dialogue HTML
                let dialogueHtml = '';
                dialogueHtml += `
                        <div class="dialogue-toggle-wrapper">
                            <strong>💬 Dialogue:</strong>
                            <button class="dialogue-toggle-btn" data-dialogue-idx="${index}">Show Pinyin & Translation</button>
                        </div>
                        <div class="dialogue-lines">
                    `;

                item.dialogue.forEach(line => {
                    const speakerClass = line.speaker === 'A' ? 'speaker-a' : 'speaker-b';
                    dialogueHtml += `
                            <div class="line">
                                <span class="${speakerClass}">${line.speaker}:</span>
                                <span class="zh">${line.chinese}</span>
                                <span class="dialogue-details">
                                    <span class="sep">·</span>
                                    <span class="pinyin-text">${line.pinyin}</span>
                                    <span class="sep">·</span>
                                    <span class="en-text">${line.english}</span>
                                </span>
                            </div>
                        `;
                });

                dialogueHtml += `</div>`;

                html += `
                        <div class="vocab-card" data-index="${index}">
                            <div class="char-row">
                                <span class="char">${item.char}</span>
                                <span class="pinyin-container" data-pinyin="${item.pinyin}" data-revealed="false">
                                    <span class="pinyin-value">${item.pinyin}</span>
                                </span>
                            </div>
                            <span class="pos ${posClass}">${posDisplay}</span>

                            <button class="details-toggle" data-target="details-${index}">
                                <span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)
                            </button>

                            <div id="details-${index}" class="details-content">
                                <div class="explanation">
                                    <div class="meaning-line">📘 ${item.en}</div>
                                    <br />
                                    <strong>📖 Usage:</strong> ${item.explanation}
                                </div>
                                <div class="dialogue-box" id="dialogue-box-${index}">
                                    ${dialogueHtml}
                                </div>
                            </div>
                        </div>
                    `;
            });

            grid.innerHTML = html;

            // ---- Click on the Hanzi toggles its pinyin ----
            document.querySelectorAll('.char').forEach(charEl => {
                charEl.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const row = this.closest('.char-row');
                    const pinyinContainer = row ? row.querySelector('.pinyin-container') : null;
                    if (!pinyinContainer) return;
                    const isRevealed = pinyinContainer.dataset.revealed === 'true';
                    const newState = !isRevealed;
                    pinyinContainer.dataset.revealed = newState ? 'true' : 'false';
                    pinyinContainer.classList.toggle('revealed', newState);
                });
            });

            // ---- Apply global state to all pinyin containers ----
            document.querySelectorAll('.pinyin-container').forEach(el => {
                const shouldReveal = globalPinyinRevealed;
                el.dataset.revealed = shouldReveal ? 'true' : 'false';
                el.classList.toggle('revealed', shouldReveal);
            });

            // ---- Toggle main details (Meaning/Explanation) ----
            document.querySelectorAll('.details-toggle').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const targetId = this.dataset.target;
                    const content = document.getElementById(targetId);
                    if (!content) return;

                    const isOpen = content.classList.contains('open');
                    if (isOpen) {
                        content.classList.remove('open');
                        this.classList.remove('active');
                        this.innerHTML = '<span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)';
                    } else {
                        content.classList.add('open');
                        this.classList.add('active');
                        this.innerHTML = '<span class="arrow">▲</span> Hide Details';
                    }
                });
            });

            // ---- Toggle dialogue pinyin/translation ----
            document.querySelectorAll('.dialogue-toggle-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = this.dataset.dialogueIdx;
                    const dialogueBox = document.getElementById(`dialogue-box-${idx}`);
                    if (!dialogueBox) return;

                    const isShowing = dialogueBox.classList.contains('show-translation');
                    if (isShowing) {
                        dialogueBox.classList.remove('show-translation');
                        this.textContent = 'Show Pinyin & Translation';
                    } else {
                        dialogueBox.classList.add('show-translation');
                        this.textContent = 'Hide Pinyin & Translation';
                    }
                });
            });

            updateGlobalToggleLabel();
        }

        // ---- Global Pinyin Toggle ----
        function updateGlobalToggleLabel() {
            if (globalPinyinRevealed) {
                pinyinToggleLabel.textContent = 'Hide All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔓';
            } else {
                pinyinToggleLabel.textContent = 'Show All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔊';
            }
        }

        pinyinGlobalToggle.addEventListener('click', function() {
            globalPinyinRevealed = !globalPinyinRevealed;
            document.querySelectorAll('.pinyin-container').forEach(el => {
                el.dataset.revealed = globalPinyinRevealed ? 'true' : 'false';
                el.classList.toggle('revealed', globalPinyinRevealed);
            });
            updateGlobalToggleLabel();
        });

        // ---- Search & Clear ----
        searchInput.addEventListener('input', () => render(searchInput.value));
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            render('');
            searchInput.focus();
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') clearBtn.click();
        });

        // ---- Initial render ----
        render('');
    </script>
</body>
</html>
