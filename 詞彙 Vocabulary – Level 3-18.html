<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 3-18 Flashcards (Click Hanzi for Pinyin)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: #f4f2ef;
            min-height: 100vh;
            padding: 2rem 1.5rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #1e1e2a;
        }

        .header h1 span {
            background: #d9c9b4;
            padding: 0.1rem 0.8rem;
            border-radius: 12px;
            color: #2c2c3a;
        }

        .header .sub {
            font-size: 1rem;
            color: #6b5f52;
            margin-top: 0.3rem;
            font-weight: 400;
        }

        .header .badge {
            display: inline-block;
            margin-top: 0.6rem;
            background: #2c2c3a;
            color: white;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            background: #ffffffd9;
            backdrop-filter: blur(6px);
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 2.2rem;
            border: 1px solid #e8e0d6;
        }

        .stats {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c2c3a;
            white-space: nowrap;
        }

        .stats strong {
            background: #ece6de;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-weight: 600;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f3efe9;
            padding: 0.1rem 0.1rem 0.1rem 1.2rem;
            border-radius: 40px;
            transition: 0.2s;
            border: 1px solid transparent;
            flex: 1;
            min-width: 180px;
        }

        .search-box:focus-within {
            background: #ffffff;
            border-color: #b8aa98;
            box-shadow: 0 0 0 3px rgba(184, 170, 152, 0.2);
        }

        .search-box input {
            border: none;
            background: transparent;
            font-size: 0.9rem;
            padding: 0.5rem 0;
            width: 100%;
            outline: none;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #1e1e2a;
        }

        .search-box input::placeholder {
            color: #a89b8c;
            font-weight: 400;
        }

        .search-box button {
            background: #2c2c3a;
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .search-box button:hover {
            background: #1a1a26;
        }

        .pinyin-global-toggle {
            background: #ece6de;
            border: 1px solid #d5cbbc;
            border-radius: 40px;
            padding: 0.3rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .pinyin-global-toggle:hover {
            background: #d5cbbc;
            border-color: #b8aa98;
        }

        .pinyin-global-toggle .icon {
            font-size: 1rem;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.2rem;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 0.6rem 1.2rem;
            background: #ffffffd9;
            border-radius: 40px;
            border: 1px solid #e8e0d6;
            font-size: 0.75rem;
            font-weight: 500;
            color: #2c2c3a;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .vocab-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid #ebe5dd;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .vocab-card:hover {
            border-color: #d0c3b2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .vocab-card .char-row {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.2rem;
        }

        .vocab-card .char {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1e1e2a;
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.2;
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease;
            padding: 0.1rem 0.4rem;
            border-radius: 8px;
            user-select: none;
        }

        .vocab-card .char:hover {
            color: #4a3f33;
            background: #f0ebe4;
        }

        .vocab-card .char:active {
            transform: scale(0.95);
        }

        .pinyin-container {
            display: inline-flex;
            align-items: center;
            min-width: 2.2rem;
            justify-content: center;
        }

        .pinyin-container .pinyin-value {
            font-size: 1rem;
            color: #6b5f52;
            font-weight: 400;
            letter-spacing: 0.3px;
            display: none;
        }

        .pinyin-container.revealed .pinyin-value {
            display: inline;
        }

        .vocab-card .pos {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            align-self: flex-start;
            margin-top: 0.6rem;
            background: #f0ebe4;
            color: #4a4037;
        }

        .pos-N {
            background: #dbe9f0;
            color: #1f5a7a;
        }
        .pos-V {
            background: #e6f0db;
            color: #3d6b2b;
        }
        .pos-Vs {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Vst {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Adv {
            background: #f0e6db;
            color: #7a5a2b;
        }
        .pos-Prep {
            background: #f0dbe6;
            color: #7a2b4a;
        }
        .pos-M {
            background: #e6dbf0;
            color: #4a2b7a;
        }
        .pos-Ptc {
            background: #f0e8db;
            color: #7a6b2b;
        }
        .pos-N\/V {
            background: #dbe8f0;
            color: #1f5a7a;
        }
        .pos-Conj {
            background: #f0e0d0;
            color: #7a5a3a;
        }
        .pos-Vst\/V {
            background: #d0d8d0;
            color: #2d5a3d;
        }
        .pos-N\/Vst {
            background: #b0c0d0;
            color: #2a4a6a;
        }

        .details-toggle {
            margin-top: 1.2rem;
            background: none;
            border: 1px solid #d5cbbc;
            border-radius: 30px;
            padding: 0.5rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #4a4037;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
            align-self: flex-start;
            background: #faf8f5;
        }

        .details-toggle:hover {
            background: #e8e0d6;
            border-color: #b8aa98;
        }

        .details-toggle .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .details-toggle.active .arrow {
            transform: rotate(180deg);
        }

        .details-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
        }

        .details-content.open {
            max-height: 900px;
            opacity: 1;
            margin-top: 1.2rem;
        }

        .details-content .explanation {
            background: #f8f6f2;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #2c2c3a;
            border-left: 4px solid #d0c3b2;
            margin-bottom: 1rem;
        }

        .details-content .explanation strong {
            color: #1e1e2a;
        }

        .details-content .explanation .meaning-line {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e1e2a;
            background: #e8e0d6;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 0.4rem;
        }

        .dialogue-box {
            background: #f0f4f8;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.8;
        }

        .dialogue-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 0.3rem;
        }

        .dialogue-toggle-btn {
            background: #e8e0d6;
            border: none;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .dialogue-toggle-btn:hover {
            background: #d5cbbc;
        }

        .dialogue-box .speaker-a {
            color: #1f5a7a;
            font-weight: 600;
        }

        .dialogue-box .speaker-b {
            color: #3d6b2b;
            font-weight: 600;
        }

        .dialogue-box .line {
            margin-bottom: 0.2rem;
        }
        .dialogue-box .line:last-child {
            margin-bottom: 0;
        }

        .dialogue-box .zh {
            font-family: 'Noto Sans SC', sans-serif;
            margin-right: 0.3rem;
        }

        .dialogue-details {
            display: none;
            margin-left: 0.3rem;
        }

        .dialogue-details .pinyin-text {
            font-weight: 400;
            color: #6b5f52;
        }

        .dialogue-details .en-text {
            font-style: italic;
            color: #4a4037;
        }

        .dialogue-details .sep {
            color: #b8aa98;
            margin: 0 0.2rem;
        }

        .dialogue-box.show-translation .dialogue-details {
            display: inline;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1.1rem;
            color: #8f8172;
            background: #faf8f5;
            border-radius: 30px;
            border: 1px dashed #d5cbbc;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.8rem 3rem;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                border-radius: 28px;
                padding: 1rem 1.2rem;
                gap: 0.8rem;
            }
            .stats {
                text-align: center;
            }
            .search-box {
                padding: 0.1rem 0.1rem 0.1rem 1rem;
            }
            .search-box button {
                padding: 0.4rem 1rem;
                font-size: 0.8rem;
            }
            .vocab-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .vocab-card .char {
                font-size: 1.8rem;
            }
            .pinyin-global-toggle {
                justify-content: center;
            }
        }

        @media (min-width: 641px) and (max-width: 900px) {
            .vocab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 詞彙 <span>Level 3-18</span></h1>
            <div class="sub">Flashcard Mode · <strong>Click the Hanzi</strong> to reveal Pinyin</div>
            <div class="badge">🔍 Click the character to show pinyin · "Show Details" for meaning & dialogue</div>
        </div>

        <div class="toolbar">
            <div class="stats">
                <strong id="countDisplay">0</strong> words
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Chinese, Pinyin, or English..." autocomplete="off" />
                <button id="clearBtn">✕</button>
            </div>
            <button class="pinyin-global-toggle" id="pinyinGlobalToggle">
                <span class="icon">🔊</span>
                <span id="pinyinToggleLabel">Show All Pinyin</span>
            </button>
        </div>

        <div class="legend" id="legendContainer"></div>

        <div class="vocab-grid" id="vocabGrid"></div>
    </div>

    <script>
        // ------------------------------------------------------------
        // DATA — Level 3-18 Vocabulary (Traditional Hanzi)
        // ------------------------------------------------------------
        const vocabData = [{
            char: '積極',
            pinyin: 'jījí',
            pos: 'Vs',
            en: 'Active / Positive',
            explanation: 'Describes someone who is energetic, proactive, and enthusiastic about tasks or life in general.',
            dialogue: [
                { speaker: 'A', chinese: '他工作很積極。', pinyin: 'Tā gōngzuò hěn jījí.', english: 'He is very active at work.' },
                { speaker: 'B', chinese: '對，他總是第一個到的。', pinyin: 'Duì, tā zǒngshì dì yī gè dào de.', english: 'Yes, he always arrives first.' }
            ]
        }, {
            char: '激烈',
            pinyin: 'jīliè',
            pos: 'Vs',
            en: 'Fierce / Intense',
            explanation: 'Describes competition, conflict, or emotions that are strong and vigorous. Often used for debates, sports, or battles.',
            dialogue: [
                { speaker: 'A', chinese: '比賽非常激烈。', pinyin: 'Bǐsài fēicháng jīliè.', english: 'The competition was very fierce.' },
                { speaker: 'B', chinese: '兩隊實力相當。', pinyin: 'Liǎng duì shílì xiāngdāng.', english: 'Both teams are evenly matched.' }
            ]
        }, {
            char: '機器',
            pinyin: 'jīqì',
            pos: 'N',
            en: 'Machine',
            explanation: 'A mechanical device that uses power to perform a specific task. Often used in industrial and everyday contexts.',
            dialogue: [
                { speaker: 'A', chinese: '這台機器壞了。', pinyin: 'Zhè tái jīqì huài le.', english: 'This machine is broken.' },
                { speaker: 'B', chinese: '找技工來修理吧。', pinyin: 'Zhǎo jìgōng lái xiūlǐ ba.', english: 'Let\'s find a technician to fix it.' }
            ]
        }, {
            char: '及',
            pinyin: 'jí',
            pos: 'Conj',
            en: 'And (formal) / As well as',
            explanation: 'A formal conjunction used to connect nouns, meaning "and" or "as well as." Often used in written Chinese.',
            dialogue: [
                { speaker: 'A', chinese: '公司提供福利及培訓。', pinyin: 'Gōngsī tígōng fúlì jí péixùn.', english: 'The company offers benefits as well as training.' },
                { speaker: 'B', chinese: '這是很好的機會。', pinyin: 'Zhè shì hěn hǎo de jīhuì.', english: 'This is a good opportunity.' }
            ]
        }, {
            char: '及時',
            pinyin: 'jíshí',
            pos: 'Adv',
            en: 'Timely / In time',
            explanation: 'Indicates that an action happens at the right time, before it is too late.',
            dialogue: [
                { speaker: 'A', chinese: '你來得真及時！', pinyin: 'Nǐ lái de zhēn jíshí!', english: 'You arrived just in time!' },
                { speaker: 'B', chinese: '我怕錯過會議。', pinyin: 'Wǒ pà cuòguò huìyì.', english: 'I was afraid of missing the meeting.' }
            ]
        }, {
            char: '擠',
            pinyin: 'jǐ',
            pos: 'V / Vs',
            en: 'To squeeze / Crowded',
            explanation: 'As a verb, to push or press into a confined space. As a stative verb, describes a place that is overcrowded.',
            dialogue: [
                { speaker: 'A', chinese: '地鐵上很擠。', pinyin: 'Dìtiě shàng hěn jǐ.', english: 'The subway is very crowded.' },
                { speaker: 'B', chinese: '我們等下一班吧。', pinyin: 'Wǒmen děng xià yī bān ba.', english: 'Let\'s wait for the next one.' }
            ]
        }, {
            char: '記',
            pinyin: 'jì',
            pos: 'Vst / V',
            en: 'To remember / To record',
            explanation: 'To keep in mind or to write down for later reference. Also used in compound words like 記住 (remember).',
            dialogue: [
                { speaker: 'A', chinese: '請記下這個電話。', pinyin: 'Qǐng jì xià zhège diànhuà.', english: 'Please write down this phone number.' },
                { speaker: 'B', chinese: '好的，我記住了。', pinyin: 'Hǎo de, wǒ jìzhù le.', english: 'OK, I\'ve memorized it.' }
            ]
        }, {
            char: '記錄',
            pinyin: 'jìlù',
            pos: 'N / V',
            en: 'Record / To record',
            explanation: 'As a noun, a written account or documentation of events. As a verb, to keep a record of something.',
            dialogue: [
                { speaker: 'A', chinese: '會議記錄做好了嗎？', pinyin: 'Huìyì jìlù zuò hǎo le ma?', english: 'Is the meeting record ready?' },
                { speaker: 'B', chinese: '做好了，我已經記錄了重點。', pinyin: 'Zuò hǎo le, wǒ yǐjīng jìlù le zhòngdiǎn.', english: 'Yes, I\'ve recorded the key points.' }
            ]
        }, {
            char: '紀念',
            pinyin: 'jìniàn',
            pos: 'N / Vst',
            en: 'Commemoration / To commemorate',
            explanation: 'To honor or remember someone or something important, often through a ceremony or object.',
            dialogue: [
                { speaker: 'A', chinese: '這張照片是紀念我們友誼的。', pinyin: 'Zhè zhāng zhàopiàn shì jìniàn wǒmen yǒuyì de.', english: 'This photo is to commemorate our friendship.' },
                { speaker: 'B', chinese: '真有意義。', pinyin: 'Zhēn yǒu yìyì.', english: 'It\'s very meaningful.' }
            ]
        }, {
            char: '技巧',
            pinyin: 'jìqiǎo',
            pos: 'N',
            en: 'Skill / Technique',
            explanation: 'A specific method or proficiency in doing something, often gained through practice and experience.',
            dialogue: [
                { speaker: 'A', chinese: '滑雪需要很多技巧。', pinyin: 'Huáxuě xūyào hěnduō jìqiǎo.', english: 'Skiing requires a lot of skill.' },
                { speaker: 'B', chinese: '我還在學習中。', pinyin: 'Wǒ hái zài xuéxí zhōng.', english: 'I\'m still learning.' }
            ]
        }, {
            char: '繼續',
            pinyin: 'jìxù',
            pos: 'V',
            en: 'To continue',
            explanation: 'To keep doing something without stopping, or to resume after a pause.',
            dialogue: [
                { speaker: 'A', chinese: '我們繼續討論吧。', pinyin: 'Wǒmen jìxù tǎolùn ba.', english: 'Let\'s continue the discussion.' },
                { speaker: 'B', chinese: '好，我還有幾個問題。', pinyin: 'Hǎo, wǒ hái yǒu jǐ gè wèntí.', english: 'OK, I still have a few questions.' }
            ]
        }, {
            char: '記憶',
            pinyin: 'jìyì',
            pos: 'N',
            en: 'Memory',
            explanation: 'The ability to remember, or the collection of things that are remembered.',
            dialogue: [
                { speaker: 'A', chinese: '我的記憶力變差了。', pinyin: 'Wǒ de jìyì lì biàn chà le.', english: 'My memory is getting worse.' },
                { speaker: 'B', chinese: '你要多運動，大腦會更好。', pinyin: 'Nǐ yào duō yùndòng, dànǎo huì gèng hǎo.', english: 'You should exercise more; your brain will be better.' }
            ]
        }, {
            char: '記者',
            pinyin: 'jìzhě',
            pos: 'N',
            en: 'Journalist / Reporter',
            explanation: 'A person who collects and reports news for media outlets such as newspapers, TV, or online platforms.',
            dialogue: [
                { speaker: 'A', chinese: '這位記者採訪了市長。', pinyin: 'Zhè wèi jìzhě cǎifǎng le shìzhǎng.', english: 'This reporter interviewed the mayor.' },
                { speaker: 'B', chinese: '報導寫得很好。', pinyin: 'Bàodǎo xiě de hěn hǎo.', english: 'The report was well written.' }
            ]
        }, {
            char: '家',
            pinyin: 'jiā',
            pos: 'M',
            en: 'Measure word for families / businesses',
            explanation: 'A measure word used for families, households, or shops/restaurants (e.g., 一家餐廳 = a restaurant).',
            dialogue: [
                { speaker: 'A', chinese: '我喜歡那家咖啡館。', pinyin: 'Wǒ xǐhuān nà jiā kāfēiguǎn.', english: 'I like that coffee shop.' },
                { speaker: 'B', chinese: '他們的咖啡很好喝。', pinyin: 'Tāmen de kāfēi hěn hǎohē.', english: 'Their coffee is very good.' }
            ]
        }, {
            char: '假',
            pinyin: 'jiǎ',
            pos: 'Vs',
            en: 'False / Fake',
            explanation: 'Describes something that is not genuine, counterfeit, or not real.',
            dialogue: [
                { speaker: 'A', chinese: '這件名牌是假的。', pinyin: 'Zhè jiàn míngpái shì jiǎ de.', english: 'This designer item is fake.' },
                { speaker: 'B', chinese: '你怎麼看出來的？', pinyin: 'Nǐ zěnme kàn chūlái de?', english: 'How can you tell?' }
            ]
        }, {
            char: '架',
            pinyin: 'jià',
            pos: 'M',
            en: 'Measure word for planes / machines',
            explanation: 'A measure word for airplanes, large machines, or a frame/structure. Also used for bridges (一架橋).',
            dialogue: [
                { speaker: 'A', chinese: '空中有一架飛機。', pinyin: 'Kōngzhōng yǒu yī jià fēijī.', english: 'There is an airplane in the sky.' },
                { speaker: 'B', chinese: '飛得很高。', pinyin: 'Fēi de hěn gāo.', english: 'It\'s flying very high.' }
            ]
        }, {
            char: '價格',
            pinyin: 'jiàgé',
            pos: 'N',
            en: 'Price',
            explanation: 'The amount of money required to purchase an item or service.',
            dialogue: [
                { speaker: 'A', chinese: '這件衣服的價格是多少？', pinyin: 'Zhè jiàn yīfu de jiàgé shì duōshao?', english: 'What is the price of this clothing?' },
                { speaker: 'B', chinese: '五百元，正在打折。', pinyin: 'Wǔbǎi yuán, zhèngzài dǎzhé.', english: '500 yuan, it\'s on sale.' }
            ]
        }, {
            char: '肩',
            pinyin: 'jiān',
            pos: 'N',
            en: 'Shoulder',
            explanation: 'The part of the body between the neck and the arm. Often used in expressions like 肩膀 (shoulder).',
            dialogue: [
                { speaker: 'A', chinese: '我的肩膀疼。', pinyin: 'Wǒ de jiānbǎng téng.', english: 'My shoulder hurts.' },
                { speaker: 'B', chinese: '你應該去按摩。', pinyin: 'Nǐ yīnggāi qù ànmó.', english: 'You should get a massage.' }
            ]
        }, {
            char: '肩膀',
            pinyin: 'jiānbǎng',
            pos: 'N',
            en: 'Shoulder (colloquial)',
            explanation: 'A common term for the shoulder, used in everyday conversation.',
            dialogue: [
                { speaker: 'A', chinese: '我背著一個很重的背包，肩膀很酸。', pinyin: 'Wǒ bēi zhe yī gè hěn zhòng de bèibāo, jiānbǎng hěn suān.', english: 'I\'m carrying a heavy backpack; my shoulders are very sore.' },
                { speaker: 'B', chinese: '放下來休息一下吧。', pinyin: 'Fàng xiàlái xiūxi yīxià ba.', english: 'Put it down and rest for a while.' }
            ]
        }, {
            char: '堅持',
            pinyin: 'jiānchí',
            pos: 'Vs',
            en: 'To persist / To insist',
            explanation: 'To continue firmly in a course of action despite difficulties or opposition.',
            dialogue: [
                { speaker: 'A', chinese: '他堅持每天都運動。', pinyin: 'Tā jiānchí měitiān dōu yùndòng.', english: 'He persists in exercising every day.' },
                { speaker: 'B', chinese: '難怪他身體這麼好。', pinyin: 'Nánguài tā shēntǐ zhème hǎo.', english: 'No wonder he is so healthy.' }
            ]
        }];

        // ------------------------------------------------------------
        // RENDER ENGINE
        // ------------------------------------------------------------
        const grid = document.getElementById('vocabGrid');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const countDisplay = document.getElementById('countDisplay');
        const legendContainer = document.getElementById('legendContainer');
        const pinyinGlobalToggle = document.getElementById('pinyinGlobalToggle');
        const pinyinToggleLabel = document.getElementById('pinyinToggleLabel');

        let globalPinyinRevealed = false;

        // Legend
        const posSet = new Set(vocabData.map(d => d.pos));
        const posLabels = {
            'N': 'Noun',
            'V': 'Verb',
            'Vs': 'Stative Verb',
            'Vst': 'Stative/Transitive Verb',
            'Adv': 'Adverb',
            'Prep': 'Preposition',
            'M': 'Measure Word',
            'Ptc': 'Particle',
            'N/V': 'Noun / Verb',
            'Conj': 'Conjunction',
            'Vst/V': 'Stative/Transitive / Verb',
            'N/Vst': 'Noun / Stative Verb'
        };
        const dotColorMap = {
            'N': '#7ba9c9',
            'V': '#7fb06a',
            'Vs': '#5ba884',
            'Vst': '#5ba884',
            'Adv': '#c9a86a',
            'Prep': '#c97a9a',
            'M': '#9a7ac9',
            'Ptc': '#c9b86a',
            'N/V': '#7ba9c9',
            'Conj': '#f0d0b0',
            'Vst/V': '#b0c0a0',
            'N/Vst': '#b0c0d0'
        };

        function buildLegend() {
            const sorted = Array.from(posSet).sort();
            let html = '';
            sorted.forEach(label => {
                const display = posLabels[label] || label;
                const color = dotColorMap[label] || '#b8aa98';
                html += `<span class="legend-item"><span class="legend-dot" style="background:${color};"></span>${display}</span>`;
            });
            legendContainer.innerHTML = html;
        }
        buildLegend();

        // Render function
        function render(filter = '') {
            const term = filter.trim().toLowerCase();
            let filtered = vocabData;

            if (term) {
                filtered = vocabData.filter(item => {
                    let dialogueSearch = '';
                    item.dialogue.forEach(line => {
                        dialogueSearch += line.chinese + ' ' + line.pinyin + ' ' + line.english + ' ';
                    });
                    const searchable = item.char + ' ' + item.pinyin + ' ' + item.en + ' ' + item.explanation + ' ' + dialogueSearch;
                    return searchable.toLowerCase().includes(term);
                });
            }

            countDisplay.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty">🔍 No matches found.</div>`;
                return;
            }

            let html = '';
            filtered.forEach((item, index) => {
                const posClass = 'pos-' + item.pos.replace('/', '-');
                const posDisplay = posLabels[item.pos] || item.pos;

                // Build dialogue HTML
                let dialogueHtml = '';
                dialogueHtml += `
                        <div class="dialogue-toggle-wrapper">
                            <strong>💬 Dialogue:</strong>
                            <button class="dialogue-toggle-btn" data-dialogue-idx="${index}">Show Pinyin & Translation</button>
                        </div>
                        <div class="dialogue-lines">
                    `;

                item.dialogue.forEach(line => {
                    const speakerClass = line.speaker === 'A' ? 'speaker-a' : 'speaker-b';
                    dialogueHtml += `
                            <div class="line">
                                <span class="${speakerClass}">${line.speaker}:</span>
                                <span class="zh">${line.chinese}</span>
                                <span class="dialogue-details">
                                    <span class="sep">·</span>
                                    <span class="pinyin-text">${line.pinyin}</span>
                                    <span class="sep">·</span>
                                    <span class="en-text">${line.english}</span>
                                </span>
                            </div>
                        `;
                });

                dialogueHtml += `</div>`;

                html += `
                        <div class="vocab-card" data-index="${index}">
                            <div class="char-row">
                                <span class="char">${item.char}</span>
                                <span class="pinyin-container" data-pinyin="${item.pinyin}" data-revealed="false">
                                    <span class="pinyin-value">${item.pinyin}</span>
                                </span>
                            </div>
                            <span class="pos ${posClass}">${posDisplay}</span>

                            <button class="details-toggle" data-target="details-${index}">
                                <span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)
                            </button>

                            <div id="details-${index}" class="details-content">
                                <div class="explanation">
                                    <div class="meaning-line">📘 ${item.en}</div>
                                    <br />
                                    <strong>📖 Usage:</strong> ${item.explanation}
                                </div>
                                <div class="dialogue-box" id="dialogue-box-${index}">
                                    ${dialogueHtml}
                                </div>
                            </div>
                        </div>
                    `;
            });

            grid.innerHTML = html;

            // ---- Click on the Hanzi toggles its pinyin ----
            document.querySelectorAll('.char').forEach(charEl => {
                charEl.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const row = this.closest('.char-row');
                    const pinyinContainer = row ? row.querySelector('.pinyin-container') : null;
                    if (!pinyinContainer) return;
                    const isRevealed = pinyinContainer.dataset.revealed === 'true';
                    const newState = !isRevealed;
                    pinyinContainer.dataset.revealed = newState ? 'true' : 'false';
                    pinyinContainer.classList.toggle('revealed', newState);
                });
            });

            // ---- Apply global state to all pinyin containers ----
            document.querySelectorAll('.pinyin-container').forEach(el => {
                const shouldReveal = globalPinyinRevealed;
                el.dataset.revealed = shouldReveal ? 'true' : 'false';
                el.classList.toggle('revealed', shouldReveal);
            });

            // ---- Toggle main details (Meaning/Explanation) ----
            document.querySelectorAll('.details-toggle').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const targetId = this.dataset.target;
                    const content = document.getElementById(targetId);
                    if (!content) return;

                    const isOpen = content.classList.contains('open');
                    if (isOpen) {
                        content.classList.remove('open');
                        this.classList.remove('active');
                        this.innerHTML = '<span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)';
                    } else {
                        content.classList.add('open');
                        this.classList.add('active');
                        this.innerHTML = '<span class="arrow">▲</span> Hide Details';
                    }
                });
            });

            // ---- Toggle dialogue pinyin/translation ----
            document.querySelectorAll('.dialogue-toggle-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = this.dataset.dialogueIdx;
                    const dialogueBox = document.getElementById(`dialogue-box-${idx}`);
                    if (!dialogueBox) return;

                    const isShowing = dialogueBox.classList.contains('show-translation');
                    if (isShowing) {
                        dialogueBox.classList.remove('show-translation');
                        this.textContent = 'Show Pinyin & Translation';
                    } else {
                        dialogueBox.classList.add('show-translation');
                        this.textContent = 'Hide Pinyin & Translation';
                    }
                });
            });

            updateGlobalToggleLabel();
        }

        // ---- Global Pinyin Toggle ----
        function updateGlobalToggleLabel() {
            if (globalPinyinRevealed) {
                pinyinToggleLabel.textContent = 'Hide All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔓';
            } else {
                pinyinToggleLabel.textContent = 'Show All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔊';
            }
        }

        pinyinGlobalToggle.addEventListener('click', function() {
            globalPinyinRevealed = !globalPinyinRevealed;
            document.querySelectorAll('.pinyin-container').forEach(el => {
                el.dataset.revealed = globalPinyinRevealed ? 'true' : 'false';
                el.classList.toggle('revealed', globalPinyinRevealed);
            });
            updateGlobalToggleLabel();
        });

        // ---- Search & Clear ----
        searchInput.addEventListener('input', () => render(searchInput.value));
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            render('');
            searchInput.focus();
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') clearBtn.click();
        });

        // ---- Initial render ----
        render('');
    </script>
</body>
</html>
