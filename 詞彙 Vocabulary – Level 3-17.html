<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 3-17 Flashcards (Click Hanzi for Pinyin)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: #f4f2ef;
            min-height: 100vh;
            padding: 2rem 1.5rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #1e1e2a;
        }

        .header h1 span {
            background: #d9c9b4;
            padding: 0.1rem 0.8rem;
            border-radius: 12px;
            color: #2c2c3a;
        }

        .header .sub {
            font-size: 1rem;
            color: #6b5f52;
            margin-top: 0.3rem;
            font-weight: 400;
        }

        .header .badge {
            display: inline-block;
            margin-top: 0.6rem;
            background: #2c2c3a;
            color: white;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            background: #ffffffd9;
            backdrop-filter: blur(6px);
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 2.2rem;
            border: 1px solid #e8e0d6;
        }

        .stats {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c2c3a;
            white-space: nowrap;
        }

        .stats strong {
            background: #ece6de;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-weight: 600;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f3efe9;
            padding: 0.1rem 0.1rem 0.1rem 1.2rem;
            border-radius: 40px;
            transition: 0.2s;
            border: 1px solid transparent;
            flex: 1;
            min-width: 180px;
        }

        .search-box:focus-within {
            background: #ffffff;
            border-color: #b8aa98;
            box-shadow: 0 0 0 3px rgba(184, 170, 152, 0.2);
        }

        .search-box input {
            border: none;
            background: transparent;
            font-size: 0.9rem;
            padding: 0.5rem 0;
            width: 100%;
            outline: none;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #1e1e2a;
        }

        .search-box input::placeholder {
            color: #a89b8c;
            font-weight: 400;
        }

        .search-box button {
            background: #2c2c3a;
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .search-box button:hover {
            background: #1a1a26;
        }

        .pinyin-global-toggle {
            background: #ece6de;
            border: 1px solid #d5cbbc;
            border-radius: 40px;
            padding: 0.3rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .pinyin-global-toggle:hover {
            background: #d5cbbc;
            border-color: #b8aa98;
        }

        .pinyin-global-toggle .icon {
            font-size: 1rem;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.2rem;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 0.6rem 1.2rem;
            background: #ffffffd9;
            border-radius: 40px;
            border: 1px solid #e8e0d6;
            font-size: 0.75rem;
            font-weight: 500;
            color: #2c2c3a;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .vocab-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid #ebe5dd;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .vocab-card:hover {
            border-color: #d0c3b2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .vocab-card .char-row {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.2rem;
        }

        .vocab-card .char {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1e1e2a;
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.2;
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease;
            padding: 0.1rem 0.4rem;
            border-radius: 8px;
            user-select: none;
        }

        .vocab-card .char:hover {
            color: #4a3f33;
            background: #f0ebe4;
        }

        .vocab-card .char:active {
            transform: scale(0.95);
        }

        .pinyin-container {
            display: inline-flex;
            align-items: center;
            min-width: 2.2rem;
            justify-content: center;
        }

        .pinyin-container .pinyin-value {
            font-size: 1rem;
            color: #6b5f52;
            font-weight: 400;
            letter-spacing: 0.3px;
            display: none;
        }

        .pinyin-container.revealed .pinyin-value {
            display: inline;
        }

        .vocab-card .pos {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            align-self: flex-start;
            margin-top: 0.6rem;
            background: #f0ebe4;
            color: #4a4037;
        }

        .pos-N {
            background: #dbe9f0;
            color: #1f5a7a;
        }
        .pos-V {
            background: #e6f0db;
            color: #3d6b2b;
        }
        .pos-Vs {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Vst {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Adv {
            background: #f0e6db;
            color: #7a5a2b;
        }
        .pos-Prep {
            background: #f0dbe6;
            color: #7a2b4a;
        }
        .pos-M {
            background: #e6dbf0;
            color: #4a2b7a;
        }
        .pos-Ptc {
            background: #f0e8db;
            color: #7a6b2b;
        }
        .pos-N\/V {
            background: #dbe8f0;
            color: #1f5a7a;
        }
        .pos-Conj {
            background: #f0e0d0;
            color: #7a5a3a;
        }
        .pos-Det {
            background: #f0d4d4;
            color: #7a3a3a;
        }
        .pos-V-sep {
            background: #d4e8d4;
            color: #2d6b2d;
        }
        .pos-Vpt {
            background: #d4d8e8;
            color: #3a4a7a;
        }
        .pos-Vi {
            background: #d4e0e0;
            color: #2d5a5a;
        }
        .pos-Vp {
            background: #d4d0d8;
            color: #3a3a5a;
        }
        .pos-Vaux {
            background: #d4d8e0;
            color: #3a4a5a;
        }
        .pos-Vs-attr {
            background: #d0e0d0;
            color: #2d6b3d;
        }
        .pos-N\/Vs {
            background: #b0c0d0;
            color: #2a4a6a;
        }

        .details-toggle {
            margin-top: 1.2rem;
            background: none;
            border: 1px solid #d5cbbc;
            border-radius: 30px;
            padding: 0.5rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #4a4037;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
            align-self: flex-start;
            background: #faf8f5;
        }

        .details-toggle:hover {
            background: #e8e0d6;
            border-color: #b8aa98;
        }

        .details-toggle .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .details-toggle.active .arrow {
            transform: rotate(180deg);
        }

        .details-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
        }

        .details-content.open {
            max-height: 900px;
            opacity: 1;
            margin-top: 1.2rem;
        }

        .details-content .explanation {
            background: #f8f6f2;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #2c2c3a;
            border-left: 4px solid #d0c3b2;
            margin-bottom: 1rem;
        }

        .details-content .explanation strong {
            color: #1e1e2a;
        }

        .details-content .explanation .meaning-line {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e1e2a;
            background: #e8e0d6;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 0.4rem;
        }

        .dialogue-box {
            background: #f0f4f8;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.8;
        }

        .dialogue-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 0.3rem;
        }

        .dialogue-toggle-btn {
            background: #e8e0d6;
            border: none;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .dialogue-toggle-btn:hover {
            background: #d5cbbc;
        }

        .dialogue-box .speaker-a {
            color: #1f5a7a;
            font-weight: 600;
        }

        .dialogue-box .speaker-b {
            color: #3d6b2b;
            font-weight: 600;
        }

        .dialogue-box .line {
            margin-bottom: 0.2rem;
        }
        .dialogue-box .line:last-child {
            margin-bottom: 0;
        }

        .dialogue-box .zh {
            font-family: 'Noto Sans SC', sans-serif;
            margin-right: 0.3rem;
        }

        .dialogue-details {
            display: none;
            margin-left: 0.3rem;
        }

        .dialogue-details .pinyin-text {
            font-weight: 400;
            color: #6b5f52;
        }

        .dialogue-details .en-text {
            font-style: italic;
            color: #4a4037;
        }

        .dialogue-details .sep {
            color: #b8aa98;
            margin: 0 0.2rem;
        }

        .dialogue-box.show-translation .dialogue-details {
            display: inline;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1.1rem;
            color: #8f8172;
            background: #faf8f5;
            border-radius: 30px;
            border: 1px dashed #d5cbbc;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.8rem 3rem;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                border-radius: 28px;
                padding: 1rem 1.2rem;
                gap: 0.8rem;
            }
            .stats {
                text-align: center;
            }
            .search-box {
                padding: 0.1rem 0.1rem 0.1rem 1rem;
            }
            .search-box button {
                padding: 0.4rem 1rem;
                font-size: 0.8rem;
            }
            .vocab-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .vocab-card .char {
                font-size: 1.8rem;
            }
            .pinyin-global-toggle {
                justify-content: center;
            }
        }

        @media (min-width: 641px) and (max-width: 900px) {
            .vocab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 詞彙 <span>Level 3-17</span></h1>
            <div class="sub">Flashcard Mode · <strong>Click the Hanzi</strong> to reveal Pinyin</div>
            <div class="badge">🔍 Click the character to show pinyin · "Show Details" for meaning & dialogue</div>
        </div>

        <div class="toolbar">
            <div class="stats">
                <strong id="countDisplay">0</strong> words
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Chinese, Pinyin, or English..." autocomplete="off" />
                <button id="clearBtn">✕</button>
            </div>
            <button class="pinyin-global-toggle" id="pinyinGlobalToggle">
                <span class="icon">🔊</span>
                <span id="pinyinToggleLabel">Show All Pinyin</span>
            </button>
        </div>

        <div class="legend" id="legendContainer"></div>

        <div class="vocab-grid" id="vocabGrid"></div>
    </div>

    <script>
        // ------------------------------------------------------------
        // DATA — Level 3-17 Vocabulary (Traditional Hanzi)
        // ------------------------------------------------------------
        const vocabData = [{
            char: '護照',
            pinyin: 'hùzhào',
            pos: 'N',
            en: 'Passport',
            explanation: 'An official document issued by a government that certifies the identity and nationality of the holder for international travel.',
            dialogue: [
                { speaker: 'A', chinese: '你的護照帶了嗎？', pinyin: 'Nǐ de hùzhào dài le ma?', english: 'Did you bring your passport?' },
                { speaker: 'B', chinese: '帶了，我隨身攜帶。', pinyin: 'Dài le, wǒ suíshēn xiédài.', english: 'Yes, I carry it with me.' }
            ]
        }, {
            char: '黃',
            pinyin: 'huáng',
            pos: 'Vs',
            en: 'Yellow',
            explanation: 'The color yellow, which has cultural significance in Chinese tradition. Also used in expressions like 黃色 (yellow color).',
            dialogue: [
                { speaker: 'A', chinese: '她穿了一件黃色的裙子。', pinyin: 'Tā chuān le yī jiàn huángsè de qúnzi.', english: 'She wore a yellow dress.' },
                { speaker: 'B', chinese: '很亮眼！', pinyin: 'Hěn liàngyǎn!', english: 'Very eye-catching!' }
            ]
        }, {
            char: '花心',
            pinyin: 'huāxīn',
            pos: 'Vs',
            en: 'Fickle in love / Playboy',
            explanation: 'Describes a person who is not faithful in romantic relationships, often looking for new partners. Usually used for men.',
            dialogue: [
                { speaker: 'A', chinese: '那個男生很花心。', pinyin: 'Nàge nánshēng hěn huāxīn.', english: 'That guy is very fickle in love.' },
                { speaker: 'B', chinese: '女生們都要小心。', pinyin: 'Nǚshēngmen dōu yào xiǎoxīn.', english: 'Girls should be careful.' }
            ]
        }, {
            char: '花園',
            pinyin: 'huāyuán',
            pos: 'N',
            en: 'Garden',
            explanation: 'A piece of land where flowers, plants, and sometimes vegetables are grown. Often used for relaxation and beauty.',
            dialogue: [
                { speaker: 'A', chinese: '我家的花園種了很多玫瑰。', pinyin: 'Wǒ jiā de huāyuán zhòng le hěnduō méigui.', english: 'My family\'s garden has many roses.' },
                { speaker: 'B', chinese: '真漂亮，你很有園藝天賦。', pinyin: 'Zhēn piàoliang, nǐ hěn yǒu yuányì tiānfù.', english: 'So beautiful, you have a talent for gardening.' }
            ]
        }, {
            char: '滑雪',
            pinyin: 'huáxuě',
            pos: 'V-sep',
            en: 'To ski',
            explanation: 'A separable verb meaning to ski or engage in skiing. Can be separated (e.g., 滑了一天雪).',
            dialogue: [
                { speaker: 'A', chinese: '我今年冬天想去滑雪。', pinyin: 'Wǒ jīnnián dōngtiān xiǎng qù huáxuě.', english: 'I want to go skiing this winter.' },
                { speaker: 'B', chinese: '我也想去，聽說那裡的雪場很好。', pinyin: 'Wǒ yě xiǎng qù, tīngshuō nàlǐ de xuěchǎng hěn hǎo.', english: 'I want to go too; I heard the ski resort there is great.' }
            ]
        }, {
            char: '話題',
            pinyin: 'huàtí',
            pos: 'N',
            en: 'Topic / Subject of conversation',
            explanation: 'The subject or theme being discussed in a conversation or debate.',
            dialogue: [
                { speaker: 'A', chinese: '我們換個話題吧。', pinyin: 'Wǒmen huàn gè huàtí ba.', english: 'Let\'s change the topic.' },
                { speaker: 'B', chinese: '好啊，你想聊什麼？', pinyin: 'Hǎo a, nǐ xiǎng liáo shénme?', english: 'OK, what do you want to talk about?' }
            ]
        }, {
            char: '化妝品',
            pinyin: 'huàzhuāngpǐn',
            pos: 'N',
            en: 'Cosmetics',
            explanation: 'Products used to enhance or alter the appearance of the face and body, such as makeup, skincare, and perfume.',
            dialogue: [
                { speaker: 'A', chinese: '你喜歡哪些化妝品品牌？', pinyin: 'Nǐ xǐhuān nǎxiē huàzhuāngpǐn pǐnpái?', english: 'Which cosmetic brands do you like?' },
                { speaker: 'B', chinese: '我喜歡日系的。', pinyin: 'Wǒ xǐhuān Rìxì de.', english: 'I like Japanese brands.' }
            ]
        }, {
            char: '恢復',
            pinyin: 'huīfù',
            pos: 'Vpt',
            en: 'To recover / To restore',
            explanation: 'To return to a previous state, such as health, normal conditions, or order. Also used for restoring relationships or systems.',
            dialogue: [
                { speaker: 'A', chinese: '他恢復了健康。', pinyin: 'Tā huīfù le jiànkāng.', english: 'He has recovered his health.' },
                { speaker: 'B', chinese: '太好了，終於康復了。', pinyin: 'Tài hǎo le, zhōngyú kāngfù le.', english: 'Great, finally recovered.' }
            ]
        }, {
            char: '回',
            pinyin: 'huí',
            pos: 'M',
            en: 'Measure word for times / occurrences',
            explanation: 'Used as a measure word for the number of times an action happens (e.g., 一次 = once, 兩次 = twice). Also means "to return" as a verb.',
            dialogue: [
                { speaker: 'A', chinese: '我去過北京好幾回了。', pinyin: 'Wǒ qùguò Běijīng hǎo jǐ huí le.', english: 'I\'ve been to Beijing several times.' },
                { speaker: 'B', chinese: '那你很熟悉了。', pinyin: 'Nà nǐ hěn shúxī le.', english: 'Then you\'re very familiar with it.' }
            ]
        }, {
            char: '回想',
            pinyin: 'huíxiǎng',
            pos: 'V',
            en: 'To recall / To think back',
            explanation: 'To remember or reflect on past events or experiences, often with a sense of nostalgia.',
            dialogue: [
                { speaker: 'A', chinese: '我回想童年的時候很開心。', pinyin: 'Wǒ huíxiǎng tóngnián de shíhou hěn kāixīn.', english: 'I recall my childhood with happiness.' },
                { speaker: 'B', chinese: '每個人都懷念童年。', pinyin: 'Měi gè rén dōu huáiniàn tóngnián.', english: 'Everyone misses their childhood.' }
            ]
        }, {
            char: '會',
            pinyin: 'huì',
            pos: 'N',
            en: 'Meeting / Can (modal)',
            explanation: 'As a noun, it means a meeting or gathering. As a modal verb, it means "can" or "will" (e.g., 我會去).',
            dialogue: [
                { speaker: 'A', chinese: '明天的會你參加嗎？', pinyin: 'Míngtiān de huì nǐ cānjiā ma?', english: 'Will you attend tomorrow\'s meeting?' },
                { speaker: 'B', chinese: '會，我一定會去。', pinyin: 'Huì, wǒ yīdìng huì qù.', english: 'Yes, I will definitely go.' }
            ]
        }, {
            char: '會場',
            pinyin: 'huìchǎng',
            pos: 'N',
            en: 'Meeting place / Venue',
            explanation: 'The location where a meeting, conference, or event is held.',
            dialogue: [
                { speaker: 'A', chinese: '會場在哪裡？', pinyin: 'Huìchǎng zài nǎlǐ?', english: 'Where is the venue?' },
                { speaker: 'B', chinese: '在國際會議中心。', pinyin: 'Zài guójì huìyì zhōngxīn.', english: 'At the international conference center.' }
            ]
        }, {
            char: '會話',
            pinyin: 'huìhuà',
            pos: 'N',
            en: 'Conversation / Dialogue',
            explanation: 'An informal spoken exchange between two or more people. Often used in language learning contexts.',
            dialogue: [
                { speaker: 'A', chinese: '我們練習一下會話吧。', pinyin: 'Wǒmen liànxí yīxià huìhuà ba.', english: 'Let\'s practice conversation.' },
                { speaker: 'B', chinese: '好，我們對話主題是旅行。', pinyin: 'Hǎo, wǒmen duìhuà zhǔtí shì lǚxíng.', english: 'OK, the topic is travel.' }
            ]
        }, {
            char: '會議',
            pinyin: 'huìyì',
            pos: 'N',
            en: 'Meeting / Conference',
            explanation: 'A formal gathering of people for discussion, decision-making, or presentation, often in a professional setting.',
            dialogue: [
                { speaker: 'A', chinese: '下午三點有個會議。', pinyin: 'Xiàwǔ sān diǎn yǒu gè huìyì.', english: 'There is a meeting at 3 PM.' },
                { speaker: 'B', chinese: '好的，我會準時參加。', pinyin: 'Hǎo de, wǒ huì zhǔnshí cānjiā.', english: 'OK, I will attend on time.' }
            ]
        }, {
            char: '婚禮',
            pinyin: 'hūnlǐ',
            pos: 'N',
            en: 'Wedding',
            explanation: 'A ceremony where two people are married. Often includes rituals, feasts, and celebrations.',
            dialogue: [
                { speaker: 'A', chinese: '下週六參加朋友的婚禮。', pinyin: 'Xià zhōu liù cānjiā péngyou de hūnlǐ.', english: 'I\'m attending a friend\'s wedding next Saturday.' },
                { speaker: 'B', chinese: '恭喜他們！', pinyin: 'Gōngxǐ tāmen!', english: 'Congratulations to them!' }
            ]
        }, {
            char: '婚姻',
            pinyin: 'hūnyīn',
            pos: 'N',
            en: 'Marriage',
            explanation: 'The legal and social relationship between two people as spouses. Also refers to the institution of marriage.',
            dialogue: [
                { speaker: 'A', chinese: '他們婚姻很幸福。', pinyin: 'Tāmen hūnyīn hěn xìngfú.', english: 'Their marriage is very happy.' },
                { speaker: 'B', chinese: '對，他們很恩愛。', pinyin: 'Duì, tāmen hěn ēnài.', english: 'Yes, they are very loving.' }
            ]
        }, {
            char: '混亂',
            pinyin: 'hùnluàn',
            pos: 'Vs',
            en: 'Chaotic / Confused',
            explanation: 'Describes a state of disorder, confusion, or lack of organization.',
            dialogue: [
                { speaker: 'A', chinese: '交通因為事故而混亂。', pinyin: 'Jiāotōng yīnwèi shìgù ér hùnluàn.', english: 'Traffic is chaotic because of the accident.' },
                { speaker: 'B', chinese: '希望早點恢復正常。', pinyin: 'Xīwàng zǎodiǎn huīfù zhèngcháng.', english: 'Hope it returns to normal soon.' }
            ]
        }, {
            char: '活',
            pinyin: 'huó',
            pos: 'Vs-attr',
            en: 'Living / Alive',
            explanation: 'Describes something that has life, or is alive. Can be used attributively (e.g., 活魚 = live fish).',
            dialogue: [
                { speaker: 'A', chinese: '市場有賣活魚嗎？', pinyin: 'Shìchǎng yǒu mài huó yú ma?', english: 'Does the market sell live fish?' },
                { speaker: 'B', chinese: '有，在後面那攤。', pinyin: 'Yǒu, zài hòumiàn nà tān.', english: 'Yes, at the stall in the back.' }
            ]
        }, {
            char: '活動',
            pinyin: 'huódòng',
            pos: 'Vi',
            en: 'Activity / To move about',
            explanation: 'As a noun, an organized event or activity. As a verb, to move around or be active.',
            dialogue: [
                { speaker: 'A', chinese: '我們參加了社區的活動。', pinyin: 'Wǒmen cānjiā le shèqū de huódòng.', english: 'We participated in a community event.' },
                { speaker: 'B', chinese: '很有趣，下次我也要去。', pinyin: 'Hěn yǒuqù, xià cì wǒ yě yào qù.', english: 'It was fun, I want to go next time too.' }
            ]
        }, {
            char: '或許',
            pinyin: 'huòxǔ',
            pos: 'Adv',
            en: 'Perhaps / Maybe',
            explanation: 'An adverb expressing uncertainty or possibility. Similar to 也許.',
            dialogue: [
                { speaker: 'A', chinese: '他或許已經到了。', pinyin: 'Tā huòxǔ yǐjīng dào le.', english: 'Perhaps he has already arrived.' },
                { speaker: 'B', chinese: '我們再等等吧。', pinyin: 'Wǒmen zài děngdeng ba.', english: 'Let\'s wait a bit longer.' }
            ]
        }, {
            char: '基本',
            pinyin: 'jīběn',
            pos: 'N / Vs',
            en: 'Basic / Foundation',
            explanation: 'As a noun, the foundation or basics. As a stative verb, describes something as basic or fundamental.',
            dialogue: [
                { speaker: 'A', chinese: '這是最基本的要求。', pinyin: 'Zhè shì zuì jīběn de yāoqiú.', english: 'This is the most basic requirement.' },
                { speaker: 'B', chinese: '我知道了，會做到的。', pinyin: 'Wǒ zhīdào le, huì zuò dào de.', english: 'I know, I will do it.' }
            ]
        }, {
            char: '基礎',
            pinyin: 'jīchǔ',
            pos: 'N',
            en: 'Foundation / Basis',
            explanation: 'The underlying support or starting point for something. Often used for knowledge, skills, or structures.',
            dialogue: [
                { speaker: 'A', chinese: '學語言要打好基礎。', pinyin: 'Xué yǔyán yào dǎ hǎo jīchǔ.', english: 'Learning a language requires a solid foundation.' },
                { speaker: 'B', chinese: '對，詞彙和語法很重要。', pinyin: 'Duì, cíhuì hé yǔfǎ hěn zhòngyào.', english: 'Yes, vocabulary and grammar are important.' }
            ]
        }, {
            char: '激動',
            pinyin: 'jīdòng',
            pos: 'Vs',
            en: 'Excited / Emotional',
            explanation: 'Describes a strong emotional state, often from happiness, surprise, or enthusiasm.',
            dialogue: [
                { speaker: 'A', chinese: '他聽到消息非常激動。', pinyin: 'Tā tīng dào xiāoxi fēicháng jīdòng.', english: 'He was very excited when he heard the news.' },
                { speaker: 'B', chinese: '什麼消息這麼令人興奮？', pinyin: 'Shénme xiāoxi zhème lìng rén xīngfèn?', english: 'What news is so exciting?' }
            ]
        }, {
            char: '基督教',
            pinyin: 'Jīdūjiào',
            pos: 'N',
            en: 'Christianity',
            explanation: 'The religion based on the life and teachings of Jesus Christ. One of the major world religions.',
            dialogue: [
                { speaker: 'A', chinese: '你信基督教嗎？', pinyin: 'Nǐ xìn Jīdūjiào ma?', english: 'Do you believe in Christianity?' },
                { speaker: 'B', chinese: '不，我是佛教徒。', pinyin: 'Bù, wǒ shì Fójiàotú.', english: 'No, I am a Buddhist.' }
            ]
        }];

        // ------------------------------------------------------------
        // RENDER ENGINE
        // ------------------------------------------------------------
        const grid = document.getElementById('vocabGrid');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const countDisplay = document.getElementById('countDisplay');
        const legendContainer = document.getElementById('legendContainer');
        const pinyinGlobalToggle = document.getElementById('pinyinGlobalToggle');
        const pinyinToggleLabel = document.getElementById('pinyinToggleLabel');

        let globalPinyinRevealed = false;

        // Legend
        const posSet = new Set(vocabData.map(d => d.pos));
        const posLabels = {
            'N': 'Noun',
            'V': 'Verb',
            'Vs': 'Stative Verb',
            'Vst': 'Stative/Transitive Verb',
            'Adv': 'Adverb',
            'Prep': 'Preposition',
            'M': 'Measure Word',
            'Ptc': 'Particle',
            'N/V': 'Noun / Verb',
            'Conj': 'Conjunction',
            'Det': 'Determiner',
            'V-sep': 'Separable Verb',
            'Vpt': 'Verb Particle (Trans.)',
            'Vi': 'Intransitive Verb',
            'Vp': 'Verb Particle',
            'Vaux': 'Auxiliary Verb',
            'Vs-attr': 'Attributive Stative Verb',
            'N/Vs': 'Noun / Stative Verb'
        };
        const dotColorMap = {
            'N': '#7ba9c9',
            'V': '#7fb06a',
            'Vs': '#5ba884',
            'Vst': '#5ba884',
            'Adv': '#c9a86a',
            'Prep': '#c97a9a',
            'M': '#9a7ac9',
            'Ptc': '#c9b86a',
            'N/V': '#7ba9c9',
            'Conj': '#f0d0b0',
            'Det': '#f0b0b0',
            'V-sep': '#6ab06a',
            'Vpt': '#6a7ab0',
            'Vi': '#6a9a9a',
            'Vp': '#7a7a9a',
            'Vaux': '#6a7a8a',
            'Vs-attr': '#80b080',
            'N/Vs': '#b0c0d0'
        };

        function buildLegend() {
            const sorted = Array.from(posSet).sort();
            let html = '';
            sorted.forEach(label => {
                const display = posLabels[label] || label;
                const color = dotColorMap[label] || '#b8aa98';
                html += `<span class="legend-item"><span class="legend-dot" style="background:${color};"></span>${display}</span>`;
            });
            legendContainer.innerHTML = html;
        }
        buildLegend();

        // Render function
        function render(filter = '') {
            const term = filter.trim().toLowerCase();
            let filtered = vocabData;

            if (term) {
                filtered = vocabData.filter(item => {
                    let dialogueSearch = '';
                    item.dialogue.forEach(line => {
                        dialogueSearch += line.chinese + ' ' + line.pinyin + ' ' + line.english + ' ';
                    });
                    const searchable = item.char + ' ' + item.pinyin + ' ' + item.en + ' ' + item.explanation + ' ' + dialogueSearch;
                    return searchable.toLowerCase().includes(term);
                });
            }

            countDisplay.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty">🔍 No matches found.</div>`;
                return;
            }

            let html = '';
            filtered.forEach((item, index) => {
                const posClass = 'pos-' + item.pos.replace('/', '-');
                const posDisplay = posLabels[item.pos] || item.pos;

                // Build dialogue HTML
                let dialogueHtml = '';
                dialogueHtml += `
                        <div class="dialogue-toggle-wrapper">
                            <strong>💬 Dialogue:</strong>
                            <button class="dialogue-toggle-btn" data-dialogue-idx="${index}">Show Pinyin & Translation</button>
                        </div>
                        <div class="dialogue-lines">
                    `;

                item.dialogue.forEach(line => {
                    const speakerClass = line.speaker === 'A' ? 'speaker-a' : 'speaker-b';
                    dialogueHtml += `
                            <div class="line">
                                <span class="${speakerClass}">${line.speaker}:</span>
                                <span class="zh">${line.chinese}</span>
                                <span class="dialogue-details">
                                    <span class="sep">·</span>
                                    <span class="pinyin-text">${line.pinyin}</span>
                                    <span class="sep">·</span>
                                    <span class="en-text">${line.english}</span>
                                </span>
                            </div>
                        `;
                });

                dialogueHtml += `</div>`;

                html += `
                        <div class="vocab-card" data-index="${index}">
                            <div class="char-row">
                                <span class="char">${item.char}</span>
                                <span class="pinyin-container" data-pinyin="${item.pinyin}" data-revealed="false">
                                    <span class="pinyin-value">${item.pinyin}</span>
                                </span>
                            </div>
                            <span class="pos ${posClass}">${posDisplay}</span>

                            <button class="details-toggle" data-target="details-${index}">
                                <span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)
                            </button>

                            <div id="details-${index}" class="details-content">
                                <div class="explanation">
                                    <div class="meaning-line">📘 ${item.en}</div>
                                    <br />
                                    <strong>📖 Usage:</strong> ${item.explanation}
                                </div>
                                <div class="dialogue-box" id="dialogue-box-${index}">
                                    ${dialogueHtml}
                                </div>
                            </div>
                        </div>
                    `;
            });

            grid.innerHTML = html;

            // ---- Click on the Hanzi toggles its pinyin ----
            document.querySelectorAll('.char').forEach(charEl => {
                charEl.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const row = this.closest('.char-row');
                    const pinyinContainer = row ? row.querySelector('.pinyin-container') : null;
                    if (!pinyinContainer) return;
                    const isRevealed = pinyinContainer.dataset.revealed === 'true';
                    const newState = !isRevealed;
                    pinyinContainer.dataset.revealed = newState ? 'true' : 'false';
                    pinyinContainer.classList.toggle('revealed', newState);
                });
            });

            // ---- Apply global state to all pinyin containers ----
            document.querySelectorAll('.pinyin-container').forEach(el => {
                const shouldReveal = globalPinyinRevealed;
                el.dataset.revealed = shouldReveal ? 'true' : 'false';
                el.classList.toggle('revealed', shouldReveal);
            });

            // ---- Toggle main details (Meaning/Explanation) ----
            document.querySelectorAll('.details-toggle').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const targetId = this.dataset.target;
                    const content = document.getElementById(targetId);
                    if (!content) return;

                    const isOpen = content.classList.contains('open');
                    if (isOpen) {
                        content.classList.remove('open');
                        this.classList.remove('active');
                        this.innerHTML = '<span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)';
                    } else {
                        content.classList.add('open');
                        this.classList.add('active');
                        this.innerHTML = '<span class="arrow">▲</span> Hide Details';
                    }
                });
            });

            // ---- Toggle dialogue pinyin/translation ----
            document.querySelectorAll('.dialogue-toggle-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = this.dataset.dialogueIdx;
                    const dialogueBox = document.getElementById(`dialogue-box-${idx}`);
                    if (!dialogueBox) return;

                    const isShowing = dialogueBox.classList.contains('show-translation');
                    if (isShowing) {
                        dialogueBox.classList.remove('show-translation');
                        this.textContent = 'Show Pinyin & Translation';
                    } else {
                        dialogueBox.classList.add('show-translation');
                        this.textContent = 'Hide Pinyin & Translation';
                    }
                });
            });

            updateGlobalToggleLabel();
        }

        // ---- Global Pinyin Toggle ----
        function updateGlobalToggleLabel() {
            if (globalPinyinRevealed) {
                pinyinToggleLabel.textContent = 'Hide All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔓';
            } else {
                pinyinToggleLabel.textContent = 'Show All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔊';
            }
        }

        pinyinGlobalToggle.addEventListener('click', function() {
            globalPinyinRevealed = !globalPinyinRevealed;
            document.querySelectorAll('.pinyin-container').forEach(el => {
                el.dataset.revealed = globalPinyinRevealed ? 'true' : 'false';
                el.classList.toggle('revealed', globalPinyinRevealed);
            });
            updateGlobalToggleLabel();
        });

        // ---- Search & Clear ----
        searchInput.addEventListener('input', () => render(searchInput.value));
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            render('');
            searchInput.focus();
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') clearBtn.click();
        });

        // ---- Initial render ----
        render('');
    </script>
</body>
</html>
