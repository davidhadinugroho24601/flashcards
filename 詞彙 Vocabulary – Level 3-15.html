<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 3-15 Flashcards (Click Hanzi for Pinyin)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: #f4f2ef;
            min-height: 100vh;
            padding: 2rem 1.5rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #1e1e2a;
        }

        .header h1 span {
            background: #d9c9b4;
            padding: 0.1rem 0.8rem;
            border-radius: 12px;
            color: #2c2c3a;
        }

        .header .sub {
            font-size: 1rem;
            color: #6b5f52;
            margin-top: 0.3rem;
            font-weight: 400;
        }

        .header .badge {
            display: inline-block;
            margin-top: 0.6rem;
            background: #2c2c3a;
            color: white;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            background: #ffffffd9;
            backdrop-filter: blur(6px);
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 2.2rem;
            border: 1px solid #e8e0d6;
        }

        .stats {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c2c3a;
            white-space: nowrap;
        }

        .stats strong {
            background: #ece6de;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-weight: 600;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f3efe9;
            padding: 0.1rem 0.1rem 0.1rem 1.2rem;
            border-radius: 40px;
            transition: 0.2s;
            border: 1px solid transparent;
            flex: 1;
            min-width: 180px;
        }

        .search-box:focus-within {
            background: #ffffff;
            border-color: #b8aa98;
            box-shadow: 0 0 0 3px rgba(184, 170, 152, 0.2);
        }

        .search-box input {
            border: none;
            background: transparent;
            font-size: 0.9rem;
            padding: 0.5rem 0;
            width: 100%;
            outline: none;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #1e1e2a;
        }

        .search-box input::placeholder {
            color: #a89b8c;
            font-weight: 400;
        }

        .search-box button {
            background: #2c2c3a;
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .search-box button:hover {
            background: #1a1a26;
        }

        .pinyin-global-toggle {
            background: #ece6de;
            border: 1px solid #d5cbbc;
            border-radius: 40px;
            padding: 0.3rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .pinyin-global-toggle:hover {
            background: #d5cbbc;
            border-color: #b8aa98;
        }

        .pinyin-global-toggle .icon {
            font-size: 1rem;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.2rem;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 0.6rem 1.2rem;
            background: #ffffffd9;
            border-radius: 40px;
            border: 1px solid #e8e0d6;
            font-size: 0.75rem;
            font-weight: 500;
            color: #2c2c3a;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .vocab-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid #ebe5dd;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .vocab-card:hover {
            border-color: #d0c3b2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .vocab-card .char-row {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.2rem;
        }

        .vocab-card .char {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1e1e2a;
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.2;
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease;
            padding: 0.1rem 0.4rem;
            border-radius: 8px;
            user-select: none;
        }

        .vocab-card .char:hover {
            color: #4a3f33;
            background: #f0ebe4;
        }

        .vocab-card .char:active {
            transform: scale(0.95);
        }

        .pinyin-container {
            display: inline-flex;
            align-items: center;
            min-width: 2.2rem;
            justify-content: center;
        }

        .pinyin-container .pinyin-value {
            font-size: 1rem;
            color: #6b5f52;
            font-weight: 400;
            letter-spacing: 0.3px;
            display: none;
        }

        .pinyin-container.revealed .pinyin-value {
            display: inline;
        }

        .vocab-card .pos {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            align-self: flex-start;
            margin-top: 0.6rem;
            background: #f0ebe4;
            color: #4a4037;
        }

        .pos-N {
            background: #dbe9f0;
            color: #1f5a7a;
        }
        .pos-V {
            background: #e6f0db;
            color: #3d6b2b;
        }
        .pos-Vs {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Vst {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Adv {
            background: #f0e6db;
            color: #7a5a2b;
        }
        .pos-Prep {
            background: #f0dbe6;
            color: #7a2b4a;
        }
        .pos-M {
            background: #e6dbf0;
            color: #4a2b7a;
        }
        .pos-Ptc {
            background: #f0e8db;
            color: #7a6b2b;
        }
        .pos-N\/V {
            background: #dbe8f0;
            color: #1f5a7a;
        }
        .pos-Conj {
            background: #f0e0d0;
            color: #7a5a3a;
        }
        .pos-Det {
            background: #f0d4d4;
            color: #7a3a3a;
        }
        .pos-V-sep {
            background: #d4e8d4;
            color: #2d6b2d;
        }
        .pos-Vpt {
            background: #d4d8e8;
            color: #3a4a7a;
        }
        .pos-Vi {
            background: #d4e0e0;
            color: #2d5a5a;
        }
        .pos-Vp {
            background: #d4d0d8;
            color: #3a3a5a;
        }
        .pos-Vaux {
            background: #d4d8e0;
            color: #3a4a5a;
        }
        .pos-Vs-attr {
            background: #d0e0d0;
            color: #2d6b3d;
        }

        .details-toggle {
            margin-top: 1.2rem;
            background: none;
            border: 1px solid #d5cbbc;
            border-radius: 30px;
            padding: 0.5rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #4a4037;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
            align-self: flex-start;
            background: #faf8f5;
        }

        .details-toggle:hover {
            background: #e8e0d6;
            border-color: #b8aa98;
        }

        .details-toggle .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .details-toggle.active .arrow {
            transform: rotate(180deg);
        }

        .details-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
        }

        .details-content.open {
            max-height: 900px;
            opacity: 1;
            margin-top: 1.2rem;
        }

        .details-content .explanation {
            background: #f8f6f2;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #2c2c3a;
            border-left: 4px solid #d0c3b2;
            margin-bottom: 1rem;
        }

        .details-content .explanation strong {
            color: #1e1e2a;
        }

        .details-content .explanation .meaning-line {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e1e2a;
            background: #e8e0d6;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 0.4rem;
        }

        .dialogue-box {
            background: #f0f4f8;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.8;
        }

        .dialogue-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 0.3rem;
        }

        .dialogue-toggle-btn {
            background: #e8e0d6;
            border: none;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .dialogue-toggle-btn:hover {
            background: #d5cbbc;
        }

        .dialogue-box .speaker-a {
            color: #1f5a7a;
            font-weight: 600;
        }

        .dialogue-box .speaker-b {
            color: #3d6b2b;
            font-weight: 600;
        }

        .dialogue-box .line {
            margin-bottom: 0.2rem;
        }
        .dialogue-box .line:last-child {
            margin-bottom: 0;
        }

        .dialogue-box .zh {
            font-family: 'Noto Sans SC', sans-serif;
            margin-right: 0.3rem;
        }

        .dialogue-details {
            display: none;
            margin-left: 0.3rem;
        }

        .dialogue-details .pinyin-text {
            font-weight: 400;
            color: #6b5f52;
        }

        .dialogue-details .en-text {
            font-style: italic;
            color: #4a4037;
        }

        .dialogue-details .sep {
            color: #b8aa98;
            margin: 0 0.2rem;
        }

        .dialogue-box.show-translation .dialogue-details {
            display: inline;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1.1rem;
            color: #8f8172;
            background: #faf8f5;
            border-radius: 30px;
            border: 1px dashed #d5cbbc;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.8rem 3rem;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                border-radius: 28px;
                padding: 1rem 1.2rem;
                gap: 0.8rem;
            }
            .stats {
                text-align: center;
            }
            .search-box {
                padding: 0.1rem 0.1rem 0.1rem 1rem;
            }
            .search-box button {
                padding: 0.4rem 1rem;
                font-size: 0.8rem;
            }
            .vocab-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .vocab-card .char {
                font-size: 1.8rem;
            }
            .pinyin-global-toggle {
                justify-content: center;
            }
        }

        @media (min-width: 641px) and (max-width: 900px) {
            .vocab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 詞彙 <span>Level 3-15</span></h1>
            <div class="sub">Flashcard Mode · <strong>Click the Hanzi</strong> to reveal Pinyin</div>
            <div class="badge">🔍 Click the character to show pinyin · "Show Details" for meaning & dialogue</div>
        </div>

        <div class="toolbar">
            <div class="stats">
                <strong id="countDisplay">0</strong> words
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Chinese, Pinyin, or English..." autocomplete="off" />
                <button id="clearBtn">✕</button>
            </div>
            <button class="pinyin-global-toggle" id="pinyinGlobalToggle">
                <span class="icon">🔊</span>
                <span id="pinyinToggleLabel">Show All Pinyin</span>
            </button>
        </div>

        <div class="legend" id="legendContainer"></div>

        <div class="vocab-grid" id="vocabGrid"></div>
    </div>

    <script>
        // ------------------------------------------------------------
        // DATA — Level 3-15 Vocabulary (Traditional Hanzi)
        // ------------------------------------------------------------
        const vocabData = [{
            char: '觀點',
            pinyin: 'guāndiǎn',
            pos: 'N',
            en: 'Point of view / Perspective',
            explanation: 'The way someone thinks about a topic or issue. One\'s opinion or stance on something.',
            dialogue: [
                { speaker: 'A', chinese: '你的觀點是什麼？', pinyin: 'Nǐ de guāndiǎn shì shénme?', english: 'What is your point of view?' },
                { speaker: 'B', chinese: '我認為我們應該先討論。', pinyin: 'Wǒ rènwéi wǒmen yīnggāi xiān tǎolùn.', english: 'I think we should discuss it first.' }
            ]
        }, {
            char: '管',
            pinyin: 'guǎn',
            pos: 'V',
            en: 'To manage / To care about',
            explanation: 'To be in charge of something, or to care about or interfere with something. Often used in 管 + object.',
            dialogue: [
                { speaker: 'A', chinese: '你別管我。', pinyin: 'Nǐ bié guǎn wǒ.', english: 'Don\'t bother me / Don\'t mind me.' },
                { speaker: 'B', chinese: '我只是關心你。', pinyin: 'Wǒ zhǐshì guānxīn nǐ.', english: 'I\'m just concerned about you.' }
            ]
        }, {
            char: '廣播',
            pinyin: 'guǎngbō',
            pos: 'N / Vi',
            en: 'Broadcast / To broadcast',
            explanation: 'As a noun, a radio or television program. As a verb, to transmit audio or video content.',
            dialogue: [
                { speaker: 'A', chinese: '你聽廣播嗎？', pinyin: 'Nǐ tīng guǎngbō ma?', english: 'Do you listen to the radio?' },
                { speaker: 'B', chinese: '偶爾聽，喜歡新聞。', pinyin: 'Ǒuěr tīng, xǐhuān xīnwén.', english: 'Occasionally, I like news.' }
            ]
        }, {
            char: '廣場',
            pinyin: 'guǎngchǎng',
            pos: 'N',
            en: 'Plaza / Public square',
            explanation: 'A large open public space in a city, often used for gatherings, events, or recreation.',
            dialogue: [
                { speaker: 'A', chinese: '晚上廣場上有很多人跳舞。', pinyin: 'Wǎnshang guǎngchǎng shàng yǒu hěnduō rén tiàowǔ.', english: 'There are many people dancing in the square at night.' },
                { speaker: 'B', chinese: '我喜歡那種熱鬧的氣氛。', pinyin: 'Wǒ xǐhuān nà zhǒng rènao de qìfēn.', english: 'I like that lively atmosphere.' }
            ]
        }, {
            char: '廣告',
            pinyin: 'guǎnggào',
            pos: 'N',
            en: 'Advertisement / Commercial',
            explanation: 'A public notice promoting a product, service, or event, found in media, online, or on billboards.',
            dialogue: [
                { speaker: 'A', chinese: '這個廣告很有趣。', pinyin: 'Zhège guǎnggào hěn yǒuqù.', english: 'This advertisement is very interesting.' },
                { speaker: 'B', chinese: '對，很有創意。', pinyin: 'Duì, hěn yǒu chuàngyì.', english: 'Yes, very creative.' }
            ]
        }, {
            char: '觀念',
            pinyin: 'guānniàn',
            pos: 'N',
            en: 'Concept / Idea / Belief',
            explanation: 'A person\'s fundamental beliefs, values, or ways of thinking about something.',
            dialogue: [
                { speaker: 'A', chinese: '我們的教育觀念不同。', pinyin: 'Wǒmen de jiàoyù guānniàn bùtóng.', english: 'We have different views on education.' },
                { speaker: 'B', chinese: '需要互相理解。', pinyin: 'Xūyào hùxiāng lǐjiě.', english: 'We need to understand each other.' }
            ]
        }, {
            char: '觀眾',
            pinyin: 'guānzhòng',
            pos: 'N',
            en: 'Audience / Spectators',
            explanation: 'People who watch a performance, show, movie, or event.',
            dialogue: [
                { speaker: 'A', chinese: '今天的觀眾很多。', pinyin: 'Jīntiān de guānzhòng hěn duō.', english: 'There are many audience members today.' },
                { speaker: 'B', chinese: '因為表演很精彩。', pinyin: 'Yīnwèi biǎoyǎn hěn jīngcǎi.', english: 'Because the performance is wonderful.' }
            ]
        }, {
            char: '規矩',
            pinyin: 'guījǔ',
            pos: 'N',
            en: 'Rules / Customs',
            explanation: 'Established rules, conventions, or social norms that guide behavior.',
            dialogue: [
                { speaker: 'A', chinese: '我們要遵守規矩。', pinyin: 'Wǒmen yào zūnshǒu guījǔ.', english: 'We need to follow the rules.' },
                { speaker: 'B', chinese: '對，這樣才有序。', pinyin: 'Duì, zhèyàng cái yǒuxù.', english: 'Yes, that\'s how things stay orderly.' }
            ]
        }, {
            char: '規模',
            pinyin: 'guīmó',
            pos: 'N',
            en: 'Scale / Scope / Size',
            explanation: 'The extent, magnitude, or range of an activity, project, or organization.',
            dialogue: [
                { speaker: 'A', chinese: '這個工程的規模很大。', pinyin: 'Zhège gōngchéng de guīmó hěn dà.', english: 'This project is on a large scale.' },
                { speaker: 'B', chinese: '需要很多人力。', pinyin: 'Xūyào hěnduō rénlì.', english: 'It needs a lot of manpower.' }
            ]
        }, {
            char: '鬼',
            pinyin: 'guǐ',
            pos: 'N',
            en: 'Ghost / Spirit',
            explanation: 'A supernatural being, often believed to be the spirit of a dead person. Also used in expressions like 鬼點子 (tricky idea).',
            dialogue: [
                { speaker: 'A', chinese: '你怕鬼嗎？', pinyin: 'Nǐ pà guǐ ma?', english: 'Are you afraid of ghosts?' },
                { speaker: 'B', chinese: '有一點，但我不信。', pinyin: 'Yǒu yīdiǎn, dàn wǒ bù xìn.', english: 'A little, but I don\'t believe in them.' }
            ]
        }, {
            char: '貴姓',
            pinyin: 'guìxìng',
            pos: 'N',
            en: 'Your (honorable) surname',
            explanation: 'A polite way to ask someone\'s family name. Often used in formal introductions.',
            dialogue: [
                { speaker: 'A', chinese: '請問您貴姓？', pinyin: 'Qǐngwèn nín guìxìng?', english: 'May I ask your surname?' },
                { speaker: 'B', chinese: '我姓王。', pinyin: 'Wǒ xìng Wáng.', english: 'My surname is Wang.' }
            ]
        }, {
            char: '國內',
            pinyin: 'guónèi',
            pos: 'N',
            en: 'Domestic / Within the country',
            explanation: 'Refers to the territory, affairs, or products of one\'s own country.',
            dialogue: [
                { speaker: 'A', chinese: '國內的疫情控制得很好。', pinyin: 'Guónèi de yìqíng kòngzhì de hěn hǎo.', english: 'The domestic pandemic control is very good.' },
                { speaker: 'B', chinese: '對，我們要感謝醫護人員。', pinyin: 'Duì, wǒmen yào gǎnxiè yīhù rényuán.', english: 'Yes, we should thank the medical staff.' }
            ]
        }, {
            char: '國外',
            pinyin: 'guówài',
            pos: 'N',
            en: 'Overseas / Abroad',
            explanation: 'Refers to foreign countries or outside one\'s own country.',
            dialogue: [
                { speaker: 'A', chinese: '他想去國外留學。', pinyin: 'Tā xiǎng qù guówài liúxué.', english: 'He wants to study abroad.' },
                { speaker: 'B', chinese: '去哪裡？美國嗎？', pinyin: 'Qù nǎlǐ? Měiguó ma?', english: 'Where to? America?' }
            ]
        }, {
            char: '國王',
            pinyin: 'guówáng',
            pos: 'N',
            en: 'King',
            explanation: 'The male ruler of a monarchy or kingdom.',
            dialogue: [
                { speaker: 'A', chinese: '那個國家的國王很受愛戴。', pinyin: 'Nàge guójiā de guówáng hěn shòu àidài.', english: 'The king of that country is very beloved.' },
                { speaker: 'B', chinese: '他是個明君。', pinyin: 'Tā shì gè míngjūn.', english: 'He is a wise ruler.' }
            ]
        }, {
            char: '國語',
            pinyin: 'guóyǔ',
            pos: 'N',
            en: 'National language / Mandarin',
            explanation: 'The official language of a country. In Taiwan, it refers to Standard Mandarin Chinese.',
            dialogue: [
                { speaker: 'A', chinese: '你國語說得很好。', pinyin: 'Nǐ guóyǔ shuō de hěn hǎo.', english: 'Your Mandarin is very good.' },
                { speaker: 'B', chinese: '謝謝，我還在學習。', pinyin: 'Xièxie, wǒ hái zài xuéxí.', english: 'Thank you, I\'m still learning.' }
            ]
        }, {
            char: '過去',
            pinyin: 'guòqù',
            pos: 'N / Vi',
            en: 'Past / To pass by',
            explanation: 'As a noun, the time before now. As a verb, to pass by or go over.',
            dialogue: [
                { speaker: 'A', chinese: '過去的事就別提了。', pinyin: 'Guòqù de shì jiù bié tí le.', english: 'Let\'s not mention the past.' },
                { speaker: 'B', chinese: '對，我們要向前看。', pinyin: 'Duì, wǒmen yào xiàng qián kàn.', english: 'Yes, we should look forward.' }
            ]
        }, {
            char: '過日子',
            pinyin: 'guò rìzi',
            pos: 'Vi',
            en: 'To live (one\'s daily life)',
            explanation: 'A verb phrase meaning to go about one\'s daily life, manage life, or make a living.',
            dialogue: [
                { speaker: 'A', chinese: '你們夫妻怎麼過日子？', pinyin: 'Nǐmen fūqī zěnme guò rìzi?', english: 'How do you and your spouse live your daily life?' },
                { speaker: 'B', chinese: '平平淡淡，但很幸福。', pinyin: 'Píngpíng dàndàn, dàn hěn xìngfú.', english: 'Simple and plain, but very happy.' }
            ]
        }, {
            char: '嗨',
            pinyin: 'hāi',
            pos: 'Ptc',
            en: 'Hi / Hey',
            explanation: 'A casual interjection used to greet someone or get their attention, similar to "hi" or "hey" in English.',
            dialogue: [
                { speaker: 'A', chinese: '嗨！你好嗎？', pinyin: 'Hāi! Nǐ hǎo ma?', english: 'Hi! How are you?' },
                { speaker: 'B', chinese: '嗨！我很好，你呢？', pinyin: 'Hāi! Wǒ hěn hǎo, nǐ ne?', english: 'Hi! I\'m good, and you?' }
            ]
        }, {
            char: '還是',
            pinyin: 'háishì',
            pos: 'Adv',
            en: 'Still / Or (in questions)',
            explanation: 'Used to indicate a choice in questions (A還是B = A or B), or to mean "still" as in "still the same."',
            dialogue: [
                { speaker: 'A', chinese: '你想喝茶還是咖啡？', pinyin: 'Nǐ xiǎng hē chá háishì kāfēi?', english: 'Do you want tea or coffee?' },
                { speaker: 'B', chinese: '茶吧，還是比較健康。', pinyin: 'Chá ba, háishì bǐjiào jiànkāng.', english: 'Tea, it\'s still healthier.' }
            ]
        }, {
            char: '還要',
            pinyin: 'háiyào',
            pos: 'Adv',
            en: 'Still want / Also need',
            explanation: 'Indicates that something more is needed or desired. Often used to add to a list or request.',
            dialogue: [
                { speaker: 'A', chinese: '我還要一份水餃。', pinyin: 'Wǒ háiyào yī fèn shuǐjiǎo.', english: 'I also want a serving of dumplings.' },
                { speaker: 'B', chinese: '好的，馬上來。', pinyin: 'Hǎo de, mǎshàng lái.', english: 'OK, coming right up.' }
            ]
        }, {
            char: '海報',
            pinyin: 'hǎibào',
            pos: 'N',
            en: 'Poster',
            explanation: 'A printed paper or sign used for advertising, decoration, or information, often displayed on walls.',
            dialogue: [
                { speaker: 'A', chinese: '我們需要設計一張海報。', pinyin: 'Wǒmen xūyào shèjì yī zhāng hǎibào.', english: 'We need to design a poster.' },
                { speaker: 'B', chinese: '什麼主題？', pinyin: 'Shénme zhǔtí?', english: 'What theme?' }
            ]
        }, {
            char: '海灘',
            pinyin: 'hǎitān',
            pos: 'N',
            en: 'Beach',
            explanation: 'A sandy or pebbly shore by the ocean or sea, popular for swimming and relaxing.',
            dialogue: [
                { speaker: 'A', chinese: '我們去海灘游泳吧！', pinyin: 'Wǒmen qù hǎitān yóuyǒng ba!', english: 'Let\'s go swimming at the beach!' },
                { speaker: 'B', chinese: '好主意，今天天氣很好。', pinyin: 'Hǎo zhǔyi, jīntiān tiānqì hěn hǎo.', english: 'Good idea, the weather is great today.' }
            ]
        }, {
            char: '海洋',
            pinyin: 'hǎiyáng',
            pos: 'N',
            en: 'Ocean / Sea',
            explanation: 'A large body of saltwater that covers most of the Earth\'s surface. Used in scientific and environmental contexts.',
            dialogue: [
                { speaker: 'A', chinese: '海洋裡有很多生物。', pinyin: 'Hǎiyáng lǐ yǒu hěnduō shēngwù.', english: 'There are many living things in the ocean.' },
                { speaker: 'B', chinese: '我們要保護海洋生態。', pinyin: 'Wǒmen yào bǎohù hǎiyáng shēngtài.', english: 'We need to protect the marine ecosystem.' }
            ]
        }, {
            char: '害',
            pinyin: 'hài',
            pos: 'V',
            en: 'To harm / To damage',
            explanation: 'To cause injury, damage, or negative effects to someone or something.',
            dialogue: [
                { speaker: 'A', chinese: '抽煙會害身體。', pinyin: 'Chōuyān huì hài shēntǐ.', english: 'Smoking harms the body.' },
                { speaker: 'B', chinese: '我知道，所以我戒煙了。', pinyin: 'Wǒ zhīdào, suǒyǐ wǒ jiè yān le.', english: 'I know, so I quit smoking.' }
            ]
        }];

        // ------------------------------------------------------------
        // RENDER ENGINE
        // ------------------------------------------------------------
        const grid = document.getElementById('vocabGrid');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const countDisplay = document.getElementById('countDisplay');
        const legendContainer = document.getElementById('legendContainer');
        const pinyinGlobalToggle = document.getElementById('pinyinGlobalToggle');
        const pinyinToggleLabel = document.getElementById('pinyinToggleLabel');

        let globalPinyinRevealed = false;

        // Legend
        const posSet = new Set(vocabData.map(d => d.pos));
        const posLabels = {
            'N': 'Noun',
            'V': 'Verb',
            'Vs': 'Stative Verb',
            'Vst': 'Stative/Transitive Verb',
            'Adv': 'Adverb',
            'Prep': 'Preposition',
            'M': 'Measure Word',
            'Ptc': 'Particle',
            'N/V': 'Noun / Verb',
            'Conj': 'Conjunction',
            'Det': 'Determiner',
            'V-sep': 'Separable Verb',
            'Vpt': 'Verb Particle (Trans.)',
            'Vi': 'Intransitive Verb',
            'Vp': 'Verb Particle',
            'Vaux': 'Auxiliary Verb',
            'Vs-attr': 'Attributive Stative Verb'
        };
        const dotColorMap = {
            'N': '#7ba9c9',
            'V': '#7fb06a',
            'Vs': '#5ba884',
            'Vst': '#5ba884',
            'Adv': '#c9a86a',
            'Prep': '#c97a9a',
            'M': '#9a7ac9',
            'Ptc': '#c9b86a',
            'N/V': '#7ba9c9',
            'Conj': '#f0d0b0',
            'Det': '#f0b0b0',
            'V-sep': '#6ab06a',
            'Vpt': '#6a7ab0',
            'Vi': '#6a9a9a',
            'Vp': '#7a7a9a',
            'Vaux': '#6a7a8a',
            'Vs-attr': '#80b080'
        };

        function buildLegend() {
            const sorted = Array.from(posSet).sort();
            let html = '';
            sorted.forEach(label => {
                const display = posLabels[label] || label;
                const color = dotColorMap[label] || '#b8aa98';
                html += `<span class="legend-item"><span class="legend-dot" style="background:${color};"></span>${display}</span>`;
            });
            legendContainer.innerHTML = html;
        }
        buildLegend();

        // Render function
        function render(filter = '') {
            const term = filter.trim().toLowerCase();
            let filtered = vocabData;

            if (term) {
                filtered = vocabData.filter(item => {
                    let dialogueSearch = '';
                    item.dialogue.forEach(line => {
                        dialogueSearch += line.chinese + ' ' + line.pinyin + ' ' + line.english + ' ';
                    });
                    const searchable = item.char + ' ' + item.pinyin + ' ' + item.en + ' ' + item.explanation + ' ' + dialogueSearch;
                    return searchable.toLowerCase().includes(term);
                });
            }

            countDisplay.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty">🔍 No matches found.</div>`;
                return;
            }

            let html = '';
            filtered.forEach((item, index) => {
                const posClass = 'pos-' + item.pos.replace('/', '-');
                const posDisplay = posLabels[item.pos] || item.pos;

                // Build dialogue HTML
                let dialogueHtml = '';
                dialogueHtml += `
                        <div class="dialogue-toggle-wrapper">
                            <strong>💬 Dialogue:</strong>
                            <button class="dialogue-toggle-btn" data-dialogue-idx="${index}">Show Pinyin & Translation</button>
                        </div>
                        <div class="dialogue-lines">
                    `;

                item.dialogue.forEach(line => {
                    const speakerClass = line.speaker === 'A' ? 'speaker-a' : 'speaker-b';
                    dialogueHtml += `
                            <div class="line">
                                <span class="${speakerClass}">${line.speaker}:</span>
                                <span class="zh">${line.chinese}</span>
                                <span class="dialogue-details">
                                    <span class="sep">·</span>
                                    <span class="pinyin-text">${line.pinyin}</span>
                                    <span class="sep">·</span>
                                    <span class="en-text">${line.english}</span>
                                </span>
                            </div>
                        `;
                });

                dialogueHtml += `</div>`;

                html += `
                        <div class="vocab-card" data-index="${index}">
                            <div class="char-row">
                                <span class="char">${item.char}</span>
                                <span class="pinyin-container" data-pinyin="${item.pinyin}" data-revealed="false">
                                    <span class="pinyin-value">${item.pinyin}</span>
                                </span>
                            </div>
                            <span class="pos ${posClass}">${posDisplay}</span>

                            <button class="details-toggle" data-target="details-${index}">
                                <span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)
                            </button>

                            <div id="details-${index}" class="details-content">
                                <div class="explanation">
                                    <div class="meaning-line">📘 ${item.en}</div>
                                    <br />
                                    <strong>📖 Usage:</strong> ${item.explanation}
                                </div>
                                <div class="dialogue-box" id="dialogue-box-${index}">
                                    ${dialogueHtml}
                                </div>
                            </div>
                        </div>
                    `;
            });

            grid.innerHTML = html;

            // ---- Click on the Hanzi toggles its pinyin ----
            document.querySelectorAll('.char').forEach(charEl => {
                charEl.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const row = this.closest('.char-row');
                    const pinyinContainer = row ? row.querySelector('.pinyin-container') : null;
                    if (!pinyinContainer) return;
                    const isRevealed = pinyinContainer.dataset.revealed === 'true';
                    const newState = !isRevealed;
                    pinyinContainer.dataset.revealed = newState ? 'true' : 'false';
                    pinyinContainer.classList.toggle('revealed', newState);
                });
            });

            // ---- Apply global state to all pinyin containers ----
            document.querySelectorAll('.pinyin-container').forEach(el => {
                const shouldReveal = globalPinyinRevealed;
                el.dataset.revealed = shouldReveal ? 'true' : 'false';
                el.classList.toggle('revealed', shouldReveal);
            });

            // ---- Toggle main details (Meaning/Explanation) ----
            document.querySelectorAll('.details-toggle').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const targetId = this.dataset.target;
                    const content = document.getElementById(targetId);
                    if (!content) return;

                    const isOpen = content.classList.contains('open');
                    if (isOpen) {
                        content.classList.remove('open');
                        this.classList.remove('active');
                        this.innerHTML = '<span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)';
                    } else {
                        content.classList.add('open');
                        this.classList.add('active');
                        this.innerHTML = '<span class="arrow">▲</span> Hide Details';
                    }
                });
            });

            // ---- Toggle dialogue pinyin/translation ----
            document.querySelectorAll('.dialogue-toggle-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = this.dataset.dialogueIdx;
                    const dialogueBox = document.getElementById(`dialogue-box-${idx}`);
                    if (!dialogueBox) return;

                    const isShowing = dialogueBox.classList.contains('show-translation');
                    if (isShowing) {
                        dialogueBox.classList.remove('show-translation');
                        this.textContent = 'Show Pinyin & Translation';
                    } else {
                        dialogueBox.classList.add('show-translation');
                        this.textContent = 'Hide Pinyin & Translation';
                    }
                });
            });

            updateGlobalToggleLabel();
        }

        // ---- Global Pinyin Toggle ----
        function updateGlobalToggleLabel() {
            if (globalPinyinRevealed) {
                pinyinToggleLabel.textContent = 'Hide All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔓';
            } else {
                pinyinToggleLabel.textContent = 'Show All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔊';
            }
        }

        pinyinGlobalToggle.addEventListener('click', function() {
            globalPinyinRevealed = !globalPinyinRevealed;
            document.querySelectorAll('.pinyin-container').forEach(el => {
                el.dataset.revealed = globalPinyinRevealed ? 'true' : 'false';
                el.classList.toggle('revealed', globalPinyinRevealed);
            });
            updateGlobalToggleLabel();
        });

        // ---- Search & Clear ----
        searchInput.addEventListener('input', () => render(searchInput.value));
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            render('');
            searchInput.focus();
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') clearBtn.click();
        });

        // ---- Initial render ----
        render('');
    </script>
</body>
</html>
