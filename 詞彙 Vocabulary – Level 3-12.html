<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 3-12 Flashcards (Click Hanzi for Pinyin)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: #f4f2ef;
            min-height: 100vh;
            padding: 2rem 1.5rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #1e1e2a;
        }

        .header h1 span {
            background: #d9c9b4;
            padding: 0.1rem 0.8rem;
            border-radius: 12px;
            color: #2c2c3a;
        }

        .header .sub {
            font-size: 1rem;
            color: #6b5f52;
            margin-top: 0.3rem;
            font-weight: 400;
        }

        .header .badge {
            display: inline-block;
            margin-top: 0.6rem;
            background: #2c2c3a;
            color: white;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            background: #ffffffd9;
            backdrop-filter: blur(6px);
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 2.2rem;
            border: 1px solid #e8e0d6;
        }

        .stats {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c2c3a;
            white-space: nowrap;
        }

        .stats strong {
            background: #ece6de;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-weight: 600;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f3efe9;
            padding: 0.1rem 0.1rem 0.1rem 1.2rem;
            border-radius: 40px;
            transition: 0.2s;
            border: 1px solid transparent;
            flex: 1;
            min-width: 180px;
        }

        .search-box:focus-within {
            background: #ffffff;
            border-color: #b8aa98;
            box-shadow: 0 0 0 3px rgba(184, 170, 152, 0.2);
        }

        .search-box input {
            border: none;
            background: transparent;
            font-size: 0.9rem;
            padding: 0.5rem 0;
            width: 100%;
            outline: none;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #1e1e2a;
        }

        .search-box input::placeholder {
            color: #a89b8c;
            font-weight: 400;
        }

        .search-box button {
            background: #2c2c3a;
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .search-box button:hover {
            background: #1a1a26;
        }

        .pinyin-global-toggle {
            background: #ece6de;
            border: 1px solid #d5cbbc;
            border-radius: 40px;
            padding: 0.3rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .pinyin-global-toggle:hover {
            background: #d5cbbc;
            border-color: #b8aa98;
        }

        .pinyin-global-toggle .icon {
            font-size: 1rem;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.2rem;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 0.6rem 1.2rem;
            background: #ffffffd9;
            border-radius: 40px;
            border: 1px solid #e8e0d6;
            font-size: 0.75rem;
            font-weight: 500;
            color: #2c2c3a;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .vocab-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid #ebe5dd;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .vocab-card:hover {
            border-color: #d0c3b2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .vocab-card .char-row {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.2rem;
        }

        .vocab-card .char {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1e1e2a;
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.2;
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease;
            padding: 0.1rem 0.4rem;
            border-radius: 8px;
            user-select: none;
        }

        .vocab-card .char:hover {
            color: #4a3f33;
            background: #f0ebe4;
        }

        .vocab-card .char:active {
            transform: scale(0.95);
        }

        .pinyin-container {
            display: inline-flex;
            align-items: center;
            min-width: 2.2rem;
            justify-content: center;
        }

        .pinyin-container .pinyin-value {
            font-size: 1rem;
            color: #6b5f52;
            font-weight: 400;
            letter-spacing: 0.3px;
            display: none;
        }

        .pinyin-container.revealed .pinyin-value {
            display: inline;
        }

        .vocab-card .pos {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            align-self: flex-start;
            margin-top: 0.6rem;
            background: #f0ebe4;
            color: #4a4037;
        }

        .pos-N {
            background: #dbe9f0;
            color: #1f5a7a;
        }
        .pos-V {
            background: #e6f0db;
            color: #3d6b2b;
        }
        .pos-Vs {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Vst {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Adv {
            background: #f0e6db;
            color: #7a5a2b;
        }
        .pos-Prep {
            background: #f0dbe6;
            color: #7a2b4a;
        }
        .pos-M {
            background: #e6dbf0;
            color: #4a2b7a;
        }
        .pos-Ptc {
            background: #f0e8db;
            color: #7a6b2b;
        }
        .pos-N\/V {
            background: #dbe8f0;
            color: #1f5a7a;
        }
        .pos-Conj {
            background: #f0e0d0;
            color: #7a5a3a;
        }
        .pos-Det {
            background: #f0d4d4;
            color: #7a3a3a;
        }
        .pos-V-sep {
            background: #d4e8d4;
            color: #2d6b2d;
        }
        .pos-Vpt {
            background: #d4d8e8;
            color: #3a4a7a;
        }
        .pos-Vi {
            background: #d4e0e0;
            color: #2d5a5a;
        }
        .pos-Vp {
            background: #d4d0d8;
            color: #3a3a5a;
        }
        .pos-Vaux {
            background: #d4d8e0;
            color: #3a4a5a;
        }
        .pos-Vs-attr {
            background: #d0e0d0;
            color: #2d6b3d;
        }

        .details-toggle {
            margin-top: 1.2rem;
            background: none;
            border: 1px solid #d5cbbc;
            border-radius: 30px;
            padding: 0.5rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #4a4037;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
            align-self: flex-start;
            background: #faf8f5;
        }

        .details-toggle:hover {
            background: #e8e0d6;
            border-color: #b8aa98;
        }

        .details-toggle .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .details-toggle.active .arrow {
            transform: rotate(180deg);
        }

        .details-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
        }

        .details-content.open {
            max-height: 900px;
            opacity: 1;
            margin-top: 1.2rem;
        }

        .details-content .explanation {
            background: #f8f6f2;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #2c2c3a;
            border-left: 4px solid #d0c3b2;
            margin-bottom: 1rem;
        }

        .details-content .explanation strong {
            color: #1e1e2a;
        }

        .details-content .explanation .meaning-line {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e1e2a;
            background: #e8e0d6;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 0.4rem;
        }

        .dialogue-box {
            background: #f0f4f8;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.8;
        }

        .dialogue-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 0.3rem;
        }

        .dialogue-toggle-btn {
            background: #e8e0d6;
            border: none;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .dialogue-toggle-btn:hover {
            background: #d5cbbc;
        }

        .dialogue-box .speaker-a {
            color: #1f5a7a;
            font-weight: 600;
        }

        .dialogue-box .speaker-b {
            color: #3d6b2b;
            font-weight: 600;
        }

        .dialogue-box .line {
            margin-bottom: 0.2rem;
        }
        .dialogue-box .line:last-child {
            margin-bottom: 0;
        }

        .dialogue-box .zh {
            font-family: 'Noto Sans SC', sans-serif;
            margin-right: 0.3rem;
        }

        .dialogue-details {
            display: none;
            margin-left: 0.3rem;
        }

        .dialogue-details .pinyin-text {
            font-weight: 400;
            color: #6b5f52;
        }

        .dialogue-details .en-text {
            font-style: italic;
            color: #4a4037;
        }

        .dialogue-details .sep {
            color: #b8aa98;
            margin: 0 0.2rem;
        }

        .dialogue-box.show-translation .dialogue-details {
            display: inline;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1.1rem;
            color: #8f8172;
            background: #faf8f5;
            border-radius: 30px;
            border: 1px dashed #d5cbbc;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.8rem 3rem;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                border-radius: 28px;
                padding: 1rem 1.2rem;
                gap: 0.8rem;
            }
            .stats {
                text-align: center;
            }
            .search-box {
                padding: 0.1rem 0.1rem 0.1rem 1rem;
            }
            .search-box button {
                padding: 0.4rem 1rem;
                font-size: 0.8rem;
            }
            .vocab-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .vocab-card .char {
                font-size: 1.8rem;
            }
            .pinyin-global-toggle {
                justify-content: center;
            }
        }

        @media (min-width: 641px) and (max-width: 900px) {
            .vocab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 詞彙 <span>Level 3-12</span></h1>
            <div class="sub">Flashcard Mode · <strong>Click the Hanzi</strong> to reveal Pinyin</div>
            <div class="badge">🔍 Click the character to show pinyin · "Show Details" for meaning & dialogue</div>
        </div>

        <div class="toolbar">
            <div class="stats">
                <strong id="countDisplay">0</strong> words
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Chinese, Pinyin, or English..." autocomplete="off" />
                <button id="clearBtn">✕</button>
            </div>
            <button class="pinyin-global-toggle" id="pinyinGlobalToggle">
                <span class="icon">🔊</span>
                <span id="pinyinToggleLabel">Show All Pinyin</span>
            </button>
        </div>

        <div class="legend" id="legendContainer"></div>

        <div class="vocab-grid" id="vocabGrid"></div>
    </div>

    <script>
        // ------------------------------------------------------------
        // DATA — Level 3-12 Vocabulary (Traditional Hanzi)
        // ------------------------------------------------------------
        const vocabData = [{
            char: '複習',
            pinyin: 'fùxí',
            pos: 'V',
            en: 'To review / To revise',
            explanation: 'To go over material already learned, especially before an exam or test.',
            dialogue: [
                { speaker: 'A', chinese: '我要複習一下生詞。', pinyin: 'Wǒ yào fùxí yīxià shēngcí.', english: 'I need to review the vocabulary.' },
                { speaker: 'B', chinese: '好，我陪你一起複習。', pinyin: 'Hǎo, wǒ péi nǐ yīqǐ fùxí.', english: 'OK, I\'ll review with you.' }
            ]
        }, {
            char: '負責',
            pinyin: 'fùzé',
            pos: 'Vs',
            en: 'Responsible',
            explanation: 'Describes a person who takes charge and is accountable for tasks or duties.',
            dialogue: [
                { speaker: 'A', chinese: '他對工作很負責。', pinyin: 'Tā duì gōngzuò hěn fùzé.', english: 'He is very responsible at work.' },
                { speaker: 'B', chinese: '是的，他從不推卸責任。', pinyin: 'Shì de, tā cóng bù tuīxiè zérèn.', english: 'Yes, he never shirks responsibility.' }
            ]
        }, {
            char: '該',
            pinyin: 'gāi',
            pos: 'Vaux',
            en: 'Should / Ought to',
            explanation: 'A modal verb expressing obligation or expectation. Also used to indicate a probable outcome.',
            dialogue: [
                { speaker: 'A', chinese: '你該去睡覺了。', pinyin: 'Nǐ gāi qù shuìjiào le.', english: 'You should go to sleep.' },
                { speaker: 'B', chinese: '嗯，我這就去。', pinyin: 'Èn, wǒ zhè jiù qù.', english: 'Okay, I\'ll go now.' }
            ]
        }, {
            char: '改變',
            pinyin: 'gǎibiàn',
            pos: 'N / V',
            en: 'To change / Change',
            explanation: 'As a verb, to make something different. As a noun, a noticeable difference or transformation.',
            dialogue: [
                { speaker: 'A', chinese: '你改變主意了嗎？', pinyin: 'Nǐ gǎibiàn zhǔyì le ma?', english: 'Did you change your mind?' },
                { speaker: 'B', chinese: '對，我覺得這個計劃更好。', pinyin: 'Duì, wǒ juéde zhège jìhuà gèng hǎo.', english: 'Yes, I think this plan is better.' }
            ]
        }, {
            char: '改進',
            pinyin: 'gǎijìn',
            pos: 'V',
            en: 'To improve',
            explanation: 'To make something better by fixing problems or enhancing quality.',
            dialogue: [
                { speaker: 'A', chinese: '我們需要改進服務。', pinyin: 'Wǒmen xūyào gǎijìn fúwù.', english: 'We need to improve our service.' },
                { speaker: 'B', chinese: '是的，顧客反饋很重要。', pinyin: 'Shì de, gùkè fǎnkuì hěn zhòngyào.', english: 'Yes, customer feedback is important.' }
            ]
        }, {
            char: '改善',
            pinyin: 'gǎishàn',
            pos: 'V',
            en: 'To improve (overall)',
            explanation: 'Similar to 改進, but often focuses on making a situation or condition better, not just a specific aspect.',
            dialogue: [
                { speaker: 'A', chinese: '我們的生活條件改善了。', pinyin: 'Wǒmen de shēnghuó tiáojiàn gǎishàn le.', english: 'Our living conditions have improved.' },
                { speaker: 'B', chinese: '太好了，這值得高興。', pinyin: 'Tài hǎo le, zhè zhídé gāoxìng.', english: 'Great, that\'s something to be happy about.' }
            ]
        }, {
            char: '改天',
            pinyin: 'gǎitiān',
            pos: 'Adv',
            en: 'Another day / Some other day',
            explanation: 'Used to postpone an appointment or event to a future day.',
            dialogue: [
                { speaker: 'A', chinese: '我們改天再聊吧。', pinyin: 'Wǒmen gǎitiān zài liáo ba.', english: 'Let\'s talk some other day.' },
                { speaker: 'B', chinese: '好的，你忙吧。', pinyin: 'Hǎo de, nǐ máng ba.', english: 'OK, go ahead with your work.' }
            ]
        }, {
            char: '蓋',
            pinyin: 'gài',
            pos: 'V',
            en: 'To cover / To build',
            explanation: 'To place something over an object (cover) or to construct a building (蓋房子).',
            dialogue: [
                { speaker: 'A', chinese: '請把鍋蓋蓋上。', pinyin: 'Qǐng bǎ guō gài gài shàng.', english: 'Please put the lid on the pot.' },
                { speaker: 'B', chinese: '好的，已經蓋好了。', pinyin: 'Hǎo de, yǐjīng gài hǎo le.', english: 'OK, it\'s covered.' }
            ]
        }, {
            char: '概念',
            pinyin: 'gàiniàn',
            pos: 'N',
            en: 'Concept / Idea',
            explanation: 'An abstract idea or general notion, often used in academic or philosophical contexts.',
            dialogue: [
                { speaker: 'A', chinese: '你理解這個概念嗎？', pinyin: 'Nǐ lǐjiě zhège gàiniàn ma?', english: 'Do you understand this concept?' },
                { speaker: 'B', chinese: '有點難，但我在努力。', pinyin: 'Yǒudiǎn nán, dàn wǒ zài nǔlì.', english: 'It\'s a bit difficult, but I\'m trying.' }
            ]
        }, {
            char: '趕',
            pinyin: 'gǎn',
            pos: 'V',
            en: 'To hurry / To catch up',
            explanation: 'To rush to do something or to catch a train, bus, or deadline.',
            dialogue: [
                { speaker: 'A', chinese: '我們快趕不上火車了。', pinyin: 'Wǒmen kuài gǎn bù shàng huǒchē le.', english: 'We\'re going to miss the train.' },
                { speaker: 'B', chinese: '那我們趕快跑吧！', pinyin: 'Nà wǒmen gǎnkuài pǎo ba!', english: 'Then let\'s run quickly!' }
            ]
        }, {
            char: '趕上',
            pinyin: 'gǎnshàng',
            pos: 'Vpt',
            en: 'To catch up / To meet (time)',
            explanation: 'To be on time for something, or to reach a person ahead of you.',
            dialogue: [
                { speaker: 'A', chinese: '我終於趕上你了。', pinyin: 'Wǒ zhōngyú gǎnshàng nǐ le.', english: 'I finally caught up with you.' },
                { speaker: 'B', chinese: '你跑得真快。', pinyin: 'Nǐ pǎo de zhēn kuài.', english: 'You run really fast.' }
            ]
        }, {
            char: '感動',
            pinyin: 'gǎndòng',
            pos: 'Vs',
            en: 'Moved / Touched',
            explanation: 'Describes a strong emotional response to something touching or meaningful.',
            dialogue: [
                { speaker: 'A', chinese: '他的故事很感動。', pinyin: 'Tā de gùshi hěn gǎndòng.', english: 'His story is very moving.' },
                { speaker: 'B', chinese: '對，我聽了都哭了。', pinyin: 'Duì, wǒ tīng le dōu kū le.', english: 'Yes, I cried when I heard it.' }
            ]
        }, {
            char: '感想',
            pinyin: 'gǎnxiǎng',
            pos: 'N',
            en: 'Impressions / Reflections',
            explanation: 'One\'s thoughts, feelings, and opinions after experiencing something.',
            dialogue: [
                { speaker: 'A', chinese: '你對這部電影有什麼感想？', pinyin: 'Nǐ duì zhè bù diànyǐng yǒu shénme gǎnxiǎng?', english: 'What are your thoughts on this movie?' },
                { speaker: 'B', chinese: '我覺得它非常深刻。', pinyin: 'Wǒ juéde tā fēicháng shēnkè.', english: 'I think it\'s very profound.' }
            ]
        }, {
            char: '感謝',
            pinyin: 'gǎnxiè',
            pos: 'Vst',
            en: 'To thank / Grateful',
            explanation: 'To express gratitude to someone. Often used in formal or sincere situations.',
            dialogue: [
                { speaker: 'A', chinese: '我感謝你的幫助。', pinyin: 'Wǒ gǎnxiè nǐ de bāngzhù.', english: 'I thank you for your help.' },
                { speaker: 'B', chinese: '不客氣，我很樂意。', pinyin: 'Bù kèqì, wǒ hěn lèyì.', english: 'You\'re welcome, I\'m happy to help.' }
            ]
        }, {
            char: '感興趣',
            pinyin: 'gǎn xìngqù',
            pos: 'Vs',
            en: 'Interested (in)',
            explanation: 'To have an interest in something. Often used with 對 (towards).',
            dialogue: [
                { speaker: 'A', chinese: '你對歷史感興趣嗎？', pinyin: 'Nǐ duì lìshǐ gǎn xìngqù ma?', english: 'Are you interested in history?' },
                { speaker: 'B', chinese: '很感興趣，我喜歡讀歷史書。', pinyin: 'Hěn gǎn xìngqù, wǒ xǐhuān dú lìshǐ shū.', english: 'Very interested, I like reading history books.' }
            ]
        }, {
            char: '鋼琴',
            pinyin: 'gāngqín',
            pos: 'N',
            en: 'Piano',
            explanation: 'A large keyboard musical instrument.',
            dialogue: [
                { speaker: 'A', chinese: '我會彈鋼琴。', pinyin: 'Wǒ huì tán gāngqín.', english: 'I can play the piano.' },
                { speaker: 'B', chinese: '真的？能彈一首給我聽嗎？', pinyin: 'Zhēn de? Néng tán yī shǒu gěi wǒ tīng ma?', english: 'Really? Can you play a piece for me?' }
            ]
        }, {
            char: '高速',
            pinyin: 'gāosù',
            pos: 'Vs-attr',
            en: 'High-speed',
            explanation: 'Describes something that moves or operates at a high speed, such as a highway or train.',
            dialogue: [
                { speaker: 'A', chinese: '我們走高速去吧。', pinyin: 'Wǒmen zǒu gāosù qù ba.', english: 'Let\'s take the highway.' },
                { speaker: 'B', chinese: '好，這樣更快。', pinyin: 'Hǎo, zhèyàng gèng kuài.', english: 'OK, it\'s faster that way.' }
            ]
        }, {
            char: '搞',
            pinyin: 'gǎo',
            pos: 'V',
            en: 'To do / To make (colloquial)',
            explanation: 'A colloquial verb meaning "to do" or "to handle," often used in casual speech.',
            dialogue: [
                { speaker: 'A', chinese: '你在搞什麼？', pinyin: 'Nǐ zài gǎo shénme?', english: 'What are you doing?' },
                { speaker: 'B', chinese: '我在搞一個小實驗。', pinyin: 'Wǒ zài gǎo yī gè xiǎo shíyàn.', english: 'I\'m doing a small experiment.' }
            ]
        }, {
            char: '個',
            pinyin: 'ge',
            pos: 'Ptc',
            en: 'Particle (sentence-final)',
            explanation: 'Used as a sentence-final particle in colloquial speech to soften the tone or indicate emphasis.',
            dialogue: [
                { speaker: 'A', chinese: '你來一下個。', pinyin: 'Nǐ lái yīxià ge.', english: 'Come here for a moment.' },
                { speaker: 'B', chinese: '來了來了！', pinyin: 'Lái le lái le!', english: 'Coming, coming!' }
            ]
        }, {
            char: '歌曲',
            pinyin: 'gēqǔ',
            pos: 'N',
            en: 'Song',
            explanation: 'A piece of music with lyrics that is sung.',
            dialogue: [
                { speaker: 'A', chinese: '我喜歡這首歌曲。', pinyin: 'Wǒ xǐhuān zhè shǒu gēqǔ.', english: 'I like this song.' },
                { speaker: 'B', chinese: '我也很喜歡，歌詞很美。', pinyin: 'Wǒ yě hěn xǐhuān, gēcí hěn měi.', english: 'I like it too, the lyrics are beautiful.' }
            ]
        }];

        // ------------------------------------------------------------
        // RENDER ENGINE
        // ------------------------------------------------------------
        const grid = document.getElementById('vocabGrid');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const countDisplay = document.getElementById('countDisplay');
        const legendContainer = document.getElementById('legendContainer');
        const pinyinGlobalToggle = document.getElementById('pinyinGlobalToggle');
        const pinyinToggleLabel = document.getElementById('pinyinToggleLabel');

        let globalPinyinRevealed = false;

        // Legend
        const posSet = new Set(vocabData.map(d => d.pos));
        const posLabels = {
            'N': 'Noun',
            'V': 'Verb',
            'Vs': 'Stative Verb',
            'Vst': 'Stative/Transitive Verb',
            'Adv': 'Adverb',
            'Prep': 'Preposition',
            'M': 'Measure Word',
            'Ptc': 'Particle',
            'N/V': 'Noun / Verb',
            'Conj': 'Conjunction',
            'Det': 'Determiner',
            'V-sep': 'Separable Verb',
            'Vpt': 'Verb Particle (Trans.)',
            'Vi': 'Intransitive Verb',
            'Vp': 'Verb Particle',
            'Vaux': 'Auxiliary Verb',
            'Vs-attr': 'Attributive Stative Verb'
        };
        const dotColorMap = {
            'N': '#7ba9c9',
            'V': '#7fb06a',
            'Vs': '#5ba884',
            'Vst': '#5ba884',
            'Adv': '#c9a86a',
            'Prep': '#c97a9a',
            'M': '#9a7ac9',
            'Ptc': '#c9b86a',
            'N/V': '#7ba9c9',
            'Conj': '#f0d0b0',
            'Det': '#f0b0b0',
            'V-sep': '#6ab06a',
            'Vpt': '#6a7ab0',
            'Vi': '#6a9a9a',
            'Vp': '#7a7a9a',
            'Vaux': '#6a7a8a',
            'Vs-attr': '#80b080'
        };

        function buildLegend() {
            const sorted = Array.from(posSet).sort();
            let html = '';
            sorted.forEach(label => {
                const display = posLabels[label] || label;
                const color = dotColorMap[label] || '#b8aa98';
                html += `<span class="legend-item"><span class="legend-dot" style="background:${color};"></span>${display}</span>`;
            });
            legendContainer.innerHTML = html;
        }
        buildLegend();

        // Render function
        function render(filter = '') {
            const term = filter.trim().toLowerCase();
            let filtered = vocabData;

            if (term) {
                filtered = vocabData.filter(item => {
                    let dialogueSearch = '';
                    item.dialogue.forEach(line => {
                        dialogueSearch += line.chinese + ' ' + line.pinyin + ' ' + line.english + ' ';
                    });
                    const searchable = item.char + ' ' + item.pinyin + ' ' + item.en + ' ' + item.explanation + ' ' + dialogueSearch;
                    return searchable.toLowerCase().includes(term);
                });
            }

            countDisplay.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty">🔍 No matches found.</div>`;
                return;
            }

            let html = '';
            filtered.forEach((item, index) => {
                const posClass = 'pos-' + item.pos.replace('/', '-');
                const posDisplay = posLabels[item.pos] || item.pos;

                // Build dialogue HTML
                let dialogueHtml = '';
                dialogueHtml += `
                        <div class="dialogue-toggle-wrapper">
                            <strong>💬 Dialogue:</strong>
                            <button class="dialogue-toggle-btn" data-dialogue-idx="${index}">Show Pinyin & Translation</button>
                        </div>
                        <div class="dialogue-lines">
                    `;

                item.dialogue.forEach(line => {
                    const speakerClass = line.speaker === 'A' ? 'speaker-a' : 'speaker-b';
                    dialogueHtml += `
                            <div class="line">
                                <span class="${speakerClass}">${line.speaker}:</span>
                                <span class="zh">${line.chinese}</span>
                                <span class="dialogue-details">
                                    <span class="sep">·</span>
                                    <span class="pinyin-text">${line.pinyin}</span>
                                    <span class="sep">·</span>
                                    <span class="en-text">${line.english}</span>
                                </span>
                            </div>
                        `;
                });

                dialogueHtml += `</div>`;

                html += `
                        <div class="vocab-card" data-index="${index}">
                            <div class="char-row">
                                <span class="char">${item.char}</span>
                                <span class="pinyin-container" data-pinyin="${item.pinyin}" data-revealed="false">
                                    <span class="pinyin-value">${item.pinyin}</span>
                                </span>
                            </div>
                            <span class="pos ${posClass}">${posDisplay}</span>

                            <button class="details-toggle" data-target="details-${index}">
                                <span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)
                            </button>

                            <div id="details-${index}" class="details-content">
                                <div class="explanation">
                                    <div class="meaning-line">📘 ${item.en}</div>
                                    <br />
                                    <strong>📖 Usage:</strong> ${item.explanation}
                                </div>
                                <div class="dialogue-box" id="dialogue-box-${index}">
                                    ${dialogueHtml}
                                </div>
                            </div>
                        </div>
                    `;
            });

            grid.innerHTML = html;

            // ---- Click on the Hanzi toggles its pinyin ----
            document.querySelectorAll('.char').forEach(charEl => {
                charEl.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const row = this.closest('.char-row');
                    const pinyinContainer = row ? row.querySelector('.pinyin-container') : null;
                    if (!pinyinContainer) return;
                    const isRevealed = pinyinContainer.dataset.revealed === 'true';
                    const newState = !isRevealed;
                    pinyinContainer.dataset.revealed = newState ? 'true' : 'false';
                    pinyinContainer.classList.toggle('revealed', newState);
                });
            });

            // ---- Apply global state to all pinyin containers ----
            document.querySelectorAll('.pinyin-container').forEach(el => {
                const shouldReveal = globalPinyinRevealed;
                el.dataset.revealed = shouldReveal ? 'true' : 'false';
                el.classList.toggle('revealed', shouldReveal);
            });

            // ---- Toggle main details (Meaning/Explanation) ----
            document.querySelectorAll('.details-toggle').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const targetId = this.dataset.target;
                    const content = document.getElementById(targetId);
                    if (!content) return;

                    const isOpen = content.classList.contains('open');
                    if (isOpen) {
                        content.classList.remove('open');
                        this.classList.remove('active');
                        this.innerHTML = '<span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)';
                    } else {
                        content.classList.add('open');
                        this.classList.add('active');
                        this.innerHTML = '<span class="arrow">▲</span> Hide Details';
                    }
                });
            });

            // ---- Toggle dialogue pinyin/translation ----
            document.querySelectorAll('.dialogue-toggle-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = this.dataset.dialogueIdx;
                    const dialogueBox = document.getElementById(`dialogue-box-${idx}`);
                    if (!dialogueBox) return;

                    const isShowing = dialogueBox.classList.contains('show-translation');
                    if (isShowing) {
                        dialogueBox.classList.remove('show-translation');
                        this.textContent = 'Show Pinyin & Translation';
                    } else {
                        dialogueBox.classList.add('show-translation');
                        this.textContent = 'Hide Pinyin & Translation';
                    }
                });
            });

            updateGlobalToggleLabel();
        }

        // ---- Global Pinyin Toggle ----
        function updateGlobalToggleLabel() {
            if (globalPinyinRevealed) {
                pinyinToggleLabel.textContent = 'Hide All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔓';
            } else {
                pinyinToggleLabel.textContent = 'Show All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔊';
            }
        }

        pinyinGlobalToggle.addEventListener('click', function() {
            globalPinyinRevealed = !globalPinyinRevealed;
            document.querySelectorAll('.pinyin-container').forEach(el => {
                el.dataset.revealed = globalPinyinRevealed ? 'true' : 'false';
                el.classList.toggle('revealed', globalPinyinRevealed);
            });
            updateGlobalToggleLabel();
        });

        // ---- Search & Clear ----
        searchInput.addEventListener('input', () => render(searchInput.value));
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            render('');
            searchInput.focus();
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') clearBtn.click();
        });

        // ---- Initial render ----
        render('');
    </script>
</body>
</html>
