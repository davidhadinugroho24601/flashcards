<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 3-4 Flashcards (Click Hanzi for Pinyin)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: #f4f2ef;
            min-height: 100vh;
            padding: 2rem 1.5rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #1e1e2a;
        }

        .header h1 span {
            background: #d9c9b4;
            padding: 0.1rem 0.8rem;
            border-radius: 12px;
            color: #2c2c3a;
        }

        .header .sub {
            font-size: 1rem;
            color: #6b5f52;
            margin-top: 0.3rem;
            font-weight: 400;
        }

        .header .badge {
            display: inline-block;
            margin-top: 0.6rem;
            background: #2c2c3a;
            color: white;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            background: #ffffffd9;
            backdrop-filter: blur(6px);
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 2.2rem;
            border: 1px solid #e8e0d6;
        }

        .stats {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c2c3a;
            white-space: nowrap;
        }

        .stats strong {
            background: #ece6de;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-weight: 600;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f3efe9;
            padding: 0.1rem 0.1rem 0.1rem 1.2rem;
            border-radius: 40px;
            transition: 0.2s;
            border: 1px solid transparent;
            flex: 1;
            min-width: 180px;
        }

        .search-box:focus-within {
            background: #ffffff;
            border-color: #b8aa98;
            box-shadow: 0 0 0 3px rgba(184, 170, 152, 0.2);
        }

        .search-box input {
            border: none;
            background: transparent;
            font-size: 0.9rem;
            padding: 0.5rem 0;
            width: 100%;
            outline: none;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #1e1e2a;
        }

        .search-box input::placeholder {
            color: #a89b8c;
            font-weight: 400;
        }

        .search-box button {
            background: #2c2c3a;
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .search-box button:hover {
            background: #1a1a26;
        }

        .pinyin-global-toggle {
            background: #ece6de;
            border: 1px solid #d5cbbc;
            border-radius: 40px;
            padding: 0.3rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .pinyin-global-toggle:hover {
            background: #d5cbbc;
            border-color: #b8aa98;
        }

        .pinyin-global-toggle .icon {
            font-size: 1rem;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.2rem;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 0.6rem 1.2rem;
            background: #ffffffd9;
            border-radius: 40px;
            border: 1px solid #e8e0d6;
            font-size: 0.75rem;
            font-weight: 500;
            color: #2c2c3a;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .vocab-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid #ebe5dd;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .vocab-card:hover {
            border-color: #d0c3b2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .vocab-card .char-row {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.2rem;
        }

        .vocab-card .char {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1e1e2a;
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.2;
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease;
            padding: 0.1rem 0.4rem;
            border-radius: 8px;
            user-select: none;
        }

        .vocab-card .char:hover {
            color: #4a3f33;
            background: #f0ebe4;
        }

        .vocab-card .char:active {
            transform: scale(0.95);
        }

        .pinyin-container {
            display: inline-flex;
            align-items: center;
            min-width: 2.2rem;
            justify-content: center;
        }

        .pinyin-container .pinyin-value {
            font-size: 1rem;
            color: #6b5f52;
            font-weight: 400;
            letter-spacing: 0.3px;
            display: none;
        }

        .pinyin-container.revealed .pinyin-value {
            display: inline;
        }

        .vocab-card .pos {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            align-self: flex-start;
            margin-top: 0.6rem;
            background: #f0ebe4;
            color: #4a4037;
        }

        .pos-N {
            background: #dbe9f0;
            color: #1f5a7a;
        }
        .pos-V {
            background: #e6f0db;
            color: #3d6b2b;
        }
        .pos-Vs {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Vst {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Adv {
            background: #f0e6db;
            color: #7a5a2b;
        }
        .pos-Prep {
            background: #f0dbe6;
            color: #7a2b4a;
        }
        .pos-M {
            background: #e6dbf0;
            color: #4a2b7a;
        }
        .pos-Ptc {
            background: #f0e8db;
            color: #7a6b2b;
        }
        .pos-N\/V {
            background: #dbe8f0;
            color: #1f5a7a;
        }
        .pos-Conj {
            background: #f0e0d0;
            color: #7a5a3a;
        }
        .pos-Det {
            background: #f0d4d4;
            color: #7a3a3a;
        }

        .details-toggle {
            margin-top: 1.2rem;
            background: none;
            border: 1px solid #d5cbbc;
            border-radius: 30px;
            padding: 0.5rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #4a4037;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
            align-self: flex-start;
            background: #faf8f5;
        }

        .details-toggle:hover {
            background: #e8e0d6;
            border-color: #b8aa98;
        }

        .details-toggle .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .details-toggle.active .arrow {
            transform: rotate(180deg);
        }

        .details-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
        }

        .details-content.open {
            max-height: 900px;
            opacity: 1;
            margin-top: 1.2rem;
        }

        .details-content .explanation {
            background: #f8f6f2;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #2c2c3a;
            border-left: 4px solid #d0c3b2;
            margin-bottom: 1rem;
        }

        .details-content .explanation strong {
            color: #1e1e2a;
        }

        .details-content .explanation .meaning-line {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e1e2a;
            background: #e8e0d6;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 0.4rem;
        }

        .dialogue-box {
            background: #f0f4f8;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.8;
        }

        .dialogue-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 0.3rem;
        }

        .dialogue-toggle-btn {
            background: #e8e0d6;
            border: none;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .dialogue-toggle-btn:hover {
            background: #d5cbbc;
        }

        .dialogue-box .speaker-a {
            color: #1f5a7a;
            font-weight: 600;
        }

        .dialogue-box .speaker-b {
            color: #3d6b2b;
            font-weight: 600;
        }

        .dialogue-box .line {
            margin-bottom: 0.2rem;
        }
        .dialogue-box .line:last-child {
            margin-bottom: 0;
        }

        .dialogue-box .zh {
            font-family: 'Noto Sans SC', sans-serif;
            margin-right: 0.3rem;
        }

        .dialogue-details {
            display: none;
            margin-left: 0.3rem;
        }

        .dialogue-details .pinyin-text {
            font-weight: 400;
            color: #6b5f52;
        }

        .dialogue-details .en-text {
            font-style: italic;
            color: #4a4037;
        }

        .dialogue-details .sep {
            color: #b8aa98;
            margin: 0 0.2rem;
        }

        .dialogue-box.show-translation .dialogue-details {
            display: inline;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1.1rem;
            color: #8f8172;
            background: #faf8f5;
            border-radius: 30px;
            border: 1px dashed #d5cbbc;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.8rem 3rem;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                border-radius: 28px;
                padding: 1rem 1.2rem;
                gap: 0.8rem;
            }
            .stats {
                text-align: center;
            }
            .search-box {
                padding: 0.1rem 0.1rem 0.1rem 1rem;
            }
            .search-box button {
                padding: 0.4rem 1rem;
                font-size: 0.8rem;
            }
            .vocab-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .vocab-card .char {
                font-size: 1.8rem;
            }
            .pinyin-global-toggle {
                justify-content: center;
            }
        }

        @media (min-width: 641px) and (max-width: 900px) {
            .vocab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 詞彙 <span>Level 3-4</span></h1>
            <div class="sub">Flashcard Mode · <strong>Click the Hanzi</strong> to reveal Pinyin</div>
            <div class="badge">🔍 Click the character to show pinyin · "Show Details" for meaning & dialogue</div>
        </div>

        <div class="toolbar">
            <div class="stats">
                <strong id="countDisplay">0</strong> words
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Chinese, Pinyin, or English..." autocomplete="off" />
                <button id="clearBtn">✕</button>
            </div>
            <button class="pinyin-global-toggle" id="pinyinGlobalToggle">
                <span class="icon">🔊</span>
                <span id="pinyinToggleLabel">Show All Pinyin</span>
            </button>
        </div>

        <div class="legend" id="legendContainer"></div>

        <div class="vocab-grid" id="vocabGrid"></div>
    </div>

    <script>
        // ------------------------------------------------------------
        // DATA — Level 3-4 Vocabulary (Traditional Hanzi)
        // ------------------------------------------------------------
        const vocabData = [{
            char: '不論',
            pinyin: 'bùlùn',
            pos: 'Conj',
            en: 'No matter / Regardless of',
            explanation: 'A conjunction used to indicate that something is true in all circumstances. Often paired with 都 or 也.',
            dialogue: [
                { speaker: 'A', chinese: '不論天氣好壞，我們都去。', pinyin: 'Bùlùn tiānqì hǎo huài, wǒmen dōu qù.', english: 'No matter the weather, we\'ll go.' },
                { speaker: 'B', chinese: '好，我準備好了。', pinyin: 'Hǎo, wǒ zhǔnbèi hǎo le.', english: 'OK, I\'m ready.' }
            ]
        }, {
            char: '不滿',
            pinyin: 'bùmán',
            pos: 'Vs',
            en: 'Dissatisfied / Discontent',
            explanation: 'A stative verb describing a feeling of unhappiness or displeasure about a person, situation, or service.',
            dialogue: [
                { speaker: 'A', chinese: '他對這個結果很不滿。', pinyin: 'Tā duì zhège jiéguǒ hěn bùmán.', english: 'He is very dissatisfied with this result.' },
                { speaker: 'B', chinese: '我們應該改進。', pinyin: 'Wǒmen yīnggāi gǎijìn.', english: 'We should improve.' }
            ]
        }, {
            char: '部門',
            pinyin: 'bùmén',
            pos: 'N',
            en: 'Department / Division',
            explanation: 'A distinct part of an organization, company, or government, responsible for a specific function.',
            dialogue: [
                { speaker: 'A', chinese: '你在哪個部門工作？', pinyin: 'Nǐ zài nǎge bùmén gōngzuò?', english: 'Which department do you work in?' },
                { speaker: 'B', chinese: '我在人力資源部。', pinyin: 'Wǒ zài rénlì zīyuán bù.', english: 'I\'m in the Human Resources department.' }
            ]
        }, {
            char: '不如',
            pinyin: 'bùrú',
            pos: 'Conj',
            en: 'Not as good as / It would be better to',
            explanation: 'Used to compare two things, indicating that the first is inferior to the second, or to suggest that an alternative is preferable.',
            dialogue: [
                { speaker: 'A', chinese: '坐公交不如走路快。', pinyin: 'Zuò gōngjiāo bùrú zǒulù kuài.', english: 'Taking the bus is not as fast as walking.' },
                { speaker: 'B', chinese: '那我們走著去吧。', pinyin: 'Nà wǒmen zǒuzhe qù ba.', english: 'Then let\'s walk.' }
            ]
        }, {
            char: '不少',
            pinyin: 'bùshǎo',
            pos: 'Det / Vs',
            en: 'Quite a few / Not a few',
            explanation: 'As a determiner, means "many" or "quite a number of." As a stative verb, it means "to be not few" (i.e., many).',
            dialogue: [
                { speaker: 'A', chinese: '這次來了不少人。', pinyin: 'Zhè cì lái le bùshǎo rén.', english: 'Quite a few people came this time.' },
                { speaker: 'B', chinese: '對，活動很受歡迎。', pinyin: 'Duì, huódòng hěn shòu huānyíng.', english: 'Yes, the event is very popular.' }
            ]
        }, {
            char: '不幸',
            pinyin: 'bùxìng',
            pos: 'Vs',
            en: 'Unfortunate / Unlucky',
            explanation: 'Describes an event or situation that is regrettable, sad, or causes misfortune. Often used with 的是 (unfortunately).',
            dialogue: [
                { speaker: 'A', chinese: '他最近遇到了不幸的事情。', pinyin: 'Tā zuìjìn yùdào le bùxìng de shìqing.', english: 'He has encountered something unfortunate recently.' },
                { speaker: 'B', chinese: '我聽說了，真替他難過。', pinyin: 'Wǒ tīngshuō le, zhēn tì tā nánguò.', english: 'I heard about it; I feel sorry for him.' }
            ]
        }, {
            char: '不用說',
            pinyin: 'bùyòngshuō',
            pos: 'Conj',
            en: 'Needless to say / It goes without saying',
            explanation: 'A conjunction used to introduce a statement that is obvious or already understood, similar to "of course" or "obviously."',
            dialogue: [
                { speaker: 'A', chinese: '不用說，他一定是第一名。', pinyin: 'Bùyòngshuō, tā yīdìng shì dì yī míng.', english: 'Needless to say, he must be the first place.' },
                { speaker: 'B', chinese: '我也這麼認為。', pinyin: 'Wǒ yě zhème rènwéi.', english: 'I think so too.' }
            ]
        }, {
            char: '布置',
            pinyin: 'bùzhì',
            pos: 'V',
            en: 'To arrange / To decorate',
            explanation: 'To set up, arrange, or decorate a space, or to assign tasks and responsibilities. Often used for rooms, events, or homework.',
            dialogue: [
                { speaker: 'A', chinese: '我們需要布置一下會議室。', pinyin: 'Wǒmen xūyào bùzhì yīxià huìyìshì.', english: 'We need to set up the meeting room.' },
                { speaker: 'B', chinese: '好的，我來準備桌椅。', pinyin: 'Hǎo de, wǒ lái zhǔnbèi zhuōyǐ.', english: 'OK, I\'ll prepare the tables and chairs.' }
            ]
        }, {
            char: '不足',
            pinyin: 'bùzú',
            pos: 'Vs',
            en: 'Insufficient / Not enough',
            explanation: 'Describes a lack of quantity, quality, or ability. Often used with 的 (不足之處 = shortcomings).',
            dialogue: [
                { speaker: 'A', chinese: '我們的資金還不足。', pinyin: 'Wǒmen de zījīn hái bùzú.', english: 'Our funds are still insufficient.' },
                { speaker: 'B', chinese: '我們需要找更多投資。', pinyin: 'Wǒmen xūyào zhǎo gèng duō tóuzī.', english: 'We need to find more investment.' }
            ]
        }, {
            char: '擦',
            pinyin: 'cā',
            pos: 'V',
            en: 'To wipe / To rub',
            explanation: 'To clean or dry by moving a cloth or hand across a surface. Also used for applying cream or lotion.',
            dialogue: [
                { speaker: 'A', chinese: '請把桌子擦乾淨。', pinyin: 'Qǐng bǎ zhuōzi cā gānjìng.', english: 'Please wipe the table clean.' },
                { speaker: 'B', chinese: '沒問題，我來擦。', pinyin: 'Méi wèntí, wǒ lái cā.', english: 'No problem, I\'ll wipe it.' }
            ]
        }, {
            char: '猜',
            pinyin: 'cāi',
            pos: 'V',
            en: 'To guess',
            explanation: 'To form an opinion or estimate about something without sufficient evidence. Often used in games or when uncertain.',
            dialogue: [
                { speaker: 'A', chinese: '你猜我買了什麼？', pinyin: 'Nǐ cāi wǒ mǎi le shénme?', english: 'Guess what I bought?' },
                { speaker: 'B', chinese: '我猜是書。', pinyin: 'Wǒ cāi shì shū.', english: 'I guess it\'s a book.' }
            ]
        }, {
            char: '材料',
            pinyin: 'cáiliào',
            pos: 'N',
            en: 'Material / Data',
            explanation: 'Refers to the physical substance used for making things, or to information and documents used for research or reference.',
            dialogue: [
                { speaker: 'A', chinese: '這些建築材料很環保。', pinyin: 'Zhèxiē jiànzhú cáiliào hěn huánbǎo.', english: 'These building materials are very eco-friendly.' },
                { speaker: 'B', chinese: '對，我們應該多使用。', pinyin: 'Duì, wǒmen yīnggāi duō shǐyòng.', english: 'Yes, we should use more of them.' }
            ]
        }, {
            char: '採用',
            pinyin: 'cǎiyòng',
            pos: 'V',
            en: 'To adopt / To use',
            explanation: 'To choose and put into practice an idea, method, or suggestion. Often used in formal or organizational contexts.',
            dialogue: [
                { speaker: 'A', chinese: '公司決定採用新技術。', pinyin: 'Gōngsī juédìng cǎiyòng xīn jìshù.', english: 'The company decided to adopt new technology.' },
                { speaker: 'B', chinese: '這會提高效率。', pinyin: 'Zhè huì tígāo xiàolǜ.', english: 'This will improve efficiency.' }
            ]
        }, {
            char: '餐',
            pinyin: 'cān',
            pos: 'M',
            en: 'Measure word for meals',
            explanation: 'A measure word used for meals. Common combinations: 一餐 (one meal), 三餐 (three meals a day).',
            dialogue: [
                { speaker: 'A', chinese: '你一天吃幾餐？', pinyin: 'Nǐ yītiān chī jǐ cān?', english: 'How many meals do you have a day?' },
                { speaker: 'B', chinese: '我通常吃三餐。', pinyin: 'Wǒ tōngcháng chī sān cān.', english: 'I usually have three meals.' }
            ]
        }, {
            char: '參考',
            pinyin: 'cānkǎo',
            pos: 'V',
            en: 'To consult / To reference',
            explanation: 'To look at information or advice for guidance when making a decision or doing something. Often used with 資料 (reference materials).',
            dialogue: [
                { speaker: 'A', chinese: '你可以參考這本書。', pinyin: 'Nǐ kěyǐ cānkǎo zhè běn shū.', english: 'You can refer to this book.' },
                { speaker: 'B', chinese: '謝謝，我會仔細看的。', pinyin: 'Xièxie, wǒ huì zǐxì kàn de.', english: 'Thanks, I\'ll read it carefully.' }
            ]
        }, {
            char: '草地',
            pinyin: 'cǎodì',
            pos: 'N',
            en: 'Lawn / Grassland',
            explanation: 'An area covered with grass, either natural or cultivated. Often used in parks, gardens, or for recreation.',
            dialogue: [
                { speaker: 'A', chinese: '孩子在草地上玩耍。', pinyin: 'Háizi zài cǎodì shàng wánshuǎ.', english: 'The children are playing on the grass.' },
                { speaker: 'B', chinese: '真開心，我也想加入。', pinyin: 'Zhēn kāixīn, wǒ yě xiǎng jiārù.', english: 'So happy, I want to join too.' }
            ]
        }, {
            char: '草原',
            pinyin: 'cǎoyuán',
            pos: 'N',
            en: 'Prairie / Steppe',
            explanation: 'A large area of grassland, often found in temperate regions, used for grazing livestock. Famous in Inner Mongolia and other regions.',
            dialogue: [
                { speaker: 'A', chinese: '蒙古草原很美麗。', pinyin: 'Ménggǔ cǎoyuán hěn měilì.', english: 'The Mongolian prairie is very beautiful.' },
                { speaker: 'B', chinese: '我想去看草原和騎馬。', pinyin: 'Wǒ xiǎng qù kàn cǎoyuán hé qímǎ.', english: 'I want to see the prairie and ride horses.' }
            ]
        }, {
            char: '曾',
            pinyin: 'céng',
            pos: 'Adv',
            en: 'Once / Formerly',
            explanation: 'An adverb indicating that an action occurred in the past. Often used with 經 (曾經) for emphasis, or alone.',
            dialogue: [
                { speaker: 'A', chinese: '我曾去過北京。', pinyin: 'Wǒ céng qùguò Běijīng.', english: 'I have been to Beijing once.' },
                { speaker: 'B', chinese: '我也去過，那裡很繁華。', pinyin: 'Wǒ yě qùguò, nàlǐ hěn fánhuá.', english: 'I\'ve been there too, it\'s very bustling.' }
            ]
        }, {
            char: '曾經',
            pinyin: 'céngjīng',
            pos: 'Adv',
            en: 'Once / Formerly (emphatic)',
            explanation: 'Similar to 曾 but more emphatic, indicating that something definitely happened in the past. Often used with 了 or 過.',
            dialogue: [
                { speaker: 'A', chinese: '他曾經是一位優秀的運動員。', pinyin: 'Tā céngjīng shì yī wèi yōuxiù de yùndòngyuán.', english: 'He was once an outstanding athlete.' },
                { speaker: 'B', chinese: '可惜現在不常運動了。', pinyin: 'Kěxí xiànzài bù cháng yùndòng le.', english: 'Unfortunately, he doesn\'t exercise much now.' }
            ]
        }, {
            char: '差點',
            pinyin: 'chàdiǎn',
            pos: 'Adv',
            en: 'Almost / Nearly',
            explanation: 'An adverb indicating that something came close to happening but did not. Also 差點兒 or 差一點兒. Often used in near-miss situations.',
            dialogue: [
                { speaker: 'A', chinese: '我差點遲到了。', pinyin: 'Wǒ chàdiǎn chídào le.', english: 'I almost arrived late.' },
                { speaker: 'B', chinese: '還好你趕上了。', pinyin: 'Hái hǎo nǐ gǎnshàng le.', english: 'Good thing you made it.' }
            ]
        }];

        // ------------------------------------------------------------
        // RENDER ENGINE
        // ------------------------------------------------------------
        const grid = document.getElementById('vocabGrid');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const countDisplay = document.getElementById('countDisplay');
        const legendContainer = document.getElementById('legendContainer');
        const pinyinGlobalToggle = document.getElementById('pinyinGlobalToggle');
        const pinyinToggleLabel = document.getElementById('pinyinToggleLabel');

        let globalPinyinRevealed = false;

        // Legend
        const posSet = new Set(vocabData.map(d => d.pos));
        const posLabels = {
            'N': 'Noun',
            'V': 'Verb',
            'Vs': 'Stative Verb',
            'Vst': 'Stative/Transitive Verb',
            'Adv': 'Adverb',
            'Prep': 'Preposition',
            'M': 'Measure Word',
            'Ptc': 'Particle',
            'N/V': 'Noun / Verb',
            'Conj': 'Conjunction',
            'Det': 'Determiner'
        };
        const dotColorMap = {
            'N': '#7ba9c9',
            'V': '#7fb06a',
            'Vs': '#5ba884',
            'Vst': '#5ba884',
            'Adv': '#c9a86a',
            'Prep': '#c97a9a',
            'M': '#9a7ac9',
            'Ptc': '#c9b86a',
            'N/V': '#7ba9c9',
            'Conj': '#f0d0b0',
            'Det': '#f0b0b0'
        };

        function buildLegend() {
            const sorted = Array.from(posSet).sort();
            let html = '';
            sorted.forEach(label => {
                const display = posLabels[label] || label;
                const color = dotColorMap[label] || '#b8aa98';
                html += `<span class="legend-item"><span class="legend-dot" style="background:${color};"></span>${display}</span>`;
            });
            legendContainer.innerHTML = html;
        }
        buildLegend();

        // Render function
        function render(filter = '') {
            const term = filter.trim().toLowerCase();
            let filtered = vocabData;

            if (term) {
                filtered = vocabData.filter(item => {
                    let dialogueSearch = '';
                    item.dialogue.forEach(line => {
                        dialogueSearch += line.chinese + ' ' + line.pinyin + ' ' + line.english + ' ';
                    });
                    const searchable = item.char + ' ' + item.pinyin + ' ' + item.en + ' ' + item.explanation + ' ' + dialogueSearch;
                    return searchable.toLowerCase().includes(term);
                });
            }

            countDisplay.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty">🔍 No matches found.</div>`;
                return;
            }

            let html = '';
            filtered.forEach((item, index) => {
                const posClass = 'pos-' + item.pos.replace('/', '-');
                const posDisplay = posLabels[item.pos] || item.pos;

                // Build dialogue HTML
                let dialogueHtml = '';
                dialogueHtml += `
                        <div class="dialogue-toggle-wrapper">
                            <strong>💬 Dialogue:</strong>
                            <button class="dialogue-toggle-btn" data-dialogue-idx="${index}">Show Pinyin & Translation</button>
                        </div>
                        <div class="dialogue-lines">
                    `;

                item.dialogue.forEach(line => {
                    const speakerClass = line.speaker === 'A' ? 'speaker-a' : 'speaker-b';
                    dialogueHtml += `
                            <div class="line">
                                <span class="${speakerClass}">${line.speaker}:</span>
                                <span class="zh">${line.chinese}</span>
                                <span class="dialogue-details">
                                    <span class="sep">·</span>
                                    <span class="pinyin-text">${line.pinyin}</span>
                                    <span class="sep">·</span>
                                    <span class="en-text">${line.english}</span>
                                </span>
                            </div>
                        `;
                });

                dialogueHtml += `</div>`;

                html += `
                        <div class="vocab-card" data-index="${index}">
                            <div class="char-row">
                                <span class="char">${item.char}</span>
                                <span class="pinyin-container" data-pinyin="${item.pinyin}" data-revealed="false">
                                    <span class="pinyin-value">${item.pinyin}</span>
                                </span>
                            </div>
                            <span class="pos ${posClass}">${posDisplay}</span>

                            <button class="details-toggle" data-target="details-${index}">
                                <span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)
                            </button>

                            <div id="details-${index}" class="details-content">
                                <div class="explanation">
                                    <div class="meaning-line">📘 ${item.en}</div>
                                    <br />
                                    <strong>📖 Usage:</strong> ${item.explanation}
                                </div>
                                <div class="dialogue-box" id="dialogue-box-${index}">
                                    ${dialogueHtml}
                                </div>
                            </div>
                        </div>
                    `;
            });

            grid.innerHTML = html;

            // ---- Click on the Hanzi toggles its pinyin ----
            document.querySelectorAll('.char').forEach(charEl => {
                charEl.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const row = this.closest('.char-row');
                    const pinyinContainer = row ? row.querySelector('.pinyin-container') : null;
                    if (!pinyinContainer) return;
                    const isRevealed = pinyinContainer.dataset.revealed === 'true';
                    const newState = !isRevealed;
                    pinyinContainer.dataset.revealed = newState ? 'true' : 'false';
                    pinyinContainer.classList.toggle('revealed', newState);
                });
            });

            // ---- Apply global state to all pinyin containers ----
            document.querySelectorAll('.pinyin-container').forEach(el => {
                const shouldReveal = globalPinyinRevealed;
                el.dataset.revealed = shouldReveal ? 'true' : 'false';
                el.classList.toggle('revealed', shouldReveal);
            });

            // ---- Toggle main details (Meaning/Explanation) ----
            document.querySelectorAll('.details-toggle').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const targetId = this.dataset.target;
                    const content = document.getElementById(targetId);
                    if (!content) return;

                    const isOpen = content.classList.contains('open');
                    if (isOpen) {
                        content.classList.remove('open');
                        this.classList.remove('active');
                        this.innerHTML = '<span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)';
                    } else {
                        content.classList.add('open');
                        this.classList.add('active');
                        this.innerHTML = '<span class="arrow">▲</span> Hide Details';
                    }
                });
            });

            // ---- Toggle dialogue pinyin/translation ----
            document.querySelectorAll('.dialogue-toggle-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = this.dataset.dialogueIdx;
                    const dialogueBox = document.getElementById(`dialogue-box-${idx}`);
                    if (!dialogueBox) return;

                    const isShowing = dialogueBox.classList.contains('show-translation');
                    if (isShowing) {
                        dialogueBox.classList.remove('show-translation');
                        this.textContent = 'Show Pinyin & Translation';
                    } else {
                        dialogueBox.classList.add('show-translation');
                        this.textContent = 'Hide Pinyin & Translation';
                    }
                });
            });

            updateGlobalToggleLabel();
        }

        // ---- Global Pinyin Toggle ----
        function updateGlobalToggleLabel() {
            if (globalPinyinRevealed) {
                pinyinToggleLabel.textContent = 'Hide All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔓';
            } else {
                pinyinToggleLabel.textContent = 'Show All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔊';
            }
        }

        pinyinGlobalToggle.addEventListener('click', function() {
            globalPinyinRevealed = !globalPinyinRevealed;
            document.querySelectorAll('.pinyin-container').forEach(el => {
                el.dataset.revealed = globalPinyinRevealed ? 'true' : 'false';
                el.classList.toggle('revealed', globalPinyinRevealed);
            });
            updateGlobalToggleLabel();
        });

        // ---- Search & Clear ----
        searchInput.addEventListener('input', () => render(searchInput.value));
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            render('');
            searchInput.focus();
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') clearBtn.click();
        });

        // ---- Initial render ----
        render('');
    </script>
</body>
</html>
