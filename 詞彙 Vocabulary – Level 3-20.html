<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 3-20 Flashcards (Click Hanzi for Pinyin)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: #f4f2ef;
            min-height: 100vh;
            padding: 2rem 1.5rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #1e1e2a;
        }

        .header h1 span {
            background: #d9c9b4;
            padding: 0.1rem 0.8rem;
            border-radius: 12px;
            color: #2c2c3a;
        }

        .header .sub {
            font-size: 1rem;
            color: #6b5f52;
            margin-top: 0.3rem;
            font-weight: 400;
        }

        .header .badge {
            display: inline-block;
            margin-top: 0.6rem;
            background: #2c2c3a;
            color: white;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            background: #ffffffd9;
            backdrop-filter: blur(6px);
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 2.2rem;
            border: 1px solid #e8e0d6;
        }

        .stats {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c2c3a;
            white-space: nowrap;
        }

        .stats strong {
            background: #ece6de;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-weight: 600;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f3efe9;
            padding: 0.1rem 0.1rem 0.1rem 1.2rem;
            border-radius: 40px;
            transition: 0.2s;
            border: 1px solid transparent;
            flex: 1;
            min-width: 180px;
        }

        .search-box:focus-within {
            background: #ffffff;
            border-color: #b8aa98;
            box-shadow: 0 0 0 3px rgba(184, 170, 152, 0.2);
        }

        .search-box input {
            border: none;
            background: transparent;
            font-size: 0.9rem;
            padding: 0.5rem 0;
            width: 100%;
            outline: none;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #1e1e2a;
        }

        .search-box input::placeholder {
            color: #a89b8c;
            font-weight: 400;
        }

        .search-box button {
            background: #2c2c3a;
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .search-box button:hover {
            background: #1a1a26;
        }

        .pinyin-global-toggle {
            background: #ece6de;
            border: 1px solid #d5cbbc;
            border-radius: 40px;
            padding: 0.3rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .pinyin-global-toggle:hover {
            background: #d5cbbc;
            border-color: #b8aa98;
        }

        .pinyin-global-toggle .icon {
            font-size: 1rem;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.2rem;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 0.6rem 1.2rem;
            background: #ffffffd9;
            border-radius: 40px;
            border: 1px solid #e8e0d6;
            font-size: 0.75rem;
            font-weight: 500;
            color: #2c2c3a;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .vocab-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid #ebe5dd;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .vocab-card:hover {
            border-color: #d0c3b2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .vocab-card .char-row {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.2rem;
        }

        .vocab-card .char {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1e1e2a;
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.2;
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease;
            padding: 0.1rem 0.4rem;
            border-radius: 8px;
            user-select: none;
        }

        .vocab-card .char:hover {
            color: #4a3f33;
            background: #f0ebe4;
        }

        .vocab-card .char:active {
            transform: scale(0.95);
        }

        .pinyin-container {
            display: inline-flex;
            align-items: center;
            min-width: 2.2rem;
            justify-content: center;
        }

        .pinyin-container .pinyin-value {
            font-size: 1rem;
            color: #6b5f52;
            font-weight: 400;
            letter-spacing: 0.3px;
            display: none;
        }

        .pinyin-container.revealed .pinyin-value {
            display: inline;
        }

        .vocab-card .pos {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            align-self: flex-start;
            margin-top: 0.6rem;
            background: #f0ebe4;
            color: #4a4037;
        }

        .pos-N {
            background: #dbe9f0;
            color: #1f5a7a;
        }
        .pos-V {
            background: #e6f0db;
            color: #3d6b2b;
        }
        .pos-Vs {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Vst {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Adv {
            background: #f0e6db;
            color: #7a5a2b;
        }
        .pos-Prep {
            background: #f0dbe6;
            color: #7a2b4a;
        }
        .pos-M {
            background: #e6dbf0;
            color: #4a2b7a;
        }
        .pos-Ptc {
            background: #f0e8db;
            color: #7a6b2b;
        }
        .pos-N\/V {
            background: #dbe8f0;
            color: #1f5a7a;
        }
        .pos-Conj {
            background: #f0e0d0;
            color: #7a5a3a;
        }
        .pos-Vpt {
            background: #d4d8e8;
            color: #3a4a7a;
        }

        .details-toggle {
            margin-top: 1.2rem;
            background: none;
            border: 1px solid #d5cbbc;
            border-radius: 30px;
            padding: 0.5rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #4a4037;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
            align-self: flex-start;
            background: #faf8f5;
        }

        .details-toggle:hover {
            background: #e8e0d6;
            border-color: #b8aa98;
        }

        .details-toggle .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .details-toggle.active .arrow {
            transform: rotate(180deg);
        }

        .details-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
        }

        .details-content.open {
            max-height: 900px;
            opacity: 1;
            margin-top: 1.2rem;
        }

        .details-content .explanation {
            background: #f8f6f2;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #2c2c3a;
            border-left: 4px solid #d0c3b2;
            margin-bottom: 1rem;
        }

        .details-content .explanation strong {
            color: #1e1e2a;
        }

        .details-content .explanation .meaning-line {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e1e2a;
            background: #e8e0d6;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 0.4rem;
        }

        .dialogue-box {
            background: #f0f4f8;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.8;
        }

        .dialogue-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 0.3rem;
        }

        .dialogue-toggle-btn {
            background: #e8e0d6;
            border: none;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .dialogue-toggle-btn:hover {
            background: #d5cbbc;
        }

        .dialogue-box .speaker-a {
            color: #1f5a7a;
            font-weight: 600;
        }

        .dialogue-box .speaker-b {
            color: #3d6b2b;
            font-weight: 600;
        }

        .dialogue-box .line {
            margin-bottom: 0.2rem;
        }
        .dialogue-box .line:last-child {
            margin-bottom: 0;
        }

        .dialogue-box .zh {
            font-family: 'Noto Sans SC', sans-serif;
            margin-right: 0.3rem;
        }

        .dialogue-details {
            display: none;
            margin-left: 0.3rem;
        }

        .dialogue-details .pinyin-text {
            font-weight: 400;
            color: #6b5f52;
        }

        .dialogue-details .en-text {
            font-style: italic;
            color: #4a4037;
        }

        .dialogue-details .sep {
            color: #b8aa98;
            margin: 0 0.2rem;
        }

        .dialogue-box.show-translation .dialogue-details {
            display: inline;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1.1rem;
            color: #8f8172;
            background: #faf8f5;
            border-radius: 30px;
            border: 1px dashed #d5cbbc;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.8rem 3rem;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                border-radius: 28px;
                padding: 1rem 1.2rem;
                gap: 0.8rem;
            }
            .stats {
                text-align: center;
            }
            .search-box {
                padding: 0.1rem 0.1rem 0.1rem 1rem;
            }
            .search-box button {
                padding: 0.4rem 1rem;
                font-size: 0.8rem;
            }
            .vocab-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .vocab-card .char {
                font-size: 1.8rem;
            }
            .pinyin-global-toggle {
                justify-content: center;
            }
        }

        @media (min-width: 641px) and (max-width: 900px) {
            .vocab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 詞彙 <span>Level 3-20</span></h1>
            <div class="sub">Flashcard Mode · <strong>Click the Hanzi</strong> to reveal Pinyin</div>
            <div class="badge">🔍 Click the character to show pinyin · "Show Details" for meaning & dialogue</div>
        </div>

        <div class="toolbar">
            <div class="stats">
                <strong id="countDisplay">0</strong> words
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Chinese, Pinyin, or English..." autocomplete="off" />
                <button id="clearBtn">✕</button>
            </div>
            <button class="pinyin-global-toggle" id="pinyinGlobalToggle">
                <span class="icon">🔊</span>
                <span id="pinyinToggleLabel">Show All Pinyin</span>
            </button>
        </div>

        <div class="legend" id="legendContainer"></div>

        <div class="vocab-grid" id="vocabGrid"></div>
    </div>

    <script>
        // ------------------------------------------------------------
        // DATA — Level 3-20 Vocabulary (Traditional Hanzi)
        // ------------------------------------------------------------
        const vocabData = [{
            char: '教練',
            pinyin: 'jiàoliàn',
            pos: 'N',
            en: 'Coach (sports / driving)',
            explanation: 'A person who trains or instructs others in a sport, driving, or other skill.',
            dialogue: [
                { speaker: 'A', chinese: '他是我的籃球教練。', pinyin: 'Tā shì wǒ de lánqiú jiàoliàn.', english: 'He is my basketball coach.' },
                { speaker: 'B', chinese: '他教得很好。', pinyin: 'Tā jiāo de hěn hǎo.', english: 'He teaches very well.' }
            ]
        }, {
            char: '教師',
            pinyin: 'jiàoshī',
            pos: 'N',
            en: 'Teacher (formal)',
            explanation: 'A formal term for a teacher, often used in official or professional contexts.',
            dialogue: [
                { speaker: 'A', chinese: '他是一位優秀的教師。', pinyin: 'Tā shì yī wèi yōuxiù de jiàoshī.', english: 'He is an excellent teacher.' },
                { speaker: 'B', chinese: '我也想像他一樣。', pinyin: 'Wǒ yě xiǎng xiàng tā yīyàng.', english: 'I want to be like him too.' }
            ]
        }, {
            char: '教堂',
            pinyin: 'jiàotáng',
            pos: 'N',
            en: 'Church',
            explanation: 'A building used for Christian worship and religious services.',
            dialogue: [
                { speaker: 'A', chinese: '我們去教堂做禮拜。', pinyin: 'Wǒmen qù jiàotáng zuò lǐbài.', english: 'We go to church for worship.' },
                { speaker: 'B', chinese: '那裡的建築很漂亮。', pinyin: 'Nàlǐ de jiànzhú hěn piàoliang.', english: 'The architecture there is beautiful.' }
            ]
        }, {
            char: '教訓',
            pinyin: 'jiàoxùn',
            pos: 'N',
            en: 'Lesson (from mistake)',
            explanation: 'A lesson learned from a past mistake or failure, often used as a warning.',
            dialogue: [
                { speaker: 'A', chinese: '這次失敗給了我一個教訓。', pinyin: 'Zhè cì shībài gěi le wǒ yī gè jiàoxùn.', english: 'This failure taught me a lesson.' },
                { speaker: 'B', chinese: '你要記住這個教訓。', pinyin: 'Nǐ yào jìzhù zhège jiàoxùn.', english: 'You should remember this lesson.' }
            ]
        }, {
            char: '加強',
            pinyin: 'jiāqiáng',
            pos: 'V',
            en: 'To strengthen / To reinforce',
            explanation: 'To make something stronger, more powerful, or more effective.',
            dialogue: [
                { speaker: 'A', chinese: '我們要加強練習。', pinyin: 'Wǒmen yào jiāqiáng liànxí.', english: 'We need to strengthen our practice.' },
                { speaker: 'B', chinese: '對，這樣才能進步。', pinyin: 'Duì, zhèyàng cáinéng jìnbù.', english: 'Yes, that way we can improve.' }
            ]
        }, {
            char: '加入',
            pinyin: 'jiārù',
            pos: 'Vpt',
            en: 'To join / To enter',
            explanation: 'To become a member of a group or organization.',
            dialogue: [
                { speaker: 'A', chinese: '我想加入籃球隊。', pinyin: 'Wǒ xiǎng jiārù lánqiú duì.', english: 'I want to join the basketball team.' },
                { speaker: 'B', chinese: '歡迎你加入。', pinyin: 'Huānyíng nǐ jiārù.', english: 'Welcome to join.' }
            ]
        }, {
            char: '家鄉',
            pinyin: 'jiāxiāng',
            pos: 'N',
            en: 'Hometown',
            explanation: 'The place where a person grew up or has family roots.',
            dialogue: [
                { speaker: 'A', chinese: '我的家鄉在台南。', pinyin: 'Wǒ de jiāxiāng zài Táinán.', english: 'My hometown is in Tainan.' },
                { speaker: 'B', chinese: '那裡有很多美食。', pinyin: 'Nàlǐ yǒu hěnduō měishí.', english: 'There is a lot of delicious food there.' }
            ]
        }, {
            char: '家長',
            pinyin: 'jiāzhǎng',
            pos: 'N',
            en: 'Parent / Guardian',
            explanation: 'A child\'s parent or guardian, often used in school or official contexts.',
            dialogue: [
                { speaker: 'A', chinese: '明天有家長會。', pinyin: 'Míngtiān yǒu jiāzhǎng huì.', english: 'There is a parent-teacher meeting tomorrow.' },
                { speaker: 'B', chinese: '我會準時參加。', pinyin: 'Wǒ huì zhǔnshí cānjiā.', english: 'I will attend on time.' }
            ]
        }, {
            char: '假如',
            pinyin: 'jiǎrú',
            pos: 'Conj',
            en: 'If (hypothetical)',
            explanation: 'A conjunction used to introduce a hypothetical situation, similar to "if" in English.',
            dialogue: [
                { speaker: 'A', chinese: '假如明天下雨，我們就不去了。', pinyin: 'Jiǎrú míngtiān xiàyǔ, wǒmen jiù bù qù le.', english: 'If it rains tomorrow, we won\'t go.' },
                { speaker: 'B', chinese: '好的，那我們看天氣再說。', pinyin: 'Hǎo de, nà wǒmen kàn tiānqì zài shuō.', english: 'OK, then let\'s decide based on the weather.' }
            ]
        }, {
            char: '假裝',
            pinyin: 'jiǎzhuāng',
            pos: 'V',
            en: 'To pretend',
            explanation: 'To behave as if something is true when it is not.',
            dialogue: [
                { speaker: 'A', chinese: '他假裝沒看到我。', pinyin: 'Tā jiǎzhuāng méi kàndào wǒ.', english: 'He pretended not to see me.' },
                { speaker: 'B', chinese: '為什麼？你們吵架了嗎？', pinyin: 'Wèishénme? Nǐmen chǎojià le ma?', english: 'Why? Did you argue?' }
            ]
        }, {
            char: '價錢',
            pinyin: 'jiàqián',
            pos: 'N',
            en: 'Price',
            explanation: 'The amount of money required to purchase something, similar to 價格 but more colloquial.',
            dialogue: [
                { speaker: 'A', chinese: '這件衣服的價錢是多少？', pinyin: 'Zhè jiàn yīfu de jiàqián shì duōshao?', english: 'What is the price of this clothing?' },
                { speaker: 'B', chinese: '五百元，正在打折。', pinyin: 'Wǔbǎi yuán, zhèngzài dǎzhé.', english: '500 yuan, it\'s on sale.' }
            ]
        }, {
            char: '價值',
            pinyin: 'jiàzhí',
            pos: 'N',
            en: 'Value',
            explanation: 'The worth or importance of something, whether financial or moral.',
            dialogue: [
                { speaker: 'A', chinese: '這幅畫的價值很高。', pinyin: 'Zhè fú huà de jiàzhí hěn gāo.', english: 'This painting is of high value.' },
                { speaker: 'B', chinese: '它是古代藝術品。', pinyin: 'Tā shì gǔdài yìshùpǐn.', english: 'It\'s an ancient work of art.' }
            ]
        }, {
            char: '接觸',
            pinyin: 'jiēchù',
            pos: 'V',
            en: 'To contact / To come into contact',
            explanation: 'To touch or to communicate with someone or something. Also means to be exposed to new ideas.',
            dialogue: [
                { speaker: 'A', chinese: '我最近接觸了很多新朋友。', pinyin: 'Wǒ zuìjìn jiēchù le hěnduō xīn péngyou.', english: 'I\'ve recently come into contact with many new friends.' },
                { speaker: 'B', chinese: '那很好，擴大社交圈。', pinyin: 'Nà hěn hǎo, kuòdà shèjiāo quān.', english: 'That\'s great, expand your social circle.' }
            ]
        }, {
            char: '接受',
            pinyin: 'jiēshòu',
            pos: 'V',
            en: 'To accept / To receive',
            explanation: 'To agree to take something offered, or to approve of an idea or situation.',
            dialogue: [
                { speaker: 'A', chinese: '我接受你的邀請。', pinyin: 'Wǒ jiēshòu nǐ de yāoqǐng.', english: 'I accept your invitation.' },
                { speaker: 'B', chinese: '太好了，我們一起去。', pinyin: 'Tài hǎo le, wǒmen yīqǐ qù.', english: 'Great, let\'s go together.' }
            ]
        }, {
            char: '結',
            pinyin: 'jié',
            pos: 'V',
            en: 'To tie / To end',
            explanation: 'To tie a knot, or to conclude something (e.g., 結束 = to end). Also used in 結婚 (to marry).',
            dialogue: [
                { speaker: 'A', chinese: '請幫我結一下帳。', pinyin: 'Qǐng bāng wǒ jié yīxià zhàng.', english: 'Please help me settle the bill.' },
                { speaker: 'B', chinese: '好的，總共是三百元。', pinyin: 'Hǎo de, zǒnggòng shì sānbǎi yuán.', english: 'OK, the total is 300 yuan.' }
            ]
        }, {
            char: '節',
            pinyin: 'jié',
            pos: 'M',
            en: 'Measure word for sections / segments',
            explanation: 'A measure word used for sections, segments, or courses. Also used for festivals (節日).',
            dialogue: [
                { speaker: 'A', chinese: '這節課很有趣。', pinyin: 'Zhè jié kè hěn yǒuqù.', english: 'This class is very interesting.' },
                { speaker: 'B', chinese: '對，老師講得很好。', pinyin: 'Duì, lǎoshī jiǎng de hěn hǎo.', english: 'Yes, the teacher teaches very well.' }
            ]
        }, {
            char: '節目',
            pinyin: 'jiémù',
            pos: 'N',
            en: 'Program / Show',
            explanation: 'A television or radio program, or a performance at an event.',
            dialogue: [
                { speaker: 'A', chinese: '今晚的節目很精彩。', pinyin: 'Jīnwǎn de jiémù hěn jīngcǎi.', english: 'Tonight\'s program is very exciting.' },
                { speaker: 'B', chinese: '我們一起看吧。', pinyin: 'Wǒmen yīqǐ kàn ba.', english: 'Let\'s watch it together.' }
            ]
        }, {
            char: '結局',
            pinyin: 'jiéjú',
            pos: 'N',
            en: 'Ending / Conclusion',
            explanation: 'The final outcome of a story, event, or situation.',
            dialogue: [
                { speaker: 'A', chinese: '這部電影的結局很感人。', pinyin: 'Zhè bù diànyǐng de jiéjú hěn gǎnrén.', english: 'The ending of this movie is very touching.' },
                { speaker: 'B', chinese: '我看了都哭了。', pinyin: 'Wǒ kàn le dōu kū le.', english: 'I cried when I watched it.' }
            ]
        }, {
            char: '解決',
            pinyin: 'jiějué',
            pos: 'V',
            en: 'To solve / To resolve',
            explanation: 'To find a solution to a problem or issue.',
            dialogue: [
                { speaker: 'A', chinese: '我們需要解決這個問題。', pinyin: 'Wǒmen xūyào jiějué zhège wèntí.', english: 'We need to solve this problem.' },
                { speaker: 'B', chinese: '大家有什麼建議嗎？', pinyin: 'Dàjiā yǒu shénme jiànyì ma?', english: 'Does anyone have any suggestions?' }
            ]
        }, {
            char: '姊妹',
            pinyin: 'jiěmèi',
            pos: 'N',
            en: 'Sisters (older and younger)',
            explanation: 'A term for sisters, often used to refer to siblings of the same generation. Can also mean "sister" in a religious context.',
            dialogue: [
                { speaker: 'A', chinese: '我有兩個姊妹。', pinyin: 'Wǒ yǒu liǎng gè jiěmèi.', english: 'I have two sisters.' },
                { speaker: 'B', chinese: '你們感情好嗎？', pinyin: 'Nǐmen gǎnqíng hǎo ma?', english: 'Are you close?' }
            ]
        }];

        // ------------------------------------------------------------
        // RENDER ENGINE
        // ------------------------------------------------------------
        const grid = document.getElementById('vocabGrid');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const countDisplay = document.getElementById('countDisplay');
        const legendContainer = document.getElementById('legendContainer');
        const pinyinGlobalToggle = document.getElementById('pinyinGlobalToggle');
        const pinyinToggleLabel = document.getElementById('pinyinToggleLabel');

        let globalPinyinRevealed = false;

        // Legend
        const posSet = new Set(vocabData.map(d => d.pos));
        const posLabels = {
            'N': 'Noun',
            'V': 'Verb',
            'Vs': 'Stative Verb',
            'Vst': 'Stative/Transitive Verb',
            'Adv': 'Adverb',
            'Prep': 'Preposition',
            'M': 'Measure Word',
            'Ptc': 'Particle',
            'N/V': 'Noun / Verb',
            'Conj': 'Conjunction',
            'Vpt': 'Verb Particle (Trans.)'
        };
        const dotColorMap = {
            'N': '#7ba9c9',
            'V': '#7fb06a',
            'Vs': '#5ba884',
            'Vst': '#5ba884',
            'Adv': '#c9a86a',
            'Prep': '#c97a9a',
            'M': '#9a7ac9',
            'Ptc': '#c9b86a',
            'N/V': '#7ba9c9',
            'Conj': '#f0d0b0',
            'Vpt': '#6a7ab0'
        };

        function buildLegend() {
            const sorted = Array.from(posSet).sort();
            let html = '';
            sorted.forEach(label => {
                const display = posLabels[label] || label;
                const color = dotColorMap[label] || '#b8aa98';
                html += `<span class="legend-item"><span class="legend-dot" style="background:${color};"></span>${display}</span>`;
            });
            legendContainer.innerHTML = html;
        }
        buildLegend();

        // Render function
        function render(filter = '') {
            const term = filter.trim().toLowerCase();
            let filtered = vocabData;

            if (term) {
                filtered = vocabData.filter(item => {
                    let dialogueSearch = '';
                    item.dialogue.forEach(line => {
                        dialogueSearch += line.chinese + ' ' + line.pinyin + ' ' + line.english + ' ';
                    });
                    const searchable = item.char + ' ' + item.pinyin + ' ' + item.en + ' ' + item.explanation + ' ' + dialogueSearch;
                    return searchable.toLowerCase().includes(term);
                });
            }

            countDisplay.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty">🔍 No matches found.</div>`;
                return;
            }

            let html = '';
            filtered.forEach((item, index) => {
                const posClass = 'pos-' + item.pos.replace('/', '-');
                const posDisplay = posLabels[item.pos] || item.pos;

                // Build dialogue HTML
                let dialogueHtml = '';
                dialogueHtml += `
                        <div class="dialogue-toggle-wrapper">
                            <strong>💬 Dialogue:</strong>
                            <button class="dialogue-toggle-btn" data-dialogue-idx="${index}">Show Pinyin & Translation</button>
                        </div>
                        <div class="dialogue-lines">
                    `;

                item.dialogue.forEach(line => {
                    const speakerClass = line.speaker === 'A' ? 'speaker-a' : 'speaker-b';
                    dialogueHtml += `
                            <div class="line">
                                <span class="${speakerClass}">${line.speaker}:</span>
                                <span class="zh">${line.chinese}</span>
                                <span class="dialogue-details">
                                    <span class="sep">·</span>
                                    <span class="pinyin-text">${line.pinyin}</span>
                                    <span class="sep">·</span>
                                    <span class="en-text">${line.english}</span>
                                </span>
                            </div>
                        `;
                });

                dialogueHtml += `</div>`;

                html += `
                        <div class="vocab-card" data-index="${index}">
                            <div class="char-row">
                                <span class="char">${item.char}</span>
                                <span class="pinyin-container" data-pinyin="${item.pinyin}" data-revealed="false">
                                    <span class="pinyin-value">${item.pinyin}</span>
                                </span>
                            </div>
                            <span class="pos ${posClass}">${posDisplay}</span>

                            <button class="details-toggle" data-target="details-${index}">
                                <span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)
                            </button>

                            <div id="details-${index}" class="details-content">
                                <div class="explanation">
                                    <div class="meaning-line">📘 ${item.en}</div>
                                    <br />
                                    <strong>📖 Usage:</strong> ${item.explanation}
                                </div>
                                <div class="dialogue-box" id="dialogue-box-${index}">
                                    ${dialogueHtml}
                                </div>
                            </div>
                        </div>
                    `;
            });

            grid.innerHTML = html;

            // ---- Click on the Hanzi toggles its pinyin ----
            document.querySelectorAll('.char').forEach(charEl => {
                charEl.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const row = this.closest('.char-row');
                    const pinyinContainer = row ? row.querySelector('.pinyin-container') : null;
                    if (!pinyinContainer) return;
                    const isRevealed = pinyinContainer.dataset.revealed === 'true';
                    const newState = !isRevealed;
                    pinyinContainer.dataset.revealed = newState ? 'true' : 'false';
                    pinyinContainer.classList.toggle('revealed', newState);
                });
            });

            // ---- Apply global state to all pinyin containers ----
            document.querySelectorAll('.pinyin-container').forEach(el => {
                const shouldReveal = globalPinyinRevealed;
                el.dataset.revealed = shouldReveal ? 'true' : 'false';
                el.classList.toggle('revealed', shouldReveal);
            });

            // ---- Toggle main details (Meaning/Explanation) ----
            document.querySelectorAll('.details-toggle').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const targetId = this.dataset.target;
                    const content = document.getElementById(targetId);
                    if (!content) return;

                    const isOpen = content.classList.contains('open');
                    if (isOpen) {
                        content.classList.remove('open');
                        this.classList.remove('active');
                        this.innerHTML = '<span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)';
                    } else {
                        content.classList.add('open');
                        this.classList.add('active');
                        this.innerHTML = '<span class="arrow">▲</span> Hide Details';
                    }
                });
            });

            // ---- Toggle dialogue pinyin/translation ----
            document.querySelectorAll('.dialogue-toggle-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = this.dataset.dialogueIdx;
                    const dialogueBox = document.getElementById(`dialogue-box-${idx}`);
                    if (!dialogueBox) return;

                    const isShowing = dialogueBox.classList.contains('show-translation');
                    if (isShowing) {
                        dialogueBox.classList.remove('show-translation');
                        this.textContent = 'Show Pinyin & Translation';
                    } else {
                        dialogueBox.classList.add('show-translation');
                        this.textContent = 'Hide Pinyin & Translation';
                    }
                });
            });

            updateGlobalToggleLabel();
        }

        // ---- Global Pinyin Toggle ----
        function updateGlobalToggleLabel() {
            if (globalPinyinRevealed) {
                pinyinToggleLabel.textContent = 'Hide All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔓';
            } else {
                pinyinToggleLabel.textContent = 'Show All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔊';
            }
        }

        pinyinGlobalToggle.addEventListener('click', function() {
            globalPinyinRevealed = !globalPinyinRevealed;
            document.querySelectorAll('.pinyin-container').forEach(el => {
                el.dataset.revealed = globalPinyinRevealed ? 'true' : 'false';
                el.classList.toggle('revealed', globalPinyinRevealed);
            });
            updateGlobalToggleLabel();
        });

        // ---- Search & Clear ----
        searchInput.addEventListener('input', () => render(searchInput.value));
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            render('');
            searchInput.focus();
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') clearBtn.click();
        });

        // ---- Initial render ----
        render('');
    </script>
</body>
</html>
