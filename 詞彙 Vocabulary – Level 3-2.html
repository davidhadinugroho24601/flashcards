<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 3-2 Flashcards (Click Hanzi for Pinyin)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: #f4f2ef;
            min-height: 100vh;
            padding: 2rem 1.5rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #1e1e2a;
        }

        .header h1 span {
            background: #d9c9b4;
            padding: 0.1rem 0.8rem;
            border-radius: 12px;
            color: #2c2c3a;
        }

        .header .sub {
            font-size: 1rem;
            color: #6b5f52;
            margin-top: 0.3rem;
            font-weight: 400;
        }

        .header .badge {
            display: inline-block;
            margin-top: 0.6rem;
            background: #2c2c3a;
            color: white;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            background: #ffffffd9;
            backdrop-filter: blur(6px);
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 2.2rem;
            border: 1px solid #e8e0d6;
        }

        .stats {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c2c3a;
            white-space: nowrap;
        }

        .stats strong {
            background: #ece6de;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-weight: 600;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f3efe9;
            padding: 0.1rem 0.1rem 0.1rem 1.2rem;
            border-radius: 40px;
            transition: 0.2s;
            border: 1px solid transparent;
            flex: 1;
            min-width: 180px;
        }

        .search-box:focus-within {
            background: #ffffff;
            border-color: #b8aa98;
            box-shadow: 0 0 0 3px rgba(184, 170, 152, 0.2);
        }

        .search-box input {
            border: none;
            background: transparent;
            font-size: 0.9rem;
            padding: 0.5rem 0;
            width: 100%;
            outline: none;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #1e1e2a;
        }

        .search-box input::placeholder {
            color: #a89b8c;
            font-weight: 400;
        }

        .search-box button {
            background: #2c2c3a;
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .search-box button:hover {
            background: #1a1a26;
        }

        .pinyin-global-toggle {
            background: #ece6de;
            border: 1px solid #d5cbbc;
            border-radius: 40px;
            padding: 0.3rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .pinyin-global-toggle:hover {
            background: #d5cbbc;
            border-color: #b8aa98;
        }

        .pinyin-global-toggle .icon {
            font-size: 1rem;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.2rem;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 0.6rem 1.2rem;
            background: #ffffffd9;
            border-radius: 40px;
            border: 1px solid #e8e0d6;
            font-size: 0.75rem;
            font-weight: 500;
            color: #2c2c3a;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .vocab-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid #ebe5dd;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .vocab-card:hover {
            border-color: #d0c3b2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .vocab-card .char-row {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.2rem;
        }

        .vocab-card .char {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1e1e2a;
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.2;
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease;
            padding: 0.1rem 0.4rem;
            border-radius: 8px;
            user-select: none;
        }

        .vocab-card .char:hover {
            color: #4a3f33;
            background: #f0ebe4;
        }

        .vocab-card .char:active {
            transform: scale(0.95);
        }

        .pinyin-container {
            display: inline-flex;
            align-items: center;
            min-width: 2.2rem;
            justify-content: center;
        }

        .pinyin-container .pinyin-value {
            font-size: 1rem;
            color: #6b5f52;
            font-weight: 400;
            letter-spacing: 0.3px;
            display: none;
        }

        .pinyin-container.revealed .pinyin-value {
            display: inline;
        }

        .vocab-card .pos {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            align-self: flex-start;
            margin-top: 0.6rem;
            background: #f0ebe4;
            color: #4a4037;
        }

        .pos-N {
            background: #dbe9f0;
            color: #1f5a7a;
        }
        .pos-V {
            background: #e6f0db;
            color: #3d6b2b;
        }
        .pos-Vs {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Vst {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Adv {
            background: #f0e6db;
            color: #7a5a2b;
        }
        .pos-Prep {
            background: #f0dbe6;
            color: #7a2b4a;
        }
        .pos-M {
            background: #e6dbf0;
            color: #4a2b7a;
        }
        .pos-Ptc {
            background: #f0e8db;
            color: #7a6b2b;
        }
        .pos-N\/V {
            background: #dbe8f0;
            color: #1f5a7a;
        }
        .pos-V-sep {
            background: #d4e8d4;
            color: #2d6b2d;
        }
        .pos-Det {
            background: #f0e0d0;
            color: #7a5a3a;
        }

        .details-toggle {
            margin-top: 1.2rem;
            background: none;
            border: 1px solid #d5cbbc;
            border-radius: 30px;
            padding: 0.5rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #4a4037;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
            align-self: flex-start;
            background: #faf8f5;
        }

        .details-toggle:hover {
            background: #e8e0d6;
            border-color: #b8aa98;
        }

        .details-toggle .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .details-toggle.active .arrow {
            transform: rotate(180deg);
        }

        .details-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
        }

        .details-content.open {
            max-height: 900px;
            opacity: 1;
            margin-top: 1.2rem;
        }

        .details-content .explanation {
            background: #f8f6f2;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #2c2c3a;
            border-left: 4px solid #d0c3b2;
            margin-bottom: 1rem;
        }

        .details-content .explanation strong {
            color: #1e1e2a;
        }

        .details-content .explanation .meaning-line {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e1e2a;
            background: #e8e0d6;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 0.4rem;
        }

        .dialogue-box {
            background: #f0f4f8;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.8;
        }

        .dialogue-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 0.3rem;
        }

        .dialogue-toggle-btn {
            background: #e8e0d6;
            border: none;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .dialogue-toggle-btn:hover {
            background: #d5cbbc;
        }

        .dialogue-box .speaker-a {
            color: #1f5a7a;
            font-weight: 600;
        }

        .dialogue-box .speaker-b {
            color: #3d6b2b;
            font-weight: 600;
        }

        .dialogue-box .line {
            margin-bottom: 0.2rem;
        }
        .dialogue-box .line:last-child {
            margin-bottom: 0;
        }

        .dialogue-box .zh {
            font-family: 'Noto Sans SC', sans-serif;
            margin-right: 0.3rem;
        }

        .dialogue-details {
            display: none;
            margin-left: 0.3rem;
        }

        .dialogue-details .pinyin-text {
            font-weight: 400;
            color: #6b5f52;
        }

        .dialogue-details .en-text {
            font-style: italic;
            color: #4a4037;
        }

        .dialogue-details .sep {
            color: #b8aa98;
            margin: 0 0.2rem;
        }

        .dialogue-box.show-translation .dialogue-details {
            display: inline;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1.1rem;
            color: #8f8172;
            background: #faf8f5;
            border-radius: 30px;
            border: 1px dashed #d5cbbc;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.8rem 3rem;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                border-radius: 28px;
                padding: 1rem 1.2rem;
                gap: 0.8rem;
            }
            .stats {
                text-align: center;
            }
            .search-box {
                padding: 0.1rem 0.1rem 0.1rem 1rem;
            }
            .search-box button {
                padding: 0.4rem 1rem;
                font-size: 0.8rem;
            }
            .vocab-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .vocab-card .char {
                font-size: 1.8rem;
            }
            .pinyin-global-toggle {
                justify-content: center;
            }
        }

        @media (min-width: 641px) and (max-width: 900px) {
            .vocab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 詞彙 <span>Level 3-2</span></h1>
            <div class="sub">Flashcard Mode · <strong>Click the Hanzi</strong> to reveal Pinyin</div>
            <div class="badge">🔍 Click the character to show pinyin · "Show Details" for meaning & dialogue</div>
        </div>

        <div class="toolbar">
            <div class="stats">
                <strong id="countDisplay">0</strong> words
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Chinese, Pinyin, or English..." autocomplete="off" />
                <button id="clearBtn">✕</button>
            </div>
            <button class="pinyin-global-toggle" id="pinyinGlobalToggle">
                <span class="icon">🔊</span>
                <span id="pinyinToggleLabel">Show All Pinyin</span>
            </button>
        </div>

        <div class="legend" id="legendContainer"></div>

        <div class="vocab-grid" id="vocabGrid"></div>
    </div>

    <script>
        // ------------------------------------------------------------
        // DATA — Level 3-2 Vocabulary (Traditional Hanzi)
        // ------------------------------------------------------------
        const vocabData = [{
            char: '寶貴',
            pinyin: 'bǎoguì',
            pos: 'Vs',
            en: 'Precious / Valuable',
            explanation: 'Describes something of great worth, such as time, experience, friendship, or resources. Often used to emphasize that something should be treasured.',
            dialogue: [
                { speaker: 'A', chinese: '時間很寶貴，別浪費。', pinyin: 'Shíjiān hěn bǎoguì, bié làngfèi.', english: 'Time is precious, don\'t waste it.' },
                { speaker: 'B', chinese: '你說得對，我會好好利用。', pinyin: 'Nǐ shuō de duì, wǒ huì hǎohǎo lìyòng.', english: 'You\'re right, I\'ll make good use of it.' }
            ]
        }, {
            char: '保守',
            pinyin: 'bǎoshōu',
            pos: 'Vs',
            en: 'Conservative',
            explanation: 'Describes a person who is traditional, cautious, and resistant to change. Can refer to attitudes, fashion, or political views.',
            dialogue: [
                { speaker: 'A', chinese: '他的想法很保守。', pinyin: 'Tā de xiǎngfǎ hěn bǎoshōu.', english: 'His way of thinking is very conservative.' },
                { speaker: 'B', chinese: '是啊，他不太接受新事物。', pinyin: 'Shì a, tā bù tài jiēshòu xīn shìwù.', english: 'Yeah, he doesn\'t really accept new things.' }
            ]
        }, {
            char: '保養',
            pinyin: 'bāoyǎng',
            pos: 'V',
            en: 'To maintain / To take care of',
            explanation: 'Refers to the act of maintaining something in good condition, such as a car, skin, health, or equipment. Can also mean "to preserve one\'s health."',
            dialogue: [
                { speaker: 'A', chinese: '你的皮膚保養得真好！', pinyin: 'Nǐ de pífū bāoyǎng de zhēn hǎo!', english: 'Your skin is so well-maintained!' },
                { speaker: 'B', chinese: '謝謝，我每天都擦保養品。', pinyin: 'Xièxie, wǒ měitiān dōu cā bāoyǎngpǐn.', english: 'Thanks, I apply skincare products every day.' }
            ]
        }, {
            char: '保證',
            pinyin: 'bǎozhèng',
            pos: 'N/V',
            en: 'Guarantee / To promise',
            explanation: 'Can be used as a noun meaning "guarantee" or as a verb meaning "to promise" or "to ensure." Often used in business, warranties, and everyday assurances.',
            dialogue: [
                { speaker: 'A', chinese: '你能保證產品品質嗎？', pinyin: 'Nǐ néng bǎozhèng chǎnpǐn pǐnzhì ma?', english: 'Can you guarantee the product quality?' },
                { speaker: 'B', chinese: '當然，我們有品質保證。', pinyin: 'Dāngrán, wǒmen yǒu pǐnzhì bǎozhèng.', english: 'Of course, we have a quality guarantee.' }
            ]
        }, {
            char: '抱',
            pinyin: 'bào',
            pos: 'V',
            en: 'To hold / To hug',
            explanation: 'A verb meaning to embrace, hold in one\'s arms, or carry. Used for hugging people, holding objects, or even figuratively "to hold" an opinion.',
            dialogue: [
                { speaker: 'A', chinese: '你可以抱一下這個孩子嗎？', pinyin: 'Nǐ kěyǐ bào yīxià zhège háizi ma?', english: 'Can you hold this child for a moment?' },
                { speaker: 'B', chinese: '好，他很可愛。', pinyin: 'Hǎo, tā hěn kě\'ài.', english: 'Sure, he\'s very cute.' }
            ]
        }, {
            char: '抱怨',
            pinyin: 'bàoyuàn',
            pos: 'V',
            en: 'To complain',
            explanation: 'To express dissatisfaction or grievances about something. Often used when someone is unhappy with a situation, person, or service.',
            dialogue: [
                { speaker: 'A', chinese: '他一直在抱怨天氣太熱。', pinyin: 'Tā yīzhí zài bàoyuàn tiānqì tài rè.', english: 'He keeps complaining that the weather is too hot.' },
                { speaker: 'B', chinese: '是啊，我也受不了了。', pinyin: 'Shì a, wǒ yě shòu bù liǎo le.', english: 'Yeah, I can\'t stand it either.' }
            ]
        }, {
            char: '報名',
            pinyin: 'bàomíng',
            pos: 'V-sep',
            en: 'To sign up / To register',
            explanation: 'A separable verb meaning to register or enroll for a course, competition, event, or activity. You can insert other words between 報 and 名 (e.g., 報了名).',
            dialogue: [
                { speaker: 'A', chinese: '你報名參加比賽了嗎？', pinyin: 'Nǐ bàomíng cānjiā bǐsài le ma?', english: 'Have you signed up for the competition?' },
                { speaker: 'B', chinese: '報了，昨天就報名了。', pinyin: 'Bào le, zuótiān jiù bàomíng le.', english: 'Yes, I signed up yesterday.' }
            ]
        }, {
            char: '把握',
            pinyin: 'bǎwò',
            pos: 'V',
            en: 'To grasp / To seize',
            explanation: 'To take hold of something firmly, either physically or figuratively. Often used with opportunities, time, or chances.',
            dialogue: [
                { speaker: 'A', chinese: '你要把握這個機會！', pinyin: 'Nǐ yào bǎwò zhège jīhuì!', english: 'You must seize this opportunity!' },
                { speaker: 'B', chinese: '我會的，我不想後悔。', pinyin: 'Wǒ huì de, wǒ bù xiǎng hòuhuǐ.', english: 'I will, I don\'t want to regret it.' }
            ]
        }, {
            char: '北方',
            pinyin: 'bēifāng',
            pos: 'N',
            en: 'The north',
            explanation: 'Refers to the northern region or direction. Commonly used in geography, weather reports, and cultural comparisons between northern and southern China.',
            dialogue: [
                { speaker: 'A', chinese: '北方冬天很冷。', pinyin: 'Bēifāng dōngtiān hěn lěng.', english: 'It\'s very cold in the north during winter.' },
                { speaker: 'B', chinese: '對，我喜歡南方的天氣。', pinyin: 'Duì, wǒ xǐhuān nánfāng de tiānqì.', english: 'Right, I prefer the weather in the south.' }
            ]
        }, {
            char: '被動',
            pinyin: 'bèidòng',
            pos: 'Vs',
            en: 'Passive',
            explanation: 'Describes a state where one is not taking initiative but rather reacting to external forces. The opposite of 主動 (active/proactive).',
            dialogue: [
                { speaker: 'A', chinese: '你不能一直這麼被動。', pinyin: 'Nǐ bùnéng yīzhí zhème bèidòng.', english: 'You can\'t always be so passive.' },
                { speaker: 'B', chinese: '你說得對，我應該主動一點。', pinyin: 'Nǐ shuō de duì, wǒ yīnggāi zhǔdòng yīdiǎn.', english: 'You\'re right, I should be more proactive.' }
            ]
        }, {
            char: '背後',
            pinyin: 'bèihòu',
            pos: 'N',
            en: 'Behind / At the back',
            explanation: 'Refers to the physical back side of something, or figuratively "behind the scenes" or "secretly." Often used to describe hidden motives or support.',
            dialogue: [
                { speaker: 'A', chinese: '他站在門背後。', pinyin: 'Tā zhàn zài mén bèihòu.', english: 'He is standing behind the door.' },
                { speaker: 'B', chinese: '我沒看到他，難怪。', pinyin: 'Wǒ méi kàndào tā, nánguài.', english: 'I didn\'t see him, no wonder.' }
            ]
        }, {
            char: '背景',
            pinyin: 'bèijǐng',
            pos: 'N',
            en: 'Background',
            explanation: 'Refers to a person\'s family, education, work history, or the contextual setting of an event or picture. Used in both personal and professional contexts.',
            dialogue: [
                { speaker: 'A', chinese: '他的家庭背景很好。', pinyin: 'Tā de jiātíng bèijǐng hěn hǎo.', english: 'He has a good family background.' },
                { speaker: 'B', chinese: '是啊，他爸媽都是教授。', pinyin: 'Shì a, tā bàmā dōu shì jiàoshòu.', english: 'Yeah, both his parents are professors.' }
            ]
        }, {
            char: '輩子',
            pinyin: 'bèizi',
            pos: 'N',
            en: 'Lifetime',
            explanation: 'A noun meaning "a lifetime." Often used in expressions like "一輩子" (a whole lifetime) to emphasize the duration of a commitment or experience.',
            dialogue: [
                { speaker: 'A', chinese: '我一輩子都不會忘記你。', pinyin: 'Wǒ yībèizi dōu bùhuì wàngjì nǐ.', english: 'I will never forget you in my lifetime.' },
                { speaker: 'B', chinese: '我也是，你永遠是我最好的朋友。', pinyin: 'Wǒ yě shì, nǐ yǒngyuǎn shì wǒ zuìhǎo de péngyou.', english: 'Me too, you\'ll always be my best friend.' }
            ]
        }, {
            char: '本',
            pinyin: 'běn',
            pos: 'Det',
            en: 'This / Our (determiner)',
            explanation: 'A determiner meaning "this" or "our" when referring to a specific item, document, or organization. Also a measure word for books.',
            dialogue: [
                { speaker: 'A', chinese: '本公司有新的規定。', pinyin: 'Běn gōngsī yǒu xīn de guīdìng.', english: 'Our company has new regulations.' },
                { speaker: 'B', chinese: '請告訴我是什麼。', pinyin: 'Qǐng gàosu wǒ shì shénme.', english: 'Please tell me what they are.' }
            ]
        }, {
            char: '本人',
            pinyin: 'běnrén',
            pos: 'N',
            en: 'Oneself / I (formal)',
            explanation: 'A formal or official way to refer to oneself, often used in documents, applications, or formal speeches. It emphasizes the person themselves.',
            dialogue: [
                { speaker: 'A', chinese: '本人同意這份合約。', pinyin: 'Běnrén tóngyì zhè fèn héyuē.', english: 'I (myself) agree to this contract.' },
                { speaker: 'B', chinese: '請在這邊簽名。', pinyin: 'Qǐng zài zhèbiān qiānmíng.', english: 'Please sign here.' }
            ]
        }, {
            char: '逼',
            pinyin: 'bī',
            pos: 'V',
            en: 'To force / To compel',
            explanation: 'To pressure or compel someone to do something against their will. Often used in contexts of coercion, urgency, or extreme situations.',
            dialogue: [
                { speaker: 'A', chinese: '你不要逼我做決定。', pinyin: 'Nǐ bùyào bī wǒ zuò juédìng.', english: 'Don\'t force me to make a decision.' },
                { speaker: 'B', chinese: '好吧，你再考慮一下。', pinyin: 'Hǎo ba, nǐ zài kǎolǜ yīxià.', english: 'Alright, think it over some more.' }
            ]
        }, {
            char: '筆',
            pinyin: 'bǐ',
            pos: 'M',
            en: 'Measure word for pens / writing',
            explanation: 'A measure word used for items with handles or writing instruments like pens, pencils, and brushes. Also used for sums of money or transactions.',
            dialogue: [
                { speaker: 'A', chinese: '請給我一枝筆。', pinyin: 'Qǐng gěi wǒ yī zhī bǐ.', english: 'Please give me a pen.' },
                { speaker: 'B', chinese: '給你，還有紙。', pinyin: 'Gěi nǐ, hái yǒu zhǐ.', english: 'Here you go, and some paper too.' }
            ]
        }, {
            char: '比',
            pinyin: 'bǐ',
            pos: 'V',
            en: 'To compare / Than',
            explanation: 'Used to compare two things. In the structure "A 比 B + adjective," it means "A is more [adjective] than B." Also used as a verb meaning "to compare."',
            dialogue: [
                { speaker: 'A', chinese: '今天比昨天熱多了。', pinyin: 'Jīntiān bǐ zuótiān rè duō le.', english: 'Today is much hotter than yesterday.' },
                { speaker: 'B', chinese: '對，我快熱死了。', pinyin: 'Duì, wǒ kuài rè sǐ le.', english: 'Right, I\'m dying of heat.' }
            ]
        }];

        // ------------------------------------------------------------
        // RENDER ENGINE
        // ------------------------------------------------------------
        const grid = document.getElementById('vocabGrid');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const countDisplay = document.getElementById('countDisplay');
        const legendContainer = document.getElementById('legendContainer');
        const pinyinGlobalToggle = document.getElementById('pinyinGlobalToggle');
        const pinyinToggleLabel = document.getElementById('pinyinToggleLabel');

        let globalPinyinRevealed = false;

        // Legend
        const posSet = new Set(vocabData.map(d => d.pos));
        const posLabels = {
            'N': 'Noun',
            'V': 'Verb',
            'Vs': 'Stative Verb',
            'Vst': 'Stative/Transitive Verb',
            'Adv': 'Adverb',
            'Prep': 'Preposition',
            'M': 'Measure Word',
            'Ptc': 'Particle',
            'N/V': 'Noun / Verb',
            'V-sep': 'Separable Verb',
            'Det': 'Determiner'
        };
        const dotColorMap = {
            'N': '#7ba9c9',
            'V': '#7fb06a',
            'Vs': '#5ba884',
            'Vst': '#5ba884',
            'Adv': '#c9a86a',
            'Prep': '#c97a9a',
            'M': '#9a7ac9',
            'Ptc': '#c9b86a',
            'N/V': '#7ba9c9',
            'V-sep': '#6ab06a',
            'Det': '#d4a87a'
        };

        function buildLegend() {
            const sorted = Array.from(posSet).sort();
            let html = '';
            sorted.forEach(label => {
                const display = posLabels[label] || label;
                const color = dotColorMap[label] || '#b8aa98';
                html += `<span class="legend-item"><span class="legend-dot" style="background:${color};"></span>${display}</span>`;
            });
            legendContainer.innerHTML = html;
        }
        buildLegend();

        // Render function
        function render(filter = '') {
            const term = filter.trim().toLowerCase();
            let filtered = vocabData;

            if (term) {
                filtered = vocabData.filter(item => {
                    let dialogueSearch = '';
                    item.dialogue.forEach(line => {
                        dialogueSearch += line.chinese + ' ' + line.pinyin + ' ' + line.english + ' ';
                    });
                    const searchable = item.char + ' ' + item.pinyin + ' ' + item.en + ' ' + item.explanation + ' ' + dialogueSearch;
                    return searchable.toLowerCase().includes(term);
                });
            }

            countDisplay.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty">🔍 No matches found.</div>`;
                return;
            }

            let html = '';
            filtered.forEach((item, index) => {
                const posClass = 'pos-' + item.pos.replace('/', '-');
                const posDisplay = posLabels[item.pos] || item.pos;

                // Build dialogue HTML
                let dialogueHtml = '';
                dialogueHtml += `
                        <div class="dialogue-toggle-wrapper">
                            <strong>💬 Dialogue:</strong>
                            <button class="dialogue-toggle-btn" data-dialogue-idx="${index}">Show Pinyin & Translation</button>
                        </div>
                        <div class="dialogue-lines">
                    `;

                item.dialogue.forEach(line => {
                    const speakerClass = line.speaker === 'A' ? 'speaker-a' : 'speaker-b';
                    dialogueHtml += `
                            <div class="line">
                                <span class="${speakerClass}">${line.speaker}:</span>
                                <span class="zh">${line.chinese}</span>
                                <span class="dialogue-details">
                                    <span class="sep">·</span>
                                    <span class="pinyin-text">${line.pinyin}</span>
                                    <span class="sep">·</span>
                                    <span class="en-text">${line.english}</span>
                                </span>
                            </div>
                        `;
                });

                dialogueHtml += `</div>`;

                html += `
                        <div class="vocab-card" data-index="${index}">
                            <div class="char-row">
                                <span class="char">${item.char}</span>
                                <span class="pinyin-container" data-pinyin="${item.pinyin}" data-revealed="false">
                                    <span class="pinyin-value">${item.pinyin}</span>
                                </span>
                            </div>
                            <span class="pos ${posClass}">${posDisplay}</span>

                            <button class="details-toggle" data-target="details-${index}">
                                <span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)
                            </button>

                            <div id="details-${index}" class="details-content">
                                <div class="explanation">
                                    <div class="meaning-line">📘 ${item.en}</div>
                                    <br />
                                    <strong>📖 Usage:</strong> ${item.explanation}
                                </div>
                                <div class="dialogue-box" id="dialogue-box-${index}">
                                    ${dialogueHtml}
                                </div>
                            </div>
                        </div>
                    `;
            });

            grid.innerHTML = html;

            // ---- Click on the Hanzi toggles its pinyin ----
            document.querySelectorAll('.char').forEach(charEl => {
                charEl.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const row = this.closest('.char-row');
                    const pinyinContainer = row ? row.querySelector('.pinyin-container') : null;
                    if (!pinyinContainer) return;
                    const isRevealed = pinyinContainer.dataset.revealed === 'true';
                    const newState = !isRevealed;
                    pinyinContainer.dataset.revealed = newState ? 'true' : 'false';
                    pinyinContainer.classList.toggle('revealed', newState);
                });
            });

            // ---- Apply global state to all pinyin containers ----
            document.querySelectorAll('.pinyin-container').forEach(el => {
                const shouldReveal = globalPinyinRevealed;
                el.dataset.revealed = shouldReveal ? 'true' : 'false';
                el.classList.toggle('revealed', shouldReveal);
            });

            // ---- Toggle main details (Meaning/Explanation) ----
            document.querySelectorAll('.details-toggle').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const targetId = this.dataset.target;
                    const content = document.getElementById(targetId);
                    if (!content) return;

                    const isOpen = content.classList.contains('open');
                    if (isOpen) {
                        content.classList.remove('open');
                        this.classList.remove('active');
                        this.innerHTML = '<span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)';
                    } else {
                        content.classList.add('open');
                        this.classList.add('active');
                        this.innerHTML = '<span class="arrow">▲</span> Hide Details';
                    }
                });
            });

            // ---- Toggle dialogue pinyin/translation ----
            document.querySelectorAll('.dialogue-toggle-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = this.dataset.dialogueIdx;
                    const dialogueBox = document.getElementById(`dialogue-box-${idx}`);
                    if (!dialogueBox) return;

                    const isShowing = dialogueBox.classList.contains('show-translation');
                    if (isShowing) {
                        dialogueBox.classList.remove('show-translation');
                        this.textContent = 'Show Pinyin & Translation';
                    } else {
                        dialogueBox.classList.add('show-translation');
                        this.textContent = 'Hide Pinyin & Translation';
                    }
                });
            });

            updateGlobalToggleLabel();
        }

        // ---- Global Pinyin Toggle ----
        function updateGlobalToggleLabel() {
            if (globalPinyinRevealed) {
                pinyinToggleLabel.textContent = 'Hide All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔓';
            } else {
                pinyinToggleLabel.textContent = 'Show All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔊';
            }
        }

        pinyinGlobalToggle.addEventListener('click', function() {
            globalPinyinRevealed = !globalPinyinRevealed;
            document.querySelectorAll('.pinyin-container').forEach(el => {
                el.dataset.revealed = globalPinyinRevealed ? 'true' : 'false';
                el.classList.toggle('revealed', globalPinyinRevealed);
            });
            updateGlobalToggleLabel();
        });

        // ---- Search & Clear ----
        searchInput.addEventListener('input', () => render(searchInput.value));
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            render('');
            searchInput.focus();
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') clearBtn.click();
        });

        // ---- Initial render ----
        render('');
    </script>
</body>
</html>
