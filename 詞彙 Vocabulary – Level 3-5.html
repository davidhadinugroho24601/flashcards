<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 3-5 Flashcards (Click Hanzi for Pinyin)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: #f4f2ef;
            min-height: 100vh;
            padding: 2rem 1.5rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #1e1e2a;
        }

        .header h1 span {
            background: #d9c9b4;
            padding: 0.1rem 0.8rem;
            border-radius: 12px;
            color: #2c2c3a;
        }

        .header .sub {
            font-size: 1rem;
            color: #6b5f52;
            margin-top: 0.3rem;
            font-weight: 400;
        }

        .header .badge {
            display: inline-block;
            margin-top: 0.6rem;
            background: #2c2c3a;
            color: white;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            background: #ffffffd9;
            backdrop-filter: blur(6px);
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 2.2rem;
            border: 1px solid #e8e0d6;
        }

        .stats {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c2c3a;
            white-space: nowrap;
        }

        .stats strong {
            background: #ece6de;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-weight: 600;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f3efe9;
            padding: 0.1rem 0.1rem 0.1rem 1.2rem;
            border-radius: 40px;
            transition: 0.2s;
            border: 1px solid transparent;
            flex: 1;
            min-width: 180px;
        }

        .search-box:focus-within {
            background: #ffffff;
            border-color: #b8aa98;
            box-shadow: 0 0 0 3px rgba(184, 170, 152, 0.2);
        }

        .search-box input {
            border: none;
            background: transparent;
            font-size: 0.9rem;
            padding: 0.5rem 0;
            width: 100%;
            outline: none;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #1e1e2a;
        }

        .search-box input::placeholder {
            color: #a89b8c;
            font-weight: 400;
        }

        .search-box button {
            background: #2c2c3a;
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .search-box button:hover {
            background: #1a1a26;
        }

        .pinyin-global-toggle {
            background: #ece6de;
            border: 1px solid #d5cbbc;
            border-radius: 40px;
            padding: 0.3rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .pinyin-global-toggle:hover {
            background: #d5cbbc;
            border-color: #b8aa98;
        }

        .pinyin-global-toggle .icon {
            font-size: 1rem;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.2rem;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 0.6rem 1.2rem;
            background: #ffffffd9;
            border-radius: 40px;
            border: 1px solid #e8e0d6;
            font-size: 0.75rem;
            font-weight: 500;
            color: #2c2c3a;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .vocab-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid #ebe5dd;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .vocab-card:hover {
            border-color: #d0c3b2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .vocab-card .char-row {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.2rem;
        }

        .vocab-card .char {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1e1e2a;
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.2;
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease;
            padding: 0.1rem 0.4rem;
            border-radius: 8px;
            user-select: none;
        }

        .vocab-card .char:hover {
            color: #4a3f33;
            background: #f0ebe4;
        }

        .vocab-card .char:active {
            transform: scale(0.95);
        }

        .pinyin-container {
            display: inline-flex;
            align-items: center;
            min-width: 2.2rem;
            justify-content: center;
        }

        .pinyin-container .pinyin-value {
            font-size: 1rem;
            color: #6b5f52;
            font-weight: 400;
            letter-spacing: 0.3px;
            display: none;
        }

        .pinyin-container.revealed .pinyin-value {
            display: inline;
        }

        .vocab-card .pos {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            align-self: flex-start;
            margin-top: 0.6rem;
            background: #f0ebe4;
            color: #4a4037;
        }

        .pos-N {
            background: #dbe9f0;
            color: #1f5a7a;
        }
        .pos-V {
            background: #e6f0db;
            color: #3d6b2b;
        }
        .pos-Vs {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Vst {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Adv {
            background: #f0e6db;
            color: #7a5a2b;
        }
        .pos-Prep {
            background: #f0dbe6;
            color: #7a2b4a;
        }
        .pos-M {
            background: #e6dbf0;
            color: #4a2b7a;
        }
        .pos-Ptc {
            background: #f0e8db;
            color: #7a6b2b;
        }
        .pos-N\/V {
            background: #dbe8f0;
            color: #1f5a7a;
        }
        .pos-Conj {
            background: #f0e0d0;
            color: #7a5a3a;
        }
        .pos-Det {
            background: #f0d4d4;
            color: #7a3a3a;
        }
        .pos-V-sep {
            background: #d4e8d4;
            color: #2d6b2d;
        }
        .pos-Vi {
            background: #d4e0e0;
            color: #2d5a5a;
        }
        .pos-Vpt {
            background: #d4d8e8;
            color: #3a4a7a;
        }
        .pos-Vs-attr {
            background: #d0e0d0;
            color: #2d6b3d;
        }

        .details-toggle {
            margin-top: 1.2rem;
            background: none;
            border: 1px solid #d5cbbc;
            border-radius: 30px;
            padding: 0.5rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #4a4037;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
            align-self: flex-start;
            background: #faf8f5;
        }

        .details-toggle:hover {
            background: #e8e0d6;
            border-color: #b8aa98;
        }

        .details-toggle .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .details-toggle.active .arrow {
            transform: rotate(180deg);
        }

        .details-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
        }

        .details-content.open {
            max-height: 900px;
            opacity: 1;
            margin-top: 1.2rem;
        }

        .details-content .explanation {
            background: #f8f6f2;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #2c2c3a;
            border-left: 4px solid #d0c3b2;
            margin-bottom: 1rem;
        }

        .details-content .explanation strong {
            color: #1e1e2a;
        }

        .details-content .explanation .meaning-line {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e1e2a;
            background: #e8e0d6;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 0.4rem;
        }

        .dialogue-box {
            background: #f0f4f8;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.8;
        }

        .dialogue-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 0.3rem;
        }

        .dialogue-toggle-btn {
            background: #e8e0d6;
            border: none;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .dialogue-toggle-btn:hover {
            background: #d5cbbc;
        }

        .dialogue-box .speaker-a {
            color: #1f5a7a;
            font-weight: 600;
        }

        .dialogue-box .speaker-b {
            color: #3d6b2b;
            font-weight: 600;
        }

        .dialogue-box .line {
            margin-bottom: 0.2rem;
        }
        .dialogue-box .line:last-child {
            margin-bottom: 0;
        }

        .dialogue-box .zh {
            font-family: 'Noto Sans SC', sans-serif;
            margin-right: 0.3rem;
        }

        .dialogue-details {
            display: none;
            margin-left: 0.3rem;
        }

        .dialogue-details .pinyin-text {
            font-weight: 400;
            color: #6b5f52;
        }

        .dialogue-details .en-text {
            font-style: italic;
            color: #4a4037;
        }

        .dialogue-details .sep {
            color: #b8aa98;
            margin: 0 0.2rem;
        }

        .dialogue-box.show-translation .dialogue-details {
            display: inline;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1.1rem;
            color: #8f8172;
            background: #faf8f5;
            border-radius: 30px;
            border: 1px dashed #d5cbbc;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.8rem 3rem;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                border-radius: 28px;
                padding: 1rem 1.2rem;
                gap: 0.8rem;
            }
            .stats {
                text-align: center;
            }
            .search-box {
                padding: 0.1rem 0.1rem 0.1rem 1rem;
            }
            .search-box button {
                padding: 0.4rem 1rem;
                font-size: 0.8rem;
            }
            .vocab-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .vocab-card .char {
                font-size: 1.8rem;
            }
            .pinyin-global-toggle {
                justify-content: center;
            }
        }

        @media (min-width: 641px) and (max-width: 900px) {
            .vocab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 詞彙 <span>Level 3-5</span></h1>
            <div class="sub">Flashcard Mode · <strong>Click the Hanzi</strong> to reveal Pinyin</div>
            <div class="badge">🔍 Click the character to show pinyin · "Show Details" for meaning & dialogue</div>
        </div>

        <div class="toolbar">
            <div class="stats">
                <strong id="countDisplay">0</strong> words
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Chinese, Pinyin, or English..." autocomplete="off" />
                <button id="clearBtn">✕</button>
            </div>
            <button class="pinyin-global-toggle" id="pinyinGlobalToggle">
                <span class="icon">🔊</span>
                <span id="pinyinToggleLabel">Show All Pinyin</span>
            </button>
        </div>

        <div class="legend" id="legendContainer"></div>

        <div class="vocab-grid" id="vocabGrid"></div>
    </div>

    <script>
        // ------------------------------------------------------------
        // DATA — Level 3-5 Vocabulary (Traditional Hanzi)
        // ------------------------------------------------------------
        const vocabData = [{
            char: '差別',
            pinyin: 'chābié',
            pos: 'N',
            en: 'Difference',
            explanation: 'Refers to the distinction or disparity between two or more things, often in quality, quantity, or nature.',
            dialogue: [
                { speaker: 'A', chinese: '這兩種產品的差別很大。', pinyin: 'Zhè liǎng zhǒng chǎnpǐn de chābié hěn dà.', english: 'The difference between these two products is big.' },
                { speaker: 'B', chinese: '對，價格和質量都不一樣。', pinyin: 'Duì, jiàgé hé zhìliàng dōu bù yīyàng.', english: 'Yes, both price and quality are different.' }
            ]
        }, {
            char: '嘗試',
            pinyin: 'chángshì',
            pos: 'V',
            en: 'To attempt / To try',
            explanation: 'To make an effort to do something new or challenging, often with the possibility of failure. Used for both actions and experiences.',
            dialogue: [
                { speaker: 'A', chinese: '我想嘗試學做菜。', pinyin: 'Wǒ xiǎng chángshì xué zuò cài.', english: 'I want to try learning to cook.' },
                { speaker: 'B', chinese: '好啊，我教你。', pinyin: 'Hǎo a, wǒ jiāo nǐ.', english: 'Great, I\'ll teach you.' }
            ]
        }, {
            char: '產品',
            pinyin: 'chǎnpǐn',
            pos: 'N',
            en: 'Product',
            explanation: 'Any item, good, or service that is produced, often for sale. Used in business and manufacturing contexts.',
            dialogue: [
                { speaker: 'A', chinese: '你們公司的主要產品是什麼？', pinyin: 'Nǐmen gōngsī de zhǔyào chǎnpǐn shì shénme?', english: 'What is your company\'s main product?' },
                { speaker: 'B', chinese: '我們生產電子產品。', pinyin: 'Wǒmen shēngchǎn diànzǐ chǎnpǐn.', english: 'We produce electronic products.' }
            ]
        }, {
            char: '產生',
            pinyin: 'chǎnshēng',
            pos: 'Vpt',
            en: 'To produce / To generate',
            explanation: 'To cause something to come into existence, such as an effect, result, or new substance. Often used in scientific or social contexts.',
            dialogue: [
                { speaker: 'A', chinese: '這個問題產生了很大的影響。', pinyin: 'Zhège wèntí chǎnshēng le hěn dà de yǐngxiǎng.', english: 'This issue has generated a huge impact.' },
                { speaker: 'B', chinese: '我們需要趕快解決。', pinyin: 'Wǒmen xūyào gǎnkuài jiějué.', english: 'We need to solve it quickly.' }
            ]
        }, {
            char: '超過',
            pinyin: 'chāoguò',
            pos: 'Vpt',
            en: 'To exceed / To surpass',
            explanation: 'To go beyond a limit, expectation, or another person\'s achievement. Used in comparisons of quantity, time, or performance.',
            dialogue: [
                { speaker: 'A', chinese: '他的成績超過了我的期望。', pinyin: 'Tā de chéngjī chāoguò le wǒ de qīwàng.', english: 'His grades exceeded my expectations.' },
                { speaker: 'B', chinese: '他真的很努力。', pinyin: 'Tā zhēn de hěn nǔlì.', english: 'He really worked hard.' }
            ]
        }, {
            char: '超級',
            pinyin: 'chāojí',
            pos: 'Vs-attr',
            en: 'Super / Ultra',
            explanation: 'An attributive stative verb meaning "super" or "ultra," used to emphasize a very high degree or level. Often used as a prefix (超級市場 = supermarket).',
            dialogue: [
                { speaker: 'A', chinese: '這個超級電腦很快。', pinyin: 'Zhège chāojí diànnǎo hěn kuài.', english: 'This supercomputer is very fast.' },
                { speaker: 'B', chinese: '我們需要它來處理數據。', pinyin: 'Wǒmen xūyào tā lái chǔlǐ shùjù.', english: 'We need it to process data.' }
            ]
        }, {
            char: '吵架',
            pinyin: 'chǎojià',
            pos: 'V-sep',
            en: 'To quarrel / To argue',
            explanation: 'A separable verb meaning to have a heated argument or fight with someone. Often over disagreements or misunderstandings.',
            dialogue: [
                { speaker: 'A', chinese: '他們為什麼吵架？', pinyin: 'Tāmen wèishénme chǎojià?', english: 'Why are they arguing?' },
                { speaker: 'B', chinese: '因為一件小事，沒什麼。', pinyin: 'Yīnwèi yī jiàn xiǎo shì, méi shénme.', english: 'Over a small thing, nothing serious.' }
            ]
        }, {
            char: '差異',
            pinyin: 'chāyì',
            pos: 'N',
            en: 'Difference / Disparity',
            explanation: 'Similar to 差別, but often used for more statistical or measurable differences, or cultural differences.',
            dialogue: [
                { speaker: 'A', chinese: '東西方的文化差異很大。', pinyin: 'Dōngxīfāng de wénhuà chāyì hěn dà.', english: 'The cultural differences between East and West are big.' },
                { speaker: 'B', chinese: '是的，語言和習慣都不同。', pinyin: 'Shì de, yǔyán hé xíguàn dōu bùtóng.', english: 'Yes, language and customs are different.' }
            ]
        }, {
            char: '車禍',
            pinyin: 'chēhuò',
            pos: 'N',
            en: 'Car accident',
            explanation: 'A traffic accident involving vehicles. Can be used for collisions, injuries, or damage caused by cars.',
            dialogue: [
                { speaker: 'A', chinese: '昨天發生了一起車禍。', pinyin: 'Zuótiān fāshēng le yīqǐ chēhuò.', english: 'There was a car accident yesterday.' },
                { speaker: 'B', chinese: '有人受傷嗎？', pinyin: 'Yǒu rén shòushāng ma?', english: 'Was anyone injured?' }
            ]
        }, {
            char: '趁',
            pinyin: 'chèn',
            pos: 'Prep',
            en: 'To take advantage of (a time/opportunity)',
            explanation: 'A preposition used to indicate that you do something while a certain condition exists, often to seize an opportunity or avoid missing a chance.',
            dialogue: [
                { speaker: 'A', chinese: '趁天氣好，我們去散步吧。', pinyin: 'Chèn tiānqì hǎo, wǒmen qù sànbù ba.', english: 'While the weather is good, let\'s go for a walk.' },
                { speaker: 'B', chinese: '好主意！', pinyin: 'Hǎo zhǔyi!', english: 'Good idea!' }
            ]
        }, {
            char: '襯衫',
            pinyin: 'chènshān',
            pos: 'N',
            en: 'Shirt (usually dress shirt)',
            explanation: 'A type of formal or casual upper garment with a collar, buttons, and often long sleeves. A staple in wardrobes.',
            dialogue: [
                { speaker: 'A', chinese: '我買了一件新襯衫。', pinyin: 'Wǒ mǎi le yī jiàn xīn chènshān.', english: 'I bought a new shirt.' },
                { speaker: 'B', chinese: '什麼顏色？', pinyin: 'Shénme yánsè?', english: 'What color?' }
            ]
        }, {
            char: '成',
            pinyin: 'chéng',
            pos: 'Vpt',
            en: 'To become / To succeed',
            explanation: 'A versatile verb meaning "to become," "to turn into," or "to succeed." Often used with complements to indicate a result or change.',
            dialogue: [
                { speaker: 'A', chinese: '他終於成了有名的畫家。', pinyin: 'Tā zhōngyú chéng le yǒumíng de huàjiā.', english: 'He finally became a famous painter.' },
                { speaker: 'B', chinese: '太好了，他為此努力了很久。', pinyin: 'Tài hǎo le, tā wèicǐ nǔlì le hěn jiǔ.', english: 'Great, he worked hard for it.' }
            ]
        }, {
            char: '成果',
            pinyin: 'chéngguǒ',
            pos: 'N',
            en: 'Result / Achievement',
            explanation: 'The positive outcome or fruit of one\'s efforts, often used in academic, research, or work contexts.',
            dialogue: [
                { speaker: 'A', chinese: '我們的研發成果很成功。', pinyin: 'Wǒmen de yánfā chéngguǒ hěn chénggōng.', english: 'Our R&D results are very successful.' },

        }, {

                { speaker: 'B', chinese: '我承認，我錯了。', pinyin: 'Wǒ chéngrèn, wǒ cuò le.', english: 'I admit, I was wrong.' }

        }, {
            char: '誠實',
            pinyin: 'chéngshí',
            pos: 'Vs',
            en: 'Honest',
            explanation: 'Describes a person who is truthful, sincere, and trustworthy. Valued in both personal and professional relationships.',
            dialogue: [
                { speaker: 'A', chinese: '誠實是很重要的品質。', pinyin: 'Chéngshí shì hěn zhòngyào de pǐnzhì.', english: 'Honesty is a very important quality.' },
                { speaker: 'B', chinese: '對，我從小就學誠實。', pinyin: 'Duì, wǒ cóngxiǎo jiù xué chéngshí.', english: 'Yes, I learned honesty from childhood.' }
            ]
        }, {
            char: '成熟',
            pinyin: 'chéngshú',
            pos: 'Vs',
            en: 'Mature / Ripe',
            explanation: 'Describes a person who is emotionally or mentally developed, or fruit that is ready to eat. Also used for ideas that are fully developed.',
            dialogue: [
                { speaker: 'A', chinese: '他的想法很成熟。', pinyin: 'Tā de xiǎngfǎ hěn chéngshú.', english: 'His way of thinking is mature.' },
                { speaker: 'B', chinese: '對，他考慮得很周全。', pinyin: 'Duì, tā kǎolǜ de hěn zhōuquán.', english: 'Yes, he thinks very thoroughly.' }
            ]
        }, {
            char: '成長',
            pinyin: 'chéngzhǎng',
            pos: 'Vs',
            en: 'To grow up / To develop',
            explanation: 'Refers to the process of growing physically, emotionally, or professionally. Used for people, plants, or organizations.',
            dialogue: [
                { speaker: 'A', chinese: '孩子在成長過程中需要關愛。', pinyin: 'Háizi zài chéngzhǎng guòchéng zhōng xūyào guān\'ài.', english: 'Children need love and care during their growing process.' },
                { speaker: 'B', chinese: '父母的支持很重要。', pinyin: 'Fùmǔ de zhīchí hěn zhòngyào.', english: 'Parental support is very important.' }
            ]
        }, {
            char: '尺',
            pinyin: 'chǐ',
            pos: 'M',
            en: 'Measure word for rulers / feet',
            explanation: 'A measure word for things like rulers, but also a unit of length (approx. 1/3 meter). Used in measurements and objects with a linear shape.',
            dialogue: [
                { speaker: 'A', chinese: '請給我一枝尺子。', pinyin: 'Qǐng gěi wǒ yī zhī chǐzi.', english: 'Please give me a ruler.' },
                { speaker: 'B', chinese: '給你，要量什麼？', pinyin: 'Gěi nǐ, yào liáng shénme?', english: 'Here you go, what do you need to measure?' }
            ]
        }, {
            char: '吃喝玩樂',
            pinyin: 'chīhēwánlè',
            pos: 'Vi',
            en: 'To eat, drink, play, and have fun',
            explanation: 'An idiom describing a carefree lifestyle of enjoying food, drinks, and entertainment. Often used in a lighthearted context.',
            dialogue: [
                { speaker: 'A', chinese: '週末我們去吃喝玩樂吧！', pinyin: 'Zhōumò wǒmen qù chīhēwánlè ba!', english: 'Let\'s go eat, drink, and have fun this weekend!' },
                { speaker: 'B', chinese: '好主意，我知道一家好餐廳。', pinyin: 'Hǎo zhǔyi, wǒ zhīdào yī jiā hǎo cāntīng.', english: 'Good idea, I know a good restaurant.' }
            ]
        }, {
            char: '蟲(子)',
            pinyin: 'chóng(zi)',
            pos: 'N',
            en: 'Bug / Insect',
            explanation: 'A general term for small crawling or flying creatures, often insects. The 子 is optional in everyday speech.',
            dialogue: [
                { speaker: 'A', chinese: '花園裡有很多蟲子。', pinyin: 'Huāyuán lǐ yǒu hěnduō chóngzi.', english: 'There are many bugs in the garden.' },
                { speaker: 'B', chinese: '我們需要噴殺蟲劑。', pinyin: 'Wǒmen xūyào pēn shāchóngjì.', english: 'We need to spray insecticide.' }
            ]
        }, {
            char: '充實',
            pinyin: 'chōngshí',
            pos: 'Vs',
            en: 'Substantial / Enriched',
            explanation: 'Describes a life or experience that is full, meaningful, and not empty. Can also mean to enrich or make something more substantial.',
            dialogue: [
                { speaker: 'A', chinese: '他的生活很充實。', pinyin: 'Tā de shēnghuó hěn chōngshí.', english: 'His life is very fulfilling.' },
                { speaker: 'B', chinese: '因為他有很多興趣愛好。', pinyin: 'Yīnwèi tā yǒu hěnduō xìngqù àihào.', english: 'Because he has many hobbies.' }
            ]
        }, {
            char: '重新',
            pinyin: 'chóngxīn',
            pos: 'Adv',
            en: 'Again / Anew',
            explanation: 'An adverb indicating that an action is done once more from the beginning, often with a fresh start or after an interruption.',
            dialogue: [
                { speaker: 'A', chinese: '我們需要重新規劃這個項目。', pinyin: 'Wǒmen xūyào chóngxīn guīhuà zhège xiàngmù.', english: 'We need to plan this project anew.' },
                { speaker: 'B', chinese: '好的，讓我們重新開始。', pinyin: 'Hǎo de, ràng wǒmen chóngxīn kāishǐ.', english: 'OK, let\'s start over.' }
            ]
        }, {
            char: '醜',
            pinyin: 'chǒu',
            pos: 'Vs',
            en: 'Ugly',
            explanation: 'Describes something that is unpleasant to look at. Also used metaphorically for ugly behavior or scandals.',
            dialogue: [
                { speaker: 'A', chinese: '那件衣服的顏色很醜。', pinyin: 'Nà jiàn yīfu de yánsè hěn chǒu.', english: 'The color of that dress is ugly.' },
                { speaker: 'B', chinese: '對，我不喜歡。', pinyin: 'Duì, wǒ bù xǐhuān.', english: 'Yes, I don\'t like it.' }
            ]
        }];

        // ------------------------------------------------------------
        // RENDER ENGINE
        // ------------------------------------------------------------
        const grid = document.getElementById('vocabGrid');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const countDisplay = document.getElementById('countDisplay');
        const legendContainer = document.getElementById('legendContainer');
        const pinyinGlobalToggle = document.getElementById('pinyinGlobalToggle');
        const pinyinToggleLabel = document.getElementById('pinyinToggleLabel');

        let globalPinyinRevealed = false;

        // Legend
        const posSet = new Set(vocabData.map(d => d.pos));
        const posLabels = {
            'N': 'Noun',
            'V': 'Verb',
            'Vs': 'Stative Verb',
            'Vst': 'Stative/Transitive Verb',
            'Adv': 'Adverb',
            'Prep': 'Preposition',
            'M': 'Measure Word',
            'Ptc': 'Particle',
            'N/V': 'Noun / Verb',
            'Conj': 'Conjunction',
            'Det': 'Determiner',
            'V-sep': 'Separable Verb',
            'Vi': 'Intransitive Verb',
            'Vpt': 'Verb Particle (Trans.)',
            'Vs-attr': 'Attributive Stative Verb'
        };
        const dotColorMap = {
            'N': '#7ba9c9',
            'V': '#7fb06a',
            'Vs': '#5ba884',
            'Vst': '#5ba884',
            'Adv': '#c9a86a',
            'Prep': '#c97a9a',
            'M': '#9a7ac9',
            'Ptc': '#c9b86a',
            'N/V': '#7ba9c9',
            'Conj': '#f0d0b0',
            'Det': '#f0b0b0',
            'V-sep': '#6ab06a',
            'Vi': '#6a9a9a',
            'Vpt': '#6a7ab0',
            'Vs-attr': '#80b080'
        };

        function buildLegend() {
            const sorted = Array.from(posSet).sort();
            let html = '';
            sorted.forEach(label => {
                const display = posLabels[label] || label;
                const color = dotColorMap[label] || '#b8aa98';
                html += `<span class="legend-item"><span class="legend-dot" style="background:${color};"></span>${display}</span>`;
            });
            legendContainer.innerHTML = html;
        }
        buildLegend();

        // Render function
        function render(filter = '') {
            const term = filter.trim().toLowerCase();
            let filtered = vocabData;

            if (term) {
                filtered = vocabData.filter(item => {
                    let dialogueSearch = '';
                    item.dialogue.forEach(line => {
                        dialogueSearch += line.chinese + ' ' + line.pinyin + ' ' + line.english + ' ';
                    });
                    const searchable = item.char + ' ' + item.pinyin + ' ' + item.en + ' ' + item.explanation + ' ' + dialogueSearch;
                    return searchable.toLowerCase().includes(term);
                });
            }

            countDisplay.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty">🔍 No matches found.</div>`;
                return;
            }

            let html = '';
            filtered.forEach((item, index) => {
                const posClass = 'pos-' + item.pos.replace('/', '-');
                const posDisplay = posLabels[item.pos] || item.pos;

                // Build dialogue HTML
                let dialogueHtml = '';
                dialogueHtml += `
                        <div class="dialogue-toggle-wrapper">
                            <strong>💬 Dialogue:</strong>
                            <button class="dialogue-toggle-btn" data-dialogue-idx="${index}">Show Pinyin & Translation</button>
                        </div>
                        <div class="dialogue-lines">
                    `;

                item.dialogue.forEach(line => {
                    const speakerClass = line.speaker === 'A' ? 'speaker-a' : 'speaker-b';
                    dialogueHtml += `
                            <div class="line">
                                <span class="${speakerClass}">${line.speaker}:</span>
                                <span class="zh">${line.chinese}</span>
                                <span class="dialogue-details">
                                    <span class="sep">·</span>
                                    <span class="pinyin-text">${line.pinyin}</span>
                                    <span class="sep">·</span>
                                    <span class="en-text">${line.english}</span>
                                </span>
                            </div>
                        `;
                });

                dialogueHtml += `</div>`;

                html += `
                        <div class="vocab-card" data-index="${index}">
                            <div class="char-row">
                                <span class="char">${item.char}</span>
                                <span class="pinyin-container" data-pinyin="${item.pinyin}" data-revealed="false">
                                    <span class="pinyin-value">${item.pinyin}</span>
                                </span>
                            </div>
                            <span class="pos ${posClass}">${posDisplay}</span>

                            <button class="details-toggle" data-target="details-${index}">
                                <span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)
                            </button>

                            <div id="details-${index}" class="details-content">
                                <div class="explanation">
                                    <div class="meaning-line">📘 ${item.en}</div>
                                    <br />
                                    <strong>📖 Usage:</strong> ${item.explanation}
                                </div>
                                <div class="dialogue-box" id="dialogue-box-${index}">
                                    ${dialogueHtml}
                                </div>
                            </div>
                        </div>
                    `;
            });

            grid.innerHTML = html;

            // ---- Click on the Hanzi toggles its pinyin ----
            document.querySelectorAll('.char').forEach(charEl => {
                charEl.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const row = this.closest('.char-row');
                    const pinyinContainer = row ? row.querySelector('.pinyin-container') : null;
                    if (!pinyinContainer) return;
                    const isRevealed = pinyinContainer.dataset.revealed === 'true';
                    const newState = !isRevealed;
                    pinyinContainer.dataset.revealed = newState ? 'true' : 'false';
                    pinyinContainer.classList.toggle('revealed', newState);
                });
            });

            // ---- Apply global state to all pinyin containers ----
            document.querySelectorAll('.pinyin-container').forEach(el => {
                const shouldReveal = globalPinyinRevealed;
                el.dataset.revealed = shouldReveal ? 'true' : 'false';
                el.classList.toggle('revealed', shouldReveal);
            });

            // ---- Toggle main details (Meaning/Explanation) ----
            document.querySelectorAll('.details-toggle').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const targetId = this.dataset.target;
                    const content = document.getElementById(targetId);
                    if (!content) return;

                    const isOpen = content.classList.contains('open');
                    if (isOpen) {
                        content.classList.remove('open');
                        this.classList.remove('active');
                        this.innerHTML = '<span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)';
                    } else {
                        content.classList.add('open');
                        this.classList.add('active');
                        this.innerHTML = '<span class="arrow">▲</span> Hide Details';
                    }
                });
            });

            // ---- Toggle dialogue pinyin/translation ----
            document.querySelectorAll('.dialogue-toggle-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = this.dataset.dialogueIdx;
                    const dialogueBox = document.getElementById(`dialogue-box-${idx}`);
                    if (!dialogueBox) return;

                    const isShowing = dialogueBox.classList.contains('show-translation');
                    if (isShowing) {
                        dialogueBox.classList.remove('show-translation');
                        this.textContent = 'Show Pinyin & Translation';
                    } else {
                        dialogueBox.classList.add('show-translation');
                        this.textContent = 'Hide Pinyin & Translation';
                    }
                });
            });

            updateGlobalToggleLabel();
        }

        // ---- Global Pinyin Toggle ----
        function updateGlobalToggleLabel() {
            if (globalPinyinRevealed) {
                pinyinToggleLabel.textContent = 'Hide All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔓';
            } else {
                pinyinToggleLabel.textContent = 'Show All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔊';
            }
        }

        pinyinGlobalToggle.addEventListener('click', function() {
            globalPinyinRevealed = !globalPinyinRevealed;
            document.querySelectorAll('.pinyin-container').forEach(el => {
                el.dataset.revealed = globalPinyinRevealed ? 'true' : 'false';
                el.classList.toggle('revealed', globalPinyinRevealed);
            });
            updateGlobalToggleLabel();
        });

        // ---- Search & Clear ----
        searchInput.addEventListener('input', () => render(searchInput.value));
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            render('');
            searchInput.focus();
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') clearBtn.click();
        });

        // ---- Initial render ----
        render('');
    </script>
</body>
</html>
