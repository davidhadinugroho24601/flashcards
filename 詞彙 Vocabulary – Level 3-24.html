<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 3-24 Flashcards (Click Hanzi for Pinyin)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: #f4f2ef;
            min-height: 100vh;
            padding: 2rem 1.5rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #1e1e2a;
        }

        .header h1 span {
            background: #d9c9b4;
            padding: 0.1rem 0.8rem;
            border-radius: 12px;
            color: #2c2c3a;
        }

        .header .sub {
            font-size: 1rem;
            color: #6b5f52;
            margin-top: 0.3rem;
            font-weight: 400;
        }

        .header .badge {
            display: inline-block;
            margin-top: 0.6rem;
            background: #2c2c3a;
            color: white;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            background: #ffffffd9;
            backdrop-filter: blur(6px);
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 2.2rem;
            border: 1px solid #e8e0d6;
        }

        .stats {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c2c3a;
            white-space: nowrap;
        }

        .stats strong {
            background: #ece6de;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-weight: 600;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f3efe9;
            padding: 0.1rem 0.1rem 0.1rem 1.2rem;
            border-radius: 40px;
            transition: 0.2s;
            border: 1px solid transparent;
            flex: 1;
            min-width: 180px;
        }

        .search-box:focus-within {
            background: #ffffff;
            border-color: #b8aa98;
            box-shadow: 0 0 0 3px rgba(184, 170, 152, 0.2);
        }

        .search-box input {
            border: none;
            background: transparent;
            font-size: 0.9rem;
            padding: 0.5rem 0;
            width: 100%;
            outline: none;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #1e1e2a;
        }

        .search-box input::placeholder {
            color: #a89b8c;
            font-weight: 400;
        }

        .search-box button {
            background: #2c2c3a;
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .search-box button:hover {
            background: #1a1a26;
        }

        .pinyin-global-toggle {
            background: #ece6de;
            border: 1px solid #d5cbbc;
            border-radius: 40px;
            padding: 0.3rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .pinyin-global-toggle:hover {
            background: #d5cbbc;
            border-color: #b8aa98;
        }

        .pinyin-global-toggle .icon {
            font-size: 1rem;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.2rem;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 0.6rem 1.2rem;
            background: #ffffffd9;
            border-radius: 40px;
            border: 1px solid #e8e0d6;
            font-size: 0.75rem;
            font-weight: 500;
            color: #2c2c3a;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .vocab-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid #ebe5dd;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .vocab-card:hover {
            border-color: #d0c3b2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .vocab-card .char-row {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.2rem;
        }

        .vocab-card .char {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1e1e2a;
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.2;
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease;
            padding: 0.1rem 0.4rem;
            border-radius: 8px;
            user-select: none;
        }

        .vocab-card .char:hover {
            color: #4a3f33;
            background: #f0ebe4;
        }

        .vocab-card .char:active {
            transform: scale(0.95);
        }

        .pinyin-container {
            display: inline-flex;
            align-items: center;
            min-width: 2.2rem;
            justify-content: center;
        }

        .pinyin-container .pinyin-value {
            font-size: 1rem;
            color: #6b5f52;
            font-weight: 400;
            letter-spacing: 0.3px;
            display: none;
        }

        .pinyin-container.revealed .pinyin-value {
            display: inline;
        }

        .vocab-card .pos {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            align-self: flex-start;
            margin-top: 0.6rem;
            background: #f0ebe4;
            color: #4a4037;
        }

        .pos-N {
            background: #dbe9f0;
            color: #1f5a7a;
        }
        .pos-V {
            background: #e6f0db;
            color: #3d6b2b;
        }
        .pos-Vs {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Vst {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Adv {
            background: #f0e6db;
            color: #7a5a2b;
        }
        .pos-Prep {
            background: #f0dbe6;
            color: #7a2b4a;
        }
        .pos-M {
            background: #e6dbf0;
            color: #4a2b7a;
        }
        .pos-Ptc {
            background: #f0e8db;
            color: #7a6b2b;
        }
        .pos-N\/V {
            background: #dbe8f0;
            color: #1f5a7a;
        }
        .pos-Conj {
            background: #f0e0d0;
            color: #7a5a3a;
        }
        .pos-V-sep {
            background: #d4e8d4;
            color: #2d6b2d;
        }
        .pos-Adv\/Ptc {
            background: #c0b0a0;
            color: #6a4a2a;
        }

        .details-toggle {
            margin-top: 1.2rem;
            background: none;
            border: 1px solid #d5cbbc;
            border-radius: 30px;
            padding: 0.5rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #4a4037;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
            align-self: flex-start;
            background: #faf8f5;
        }

        .details-toggle:hover {
            background: #e8e0d6;
            border-color: #b8aa98;
        }

        .details-toggle .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .details-toggle.active .arrow {
            transform: rotate(180deg);
        }

        .details-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
        }

        .details-content.open {
            max-height: 900px;
            opacity: 1;
            margin-top: 1.2rem;
        }

        .details-content .explanation {
            background: #f8f6f2;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #2c2c3a;
            border-left: 4px solid #d0c3b2;
            margin-bottom: 1rem;
        }

        .details-content .explanation strong {
            color: #1e1e2a;
        }

        .details-content .explanation .meaning-line {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e1e2a;
            background: #e8e0d6;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 0.4rem;
        }

        .dialogue-box {
            background: #f0f4f8;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.8;
        }

        .dialogue-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 0.3rem;
        }

        .dialogue-toggle-btn {
            background: #e8e0d6;
            border: none;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .dialogue-toggle-btn:hover {
            background: #d5cbbc;
        }

        .dialogue-box .speaker-a {
            color: #1f5a7a;
            font-weight: 600;
        }

        .dialogue-box .speaker-b {
            color: #3d6b2b;
            font-weight: 600;
        }

        .dialogue-box .line {
            margin-bottom: 0.2rem;
        }
        .dialogue-box .line:last-child {
            margin-bottom: 0;
        }

        .dialogue-box .zh {
            font-family: 'Noto Sans SC', sans-serif;
            margin-right: 0.3rem;
        }

        .dialogue-details {
            display: none;
            margin-left: 0.3rem;
        }

        .dialogue-details .pinyin-text {
            font-weight: 400;
            color: #6b5f52;
        }

        .dialogue-details .en-text {
            font-style: italic;
            color: #4a4037;
        }

        .dialogue-details .sep {
            color: #b8aa98;
            margin: 0 0.2rem;
        }

        .dialogue-box.show-translation .dialogue-details {
            display: inline;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1.1rem;
            color: #8f8172;
            background: #faf8f5;
            border-radius: 30px;
            border: 1px dashed #d5cbbc;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.8rem 3rem;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                border-radius: 28px;
                padding: 1rem 1.2rem;
                gap: 0.8rem;
            }
            .stats {
                text-align: center;
            }
            .search-box {
                padding: 0.1rem 0.1rem 0.1rem 1rem;
            }
            .search-box button {
                padding: 0.4rem 1rem;
                font-size: 0.8rem;
            }
            .vocab-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .vocab-card .char {
                font-size: 1.8rem;
            }
            .pinyin-global-toggle {
                justify-content: center;
            }
        }

        @media (min-width: 641px) and (max-width: 900px) {
            .vocab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 詞彙 <span>Level 3-24</span></h1>
            <div class="sub">Flashcard Mode · <strong>Click the Hanzi</strong> to reveal Pinyin</div>
            <div class="badge">🔍 Click the character to show pinyin · "Show Details" for meaning & dialogue</div>
        </div>

        <div class="toolbar">
            <div class="stats">
                <strong id="countDisplay">0</strong> words
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Chinese, Pinyin, or English..." autocomplete="off" />
                <button id="clearBtn">✕</button>
            </div>
            <button class="pinyin-global-toggle" id="pinyinGlobalToggle">
                <span class="icon">🔊</span>
                <span id="pinyinToggleLabel">Show All Pinyin</span>
            </button>
        </div>

        <div class="legend" id="legendContainer"></div>

        <div class="vocab-grid" id="vocabGrid"></div>
    </div>

    <script>
        // ------------------------------------------------------------
        // DATA — Level 3-24 Vocabulary (Traditional Hanzi)
        // ------------------------------------------------------------
        const vocabData = [{
            char: '口味',
            pinyin: 'kǒuwèi',
            pos: 'N',
            en: 'Taste / Flavor',
            explanation: 'The specific flavor or taste of food, or a person\'s preference in taste.',
            dialogue: [
                { speaker: 'A', chinese: '你喜歡什麼口味？', pinyin: 'Nǐ xǐhuān shénme kǒuwèi?', english: 'What flavor do you like?' },
                { speaker: 'B', chinese: '我喜歡甜的口味。', pinyin: 'Wǒ xǐhuān tián de kǒuwèi.', english: 'I like sweet flavors.' }
            ]
        }, {
            char: '快',
            pinyin: 'kuài',
            pos: 'Adv',
            en: 'Quickly / Fast',
            explanation: 'Describes speed, or used as an adverb meaning "soon" or "quickly." Also can mean "happy" in some contexts.',
            dialogue: [
                { speaker: 'A', chinese: '你走得真快！', pinyin: 'Nǐ zǒu de zhēn kuài!', english: 'You walk really fast!' },
                { speaker: 'B', chinese: '我趕時間。', pinyin: 'Wǒ gǎn shíjiān.', english: 'I\'m in a hurry.' }
            ]
        }, {
            char: '寬',
            pinyin: 'kuān',
            pos: 'Vs',
            en: 'Wide / Broad',
            explanation: 'Describes physical width, or metaphorically "generous" or "lenient."',
            dialogue: [
                { speaker: 'A', chinese: '這條路很寬。', pinyin: 'Zhè tiáo lù hěn kuān.', english: 'This road is very wide.' },
                { speaker: 'B', chinese: '可以容納很多車。', pinyin: 'Kěyǐ róngnà hěnduō chē.', english: 'It can accommodate many cars.' }
            ]
        }, {
            char: '況且',
            pinyin: 'kuàngqiě',
            pos: 'Conj',
            en: 'Moreover / Besides',
            explanation: 'Used to add an additional point or reason to support an argument, often with a sense of "besides" or "furthermore."',
            dialogue: [
                { speaker: 'A', chinese: '太貴了，況且我也不喜歡。', pinyin: 'Tài guì le, kuàngqiě wǒ yě bù xǐhuān.', english: 'It\'s too expensive, and besides, I don\'t like it.' },
                { speaker: 'B', chinese: '那我們別買了。', pinyin: 'Nà wǒmen bié mǎi le.', english: 'Then let\'s not buy it.' }
            ]
        }, {
            char: '誇張',
            pinyin: 'kuāzhāng',
            pos: 'Vs',
            en: 'Exaggerated',
            explanation: 'Describes statements or actions that are overblown or not entirely truthful, often for effect.',
            dialogue: [
                { speaker: 'A', chinese: '你太誇張了吧！', pinyin: 'Nǐ tài kuāzhāng le ba!', english: 'You\'re exaggerating too much!' },
                { speaker: 'B', chinese: '我沒有，是真的。', pinyin: 'Wǒ méiyǒu, shì zhēn de.', english: 'I\'m not; it\'s true.' }
            ]
        }, {
            char: '擴大',
            pinyin: 'kuòdà',
            pos: 'V',
            en: 'To expand / To enlarge',
            explanation: 'To make something bigger in size, scope, or influence.',
            dialogue: [
                { speaker: 'A', chinese: '我們要擴大業務。', pinyin: 'Wǒmen yào kuòdà yèwù.', english: 'We need to expand our business.' },
                { speaker: 'B', chinese: '需要更多資金嗎？', pinyin: 'Xūyào gèng duō zījīn ma?', english: 'Do we need more funding?' }
            ]
        }, {
            char: '拉肚子',
            pinyin: 'lādùzi',
            pos: 'V-sep',
            en: 'To have diarrhea',
            explanation: 'A separable verb phrase meaning to suffer from diarrhea.',
            dialogue: [
                { speaker: 'A', chinese: '我昨天拉肚子了。', pinyin: 'Wǒ zuótiān lā dùzi le.', english: 'I had diarrhea yesterday.' },
                { speaker: 'B', chinese: '去看醫生沒？', pinyin: 'Qù kàn yīshēng méi?', english: 'Did you see a doctor?' }
            ]
        }, {
            char: '來',
            pinyin: 'lái',
            pos: 'Adv / Ptc',
            en: 'Come / (particle)',
            explanation: 'As a verb, "to come." As an adverb/particle, it can indicate an action is about to happen or add a sense of "ever since."',
            dialogue: [
                { speaker: 'A', chinese: '他來了。', pinyin: 'Tā lái le.', english: 'He has come.' },
                { speaker: 'B', chinese: '歡迎！', pinyin: 'Huānyíng!', english: 'Welcome!' }
            ]
        }, {
            char: '來不及',
            pinyin: 'lái bù jí',
            pos: 'Vs',
            en: 'Not enough time / Too late',
            explanation: 'Indicates that there is insufficient time to do something, or that it is too late to act.',
            dialogue: [
                { speaker: 'A', chinese: '快點，來不及了！', pinyin: 'Kuài diǎn, lái bù jí le!', english: 'Hurry up, we don\'t have enough time!' },
                { speaker: 'B', chinese: '我已經在跑了。', pinyin: 'Wǒ yǐjīng zài pǎo le.', english: 'I\'m already running.' }
            ]
        }, {
            char: '來得及',
            pinyin: 'lái de jí',
            pos: 'Vs',
            en: 'Have enough time / In time',
            explanation: 'Indicates that there is enough time to do something, or that it is not too late.',
            dialogue: [
                { speaker: 'A', chinese: '我們還來得及趕上火車。', pinyin: 'Wǒmen hái lái de jí gǎn shàng huǒchē.', english: 'We still have enough time to catch the train.' },
                { speaker: 'B', chinese: '太好了！', pinyin: 'Tài hǎo le!', english: 'Great!' }
            ]
        }, {
            char: '藍',
            pinyin: 'lán',
            pos: 'Vs',
            en: 'Blue',
            explanation: 'The color blue, used to describe objects or as a metaphor for mood (feeling blue).',
            dialogue: [
                { speaker: 'A', chinese: '天空是藍色的。', pinyin: 'Tiānkōng shì lánsè de.', english: 'The sky is blue.' },
                { speaker: 'B', chinese: '今天天氣真好。', pinyin: 'Jīntiān tiānqì zhēn hǎo.', english: 'The weather is great today.' }
            ]
        }, {
            char: '浪漫',
            pinyin: 'làngmàn',
            pos: 'Vs',
            en: 'Romantic',
            explanation: 'Describes something that is filled with romance, often used for relationships, gestures, or atmospheres.',
            dialogue: [
                { speaker: 'A', chinese: '他安排了一場浪漫的晚餐。', pinyin: 'Tā ānpái le yī chǎng làngmàn de wǎncān.', english: 'He arranged a romantic dinner.' },
                { speaker: 'B', chinese: '真的很貼心。', pinyin: 'Zhēn de hěn tiēxīn.', english: 'That\'s really thoughtful.' }
            ]
        }, {
            char: '老公',
            pinyin: 'lǎogōng',
            pos: 'N',
            en: 'Husband (colloquial)',
            explanation: 'An informal, affectionate term for one\'s husband. Used in daily conversation.',
            dialogue: [
                { speaker: 'A', chinese: '我老公在銀行工作。', pinyin: 'Wǒ lǎogōng zài yínháng gōngzuò.', english: 'My husband works at a bank.' },
                { speaker: 'B', chinese: '他的工作穩定嗎？', pinyin: 'Tā de gōngzuò wěndìng ma?', english: 'Is his job stable?' }
            ]
        }, {
            char: '老虎',
            pinyin: 'lǎohǔ',
            pos: 'N',
            en: 'Tiger',
            explanation: 'The large wild cat, a symbol of power and courage in Chinese culture.',
            dialogue: [
                { speaker: 'A', chinese: '老虎是森林之王。', pinyin: 'Lǎohǔ shì sēnlín zhī wáng.', english: 'The tiger is the king of the forest.' },
                { speaker: 'B', chinese: '牠們很威猛。', pinyin: 'Tāmen hěn wēiměng.', english: 'They are very fierce.' }
            ]
        }, {
            char: '老婆',
            pinyin: 'lǎopó',
            pos: 'N',
            en: 'Wife (colloquial)',
            explanation: 'An informal, affectionate term for one\'s wife. Used in daily conversation.',
            dialogue: [
                { speaker: 'A', chinese: '我老婆做菜很好吃。', pinyin: 'Wǒ lǎopó zuòcài hěn hǎochī.', english: 'My wife cooks very well.' },
                { speaker: 'B', chinese: '真幸福！', pinyin: 'Zhēn xìngfú!', english: 'How lucky!' }
            ]
        }, {
            char: '老實',
            pinyin: 'lǎoshi',
            pos: 'Vs',
            en: 'Honest / Well-behaved',
            description: 'Describes a person who is truthful, straightforward, and obedient.',
            dialogue: [
                { speaker: 'A', chinese: '他是一個老實的人。', pinyin: 'Tā shì yī gè lǎoshi de rén.', english: 'He is an honest person.' },
                { speaker: 'B', chinese: '對，他從不說謊。', pinyin: 'Duì, tā cóng bù shuōhuǎng.', english: 'Yes, he never lies.' }
            ]
        }, {
            char: '老是',
            pinyin: 'lǎoshi',
            pos: 'Adv',
            en: 'Always / All the time',
            explanation: 'An adverb indicating a recurring action or state, often with a sense of annoyance.',
            dialogue: [
                { speaker: 'A', chinese: '他老是遲到。', pinyin: 'Tā lǎoshi chídào.', english: 'He is always late.' },
                { speaker: 'B', chinese: '真受不了。', pinyin: 'Zhēn shòu bù liǎo.', english: 'I can\'t stand it.' }
            ]
        }, {
            char: '樂',
            pinyin: 'lè',
            pos: 'Vs',
            en: 'Happy / Joyful',
            explanation: 'Describes a feeling of happiness or pleasure. Also used in compound words like 快樂 (happy).',
            dialogue: [
                { speaker: 'A', chinese: '我今天很樂。', pinyin: 'Wǒ jīntiān hěn lè.', english: 'I am very happy today.' },
                { speaker: 'B', chinese: '為什麼？有什麼好事？', pinyin: 'Wèishénme? Yǒu shénme hǎoshì?', english: 'Why? Any good news?' }
            ]
        }, {
            char: '樂觀',
            pinyin: 'lèguān',
            pos: 'Vs',
            en: 'Optimistic',
            explanation: 'Describes a person who tends to see the positive side of things and expects good outcomes.',
            dialogue: [
                { speaker: 'A', chinese: '他總是保持樂觀。', pinyin: 'Tā zǒngshì bǎochí lèguān.', english: 'He always stays optimistic.' },
                { speaker: 'B', chinese: '這種態度很好。', pinyin: 'Zhè zhǒng tàidù hěn hǎo.', english: 'That attitude is great.' }
            ]
        }, {
            char: '樂趣',
            pinyin: 'lèqù',
            pos: 'N',
            en: 'Pleasure / Fun',
            explanation: 'A source of enjoyment or amusement.',
            dialogue: [
                { speaker: 'A', chinese: '閱讀是我的樂趣。', pinyin: 'Yuèdú shì wǒ de lèqù.', english: 'Reading is my pleasure.' },
                { speaker: 'B', chinese: '我也喜歡閱讀。', pinyin: 'Wǒ yě xǐhuān yuèdú.', english: 'I also like reading.' }
            ]
        }];

        // ------------------------------------------------------------
        // RENDER ENGINE
        // ------------------------------------------------------------
        const grid = document.getElementById('vocabGrid');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const countDisplay = document.getElementById('countDisplay');
        const legendContainer = document.getElementById('legendContainer');
        const pinyinGlobalToggle = document.getElementById('pinyinGlobalToggle');
        const pinyinToggleLabel = document.getElementById('pinyinToggleLabel');

        let globalPinyinRevealed = false;

        // Legend
        const posSet = new Set(vocabData.map(d => d.pos));
        const posLabels = {
            'N': 'Noun',
            'V': 'Verb',
            'Vs': 'Stative Verb',
            'Vst': 'Stative/Transitive Verb',
            'Adv': 'Adverb',
            'Prep': 'Preposition',
            'M': 'Measure Word',
            'Ptc': 'Particle',
            'N/V': 'Noun / Verb',
            'Conj': 'Conjunction',
            'V-sep': 'Separable Verb',
            'Adv/Ptc': 'Adverb / Particle'
        };
        const dotColorMap = {
            'N': '#7ba9c9',
            'V': '#7fb06a',
            'Vs': '#5ba884',
            'Vst': '#5ba884',
            'Adv': '#c9a86a',
            'Prep': '#c97a9a',
            'M': '#9a7ac9',
            'Ptc': '#c9b86a',
            'N/V': '#7ba9c9',
            'Conj': '#f0d0b0',
            'V-sep': '#6ab06a',
            'Adv/Ptc': '#c0b0a0'
        };

        function buildLegend() {
            const sorted = Array.from(posSet).sort();
            let html = '';
            sorted.forEach(label => {
                const display = posLabels[label] || label;
                const color = dotColorMap[label] || '#b8aa98';
                html += `<span class="legend-item"><span class="legend-dot" style="background:${color};"></span>${display}</span>`;
            });
            legendContainer.innerHTML = html;
        }
        buildLegend();

        // Render function
        function render(filter = '') {
            const term = filter.trim().toLowerCase();
            let filtered = vocabData;

            if (term) {
                filtered = vocabData.filter(item => {
                    let dialogueSearch = '';
                    item.dialogue.forEach(line => {
                        dialogueSearch += line.chinese + ' ' + line.pinyin + ' ' + line.english + ' ';
                    });
                    const searchable = item.char + ' ' + item.pinyin + ' ' + item.en + ' ' + item.explanation + ' ' + dialogueSearch;
                    return searchable.toLowerCase().includes(term);
                });
            }

            countDisplay.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty">🔍 No matches found.</div>`;
                return;
            }

            let html = '';
            filtered.forEach((item, index) => {
                const posClass = 'pos-' + item.pos.replace('/', '-');
                const posDisplay = posLabels[item.pos] || item.pos;

                // Build dialogue HTML
                let dialogueHtml = '';
                dialogueHtml += `
                        <div class="dialogue-toggle-wrapper">
                            <strong>💬 Dialogue:</strong>
                            <button class="dialogue-toggle-btn" data-dialogue-idx="${index}">Show Pinyin & Translation</button>
                        </div>
                        <div class="dialogue-lines">
                    `;

                item.dialogue.forEach(line => {
                    const speakerClass = line.speaker === 'A' ? 'speaker-a' : 'speaker-b';
                    dialogueHtml += `
                            <div class="line">
                                <span class="${speakerClass}">${line.speaker}:</span>
                                <span class="zh">${line.chinese}</span>
                                <span class="dialogue-details">
                                    <span class="sep">·</span>
                                    <span class="pinyin-text">${line.pinyin}</span>
                                    <span class="sep">·</span>
                                    <span class="en-text">${line.english}</span>
                                </span>
                            </div>
                        `;
                });

                dialogueHtml += `</div>`;

                html += `
                        <div class="vocab-card" data-index="${index}">
                            <div class="char-row">
                                <span class="char">${item.char}</span>
                                <span class="pinyin-container" data-pinyin="${item.pinyin}" data-revealed="false">
                                    <span class="pinyin-value">${item.pinyin}</span>
                                </span>
                            </div>
                            <span class="pos ${posClass}">${posDisplay}</span>

                            <button class="details-toggle" data-target="details-${index}">
                                <span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)
                            </button>

                            <div id="details-${index}" class="details-content">
                                <div class="explanation">
                                    <div class="meaning-line">📘 ${item.en}</div>
                                    <br />
                                    <strong>📖 Usage:</strong> ${item.explanation}
                                </div>
                                <div class="dialogue-box" id="dialogue-box-${index}">
                                    ${dialogueHtml}
                                </div>
                            </div>
                        </div>
                    `;
            });

            grid.innerHTML = html;

            // ---- Click on the Hanzi toggles its pinyin ----
            document.querySelectorAll('.char').forEach(charEl => {
                charEl.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const row = this.closest('.char-row');
                    const pinyinContainer = row ? row.querySelector('.pinyin-container') : null;
                    if (!pinyinContainer) return;
                    const isRevealed = pinyinContainer.dataset.revealed === 'true';
                    const newState = !isRevealed;
                    pinyinContainer.dataset.revealed = newState ? 'true' : 'false';
                    pinyinContainer.classList.toggle('revealed', newState);
                });
            });

            // ---- Apply global state to all pinyin containers ----
            document.querySelectorAll('.pinyin-container').forEach(el => {
                const shouldReveal = globalPinyinRevealed;
                el.dataset.revealed = shouldReveal ? 'true' : 'false';
                el.classList.toggle('revealed', shouldReveal);
            });

            // ---- Toggle main details (Meaning/Explanation) ----
            document.querySelectorAll('.details-toggle').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const targetId = this.dataset.target;
                    const content = document.getElementById(targetId);
                    if (!content) return;

                    const isOpen = content.classList.contains('open');
                    if (isOpen) {
                        content.classList.remove('open');
                        this.classList.remove('active');
                        this.innerHTML = '<span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)';
                    } else {
                        content.classList.add('open');
                        this.classList.add('active');
                        this.innerHTML = '<span class="arrow">▲</span> Hide Details';
                    }
                });
            });

            // ---- Toggle dialogue pinyin/translation ----
            document.querySelectorAll('.dialogue-toggle-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = this.dataset.dialogueIdx;
                    const dialogueBox = document.getElementById(`dialogue-box-${idx}`);
                    if (!dialogueBox) return;

                    const isShowing = dialogueBox.classList.contains('show-translation');
                    if (isShowing) {
                        dialogueBox.classList.remove('show-translation');
                        this.textContent = 'Show Pinyin & Translation';
                    } else {
                        dialogueBox.classList.add('show-translation');
                        this.textContent = 'Hide Pinyin & Translation';
                    }
                });
            });

            updateGlobalToggleLabel();
        }

        // ---- Global Pinyin Toggle ----
        function updateGlobalToggleLabel() {
            if (globalPinyinRevealed) {
                pinyinToggleLabel.textContent = 'Hide All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔓';
            } else {
                pinyinToggleLabel.textContent = 'Show All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔊';
            }
        }

        pinyinGlobalToggle.addEventListener('click', function() {
            globalPinyinRevealed = !globalPinyinRevealed;
            document.querySelectorAll('.pinyin-container').forEach(el => {
                el.dataset.revealed = globalPinyinRevealed ? 'true' : 'false';
                el.classList.toggle('revealed', globalPinyinRevealed);
            });
            updateGlobalToggleLabel();
        });

        // ---- Search & Clear ----
        searchInput.addEventListener('input', () => render(searchInput.value));
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            render('');
            searchInput.focus();
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') clearBtn.click();
        });

        // ---- Initial render ----
        render('');
    </script>
</body>
</html>
