<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 3-19 Flashcards (Click Hanzi for Pinyin)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: #f4f2ef;
            min-height: 100vh;
            padding: 2rem 1.5rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #1e1e2a;
        }

        .header h1 span {
            background: #d9c9b4;
            padding: 0.1rem 0.8rem;
            border-radius: 12px;
            color: #2c2c3a;
        }

        .header .sub {
            font-size: 1rem;
            color: #6b5f52;
            margin-top: 0.3rem;
            font-weight: 400;
        }

        .header .badge {
            display: inline-block;
            margin-top: 0.6rem;
            background: #2c2c3a;
            color: white;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            background: #ffffffd9;
            backdrop-filter: blur(6px);
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 2.2rem;
            border: 1px solid #e8e0d6;
        }

        .stats {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c2c3a;
            white-space: nowrap;
        }

        .stats strong {
            background: #ece6de;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-weight: 600;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f3efe9;
            padding: 0.1rem 0.1rem 0.1rem 1.2rem;
            border-radius: 40px;
            transition: 0.2s;
            border: 1px solid transparent;
            flex: 1;
            min-width: 180px;
        }

        .search-box:focus-within {
            background: #ffffff;
            border-color: #b8aa98;
            box-shadow: 0 0 0 3px rgba(184, 170, 152, 0.2);
        }

        .search-box input {
            border: none;
            background: transparent;
            font-size: 0.9rem;
            padding: 0.5rem 0;
            width: 100%;
            outline: none;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #1e1e2a;
        }

        .search-box input::placeholder {
            color: #a89b8c;
            font-weight: 400;
        }

        .search-box button {
            background: #2c2c3a;
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .search-box button:hover {
            background: #1a1a26;
        }

        .pinyin-global-toggle {
            background: #ece6de;
            border: 1px solid #d5cbbc;
            border-radius: 40px;
            padding: 0.3rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .pinyin-global-toggle:hover {
            background: #d5cbbc;
            border-color: #b8aa98;
        }

        .pinyin-global-toggle .icon {
            font-size: 1rem;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.2rem;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 0.6rem 1.2rem;
            background: #ffffffd9;
            border-radius: 40px;
            border: 1px solid #e8e0d6;
            font-size: 0.75rem;
            font-weight: 500;
            color: #2c2c3a;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .vocab-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid #ebe5dd;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .vocab-card:hover {
            border-color: #d0c3b2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .vocab-card .char-row {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.2rem;
        }

        .vocab-card .char {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1e1e2a;
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.2;
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease;
            padding: 0.1rem 0.4rem;
            border-radius: 8px;
            user-select: none;
        }

        .vocab-card .char:hover {
            color: #4a3f33;
            background: #f0ebe4;
        }

        .vocab-card .char:active {
            transform: scale(0.95);
        }

        .pinyin-container {
            display: inline-flex;
            align-items: center;
            min-width: 2.2rem;
            justify-content: center;
        }

        .pinyin-container .pinyin-value {
            font-size: 1rem;
            color: #6b5f52;
            font-weight: 400;
            letter-spacing: 0.3px;
            display: none;
        }

        .pinyin-container.revealed .pinyin-value {
            display: inline;
        }

        .vocab-card .pos {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            align-self: flex-start;
            margin-top: 0.6rem;
            background: #f0ebe4;
            color: #4a4037;
        }

        .pos-N {
            background: #dbe9f0;
            color: #1f5a7a;
        }
        .pos-V {
            background: #e6f0db;
            color: #3d6b2b;
        }
        .pos-Vs {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Vst {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Adv {
            background: #f0e6db;
            color: #7a5a2b;
        }
        .pos-Prep {
            background: #f0dbe6;
            color: #7a2b4a;
        }
        .pos-M {
            background: #e6dbf0;
            color: #4a2b7a;
        }
        .pos-Ptc {
            background: #f0e8db;
            color: #7a6b2b;
        }
        .pos-N\/V {
            background: #dbe8f0;
            color: #1f5a7a;
        }
        .pos-Conj {
            background: #f0e0d0;
            color: #7a5a3a;
        }
        .pos-V-sep {
            background: #d4e8d4;
            color: #2d6b2d;
        }
        .pos-Vpt {
            background: #d4d8e8;
            color: #3a4a7a;
        }
        .pos-Vi {
            background: #d4e0e0;
            color: #2d5a5a;
        }

        .details-toggle {
            margin-top: 1.2rem;
            background: none;
            border: 1px solid #d5cbbc;
            border-radius: 30px;
            padding: 0.5rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #4a4037;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
            align-self: flex-start;
            background: #faf8f5;
        }

        .details-toggle:hover {
            background: #e8e0d6;
            border-color: #b8aa98;
        }

        .details-toggle .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .details-toggle.active .arrow {
            transform: rotate(180deg);
        }

        .details-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
        }

        .details-content.open {
            max-height: 900px;
            opacity: 1;
            margin-top: 1.2rem;
        }

        .details-content .explanation {
            background: #f8f6f2;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #2c2c3a;
            border-left: 4px solid #d0c3b2;
            margin-bottom: 1rem;
        }

        .details-content .explanation strong {
            color: #1e1e2a;
        }

        .details-content .explanation .meaning-line {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e1e2a;
            background: #e8e0d6;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 0.4rem;
        }

        .dialogue-box {
            background: #f0f4f8;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.8;
        }

        .dialogue-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 0.3rem;
        }

        .dialogue-toggle-btn {
            background: #e8e0d6;
            border: none;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .dialogue-toggle-btn:hover {
            background: #d5cbbc;
        }

        .dialogue-box .speaker-a {
            color: #1f5a7a;
            font-weight: 600;
        }

        .dialogue-box .speaker-b {
            color: #3d6b2b;
            font-weight: 600;
        }

        .dialogue-box .line {
            margin-bottom: 0.2rem;
        }
        .dialogue-box .line:last-child {
            margin-bottom: 0;
        }

        .dialogue-box .zh {
            font-family: 'Noto Sans SC', sans-serif;
            margin-right: 0.3rem;
        }

        .dialogue-details {
            display: none;
            margin-left: 0.3rem;
        }

        .dialogue-details .pinyin-text {
            font-weight: 400;
            color: #6b5f52;
        }

        .dialogue-details .en-text {
            font-style: italic;
            color: #4a4037;
        }

        .dialogue-details .sep {
            color: #b8aa98;
            margin: 0 0.2rem;
        }

        .dialogue-box.show-translation .dialogue-details {
            display: inline;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1.1rem;
            color: #8f8172;
            background: #faf8f5;
            border-radius: 30px;
            border: 1px dashed #d5cbbc;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.8rem 3rem;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                border-radius: 28px;
                padding: 1rem 1.2rem;
                gap: 0.8rem;
            }
            .stats {
                text-align: center;
            }
            .search-box {
                padding: 0.1rem 0.1rem 0.1rem 1rem;
            }
            .search-box button {
                padding: 0.4rem 1rem;
                font-size: 0.8rem;
            }
            .vocab-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .vocab-card .char {
                font-size: 1.8rem;
            }
            .pinyin-global-toggle {
                justify-content: center;
            }
        }

        @media (min-width: 641px) and (max-width: 900px) {
            .vocab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 詞彙 <span>Level 3-19</span></h1>
            <div class="sub">Flashcard Mode · <strong>Click the Hanzi</strong> to reveal Pinyin</div>
            <div class="badge">🔍 Click the character to show pinyin · "Show Details" for meaning & dialogue</div>
        </div>

        <div class="toolbar">
            <div class="stats">
                <strong id="countDisplay">0</strong> words
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Chinese, Pinyin, or English..." autocomplete="off" />
                <button id="clearBtn">✕</button>
            </div>
            <button class="pinyin-global-toggle" id="pinyinGlobalToggle">
                <span class="icon">🔊</span>
                <span id="pinyinToggleLabel">Show All Pinyin</span>
            </button>
        </div>

        <div class="legend" id="legendContainer"></div>

        <div class="vocab-grid" id="vocabGrid"></div>
    </div>

    <script>
        // ------------------------------------------------------------
        // DATA — Level 3-19 Vocabulary (Traditional Hanzi)
        // ------------------------------------------------------------
        const vocabData = [{
            char: '剪',
            pinyin: 'jiǎn',
            pos: 'V',
            en: 'To cut (with scissors)',
            explanation: 'To use scissors or shears to cut paper, cloth, hair, or other materials.',
            dialogue: [
                { speaker: 'A', chinese: '請幫我剪一下頭髮。', pinyin: 'Qǐng bāng wǒ jiǎn yīxià tóufǎ.', english: 'Please cut my hair for me.' },
                { speaker: 'B', chinese: '沒問題，你想剪多短？', pinyin: 'Méi wèntí, nǐ xiǎng jiǎn duō duǎn?', english: 'No problem, how short do you want it?' }
            ]
        }, {
            char: '檢查',
            pinyin: 'jiǎnchá',
            pos: 'V',
            en: 'To inspect / To check',
            explanation: 'To examine something carefully to determine its condition or correctness.',
            dialogue: [
                { speaker: 'A', chinese: '醫生要檢查你的身體。', pinyin: 'Yīshēng yào jiǎnchá nǐ de shēntǐ.', english: 'The doctor needs to check your body.' },
                { speaker: 'B', chinese: '好的，我準備好了。', pinyin: 'Hǎo de, wǒ zhǔnbèi hǎo le.', english: 'OK, I\'m ready.' }
            ]
        }, {
            char: '將來',
            pinyin: 'jiānglái',
            pos: 'N',
            en: 'Future',
            explanation: 'The time yet to come, often used in the context of hopes, plans, or predictions.',
            dialogue: [
                { speaker: 'A', chinese: '你將來想做什麼工作？', pinyin: 'Nǐ jiānglái xiǎng zuò shénme gōngzuò?', english: 'What job do you want to do in the future?' },
                { speaker: 'B', chinese: '我想成為一名醫生。', pinyin: 'Wǒ xiǎng chéngwéi yī míng yīshēng.', english: 'I want to become a doctor.' }
            ]
        }, {
            char: '獎學金',
            pinyin: 'jiǎngxuéjīn',
            pos: 'N',
            en: 'Scholarship',
            explanation: 'A sum of money given to a student to support their education, often based on academic merit.',
            dialogue: [
                { speaker: 'A', chinese: '他獲得了全額獎學金。', pinyin: 'Tā huòdé le quán'é jiǎngxuéjīn.', english: 'He received a full scholarship.' },
                { speaker: 'B', chinese: '太好了，這對他幫助很大。', pinyin: 'Tài hǎo le, zhè duì tā bāngzhù hěn dà.', english: 'That\'s great, it helps him a lot.' }
            ]
        }, {
            char: '降低',
            pinyin: 'jiàngdī',
            pos: 'Vpt',
            en: 'To lower / To reduce',
            explanation: 'To make something smaller in amount, degree, or level.',
            dialogue: [
                { speaker: 'A', chinese: '我們需要降低成本。', pinyin: 'Wǒmen xūyào jiàngdī chéngběn.', english: 'We need to reduce costs.' },
                { speaker: 'B', chinese: '可以從材料方面下手。', pinyin: 'Kěyǐ cóng cáiliào fāngmiàn xiàshǒu.', english: 'We can start with the materials.' }
            ]
        }, {
            char: '講話',
            pinyin: 'jiǎnghuà',
            pos: 'V-sep',
            en: 'To speak / To talk',
            explanation: 'To give a speech or to have a conversation. A separable verb (e.g., 講了幾句話).',
            dialogue: [
                { speaker: 'A', chinese: '他在台上講話。', pinyin: 'Tā zài tái shàng jiǎnghuà.', english: 'He is speaking on stage.' },
                { speaker: 'B', chinese: '他講得很好。', pinyin: 'Tā jiǎng de hěn hǎo.', english: 'He speaks very well.' }
            ]
        }, {
            char: '講價',
            pinyin: 'jiǎngjià',
            pos: 'Vi',
            en: 'To bargain',
            explanation: 'To negotiate the price of an item with a seller, especially in markets or street stalls.',
            dialogue: [
                { speaker: 'A', chinese: '你可以在市場講價。', pinyin: 'Nǐ kěyǐ zài shìchǎng jiǎngjià.', english: 'You can bargain at the market.' },
                { speaker: 'B', chinese: '真的嗎？我試試看。', pinyin: 'Zhēn de ma? Wǒ shìshi kàn.', english: 'Really? I\'ll give it a try.' }
            ]
        }, {
            char: '講究',
            pinyin: 'jiǎngjiu',
            pos: 'Vs',
            en: 'Fastidious / Particular',
            explanation: 'To be very particular about quality, style, or detail; to have high standards.',
            dialogue: [
                { speaker: 'A', chinese: '他對吃很講究。', pinyin: 'Tā duì chī hěn jiǎngjiu.', english: 'He is very particular about food.' },
                { speaker: 'B', chinese: '對，他喜歡高級餐廳。', pinyin: 'Duì, tā xǐhuān gāojí cāntīng.', english: 'Yes, he likes fine dining.' }
            ]
        }, {
            char: '醬油',
            pinyin: 'jiàngyóu',
            pos: 'N',
            en: 'Soy sauce',
            explanation: 'A dark, salty liquid made from fermented soybeans, used as a condiment in Asian cuisine.',
            dialogue: [
                { speaker: 'A', chinese: '請給我一瓶醬油。', pinyin: 'Qǐng gěi wǒ yī píng jiàngyóu.', english: 'Please give me a bottle of soy sauce.' },
                { speaker: 'B', chinese: '好的，你要生抽還是老抽？', pinyin: 'Hǎo de, nǐ yào shēngchōu háishì lǎochōu?', english: 'OK, do you want light or dark soy sauce?' }
            ]
        }, {
            char: '堅強',
            pinyin: 'jiānqiáng',
            pos: 'Vs',
            en: 'Strong (character)',
            explanation: 'Describes a person who is mentally tough, resilient, and able to face adversity.',
            dialogue: [
                { speaker: 'A', chinese: '他很堅強，從不抱怨。', pinyin: 'Tā hěn jiānqiáng, cóng bù bàoyuàn.', english: 'He is very strong-willed and never complains.' },
                { speaker: 'B', chinese: '我佩服他的毅力。', pinyin: 'Wǒ pèifú tā de yìlì.', english: 'I admire his perseverance.' }
            ]
        }, {
            char: '減輕',
            pinyin: 'jiǎnqīng',
            pos: 'Vpt',
            en: 'To lighten / To alleviate',
            explanation: 'To make a burden, pain, or problem less severe.',
            dialogue: [
                { speaker: 'A', chinese: '運動可以減輕壓力。', pinyin: 'Yùndòng kěyǐ jiǎnqīng yālì.', english: 'Exercise can alleviate stress.' },
                { speaker: 'B', chinese: '我每天都去跑步。', pinyin: 'Wǒ měitiān dōu qù pǎobù.', english: 'I go running every day.' }
            ]
        }, {
            char: '減少',
            pinyin: 'jiǎnshǎo',
            pos: 'Vpt',
            en: 'To reduce / To decrease',
            explanation: 'To make something become less in quantity or size.',
            dialogue: [
                { speaker: 'A', chinese: '我們要減少浪費。', pinyin: 'Wǒmen yào jiǎnshǎo làngfèi.', english: 'We need to reduce waste.' },
                { speaker: 'B', chinese: '對，要節約資源。', pinyin: 'Duì, yào jiéyuē zīyuán.', english: 'Yes, we need to conserve resources.' }
            ]
        }, {
            char: '簡直',
            pinyin: 'jiǎnzhí',
            pos: 'Adv',
            en: 'Simply / Absolutely (emphatic)',
            explanation: 'Used to emphasize a statement, often expressing surprise or strong opinion, like "simply" or "virtually."',
            dialogue: [
                { speaker: 'A', chinese: '這簡直太棒了！', pinyin: 'Zhè jiǎnzhí tài bàng le!', english: 'This is simply amazing!' },
                { speaker: 'B', chinese: '對，我也這麼認為。', pinyin: 'Duì, wǒ yě zhème rènwéi.', english: 'Yes, I think so too.' }
            ]
        }, {
            char: '建立',
            pinyin: 'jiànlì',
            pos: 'V',
            en: 'To establish / To set up',
            explanation: 'To create or form something new, such as an organization, system, or relationship.',
            dialogue: [
                { speaker: 'A', chinese: '他們建立了新的公司。', pinyin: 'Tāmen jiànlì le xīn de gōngsī.', english: 'They established a new company.' },
                { speaker: 'B', chinese: '希望他們成功。', pinyin: 'Xīwàng tāmen chénggōng.', english: 'I hope they succeed.' }

        }, {

            pinyin: 'jiànshè',
            pos: 'N / V',
            en: 'Construction / To build',
            explanation: 'As a noun, the process of building or developing something. As a verb, to construct or build.',
            dialogue: [
                { speaker: 'A', chinese: '這個城市的建設很快。', pinyin: 'Zhège chéngshì de jiànshè hěn kuài.', english: 'The construction of this city is very fast.' },
                { speaker: 'B', chinese: '對，許多新大樓正在建設中。', pinyin: 'Duì, xǔduō xīn dàlóu zhèngzài jiànshè zhōng.', english: 'Yes, many new buildings are under construction.' }
            ]
        }, {
            char: '驕傲',
            pinyin: 'jiāoào',
            pos: 'Vs',
            en: 'Proud / Arrogant',
            explanation: 'Can mean proud (positive) or arrogant (negative). Context determines the meaning.',
            dialogue: [
                { speaker: 'A', chinese: '他為自己的孩子感到驕傲。', pinyin: 'Tā wèi zìjǐ de háizi gǎndào jiāoào.', english: 'He is proud of his children.' },
                { speaker: 'B', chinese: '父母都應該這樣。', pinyin: 'Fùmǔ dōu yīnggāi zhèyàng.', english: 'All parents should be that way.' }
            ]
        }, {
            char: '交流',
            pinyin: 'jiāoliú',
            pos: 'Vi',
            en: 'To exchange / To communicate',
            explanation: 'To share ideas, feelings, or information between people or groups.',
            dialogue: [
                { speaker: 'A', chinese: '我們需要加強文化交流。', pinyin: 'Wǒmen xūyào jiāqiáng wénhuà jiāoliú.', english: 'We need to strengthen cultural exchange.' },
                { speaker: 'B', chinese: '這樣可以增進理解。', pinyin: 'Zhèyàng kěyǐ zēngjìn lǐjiě.', english: 'This can enhance understanding.' }
            ]
        }, {
            char: '郊區',
            pinyin: 'jiāoqū',
            pos: 'N',
            en: 'Suburb',
            explanation: 'The area outside a city but still close to it, often residential and less crowded.',
            dialogue: [
                { speaker: 'A', chinese: '我住在郊區，比較安靜。', pinyin: 'Wǒ zhù zài jiāoqū, bǐjiào ānjìng.', english: 'I live in the suburbs, it\'s quieter.' },
                { speaker: 'B', chinese: '我也喜歡郊區的環境。', pinyin: 'Wǒ yě xǐhuān jiāoqū de huánjìng.', english: 'I also like the environment of the suburbs.' }
            ]
        }, {
            char: '交友',
            pinyin: 'jiāoyǒu',
            pos: 'Vi',
            en: 'To make friends',
            explanation: 'To form friendships with others.',
            dialogue: [
                { speaker: 'A', chinese: '他很善於交友。', pinyin: 'Tā hěn shànyú jiāoyǒu.', english: 'He is good at making friends.' },
                { speaker: 'B', chinese: '對，他性格開朗。', pinyin: 'Duì, tā xìnggé kāilǎng.', english: 'Yes, he has an outgoing personality.' }
            ]
        }, {
            char: '角度',
            pinyin: 'jiǎodù',
            pos: 'N',
            en: 'Angle / Point of view',
            explanation: 'The angle formed by lines, or a particular perspective or way of looking at something.',
            dialogue: [
                { speaker: 'A', chinese: '這個問題有很多角度。', pinyin: 'Zhège wèntí yǒu hěnduō jiǎodù.', english: 'This issue has many angles.' },
                { speaker: 'B', chinese: '我們應該從不同角度思考。', pinyin: 'Wǒmen yīnggāi cóng bùtóng jiǎodù sīkǎo.', english: 'We should think from different perspectives.' }
            ]
        }, {
            char: '教',
            pinyin: 'jiào',
            pos: 'Vst',
            en: 'To teach / To instruct',
            explanation: 'To impart knowledge or skill to someone. Often used as a verb meaning "to teach."',
            dialogue: [
                { speaker: 'A', chinese: '他教中文。', pinyin: 'Tā jiào Zhōngwén.', english: 'He teaches Chinese.' },
                { speaker: 'B', chinese: '他是個好老師。', pinyin: 'Tā shì gè hǎo lǎoshī.', english: 'He is a good teacher.' }
            ]
        }, {
            char: '教材',
            pinyin: 'jiàocái',
            pos: 'N',
            en: 'Teaching materials',
            explanation: 'Books, worksheets, audio, or other resources used in teaching.',
            dialogue: [
                { speaker: 'A', chinese: '你準備好教材了嗎？', pinyin: 'Nǐ zhǔnbèi hǎo jiàocái le ma?', english: 'Have you prepared the teaching materials?' },
                { speaker: 'B', chinese: '準備好了，這是講義和練習題。', pinyin: 'Zhǔnbèi hǎo le, zhè shì jiǎngyì hé liànxí tí.', english: 'Yes, here are the handouts and practice exercises.' }
            ]
        }, {
            char: '教導',
            pinyin: 'jiàodǎo',
            pos: 'V',
            en: 'To guide / To instruct (moral)',
            explanation: 'To provide guidance, especially in moral or ethical matters, often from a mentor or authority.',
            dialogue: [
                { speaker: 'A', chinese: '父母教導孩子要誠實。', pinyin: 'Fùmǔ jiàodǎo háizi yào chéngshí.', english: 'Parents teach children to be honest.' },
                { speaker: 'B', chinese: '這是很重要的品德。', pinyin: 'Zhè shì hěn zhòngyào de pǐndé.', english: 'This is an important virtue.' }
            ]
        }, {
            char: '教法',
            pinyin: 'jiàofǎ',
            pos: 'N',
            en: 'Teaching method',
            explanation: 'The approach or method used in teaching, often based on educational philosophy.',
            dialogue: [
                { speaker: 'A', chinese: '這種教法很有效。', pinyin: 'Zhè zhǒng jiàofǎ hěn yǒuxiào.', english: 'This teaching method is very effective.' },
                { speaker: 'B', chinese: '對，學生都很喜歡。', pinyin: 'Duì, xuéshēng dōu hěn xǐhuān.', english: 'Yes, the students all like it.' }
            ]
        }];

        // ------------------------------------------------------------
        // RENDER ENGINE
        // ------------------------------------------------------------
        const grid = document.getElementById('vocabGrid');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const countDisplay = document.getElementById('countDisplay');
        const legendContainer = document.getElementById('legendContainer');
        const pinyinGlobalToggle = document.getElementById('pinyinGlobalToggle');
        const pinyinToggleLabel = document.getElementById('pinyinToggleLabel');

        let globalPinyinRevealed = false;

        // Legend
        const posSet = new Set(vocabData.map(d => d.pos));
        const posLabels = {
            'N': 'Noun',
            'V': 'Verb',
            'Vs': 'Stative Verb',
            'Vst': 'Stative/Transitive Verb',
            'Adv': 'Adverb',
            'Prep': 'Preposition',
            'M': 'Measure Word',
            'Ptc': 'Particle',
            'N/V': 'Noun / Verb',
            'Conj': 'Conjunction',
            'V-sep': 'Separable Verb',
            'Vpt': 'Verb Particle (Trans.)',
            'Vi': 'Intransitive Verb'
        };
        const dotColorMap = {
            'N': '#7ba9c9',
            'V': '#7fb06a',
            'Vs': '#5ba884',
            'Vst': '#5ba884',
            'Adv': '#c9a86a',
            'Prep': '#c97a9a',
            'M': '#9a7ac9',
            'Ptc': '#c9b86a',
            'N/V': '#7ba9c9',
            'Conj': '#f0d0b0',
            'V-sep': '#6ab06a',
            'Vpt': '#6a7ab0',
            'Vi': '#6a9a9a'
        };

        function buildLegend() {
            const sorted = Array.from(posSet).sort();
            let html = '';
            sorted.forEach(label => {
                const display = posLabels[label] || label;
                const color = dotColorMap[label] || '#b8aa98';
                html += `<span class="legend-item"><span class="legend-dot" style="background:${color};"></span>${display}</span>`;
            });
            legendContainer.innerHTML = html;
        }
        buildLegend();

        // Render function
        function render(filter = '') {
            const term = filter.trim().toLowerCase();
            let filtered = vocabData;

            if (term) {
                filtered = vocabData.filter(item => {
                    let dialogueSearch = '';
                    item.dialogue.forEach(line => {
                        dialogueSearch += line.chinese + ' ' + line.pinyin + ' ' + line.english + ' ';
                    });
                    const searchable = item.char + ' ' + item.pinyin + ' ' + item.en + ' ' + item.explanation + ' ' + dialogueSearch;
                    return searchable.toLowerCase().includes(term);
                });
            }

            countDisplay.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty">🔍 No matches found.</div>`;
                return;
            }

            let html = '';
            filtered.forEach((item, index) => {
                const posClass = 'pos-' + item.pos.replace('/', '-');
                const posDisplay = posLabels[item.pos] || item.pos;

                // Build dialogue HTML
                let dialogueHtml = '';
                dialogueHtml += `
                        <div class="dialogue-toggle-wrapper">
                            <strong>💬 Dialogue:</strong>
                            <button class="dialogue-toggle-btn" data-dialogue-idx="${index}">Show Pinyin & Translation</button>
                        </div>
                        <div class="dialogue-lines">
                    `;

                item.dialogue.forEach(line => {
                    const speakerClass = line.speaker === 'A' ? 'speaker-a' : 'speaker-b';
                    dialogueHtml += `
                            <div class="line">
                                <span class="${speakerClass}">${line.speaker}:</span>
                                <span class="zh">${line.chinese}</span>
                                <span class="dialogue-details">
                                    <span class="sep">·</span>
                                    <span class="pinyin-text">${line.pinyin}</span>
                                    <span class="sep">·</span>
                                    <span class="en-text">${line.english}</span>
                                </span>
                            </div>
                        `;
                });

                dialogueHtml += `</div>`;

                html += `
                        <div class="vocab-card" data-index="${index}">
                            <div class="char-row">
                                <span class="char">${item.char}</span>
                                <span class="pinyin-container" data-pinyin="${item.pinyin}" data-revealed="false">
                                    <span class="pinyin-value">${item.pinyin}</span>
                                </span>
                            </div>
                            <span class="pos ${posClass}">${posDisplay}</span>

                            <button class="details-toggle" data-target="details-${index}">
                                <span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)
                            </button>

                            <div id="details-${index}" class="details-content">
                                <div class="explanation">
                                    <div class="meaning-line">📘 ${item.en}</div>
                                    <br />
                                    <strong>📖 Usage:</strong> ${item.explanation}
                                </div>
                                <div class="dialogue-box" id="dialogue-box-${index}">
                                    ${dialogueHtml}
                                </div>
                            </div>
                        </div>
                    `;
            });

            grid.innerHTML = html;

            // ---- Click on the Hanzi toggles its pinyin ----
            document.querySelectorAll('.char').forEach(charEl => {
                charEl.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const row = this.closest('.char-row');
                    const pinyinContainer = row ? row.querySelector('.pinyin-container') : null;
                    if (!pinyinContainer) return;
                    const isRevealed = pinyinContainer.dataset.revealed === 'true';
                    const newState = !isRevealed;
                    pinyinContainer.dataset.revealed = newState ? 'true' : 'false';
                    pinyinContainer.classList.toggle('revealed', newState);
                });
            });

            // ---- Apply global state to all pinyin containers ----
            document.querySelectorAll('.pinyin-container').forEach(el => {
                const shouldReveal = globalPinyinRevealed;
                el.dataset.revealed = shouldReveal ? 'true' : 'false';
                el.classList.toggle('revealed', shouldReveal);
            });

            // ---- Toggle main details (Meaning/Explanation) ----
            document.querySelectorAll('.details-toggle').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const targetId = this.dataset.target;
                    const content = document.getElementById(targetId);
                    if (!content) return;

                    const isOpen = content.classList.contains('open');
                    if (isOpen) {
                        content.classList.remove('open');
                        this.classList.remove('active');
                        this.innerHTML = '<span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)';
                    } else {
                        content.classList.add('open');
                        this.classList.add('active');
                        this.innerHTML = '<span class="arrow">▲</span> Hide Details';
                    }
                });
            });

            // ---- Toggle dialogue pinyin/translation ----
            document.querySelectorAll('.dialogue-toggle-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = this.dataset.dialogueIdx;
                    const dialogueBox = document.getElementById(`dialogue-box-${idx}`);
                    if (!dialogueBox) return;

                    const isShowing = dialogueBox.classList.contains('show-translation');
                    if (isShowing) {
                        dialogueBox.classList.remove('show-translation');
                        this.textContent = 'Show Pinyin & Translation';
                    } else {
                        dialogueBox.classList.add('show-translation');
                        this.textContent = 'Hide Pinyin & Translation';
                    }
                });
            });

            updateGlobalToggleLabel();
        }

        // ---- Global Pinyin Toggle ----
        function updateGlobalToggleLabel() {
            if (globalPinyinRevealed) {
                pinyinToggleLabel.textContent = 'Hide All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔓';
            } else {
                pinyinToggleLabel.textContent = 'Show All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔊';
            }
        }

        pinyinGlobalToggle.addEventListener('click', function() {
            globalPinyinRevealed = !globalPinyinRevealed;
            document.querySelectorAll('.pinyin-container').forEach(el => {
                el.dataset.revealed = globalPinyinRevealed ? 'true' : 'false';
                el.classList.toggle('revealed', globalPinyinRevealed);
            });
            updateGlobalToggleLabel();
        });

        // ---- Search & Clear ----
        searchInput.addEventListener('input', () => render(searchInput.value));
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            render('');
            searchInput.focus();
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') clearBtn.click();
        });

        // ---- Initial render ----
        render('');
    </script>
</body>
</html>
