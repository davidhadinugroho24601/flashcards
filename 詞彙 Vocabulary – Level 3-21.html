<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 3-21 Flashcards (Click Hanzi for Pinyin)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: #f4f2ef;
            min-height: 100vh;
            padding: 2rem 1.5rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #1e1e2a;
        }

        .header h1 span {
            background: #d9c9b4;
            padding: 0.1rem 0.8rem;
            border-radius: 12px;
            color: #2c2c3a;
        }

        .header .sub {
            font-size: 1rem;
            color: #6b5f52;
            margin-top: 0.3rem;
            font-weight: 400;
        }

        .header .badge {
            display: inline-block;
            margin-top: 0.6rem;
            background: #2c2c3a;
            color: white;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            background: #ffffffd9;
            backdrop-filter: blur(6px);
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 2.2rem;
            border: 1px solid #e8e0d6;
        }

        .stats {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c2c3a;
            white-space: nowrap;
        }

        .stats strong {
            background: #ece6de;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-weight: 600;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f3efe9;
            padding: 0.1rem 0.1rem 0.1rem 1.2rem;
            border-radius: 40px;
            transition: 0.2s;
            border: 1px solid transparent;
            flex: 1;
            min-width: 180px;
        }

        .search-box:focus-within {
            background: #ffffff;
            border-color: #b8aa98;
            box-shadow: 0 0 0 3px rgba(184, 170, 152, 0.2);
        }

        .search-box input {
            border: none;
            background: transparent;
            font-size: 0.9rem;
            padding: 0.5rem 0;
            width: 100%;
            outline: none;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #1e1e2a;
        }

        .search-box input::placeholder {
            color: #a89b8c;
            font-weight: 400;
        }

        .search-box button {
            background: #2c2c3a;
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .search-box button:hover {
            background: #1a1a26;
        }

        .pinyin-global-toggle {
            background: #ece6de;
            border: 1px solid #d5cbbc;
            border-radius: 40px;
            padding: 0.3rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .pinyin-global-toggle:hover {
            background: #d5cbbc;
            border-color: #b8aa98;
        }

        .pinyin-global-toggle .icon {
            font-size: 1rem;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.2rem;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 0.6rem 1.2rem;
            background: #ffffffd9;
            border-radius: 40px;
            border: 1px solid #e8e0d6;
            font-size: 0.75rem;
            font-weight: 500;
            color: #2c2c3a;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .vocab-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid #ebe5dd;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .vocab-card:hover {
            border-color: #d0c3b2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .vocab-card .char-row {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.2rem;
        }

        .vocab-card .char {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1e1e2a;
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.2;
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease;
            padding: 0.1rem 0.4rem;
            border-radius: 8px;
            user-select: none;
        }

        .vocab-card .char:hover {
            color: #4a3f33;
            background: #f0ebe4;
        }

        .vocab-card .char:active {
            transform: scale(0.95);
        }

        .pinyin-container {
            display: inline-flex;
            align-items: center;
            min-width: 2.2rem;
            justify-content: center;
        }

        .pinyin-container .pinyin-value {
            font-size: 1rem;
            color: #6b5f52;
            font-weight: 400;
            letter-spacing: 0.3px;
            display: none;
        }

        .pinyin-container.revealed .pinyin-value {
            display: inline;
        }

        .vocab-card .pos {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            align-self: flex-start;
            margin-top: 0.6rem;
            background: #f0ebe4;
            color: #4a4037;
        }

        .pos-N {
            background: #dbe9f0;
            color: #1f5a7a;
        }
        .pos-V {
            background: #e6f0db;
            color: #3d6b2b;
        }
        .pos-Vs {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Vst {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Adv {
            background: #f0e6db;
            color: #7a5a2b;
        }
        .pos-Prep {
            background: #f0dbe6;
            color: #7a2b4a;
        }
        .pos-M {
            background: #e6dbf0;
            color: #4a2b7a;
        }
        .pos-Ptc {
            background: #f0e8db;
            color: #7a6b2b;
        }
        .pos-N\/V {
            background: #dbe8f0;
            color: #1f5a7a;
        }
        .pos-Conj {
            background: #f0e0d0;
            color: #7a5a3a;
        }
        .pos-Vpt {
            background: #d4d8e8;
            color: #3a4a7a;
        }
        .pos-N\/Prep {
            background: #b0c0d0;
            color: #2a4a6a;
        }

        .details-toggle {
            margin-top: 1.2rem;
            background: none;
            border: 1px solid #d5cbbc;
            border-radius: 30px;
            padding: 0.5rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #4a4037;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
            align-self: flex-start;
            background: #faf8f5;
        }

        .details-toggle:hover {
            background: #e8e0d6;
            border-color: #b8aa98;
        }

        .details-toggle .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .details-toggle.active .arrow {
            transform: rotate(180deg);
        }

        .details-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
        }

        .details-content.open {
            max-height: 900px;
            opacity: 1;
            margin-top: 1.2rem;
        }

        .details-content .explanation {
            background: #f8f6f2;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #2c2c3a;
            border-left: 4px solid #d0c3b2;
            margin-bottom: 1rem;
        }

        .details-content .explanation strong {
            color: #1e1e2a;
        }

        .details-content .explanation .meaning-line {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e1e2a;
            background: #e8e0d6;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 0.4rem;
        }

        .dialogue-box {
            background: #f0f4f8;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.8;
        }

        .dialogue-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 0.3rem;
        }

        .dialogue-toggle-btn {
            background: #e8e0d6;
            border: none;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .dialogue-toggle-btn:hover {
            background: #d5cbbc;
        }

        .dialogue-box .speaker-a {
            color: #1f5a7a;
            font-weight: 600;
        }

        .dialogue-box .speaker-b {
            color: #3d6b2b;
            font-weight: 600;
        }

        .dialogue-box .line {
            margin-bottom: 0.2rem;
        }
        .dialogue-box .line:last-child {
            margin-bottom: 0;
        }

        .dialogue-box .zh {
            font-family: 'Noto Sans SC', sans-serif;
            margin-right: 0.3rem;
        }

        .dialogue-details {
            display: none;
            margin-left: 0.3rem;
        }

        .dialogue-details .pinyin-text {
            font-weight: 400;
            color: #6b5f52;
        }

        .dialogue-details .en-text {
            font-style: italic;
            color: #4a4037;
        }

        .dialogue-details .sep {
            color: #b8aa98;
            margin: 0 0.2rem;
        }

        .dialogue-box.show-translation .dialogue-details {
            display: inline;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1.1rem;
            color: #8f8172;
            background: #faf8f5;
            border-radius: 30px;
            border: 1px dashed #d5cbbc;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.8rem 3rem;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                border-radius: 28px;
                padding: 1rem 1.2rem;
                gap: 0.8rem;
            }
            .stats {
                text-align: center;
            }
            .search-box {
                padding: 0.1rem 0.1rem 0.1rem 1rem;
            }
            .search-box button {
                padding: 0.4rem 1rem;
                font-size: 0.8rem;
            }
            .vocab-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .vocab-card .char {
                font-size: 1.8rem;
            }
            .pinyin-global-toggle {
                justify-content: center;
            }
        }

        @media (min-width: 641px) and (max-width: 900px) {
            .vocab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 詞彙 <span>Level 3-21</span></h1>
            <div class="sub">Flashcard Mode · <strong>Click the Hanzi</strong> to reveal Pinyin</div>
            <div class="badge">🔍 Click the character to show pinyin · "Show Details" for meaning & dialogue</div>
        </div>

        <div class="toolbar">
            <div class="stats">
                <strong id="countDisplay">0</strong> words
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Chinese, Pinyin, or English..." autocomplete="off" />
                <button id="clearBtn">✕</button>
            </div>
            <button class="pinyin-global-toggle" id="pinyinGlobalToggle">
                <span class="icon">🔊</span>
                <span id="pinyinToggleLabel">Show All Pinyin</span>
            </button>
        </div>

        <div class="legend" id="legendContainer"></div>

        <div class="vocab-grid" id="vocabGrid"></div>
    </div>

    <script>
        // ------------------------------------------------------------
        // DATA — Level 3-21 Vocabulary (Traditional Hanzi)
        // ------------------------------------------------------------
        const vocabData = [{
            char: '解',
            pinyin: 'jiě',
            pos: 'V / N',
            en: 'To solve / To understand',
            explanation: 'To untie, release, or solve. Also means "to understand" (解理). Used in many compound words like 解決 (to solve) or 了解 (to understand).',
            dialogue: [
                { speaker: 'A', chinese: '這個問題你解開了嗎？', pinyin: 'Zhège wèntí nǐ jiěkāi le ma?', english: 'Did you solve this problem?' },
                { speaker: 'B', chinese: '還沒，我需要更多時間。', pinyin: 'Hái méi, wǒ xūyào gèng duō shíjiān.', english: 'Not yet, I need more time.' }
            ]
        }, {
            char: '斤',
            pinyin: 'jīn',
            pos: 'M',
            en: 'Jin (Chinese unit of weight)',
            explanation: 'A traditional Chinese unit of weight equal to 500 grams. Commonly used in markets and for food.',
            dialogue: [
                { speaker: 'A', chinese: '我想買兩斤蘋果。', pinyin: 'Wǒ xiǎng mǎi liǎng jīn píngguǒ.', english: 'I want to buy two jin of apples.' },
                { speaker: 'B', chinese: '好的，一共二十元。', pinyin: 'Hǎo de, yīgòng èrshí yuán.', english: 'OK, 20 yuan in total.' }
            ]
        }, {
            char: '金',
            pinyin: 'jīn',
            pos: 'N',
            en: 'Gold / Metal (attributive)',
            explanation: 'Gold as a precious metal, or used attributively to mean "golden" or "metal." Also in many compound words.',
            dialogue: [
                { speaker: 'A', chinese: '她戴了一條金項鍊。', pinyin: 'Tā dài le yī tiáo jīn xiàngliàn.', english: 'She is wearing a gold necklace.' },
                { speaker: 'B', chinese: '很漂亮，是真的嗎？', pinyin: 'Hěn piàoliang, shì zhēn de ma?', english: 'It\'s beautiful, is it real?' }
            ]
        }, {
            char: '緊',
            pinyin: 'jǐn',
            pos: 'Vs',
            en: 'Tight / Urgent',
            explanation: 'Describes something that is tight, firm, or urgent. Used for physical tightness or time pressure.',
            dialogue: [
                { speaker: 'A', chinese: '這雙鞋太緊了。', pinyin: 'Zhè shuāng xié tài jǐn le.', english: 'These shoes are too tight.' },
                { speaker: 'B', chinese: '換一雙大一點的吧。', pinyin: 'Huàn yī shuāng dà yīdiǎn de ba.', english: 'Change to a bigger pair.' }
            ]
        }, {
            char: '僅',
            pinyin: 'jǐn',
            pos: 'Adv',
            en: 'Only / Merely',
            explanation: 'An adverb meaning "only" or "merely." Often used in formal writing to emphasize a small quantity or degree.',
            dialogue: [
                { speaker: 'A', chinese: '他僅用了三天就完成了工作。', pinyin: 'Tā jǐn yòng le sān tiān jiù wánchéng le gōngzuò.', english: 'He finished the work in only three days.' },
                { speaker: 'B', chinese: '真厲害！', pinyin: 'Zhēn lìhài!', english: 'Amazing!' }
            ]
        }, {
            char: '僅僅',
            pinyin: 'jǐnjǐn',
            pos: 'Adv',
            en: 'Only / Merely (emphatic)',
            explanation: 'A more emphatic version of 僅, meaning "only" or "merely," often with a sense of surprise or limitation.',
            dialogue: [
                { speaker: 'A', chinese: '我僅僅認識他一個月。', pinyin: 'Wǒ jǐnjǐn rènshi tā yī gè yuè.', english: 'I\'ve only known him for a month.' },
                { speaker: 'B', chinese: '那你們已經很熟悉了。', pinyin: 'Nà nǐmen yǐjīng hěn shúxī le.', english: 'Then you\'re already quite familiar.' }
            ]
        }, {
            char: '盡',
            pinyin: 'jìn',
            pos: 'V',
            en: 'To exhaust / To use up',
            explanation: 'To exhaust, use up, or do one\'s best. Often used in 盡量 (as much as possible) or 盡快 (as soon as possible).',
            dialogue: [
                { speaker: 'A', chinese: '我會盡力幫助你。', pinyin: 'Wǒ huì jìnlì bāngzhù nǐ.', english: 'I will do my best to help you.' },
                { speaker: 'B', chinese: '謝謝你，我會記住的。', pinyin: 'Xièxie nǐ, wǒ huì jìzhù de.', english: 'Thank you, I will remember.' }
            ]
        }, {
            char: '進',
            pinyin: 'jìn',
            pos: 'V',
            en: 'To enter / To advance',
            explanation: 'To go into or move forward. Often used in directions (進門 = enter) or progress (進步 = progress).',
            dialogue: [
                { speaker: 'A', chinese: '請進！', pinyin: 'Qǐng jìn!', english: 'Please come in!' },
                { speaker: 'B', chinese: '謝謝，打擾了。', pinyin: 'Xièxie, dǎrǎo le.', english: 'Thank you, sorry for the intrusion.' }
            ]
        }, {
            char: '經',
            pinyin: 'jīng',
            pos: 'V',
            en: 'To pass through / To manage',
            explanation: 'To undergo or experience. Also means "to manage" (經營). Used in many compound words related to time or experience.',
            dialogue: [
                { speaker: 'A', chinese: '他經過了很多困難。', pinyin: 'Tā jīngguò le hěnduō kùnnán.', english: 'He has gone through many difficulties.' },
                { speaker: 'B', chinese: '但他一直很堅強。', pinyin: 'Dàn tā yīzhí hěn jiānqiáng.', english: 'But he has always been strong.' }
            ]
        }, {
            char: '經費',
            pinyin: 'jīngfèi',
            pos: 'N',
            en: 'Funds / Budget',
            explanation: 'Money allocated for a specific purpose, such as a project, organization, or research.',
            dialogue: [
                { speaker: 'A', chinese: '我們需要更多經費。', pinyin: 'Wǒmen xūyào gèng duō jīngfèi.', english: 'We need more funding.' },
                { speaker: 'B', chinese: '我會向上面申請。', pinyin: 'Wǒ huì xiàng shàngmiàn shēnqǐng.', english: 'I will apply to the higher-ups.' }
            ]
        }, {
            char: '經過',
            pinyin: 'jīngguò',
            pos: 'N / Prep',
            en: 'To pass through / Via / Process',
            explanation: 'As a verb/preposition, to pass through a place or time. As a noun, the process or course of something.',
            dialogue: [
                { speaker: 'A', chinese: '經過這件事，我學到了很多。', pinyin: 'Jīngguò zhè jiàn shì, wǒ xué dào le hěnduō.', english: 'Through this matter, I learned a lot.' },
                { speaker: 'B', chinese: '每個人都需要經驗才能成長。', pinyin: 'Měi gè rén dōu xūyào jīngyàn cáinéng chéngzhǎng.', english: 'Everyone needs experience to grow.' }
            ]
        }, {
            char: '驚訝',
            pinyin: 'jīngyà',
            pos: 'Vs',
            en: 'Surprised / Amazed',
            explanation: 'Describes a feeling of surprise or astonishment at something unexpected.',
            dialogue: [
                { speaker: 'A', chinese: '他聽到消息時很驚訝。', pinyin: 'Tā tīng dào xiāoxi shí hěn jīngyà.', english: 'He was very surprised when he heard the news.' },
                { speaker: 'B', chinese: '誰都會驚訝吧。', pinyin: 'Shéi dōu huì jīngyà ba.', english: 'Anyone would be surprised.' }
            ]
        }, {
            char: '經驗',
            pinyin: 'jīngyàn',
            pos: 'Vpt',
            en: 'Experience',
            explanation: 'Knowledge or skill gained from doing or seeing things over time. Also used as a verb meaning "to experience."',
            dialogue: [
                { speaker: 'A', chinese: '他有很多工作經驗。', pinyin: 'Tā yǒu hěnduō gōngzuò jīngyàn.', english: 'He has a lot of work experience.' },
                { speaker: 'B', chinese: '難怪他做事這麼穩妥。', pinyin: 'Nánguài tā zuòshì zhème wěntuǒ.', english: 'No wonder he handles things so well.' }
            ]
        }, {
            char: '警察',
            pinyin: 'jǐngchá',
            pos: 'N',
            en: 'Police',
            explanation: 'Law enforcement officers responsible for maintaining public order and safety.',
            dialogue: [
                { speaker: 'A', chinese: '警察在維持秩序。', pinyin: 'Jǐngchá zài wéichí zhìxù.', english: 'The police are maintaining order.' },
                { speaker: 'B', chinese: '我們應該配合他們的工作。', pinyin: 'Wǒmen yīnggāi pèihé tāmen de gōngzuò.', english: 'We should cooperate with them.' }
            ]
        }, {
            char: '儘管',
            pinyin: 'jǐnguǎn',
            pos: 'Conj',
            en: 'Although / Despite',
            explanation: 'A conjunction used to introduce a contrastive clause, similar to "although" or "despite" in English.',
            dialogue: [
                { speaker: 'A', chinese: '儘管天氣不好，我們還是去了。', pinyin: 'Jǐnguǎn tiānqì bù hǎo, wǒmen háishì qù le.', english: 'Although the weather was bad, we still went.' },
                { speaker: 'B', chinese: '你們真有毅力。', pinyin: 'Nǐmen zhēn yǒu yìlì.', english: 'You have a lot of perseverance.' }
            ]
        }, {
            char: '進行',
            pinyin: 'jìnxíng',
            pos: 'V',
            en: 'To carry out / To conduct',
            explanation: 'To proceed with or execute a task, activity, or process. Often used in formal or business contexts.',
            dialogue: [
                { speaker: 'A', chinese: '會議正在進行中。', pinyin: 'Huìyì zhèngzài jìnxíng zhōng.', english: 'The meeting is in progress.' },
                { speaker: 'B', chinese: '我們不要打擾他們。', pinyin: 'Wǒmen bùyào dǎrǎo tāmen.', english: 'Let\'s not disturb them.' }
            ]
        }, {
            char: '進一步',
            pinyin: 'jìnyībù',
            pos: 'Adv',
            en: 'Further / One step further',
            explanation: 'Indicates further progress or a deeper level of action, often used in discussions of plans or research.',
            dialogue: [
                { speaker: 'A', chinese: '我們需要進一步討論這個問題。', pinyin: 'Wǒmen xūyào jìnyībù tǎolùn zhège wèntí.', english: 'We need to discuss this issue further.' },
                { speaker: 'B', chinese: '好的，我們約個時間吧。', pinyin: 'Hǎo de, wǒmen yuē gè shíjiān ba.', english: 'OK, let\'s set a time.' }
            ]
        }, {
            char: '酒吧',
            pinyin: 'jiǔbā',
            pos: 'N',
            en: 'Bar / Pub',
            explanation: 'A place where alcoholic drinks are sold and consumed, often with music and socializing.',
            dialogue: [
                { speaker: 'A', chinese: '我們去酒吧喝一杯吧。', pinyin: 'Wǒmen qù jiǔbā hē yī bēi ba.', english: 'Let\'s go to the bar for a drink.' },
                { speaker: 'B', chinese: '好，我知道附近有一家不錯的。', pinyin: 'Hǎo, wǒ zhīdào fùjìn yǒu yī jiā bùcuò de.', english: 'OK, I know a good one nearby.' }
            ]
        }, {
            char: '救',
            pinyin: 'jiù',
            pos: 'V',
            en: 'To rescue / To save',
            explanation: 'To save someone from danger or harm. Also used in 救命 (help) and 救火 (firefighting).',
            dialogue: [
                { speaker: 'A', chinese: '消防員救出了被困的人。', pinyin: 'Xiāofángyuán jiù chū le bèi kùn de rén.', english: 'The firefighters rescued the trapped people.' },
                { speaker: 'B', chinese: '他們真是英雄。', pinyin: 'Tāmen zhēn shì yīngxióng.', english: 'They are true heroes.' }
            ]
        }, {
            char: '就',
            pinyin: 'jiù',
            pos: 'Prep',
            en: 'Just / Right away / Then',
            explanation: 'A versatile preposition/adverb indicating immediacy, emphasis, or a sequence of events (e.g., 就是 = exactly, 就要 = about to).',
            dialogue: [
                { speaker: 'A', chinese: '我就要這本書。', pinyin: 'Wǒ jiù yào zhè běn shū.', english: 'I want this book exactly.' },
                { speaker: 'B', chinese: '好，給你。', pinyin: 'Hǎo, gěi nǐ.', english: 'OK, here you go.' }
            ]
        }, {
            char: '就是',
            pinyin: 'jiùshì',
            pos: 'Conj',
            en: 'Exactly / That is',
            explanation: 'Used to emphasize identity or to explain something, similar to "that is" or "exactly" in English.',
            dialogue: [
                { speaker: 'A', chinese: '他就是我們的老師。', pinyin: 'Tā jiùshì wǒmen de lǎoshī.', english: 'He is exactly our teacher.' },
                { speaker: 'B', chinese: '原來如此！', pinyin: 'Yuánlái rúcǐ!', english: 'So that\'s it!' }
            ]
        }, {
            char: '就算',
            pinyin: 'jiùsuàn',
            pos: 'Conj',
            en: 'Even if',
            explanation: 'A conjunction meaning "even if," used to introduce a hypothetical or extreme condition.',
            dialogue: [
                { speaker: 'A', chinese: '就算下雨，我們也要去。', pinyin: 'Jiùsuàn xià yǔ, wǒmen yě yào qù.', english: 'Even if it rains, we still have to go.' },
                { speaker: 'B', chinese: '好吧，我們準備雨具。', pinyin: 'Hǎo ba, wǒmen zhǔnbèi yǔjù.', english: 'OK, let\'s prepare rain gear.' }
            ]
        }, {
            char: '舅舅',
            pinyin: 'jiùjiu',
            pos: 'N',
            en: 'Maternal uncle',
            explanation: 'The brother of one\'s mother. A specific kinship term for a mother\'s brother.',
            dialogue: [
                { speaker: 'A', chinese: '我舅舅從國外回來了。', pinyin: 'Wǒ jiùjiu cóng guówài huílái le.', english: 'My maternal uncle is back from abroad.' },
                { speaker: 'B', chinese: '真棒，你們全家可以團聚了。', pinyin: 'Zhēn bàng, nǐmen quánjiā kěyǐ tuánjù le.', english: 'That\'s great, your whole family can reunite.' }
            ]
        }, {
            char: '舅媽',
            pinyin: 'jiùmā',
            pos: 'N',
            en: 'Maternal uncle\'s wife',
            explanation: 'The wife of one\'s maternal uncle. A specific kinship term.',
            dialogue: [
                { speaker: 'A', chinese: '我舅媽做飯很好吃。', pinyin: 'Wǒ jiùmā zuòfàn hěn hǎochī.', english: 'My aunt (maternal uncle\'s wife) cooks very well.' },
                { speaker: 'B', chinese: '我想去你家吃一頓。', pinyin: 'Wǒ xiǎng qù nǐ jiā chī yī dùn.', english: 'I want to go to your house for a meal.' }
            ]
        }];

        // ------------------------------------------------------------
        // RENDER ENGINE
        // ------------------------------------------------------------
        const grid = document.getElementById('vocabGrid');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const countDisplay = document.getElementById('countDisplay');
        const legendContainer = document.getElementById('legendContainer');
        const pinyinGlobalToggle = document.getElementById('pinyinGlobalToggle');
        const pinyinToggleLabel = document.getElementById('pinyinToggleLabel');

        let globalPinyinRevealed = false;

        // Legend
        const posSet = new Set(vocabData.map(d => d.pos));
        const posLabels = {
            'N': 'Noun',
            'V': 'Verb',
            'Vs': 'Stative Verb',
            'Vst': 'Stative/Transitive Verb',
            'Adv': 'Adverb',
            'Prep': 'Preposition',
            'M': 'Measure Word',
            'Ptc': 'Particle',
            'N/V': 'Noun / Verb',
            'Conj': 'Conjunction',
            'Vpt': 'Verb Particle (Trans.)',
            'N/Prep': 'Noun / Preposition'
        };
        const dotColorMap = {
            'N': '#7ba9c9',
            'V': '#7fb06a',
            'Vs': '#5ba884',
            'Vst': '#5ba884',
            'Adv': '#c9a86a',
            'Prep': '#c97a9a',
            'M': '#9a7ac9',
            'Ptc': '#c9b86a',
            'N/V': '#7ba9c9',
            'Conj': '#f0d0b0',
            'Vpt': '#6a7ab0',
            'N/Prep': '#b0c0d0'
        };

        function buildLegend() {
            const sorted = Array.from(posSet).sort();
            let html = '';
            sorted.forEach(label => {
                const display = posLabels[label] || label;
                const color = dotColorMap[label] || '#b8aa98';
                html += `<span class="legend-item"><span class="legend-dot" style="background:${color};"></span>${display}</span>`;
            });
            legendContainer.innerHTML = html;
        }
        buildLegend();

        // Render function
        function render(filter = '') {
            const term = filter.trim().toLowerCase();
            let filtered = vocabData;

            if (term) {
                filtered = vocabData.filter(item => {
                    let dialogueSearch = '';
                    item.dialogue.forEach(line => {
                        dialogueSearch += line.chinese + ' ' + line.pinyin + ' ' + line.english + ' ';
                    });
                    const searchable = item.char + ' ' + item.pinyin + ' ' + item.en + ' ' + item.explanation + ' ' + dialogueSearch;
                    return searchable.toLowerCase().includes(term);
                });
            }

            countDisplay.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty">🔍 No matches found.</div>`;
                return;
            }

            let html = '';
            filtered.forEach((item, index) => {
                const posClass = 'pos-' + item.pos.replace('/', '-');
                const posDisplay = posLabels[item.pos] || item.pos;

                // Build dialogue HTML
                let dialogueHtml = '';
                dialogueHtml += `
                        <div class="dialogue-toggle-wrapper">
                            <strong>💬 Dialogue:</strong>
                            <button class="dialogue-toggle-btn" data-dialogue-idx="${index}">Show Pinyin & Translation</button>
                        </div>
                        <div class="dialogue-lines">
                    `;

                item.dialogue.forEach(line => {
                    const speakerClass = line.speaker === 'A' ? 'speaker-a' : 'speaker-b';
                    dialogueHtml += `
                            <div class="line">
                                <span class="${speakerClass}">${line.speaker}:</span>
                                <span class="zh">${line.chinese}</span>
                                <span class="dialogue-details">
                                    <span class="sep">·</span>
                                    <span class="pinyin-text">${line.pinyin}</span>
                                    <span class="sep">·</span>
                                    <span class="en-text">${line.english}</span>
                                </span>
                            </div>
                        `;
                });

                dialogueHtml += `</div>`;

                html += `
                        <div class="vocab-card" data-index="${index}">
                            <div class="char-row">
                                <span class="char">${item.char}</span>
                                <span class="pinyin-container" data-pinyin="${item.pinyin}" data-revealed="false">
                                    <span class="pinyin-value">${item.pinyin}</span>
                                </span>
                            </div>
                            <span class="pos ${posClass}">${posDisplay}</span>

                            <button class="details-toggle" data-target="details-${index}">
                                <span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)
                            </button>

                            <div id="details-${index}" class="details-content">
                                <div class="explanation">
                                    <div class="meaning-line">📘 ${item.en}</div>
                                    <br />
                                    <strong>📖 Usage:</strong> ${item.explanation}
                                </div>
                                <div class="dialogue-box" id="dialogue-box-${index}">
                                    ${dialogueHtml}
                                </div>
                            </div>
                        </div>
                    `;
            });

            grid.innerHTML = html;

            // ---- Click on the Hanzi toggles its pinyin ----
            document.querySelectorAll('.char').forEach(charEl => {
                charEl.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const row = this.closest('.char-row');
                    const pinyinContainer = row ? row.querySelector('.pinyin-container') : null;
                    if (!pinyinContainer) return;
                    const isRevealed = pinyinContainer.dataset.revealed === 'true';
                    const newState = !isRevealed;
                    pinyinContainer.dataset.revealed = newState ? 'true' : 'false';
                    pinyinContainer.classList.toggle('revealed', newState);
                });
            });

            // ---- Apply global state to all pinyin containers ----
            document.querySelectorAll('.pinyin-container').forEach(el => {
                const shouldReveal = globalPinyinRevealed;
                el.dataset.revealed = shouldReveal ? 'true' : 'false';
                el.classList.toggle('revealed', shouldReveal);
            });

            // ---- Toggle main details (Meaning/Explanation) ----
            document.querySelectorAll('.details-toggle').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const targetId = this.dataset.target;
                    const content = document.getElementById(targetId);
                    if (!content) return;

                    const isOpen = content.classList.contains('open');
                    if (isOpen) {
                        content.classList.remove('open');
                        this.classList.remove('active');
                        this.innerHTML = '<span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)';
                    } else {
                        content.classList.add('open');
                        this.classList.add('active');
                        this.innerHTML = '<span class="arrow">▲</span> Hide Details';
                    }
                });
            });

            // ---- Toggle dialogue pinyin/translation ----
            document.querySelectorAll('.dialogue-toggle-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = this.dataset.dialogueIdx;
                    const dialogueBox = document.getElementById(`dialogue-box-${idx}`);
                    if (!dialogueBox) return;

                    const isShowing = dialogueBox.classList.contains('show-translation');
                    if (isShowing) {
                        dialogueBox.classList.remove('show-translation');
                        this.textContent = 'Show Pinyin & Translation';
                    } else {
                        dialogueBox.classList.add('show-translation');
                        this.textContent = 'Hide Pinyin & Translation';
                    }
                });
            });

            updateGlobalToggleLabel();
        }

        // ---- Global Pinyin Toggle ----
        function updateGlobalToggleLabel() {
            if (globalPinyinRevealed) {
                pinyinToggleLabel.textContent = 'Hide All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔓';
            } else {
                pinyinToggleLabel.textContent = 'Show All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔊';
            }
        }

        pinyinGlobalToggle.addEventListener('click', function() {
            globalPinyinRevealed = !globalPinyinRevealed;
            document.querySelectorAll('.pinyin-container').forEach(el => {
                el.dataset.revealed = globalPinyinRevealed ? 'true' : 'false';
                el.classList.toggle('revealed', globalPinyinRevealed);
            });
            updateGlobalToggleLabel();
        });

        // ---- Search & Clear ----
        searchInput.addEventListener('input', () => render(searchInput.value));
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            render('');
            searchInput.focus();
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') clearBtn.click();
        });

        // ---- Initial render ----
        render('');
    </script>
</body>
</html>
