<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 3-6 Flashcards (Click Hanzi for Pinyin)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: #f4f2ef;
            min-height: 100vh;
            padding: 2rem 1.5rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #1e1e2a;
        }

        .header h1 span {
            background: #d9c9b4;
            padding: 0.1rem 0.8rem;
            border-radius: 12px;
            color: #2c2c3a;
        }

        .header .sub {
            font-size: 1rem;
            color: #6b5f52;
            margin-top: 0.3rem;
            font-weight: 400;
        }

        .header .badge {
            display: inline-block;
            margin-top: 0.6rem;
            background: #2c2c3a;
            color: white;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            background: #ffffffd9;
            backdrop-filter: blur(6px);
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 2.2rem;
            border: 1px solid #e8e0d6;
        }

        .stats {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c2c3a;
            white-space: nowrap;
        }

        .stats strong {
            background: #ece6de;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-weight: 600;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f3efe9;
            padding: 0.1rem 0.1rem 0.1rem 1.2rem;
            border-radius: 40px;
            transition: 0.2s;
            border: 1px solid transparent;
            flex: 1;
            min-width: 180px;
        }

        .search-box:focus-within {
            background: #ffffff;
            border-color: #b8aa98;
            box-shadow: 0 0 0 3px rgba(184, 170, 152, 0.2);
        }

        .search-box input {
            border: none;
            background: transparent;
            font-size: 0.9rem;
            padding: 0.5rem 0;
            width: 100%;
            outline: none;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #1e1e2a;
        }

        .search-box input::placeholder {
            color: #a89b8c;
            font-weight: 400;
        }

        .search-box button {
            background: #2c2c3a;
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .search-box button:hover {
            background: #1a1a26;
        }

        .pinyin-global-toggle {
            background: #ece6de;
            border: 1px solid #d5cbbc;
            border-radius: 40px;
            padding: 0.3rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .pinyin-global-toggle:hover {
            background: #d5cbbc;
            border-color: #b8aa98;
        }

        .pinyin-global-toggle .icon {
            font-size: 1rem;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.2rem;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 0.6rem 1.2rem;
            background: #ffffffd9;
            border-radius: 40px;
            border: 1px solid #e8e0d6;
            font-size: 0.75rem;
            font-weight: 500;
            color: #2c2c3a;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .vocab-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid #ebe5dd;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .vocab-card:hover {
            border-color: #d0c3b2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .vocab-card .char-row {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.2rem;
        }

        .vocab-card .char {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1e1e2a;
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.2;
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease;
            padding: 0.1rem 0.4rem;
            border-radius: 8px;
            user-select: none;
        }

        .vocab-card .char:hover {
            color: #4a3f33;
            background: #f0ebe4;
        }

        .vocab-card .char:active {
            transform: scale(0.95);
        }

        .pinyin-container {
            display: inline-flex;
            align-items: center;
            min-width: 2.2rem;
            justify-content: center;
        }

        .pinyin-container .pinyin-value {
            font-size: 1rem;
            color: #6b5f52;
            font-weight: 400;
            letter-spacing: 0.3px;
            display: none;
        }

        .pinyin-container.revealed .pinyin-value {
            display: inline;
        }

        .vocab-card .pos {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            align-self: flex-start;
            margin-top: 0.6rem;
            background: #f0ebe4;
            color: #4a4037;
        }

        .pos-N {
            background: #dbe9f0;
            color: #1f5a7a;
        }
        .pos-V {
            background: #e6f0db;
            color: #3d6b2b;
        }
        .pos-Vs {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Vst {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Adv {
            background: #f0e6db;
            color: #7a5a2b;
        }
        .pos-Prep {
            background: #f0dbe6;
            color: #7a2b4a;
        }
        .pos-M {
            background: #e6dbf0;
            color: #4a2b7a;
        }
        .pos-Ptc {
            background: #f0e8db;
            color: #7a6b2b;
        }
        .pos-N\/V {
            background: #dbe8f0;
            color: #1f5a7a;
        }
        .pos-Conj {
            background: #f0e0d0;
            color: #7a5a3a;
        }
        .pos-Det {
            background: #f0d4d4;
            color: #7a3a3a;
        }
        .pos-V-sep {
            background: #d4e8d4;
            color: #2d6b2d;
        }
        .pos-Vp {
            background: #d4d8e8;
            color: #3a4a7a;
        }
        .pos-Vi {
            background: #d4e0e0;
            color: #2d5a5a;
        }

        .details-toggle {
            margin-top: 1.2rem;
            background: none;
            border: 1px solid #d5cbbc;
            border-radius: 30px;
            padding: 0.5rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #4a4037;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
            align-self: flex-start;
            background: #faf8f5;
        }

        .details-toggle:hover {
            background: #e8e0d6;
            border-color: #b8aa98;
        }

        .details-toggle .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .details-toggle.active .arrow {
            transform: rotate(180deg);
        }

        .details-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
        }

        .details-content.open {
            max-height: 900px;
            opacity: 1;
            margin-top: 1.2rem;
        }

        .details-content .explanation {
            background: #f8f6f2;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #2c2c3a;
            border-left: 4px solid #d0c3b2;
            margin-bottom: 1rem;
        }

        .details-content .explanation strong {
            color: #1e1e2a;
        }

        .details-content .explanation .meaning-line {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e1e2a;
            background: #e8e0d6;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 0.4rem;
        }

        .dialogue-box {
            background: #f0f4f8;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.8;
        }

        .dialogue-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 0.3rem;
        }

        .dialogue-toggle-btn {
            background: #e8e0d6;
            border: none;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .dialogue-toggle-btn:hover {
            background: #d5cbbc;
        }

        .dialogue-box .speaker-a {
            color: #1f5a7a;
            font-weight: 600;
        }

        .dialogue-box .speaker-b {
            color: #3d6b2b;
            font-weight: 600;
        }

        .dialogue-box .line {
            margin-bottom: 0.2rem;
        }
        .dialogue-box .line:last-child {
            margin-bottom: 0;
        }

        .dialogue-box .zh {
            font-family: 'Noto Sans SC', sans-serif;
            margin-right: 0.3rem;
        }

        .dialogue-details {
            display: none;
            margin-left: 0.3rem;
        }

        .dialogue-details .pinyin-text {
            font-weight: 400;
            color: #6b5f52;
        }

        .dialogue-details .en-text {
            font-style: italic;
            color: #4a4037;
        }

        .dialogue-details .sep {
            color: #b8aa98;
            margin: 0 0.2rem;
        }

        .dialogue-box.show-translation .dialogue-details {
            display: inline;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1.1rem;
            color: #8f8172;
            background: #faf8f5;
            border-radius: 30px;
            border: 1px dashed #d5cbbc;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.8rem 3rem;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                border-radius: 28px;
                padding: 1rem 1.2rem;
                gap: 0.8rem;
            }
            .stats {
                text-align: center;
            }
            .search-box {
                padding: 0.1rem 0.1rem 0.1rem 1rem;
            }
            .search-box button {
                padding: 0.4rem 1rem;
                font-size: 0.8rem;
            }
            .vocab-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .vocab-card .char {
                font-size: 1.8rem;
            }
            .pinyin-global-toggle {
                justify-content: center;
            }
        }

        @media (min-width: 641px) and (max-width: 900px) {
            .vocab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 詞彙 <span>Level 3-6</span></h1>
            <div class="sub">Flashcard Mode · <strong>Click the Hanzi</strong> to reveal Pinyin</div>
            <div class="badge">🔍 Click the character to show pinyin · "Show Details" for meaning & dialogue</div>
        </div>

        <div class="toolbar">
            <div class="stats">
                <strong id="countDisplay">0</strong> words
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Chinese, Pinyin, or English..." autocomplete="off" />
                <button id="clearBtn">✕</button>
            </div>
            <button class="pinyin-global-toggle" id="pinyinGlobalToggle">
                <span class="icon">🔊</span>
                <span id="pinyinToggleLabel">Show All Pinyin</span>
            </button>
        </div>

        <div class="legend" id="legendContainer"></div>

        <div class="vocab-grid" id="vocabGrid"></div>
    </div>

    <script>
        // ------------------------------------------------------------
        // DATA — Level 3-6 Vocabulary (Traditional Hanzi)
        // ------------------------------------------------------------
        const vocabData = [{
            char: '抽',
            pinyin: 'chōu',
            pos: 'V',
            en: 'To pull out / To take out',
            explanation: 'To extract or remove something from a container, often with a quick motion. Used for taking out a card, a tissue, or drawing a lottery.',
            dialogue: [
                { speaker: 'A', chinese: '請抽一張卡片。', pinyin: 'Qǐng chōu yī zhāng kǎpiàn.', english: 'Please draw a card.' },
                { speaker: 'B', chinese: '我抽到了這張。', pinyin: 'Wǒ chōu dào le zhè zhāng.', english: 'I drew this one.' }
            ]
        }, {
            char: '初',
            pinyin: 'chū',
            pos: 'N',
            en: 'Beginning / Early',
            explanation: 'Refers to the initial stage of a period, such as the beginning of the month, year, or a new phase. Also means "first" in a sequence.',
            dialogue: [
                { speaker: 'A', chinese: '月初我們要開會。', pinyin: 'Yuèchū wǒmen yào kāihuì.', english: 'We have a meeting at the beginning of the month.' },
                { speaker: 'B', chinese: '好的，我會準時參加。', pinyin: 'Hǎo de, wǒ huì zhǔnshí cānjiā.', english: 'OK, I will attend on time.' }
            ]
        }, {
            char: '串',
            pinyin: 'chuàn',
            pos: 'M',
            en: 'Measure word for strings / clusters',
            explanation: 'Used for things that are strung together, like skewers, beads, keys, or a series of events. Also used for a bunch of items.',
            dialogue: [
                { speaker: 'A', chinese: '我買了一串羊肉串。', pinyin: 'Wǒ mǎi le yī chuàn yángròu chuàn.', english: 'I bought a skewer of lamb kebabs.' },
                { speaker: 'B', chinese: '我也想吃！', pinyin: 'Wǒ yě xiǎng chī!', english: 'I want to eat one too!' }
            ]
        }, {
            char: '創造',
            pinyin: 'chuàngzào',
            pos: 'V',
            en: 'To create / To bring about',
            explanation: 'To invent or produce something new and original, often in art, science, or technology. Implies innovation and imagination.',
            dialogue: [
                { speaker: 'A', chinese: '藝術家在創造新的作品。', pinyin: 'Yìshùjiā zài chuàngzào xīn de zuòpǐn.', english: 'The artist is creating new works.' },
                { speaker: 'B', chinese: '我很期待看到。', pinyin: 'Wǒ hěn qīdài kàndào.', english: 'I look forward to seeing them.' }
            ]
        }, {
            char: '出版',
            pinyin: 'chūbǎn',
            pos: 'V',
            en: 'To publish',
            explanation: 'To produce and distribute books, magazines, or other media to the public. Often used in the context of authors and publishers.',
            dialogue: [
                { speaker: 'A', chinese: '他的新書下個月出版。', pinyin: 'Tā de xīn shū xià gè yuè chūbǎn.', english: 'His new book will be published next month.' },
                { speaker: 'B', chinese: '我一定會買一本。', pinyin: 'Wǒ yīdìng huì mǎi yī běn.', english: 'I will definitely buy a copy.' }
            ]
        }, {
            char: '出差',
            pinyin: 'chūchāi',
            pos: 'V-sep',
            en: 'To go on a business trip',
            explanation: 'A separable verb meaning to travel for work to another city or country. Can be used with objects like 出過差 (have been on a business trip).',
            dialogue: [
                { speaker: 'A', chinese: '他明天要出差去上海。', pinyin: 'Tā míngtiān yào chūchāi qù Shànghǎi.', english: 'He is going on a business trip to Shanghai tomorrow.' },
                { speaker: 'B', chinese: '他會去幾天？', pinyin: 'Tā huì qù jǐ tiān?', english: 'How many days will he be gone?' }
            ]
        }, {
            char: '出發',
            pinyin: 'chūfā',
            pos: 'Vp',
            en: 'To set out / To depart',
            explanation: 'To leave a place to begin a journey or trip. Often used with a destination or a time.',
            dialogue: [
                { speaker: 'A', chinese: '我們什麼時候出發？', pinyin: 'Wǒmen shénme shíhou chūfā?', english: 'When do we set out?' },
                { speaker: 'B', chinese: '早上八點出發。', pinyin: 'Zǎoshang bā diǎn chūfā.', english: 'We depart at 8 AM.' }
            ]
        }, {
            char: '出現',
            pinyin: 'chūxiàn',
            pos: 'Vp',
            en: 'To appear / To emerge',
            explanation: 'To come into sight or become evident. Used for people, things, or situations that become noticeable or arise.',
            dialogue: [
                { speaker: 'A', chinese: '問題突然出現了。', pinyin: 'Wèntí tūrán chūxiàn le.', english: 'The problem suddenly emerged.' },
                { speaker: 'B', chinese: '我們需要立刻解決。', pinyin: 'Wǒmen xūyào lìkè jiějué.', english: 'We need to solve it immediately.' }
            ]
        }, {
            char: '出租',
            pinyin: 'chūzū',
            pos: 'V',
            en: 'To rent out / To lease',
            explanation: 'To allow someone to use your property, vehicle, or equipment in exchange for payment. Often used for apartments, cars, or tools.',
            dialogue: [
                { speaker: 'A', chinese: '這間房子出租嗎？', pinyin: 'Zhè jiān fángzi chūzū ma?', english: 'Is this house for rent?' },
                { speaker: 'B', chinese: '是的，每月一萬元。', pinyin: 'Shì de, měi yuè yī wàn yuán.', english: 'Yes, it\'s 10,000 yuan per month.' }
            ]
        }, {
            char: '處理',
            pinyin: 'chǔlǐ',
            pos: 'V',
            en: 'To handle / To deal with',
            explanation: 'To manage, take care of, or resolve a matter, problem, or task. Used in both personal and professional contexts.',
            dialogue: [
                { speaker: 'A', chinese: '請你處理這件事。', pinyin: 'Qǐng nǐ chǔlǐ zhè jiàn shì.', english: 'Please handle this matter.' },
                { speaker: 'B', chinese: '我會儘快處理好。', pinyin: 'Wǒ huì jǐnkuài chǔlǐ hǎo.', english: 'I will handle it as soon as possible.' }
            ]
        }, {
            char: '廚師',
            pinyin: 'chúshī',
            pos: 'N',
            en: 'Cook / Chef',
            explanation: 'A person who prepares food professionally, either in a restaurant or as a personal cook. Can refer to any level of culinary skill.',
            dialogue: [
                { speaker: 'A', chinese: '這家餐廳的廚師很有名。', pinyin: 'Zhè jiā cāntīng de chúshī hěn yǒumíng.', english: 'The chef at this restaurant is very famous.' },
                { speaker: 'B', chinese: '他們的菜真的很好吃。', pinyin: 'Tāmen de cài zhēn de hěn hǎochī.', english: 'Their food is really delicious.' }
            ]
        }, {
            char: '吹',
            pinyin: 'chuī',
            pos: 'V',
            en: 'To blow',
            explanation: 'To move air, either by mouth or by wind. Used for blowing out candles, playing wind instruments, or describing windy weather.',
            dialogue: [
                { speaker: 'A', chinese: '請吹滅蠟燭。', pinyin: 'Qǐng chuī miè làzhú.', english: 'Please blow out the candles.' },
                { speaker: 'B', chinese: '好，許個願吧！', pinyin: 'Hǎo, xǔ gè yuàn ba!', english: 'OK, make a wish!' }
            ]
        }, {
            char: '此',
            pinyin: 'cǐ',
            pos: 'Det',
            en: 'This / These',
            explanation: 'A formal or literary determiner meaning "this" or "these." Often used in written Chinese, official documents, or set phrases.',
            dialogue: [
                { speaker: 'A', chinese: '此事非常重要。', pinyin: 'Cǐ shì fēicháng zhòngyào.', english: 'This matter is very important.' },
                { speaker: 'B', chinese: '我了解了，會認真處理。', pinyin: 'Wǒ liǎojiě le, huì rènzhēn chǔlǐ.', english: 'I understand, I will handle it seriously.' }
            ]
        }, {
            char: '刺激',
            pinyin: 'cìjī',
            pos: 'N / Vs',
            en: 'Stimulation / Exciting',
            explanation: 'As a noun, it means "stimulus" or "excitement." As a stative verb, it means "exciting" or "thrilling." Used for emotions or physiological responses.',
            dialogue: [
                { speaker: 'A', chinese: '過山車很刺激。', pinyin: 'Guòshānchē hěn cìjī.', english: 'Roller coasters are very exciting.' },
                { speaker: 'B', chinese: '我喜歡這種感覺。', pinyin: 'Wǒ xǐhuān zhè zhǒng gǎnjué.', english: 'I like that feeling.' }
            ]
        }, {
            char: '從不',
            pinyin: 'cóngbù',
            pos: 'Adv',
            en: 'Never (habitual)',
            explanation: 'An adverb indicating that an action has never occurred and is not expected to occur in the future. Emphasizes consistency.',
            dialogue: [
                { speaker: 'A', chinese: '他從不遲到。', pinyin: 'Tā cóngbù chídào.', english: 'He is never late.' },
                { speaker: 'B', chinese: '那是個好習慣。', pinyin: 'Nà shì gè hǎo xíguàn.', english: 'That\'s a good habit.' }
            ]
        }, {
            char: '從小',
            pinyin: 'cóngxiǎo',
            pos: 'Adv',
            en: 'Since childhood',
            explanation: 'Indicates that something has been true or happening since a person was young. Often used to describe habits, skills, or traits.',
            dialogue: [
                { speaker: 'A', chinese: '他從小就喜歡畫畫。', pinyin: 'Tā cóngxiǎo jiù xǐhuān huàhuà.', english: 'He has liked painting since childhood.' },
                { speaker: 'B', chinese: '難怪他現在是畫家。', pinyin: 'Nánguài tā xiànzài shì huàjiā.', english: 'No wonder he is a painter now.' }
            ]
        }, {
            char: '醋',
            pinyin: 'cù',
            pos: 'N',
            en: 'Vinegar',
            explanation: 'A sour liquid used as a condiment or ingredient in cooking. Also used in the expression "吃醋" (to be jealous).',
            dialogue: [
                { speaker: 'A', chinese: '餃子要蘸醋吃。', pinyin: 'Jiǎozi yào zhàn cù chī.', english: 'Dumplings should be dipped in vinegar.' },
                { speaker: 'B', chinese: '我喜歡加點醬油。', pinyin: 'Wǒ xǐhuān jiā diǎn jiàngyóu.', english: 'I like to add a little soy sauce.' }
            ]
        }, {
            char: '寸',
            pinyin: 'cùn',
            pos: 'M',
            en: 'Cun (Chinese inch)',
            explanation: 'A traditional Chinese unit of length, approximately 3.3 cm. Also used metaphorically to mean "a small amount" (e.g., 寸步難行).',
            dialogue: [
                { speaker: 'A', chinese: '這根繩子長兩尺。', pinyin: 'Zhè gēn shéngzi cháng liǎng chǐ.', english: 'This rope is two chi (feet) long.' },
                { speaker: 'B', chinese: '那一寸是多少厘米？', pinyin: 'Nà yī cùn shì duōshao límǐ?', english: 'How many centimeters is one cun?' }
            ]
        }, {
            char: '存在',
            pinyin: 'cúnzài',
            pos: 'Vi',
            en: 'To exist / Existence',
            explanation: 'To have objective reality or be present. Used for abstract concepts, objects, or beings. Also used as a noun meaning "existence."',
            dialogue: [
                { speaker: 'A', chinese: '這個問題長期存在。', pinyin: 'Zhège wèntí chángqī cúnzài.', english: 'This problem has existed for a long time.' },
                { speaker: 'B', chinese: '我們必須正視它。', pinyin: 'Wǒmen bìxū zhèngshì tā.', english: 'We must face it squarely.' }
            ]
        }, {
            char: '錯',
            pinyin: 'cuò',
            pos: 'N',
            en: 'Mistake / Fault',
            explanation: 'Refers to an error, fault, or wrongdoing. Can be used in phrases like 犯錯 (make a mistake) or 對錯 (right and wrong).',
            dialogue: [
                { speaker: 'A', chinese: '這是我的錯，對不起。', pinyin: 'Zhè shì wǒ de cuò, duìbuqǐ.', english: 'This is my fault, I\'m sorry.' },
                { speaker: 'B', chinese: '沒關係，我們都犯過錯。', pinyin: 'Méi guānxi, wǒmen dōu fàn guo cuò.', english: 'It\'s okay, we all make mistakes.' }
            ]
        }];

        // ------------------------------------------------------------
        // RENDER ENGINE
        // ------------------------------------------------------------
        const grid = document.getElementById('vocabGrid');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const countDisplay = document.getElementById('countDisplay');
        const legendContainer = document.getElementById('legendContainer');
        const pinyinGlobalToggle = document.getElementById('pinyinGlobalToggle');
        const pinyinToggleLabel = document.getElementById('pinyinToggleLabel');

        let globalPinyinRevealed = false;

        // Legend
        const posSet = new Set(vocabData.map(d => d.pos));
        const posLabels = {
            'N': 'Noun',
            'V': 'Verb',
            'Vs': 'Stative Verb',
            'Vst': 'Stative/Transitive Verb',
            'Adv': 'Adverb',
            'Prep': 'Preposition',
            'M': 'Measure Word',
            'Ptc': 'Particle',
            'N/V': 'Noun / Verb',
            'Conj': 'Conjunction',
            'Det': 'Determiner',
            'V-sep': 'Separable Verb',
            'Vp': 'Verb Particle',
            'Vi': 'Intransitive Verb'
        };
        const dotColorMap = {
            'N': '#7ba9c9',
            'V': '#7fb06a',
            'Vs': '#5ba884',
            'Vst': '#5ba884',
            'Adv': '#c9a86a',
            'Prep': '#c97a9a',
            'M': '#9a7ac9',
            'Ptc': '#c9b86a',
            'N/V': '#7ba9c9',
            'Conj': '#f0d0b0',
            'Det': '#f0b0b0',
            'V-sep': '#6ab06a',
            'Vp': '#6a7ab0',
            'Vi': '#6a9a9a'
        };

        function buildLegend() {
            const sorted = Array.from(posSet).sort();
            let html = '';
            sorted.forEach(label => {
                const display = posLabels[label] || label;
                const color = dotColorMap[label] || '#b8aa98';
                html += `<span class="legend-item"><span class="legend-dot" style="background:${color};"></span>${display}</span>`;
            });
            legendContainer.innerHTML = html;
        }
        buildLegend();

        // Render function
        function render(filter = '') {
            const term = filter.trim().toLowerCase();
            let filtered = vocabData;

            if (term) {
                filtered = vocabData.filter(item => {
                    let dialogueSearch = '';
                    item.dialogue.forEach(line => {
                        dialogueSearch += line.chinese + ' ' + line.pinyin + ' ' + line.english + ' ';
                    });
                    const searchable = item.char + ' ' + item.pinyin + ' ' + item.en + ' ' + item.explanation + ' ' + dialogueSearch;
                    return searchable.toLowerCase().includes(term);
                });
            }

            countDisplay.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty">🔍 No matches found.</div>`;
                return;
            }

            let html = '';
            filtered.forEach((item, index) => {
                const posClass = 'pos-' + item.pos.replace('/', '-');
                const posDisplay = posLabels[item.pos] || item.pos;

                // Build dialogue HTML
                let dialogueHtml = '';
                dialogueHtml += `
                        <div class="dialogue-toggle-wrapper">
                            <strong>💬 Dialogue:</strong>
                            <button class="dialogue-toggle-btn" data-dialogue-idx="${index}">Show Pinyin & Translation</button>
                        </div>
                        <div class="dialogue-lines">
                    `;

                item.dialogue.forEach(line => {
                    const speakerClass = line.speaker === 'A' ? 'speaker-a' : 'speaker-b';
                    dialogueHtml += `
                            <div class="line">
                                <span class="${speakerClass}">${line.speaker}:</span>
                                <span class="zh">${line.chinese}</span>
                                <span class="dialogue-details">
                                    <span class="sep">·</span>
                                    <span class="pinyin-text">${line.pinyin}</span>
                                    <span class="sep">·</span>
                                    <span class="en-text">${line.english}</span>
                                </span>
                            </div>
                        `;
                });

                dialogueHtml += `</div>`;

                html += `
                        <div class="vocab-card" data-index="${index}">
                            <div class="char-row">
                                <span class="char">${item.char}</span>
                                <span class="pinyin-container" data-pinyin="${item.pinyin}" data-revealed="false">
                                    <span class="pinyin-value">${item.pinyin}</span>
                                </span>
                            </div>
                            <span class="pos ${posClass}">${posDisplay}</span>

                            <button class="details-toggle" data-target="details-${index}">
                                <span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)
                            </button>

                            <div id="details-${index}" class="details-content">
                                <div class="explanation">
                                    <div class="meaning-line">📘 ${item.en}</div>
                                    <br />
                                    <strong>📖 Usage:</strong> ${item.explanation}
                                </div>
                                <div class="dialogue-box" id="dialogue-box-${index}">
                                    ${dialogueHtml}
                                </div>
                            </div>
                        </div>
                    `;
            });

            grid.innerHTML = html;

            // ---- Click on the Hanzi toggles its pinyin ----
            document.querySelectorAll('.char').forEach(charEl => {
                charEl.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const row = this.closest('.char-row');
                    const pinyinContainer = row ? row.querySelector('.pinyin-container') : null;
                    if (!pinyinContainer) return;
                    const isRevealed = pinyinContainer.dataset.revealed === 'true';
                    const newState = !isRevealed;
                    pinyinContainer.dataset.revealed = newState ? 'true' : 'false';
                    pinyinContainer.classList.toggle('revealed', newState);
                });
            });

            // ---- Apply global state to all pinyin containers ----
            document.querySelectorAll('.pinyin-container').forEach(el => {
                const shouldReveal = globalPinyinRevealed;
                el.dataset.revealed = shouldReveal ? 'true' : 'false';
                el.classList.toggle('revealed', shouldReveal);
            });

            // ---- Toggle main details (Meaning/Explanation) ----
            document.querySelectorAll('.details-toggle').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const targetId = this.dataset.target;
                    const content = document.getElementById(targetId);
                    if (!content) return;

                    const isOpen = content.classList.contains('open');
                    if (isOpen) {
                        content.classList.remove('open');
                        this.classList.remove('active');
                        this.innerHTML = '<span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)';
                    } else {
                        content.classList.add('open');
                        this.classList.add('active');
                        this.innerHTML = '<span class="arrow">▲</span> Hide Details';
                    }
                });
            });

            // ---- Toggle dialogue pinyin/translation ----
            document.querySelectorAll('.dialogue-toggle-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = this.dataset.dialogueIdx;
                    const dialogueBox = document.getElementById(`dialogue-box-${idx}`);
                    if (!dialogueBox) return;

                    const isShowing = dialogueBox.classList.contains('show-translation');
                    if (isShowing) {
                        dialogueBox.classList.remove('show-translation');
                        this.textContent = 'Show Pinyin & Translation';
                    } else {
                        dialogueBox.classList.add('show-translation');
                        this.textContent = 'Hide Pinyin & Translation';
                    }
                });
            });

            updateGlobalToggleLabel();
        }

        // ---- Global Pinyin Toggle ----
        function updateGlobalToggleLabel() {
            if (globalPinyinRevealed) {
                pinyinToggleLabel.textContent = 'Hide All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔓';
            } else {
                pinyinToggleLabel.textContent = 'Show All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔊';
            }
        }

        pinyinGlobalToggle.addEventListener('click', function() {
            globalPinyinRevealed = !globalPinyinRevealed;
            document.querySelectorAll('.pinyin-container').forEach(el => {
                el.dataset.revealed = globalPinyinRevealed ? 'true' : 'false';
                el.classList.toggle('revealed', globalPinyinRevealed);
            });
            updateGlobalToggleLabel();
        });

        // ---- Search & Clear ----
        searchInput.addEventListener('input', () => render(searchInput.value));
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            render('');
            searchInput.focus();
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') clearBtn.click();
        });

        // ---- Initial render ----
        render('');
    </script>
</body>
</html>
