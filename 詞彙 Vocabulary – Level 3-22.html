<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 3-22 Flashcards (Click Hanzi for Pinyin)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: #f4f2ef;
            min-height: 100vh;
            padding: 2rem 1.5rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #1e1e2a;
        }

        .header h1 span {
            background: #d9c9b4;
            padding: 0.1rem 0.8rem;
            border-radius: 12px;
            color: #2c2c3a;
        }

        .header .sub {
            font-size: 1rem;
            color: #6b5f52;
            margin-top: 0.3rem;
            font-weight: 400;
        }

        .header .badge {
            display: inline-block;
            margin-top: 0.6rem;
            background: #2c2c3a;
            color: white;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            background: #ffffffd9;
            backdrop-filter: blur(6px);
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 2.2rem;
            border: 1px solid #e8e0d6;
        }

        .stats {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c2c3a;
            white-space: nowrap;
        }

        .stats strong {
            background: #ece6de;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-weight: 600;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f3efe9;
            padding: 0.1rem 0.1rem 0.1rem 1.2rem;
            border-radius: 40px;
            transition: 0.2s;
            border: 1px solid transparent;
            flex: 1;
            min-width: 180px;
        }

        .search-box:focus-within {
            background: #ffffff;
            border-color: #b8aa98;
            box-shadow: 0 0 0 3px rgba(184, 170, 152, 0.2);
        }

        .search-box input {
            border: none;
            background: transparent;
            font-size: 0.9rem;
            padding: 0.5rem 0;
            width: 100%;
            outline: none;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #1e1e2a;
        }

        .search-box input::placeholder {
            color: #a89b8c;
            font-weight: 400;
        }

        .search-box button {
            background: #2c2c3a;
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .search-box button:hover {
            background: #1a1a26;
        }

        .pinyin-global-toggle {
            background: #ece6de;
            border: 1px solid #d5cbbc;
            border-radius: 40px;
            padding: 0.3rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .pinyin-global-toggle:hover {
            background: #d5cbbc;
            border-color: #b8aa98;
        }

        .pinyin-global-toggle .icon {
            font-size: 1rem;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.2rem;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 0.6rem 1.2rem;
            background: #ffffffd9;
            border-radius: 40px;
            border: 1px solid #e8e0d6;
            font-size: 0.75rem;
            font-weight: 500;
            color: #2c2c3a;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .vocab-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid #ebe5dd;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .vocab-card:hover {
            border-color: #d0c3b2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .vocab-card .char-row {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.2rem;
        }

        .vocab-card .char {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1e1e2a;
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.2;
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease;
            padding: 0.1rem 0.4rem;
            border-radius: 8px;
            user-select: none;
        }

        .vocab-card .char:hover {
            color: #4a3f33;
            background: #f0ebe4;
        }

        .vocab-card .char:active {
            transform: scale(0.95);
        }

        .pinyin-container {
            display: inline-flex;
            align-items: center;
            min-width: 2.2rem;
            justify-content: center;
        }

        .pinyin-container .pinyin-value {
            font-size: 1rem;
            color: #6b5f52;
            font-weight: 400;
            letter-spacing: 0.3px;
            display: none;
        }

        .pinyin-container.revealed .pinyin-value {
            display: inline;
        }

        .vocab-card .pos {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            align-self: flex-start;
            margin-top: 0.6rem;
            background: #f0ebe4;
            color: #4a4037;
        }

        .pos-N {
            background: #dbe9f0;
            color: #1f5a7a;
        }
        .pos-V {
            background: #e6f0db;
            color: #3d6b2b;
        }
        .pos-Vs {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Vst {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Adv {
            background: #f0e6db;
            color: #7a5a2b;
        }
        .pos-Prep {
            background: #f0dbe6;
            color: #7a2b4a;
        }
        .pos-M {
            background: #e6dbf0;
            color: #4a2b7a;
        }
        .pos-Ptc {
            background: #f0e8db;
            color: #7a6b2b;
        }
        .pos-N\/V {
            background: #dbe8f0;
            color: #1f5a7a;
        }
        .pos-Conj {
            background: #f0e0d0;
            color: #7a5a3a;
        }
        .pos-V-sep {
            background: #d4e8d4;
            color: #2d6b2d;
        }
        .pos-Vp-sep {
            background: #d4d8d4;
            color: #2d5a3d;
        }
        .pos-Vi {
            background: #d4e0e0;
            color: #2d5a5a;
        }

        .details-toggle {
            margin-top: 1.2rem;
            background: none;
            border: 1px solid #d5cbbc;
            border-radius: 30px;
            padding: 0.5rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #4a4037;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
            align-self: flex-start;
            background: #faf8f5;
        }

        .details-toggle:hover {
            background: #e8e0d6;
            border-color: #b8aa98;
        }

        .details-toggle .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .details-toggle.active .arrow {
            transform: rotate(180deg);
        }

        .details-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
        }

        .details-content.open {
            max-height: 900px;
            opacity: 1;
            margin-top: 1.2rem;
        }

        .details-content .explanation {
            background: #f8f6f2;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #2c2c3a;
            border-left: 4px solid #d0c3b2;
            margin-bottom: 1rem;
        }

        .details-content .explanation strong {
            color: #1e1e2a;
        }

        .details-content .explanation .meaning-line {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e1e2a;
            background: #e8e0d6;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 0.4rem;
        }

        .dialogue-box {
            background: #f0f4f8;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.8;
        }

        .dialogue-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 0.3rem;
        }

        .dialogue-toggle-btn {
            background: #e8e0d6;
            border: none;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .dialogue-toggle-btn:hover {
            background: #d5cbbc;
        }

        .dialogue-box .speaker-a {
            color: #1f5a7a;
            font-weight: 600;
        }

        .dialogue-box .speaker-b {
            color: #3d6b2b;
            font-weight: 600;
        }

        .dialogue-box .line {
            margin-bottom: 0.2rem;
        }
        .dialogue-box .line:last-child {
            margin-bottom: 0;
        }

        .dialogue-box .zh {
            font-family: 'Noto Sans SC', sans-serif;
            margin-right: 0.3rem;
        }

        .dialogue-details {
            display: none;
            margin-left: 0.3rem;
        }

        .dialogue-details .pinyin-text {
            font-weight: 400;
            color: #6b5f52;
        }

        .dialogue-details .en-text {
            font-style: italic;
            color: #4a4037;
        }

        .dialogue-details .sep {
            color: #b8aa98;
            margin: 0 0.2rem;
        }

        .dialogue-box.show-translation .dialogue-details {
            display: inline;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1.1rem;
            color: #8f8172;
            background: #faf8f5;
            border-radius: 30px;
            border: 1px dashed #d5cbbc;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.8rem 3rem;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                border-radius: 28px;
                padding: 1rem 1.2rem;
                gap: 0.8rem;
            }
            .stats {
                text-align: center;
            }
            .search-box {
                padding: 0.1rem 0.1rem 0.1rem 1rem;
            }
            .search-box button {
                padding: 0.4rem 1rem;
                font-size: 0.8rem;
            }
            .vocab-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .vocab-card .char {
                font-size: 1.8rem;
            }
            .pinyin-global-toggle {
                justify-content: center;
            }
        }

        @media (min-width: 641px) and (max-width: 900px) {
            .vocab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 詞彙 <span>Level 3-22</span></h1>
            <div class="sub">Flashcard Mode · <strong>Click the Hanzi</strong> to reveal Pinyin</div>
            <div class="badge">🔍 Click the character to show pinyin · "Show Details" for meaning & dialogue</div>
        </div>

        <div class="toolbar">
            <div class="stats">
                <strong id="countDisplay">0</strong> words
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Chinese, Pinyin, or English..." autocomplete="off" />
                <button id="clearBtn">✕</button>
            </div>
            <button class="pinyin-global-toggle" id="pinyinGlobalToggle">
                <span class="icon">🔊</span>
                <span id="pinyinToggleLabel">Show All Pinyin</span>
            </button>
        </div>

        <div class="legend" id="legendContainer"></div>

        <div class="vocab-grid" id="vocabGrid"></div>
    </div>

    <script>
        // ------------------------------------------------------------
        // DATA — Level 3-22 Vocabulary (Traditional Hanzi)
        // ------------------------------------------------------------
        const vocabData = [{
            char: '居住',
            pinyin: 'jūzhù',
            pos: 'Vi',
            en: 'To reside / To live',
            explanation: 'To dwell or live in a particular place. Often used for long-term or formal residence.',
            dialogue: [
                { speaker: 'A', chinese: '你在哪裡居住？', pinyin: 'Nǐ zài nǎlǐ jūzhù?', english: 'Where do you reside?' },
                { speaker: 'B', chinese: '我居住在台北市。', pinyin: 'Wǒ jūzhù zài Táiběi shì.', english: 'I reside in Taipei.' }
            ]
        }, {
            char: '舉',
            pinyin: 'jǔ',
            pos: 'V',
            en: 'To lift / To raise',
            explanation: 'To lift or raise something physically, or to hold an event (舉辦). Also used in 舉手 (raise hand).',
            dialogue: [
                { speaker: 'A', chinese: '他舉起了獎盃。', pinyin: 'Tā jǔ qǐ le jiǎngbēi.', english: 'He raised the trophy.' },
                { speaker: 'B', chinese: '他贏了比賽！', pinyin: 'Tā yíng le bǐsài!', english: 'He won the game!' }
            ]
        }, {
            char: '舉辦',
            pinyin: 'jǔbàn',
            pos: 'V',
            en: 'To hold / To organize (event)',
            explanation: 'To organize and carry out an event, such as a meeting, party, or competition.',
            dialogue: [
                { speaker: 'A', chinese: '我們要舉辦一場派對。', pinyin: 'Wǒmen yào jǔbàn yī chǎng pàiduì.', english: 'We are going to hold a party.' },
                { speaker: 'B', chinese: '太好了，我可以幫忙。', pinyin: 'Tài hǎo le, wǒ kěyǐ bāngmáng.', english: 'Great, I can help.' }
            ]
        }, {
            char: '舉手',
            pinyin: 'jǔshǒu',
            pos: 'V-sep',
            en: 'To raise one\'s hand',
            explanation: 'A separable verb meaning to raise one\'s hand, often in class or during voting.',
            dialogue: [
                { speaker: 'A', chinese: '請舉手回答問題。', pinyin: 'Qǐng jǔshǒu huídá wèntí.', english: 'Please raise your hand to answer the question.' },
                { speaker: 'B', chinese: '我知道答案！', pinyin: 'Wǒ zhīdào dá'àn!', english: 'I know the answer!' }
            ]
        }, {
            char: '舉行',
            pinyin: 'jǔxíng',
            pos: 'V',
            en: 'To hold (ceremony/meeting)',
            explanation: 'Similar to 舉辦, often used for formal ceremonies, meetings, or weddings.',
            dialogue: [
                { speaker: 'A', chinese: '婚禮將在教堂舉行。', pinyin: 'Hūnlǐ jiāng zài jiàotáng jǔxíng.', english: 'The wedding will be held at the church.' },
                { speaker: 'B', chinese: '那一定很浪漫。', pinyin: 'Nà yīdìng hěn làngmàn.', english: 'That must be very romantic.' }
            ]
        }, {
            char: '聚',
            pinyin: 'jù',
            pos: 'Vi',
            en: 'To gather / To get together',
            explanation: 'To come together in a group, often for social or informal purposes.',
            dialogue: [
                { speaker: 'A', chinese: '我們聚一聚吧。', pinyin: 'Wǒmen jù yī jù ba.', english: 'Let\'s get together.' },
                { speaker: 'B', chinese: '好啊，什麼時候？', pinyin: 'Hǎo a, shénme shíhou?', english: 'OK, when?' }
            ]
        }, {
            char: '距',
            pinyin: 'jù',
            pos: 'Prep',
            en: 'At a distance from',
            explanation: 'A preposition used to indicate distance from a point, often used with 離.',
            dialogue: [
                { speaker: 'A', chinese: '學校距火車站兩公里。', pinyin: 'Xuéxiào jù huǒchē zhàn liǎng gōnglǐ.', english: 'The school is two kilometers from the train station.' },
                { speaker: 'B', chinese: '走路要二十分鐘。', pinyin: 'Zǒulù yào èrshí fēnzhōng.', english: 'It takes 20 minutes to walk.' }
            ]
        }, {
            char: '拒絕',
            pinyin: 'jùjué',
            pos: 'V',
            en: 'To refuse / To reject',
            explanation: 'To say no to an offer, request, or suggestion.',
            dialogue: [
                { speaker: 'A', chinese: '他拒絕了我的邀請。', pinyin: 'Tā jùjué le wǒ de yāoqǐng.', english: 'He refused my invitation.' },
                { speaker: 'B', chinese: '為什麼？他很忙嗎？', pinyin: 'Wèishénme? Tā hěn máng ma?', english: 'Why? Is he busy?' }
            ]
        }, {
            char: '距離',
            pinyin: 'jùlí',
            pos: 'N',
            en: 'Distance',
            explanation: 'The amount of space between two points or places.',
            dialogue: [
                { speaker: 'A', chinese: '台北到高雄的距離多遠？', pinyin: 'Táiběi dào Gāoxióng de jùlí duō yuǎn?', english: 'How far is the distance from Taipei to Kaohsiung?' },
                { speaker: 'B', chinese: '大約三百公里。', pinyin: 'Dàyuē sānbǎi gōnglǐ.', english: 'About 300 kilometers.' }
            ]
        }, {
            char: '劇本',
            pinyin: 'jùběn',
            pos: 'N',
            en: 'Script / Play script',
            explanation: 'The written text for a play, film, or television show.',
            dialogue: [
                { speaker: 'A', chinese: '他正在寫一個電影劇本。', pinyin: 'Tā zhèngzài xiě yī gè diànyǐng jùběn.', english: 'He is writing a movie script.' },
                { speaker: 'B', chinese: '希望他能成功拍攝。', pinyin: 'Xīwàng tā néng chénggōng pāishè.', english: 'I hope he can successfully film it.' }
            ]
        }, {
            char: '劇情',
            pinyin: 'jùqíng',
            pos: 'N',
            en: 'Plot / Storyline',
            explanation: 'The sequence of events that make up a story in a film, book, or play.',
            dialogue: [
                { speaker: 'A', chinese: '這部電影的劇情很曲折。', pinyin: 'Zhè bù diànyǐng de jùqíng hěn qūzhé.', english: 'The plot of this movie is very twisty.' },
                { speaker: 'B', chinese: '我喜歡這種複雜的故事。', pinyin: 'Wǒ xǐhuān zhè zhǒng fùzá de gùshi.', english: 'I like this kind of complex story.' }
            ]
        }, {
            char: '具有',
            pinyin: 'jùyǒu',
            pos: 'Vst',
            en: 'To have / To possess',
            explanation: 'To have a particular quality, characteristic, or feature. Often used for abstract attributes.',
            dialogue: [
                { speaker: 'A', chinese: '他具有很強的領導能力。', pinyin: 'Tā jùyǒu hěn qiáng de lǐngdǎo nénglì.', english: 'He possesses strong leadership skills.' },
                { speaker: 'B', chinese: '難怪他是經理。', pinyin: 'Nánguài tā shì jīnglǐ.', english: 'No wonder he is the manager.' }
            ]
        }, {
            char: '絕對',
            pinyin: 'juéduì',
            pos: 'Adv',
            en: 'Absolutely / Definitely',
            explanation: 'An adverb used to emphasize certainty, often meaning "absolutely" or "definitely."',
            dialogue: [
                { speaker: 'A', chinese: '我絕對不會忘記你的。', pinyin: 'Wǒ juéduì bùhuì wàngjì nǐ de.', english: 'I will definitely not forget you.' },
                { speaker: 'B', chinese: '謝謝，你真好。', pinyin: 'Xièxie, nǐ zhēn hǎo.', english: 'Thank you, you are so kind.' }
            ]
        }, {
            char: '角色',
            pinyin: 'juésè',
            pos: 'N',
            en: 'Character / Role',
            explanation: 'A person in a story, play, or film, or the function someone has in a situation.',
            dialogue: [
                { speaker: 'A', chinese: '他在電影中扮演主角。', pinyin: 'Tā zài diànyǐng zhōng bànyǎn zhǔjué.', english: 'He plays the main character in the movie.' },
                { speaker: 'B', chinese: '他演得很好。', pinyin: 'Tā yǎn de hěn hǎo.', english: 'He acts very well.' }
            ]
        }, {
            char: '軍隊',
            pinyin: 'jūnduì',
            pos: 'N',
            en: 'Military / Army',
            explanation: 'The armed forces of a nation, including army, navy, and air force.',
            dialogue: [
                { speaker: 'A', chinese: '他在軍隊服役。', pinyin: 'Tā zài jūnduì fúyì.', english: 'He is serving in the military.' },
                { speaker: 'B', chinese: '他很愛國。', pinyin: 'Tā hěn àiguó.', english: 'He is very patriotic.' }
            ]
        }, {
            char: '軍人',
            pinyin: 'jūnrén',
            pos: 'N',
            en: 'Soldier',
            explanation: 'A member of the armed forces.',
            dialogue: [
                { speaker: 'A', chinese: '他是一位軍人。', pinyin: 'Tā shì yī wèi jūnrén.', english: 'He is a soldier.' },
                { speaker: 'B', chinese: '他的職責是保衛國家。', pinyin: 'Tā de zhízé shì bǎowèi guójiā.', english: 'His duty is to defend the country.' }
            ]
        }, {
            char: '卡車',
            pinyin: 'kǎchē',
            pos: 'N',
            en: 'Truck',
            explanation: 'A large motor vehicle used for transporting goods.',
            dialogue: [
                { speaker: 'A', chinese: '外面停了一輛大卡車。', pinyin: 'Wàimiàn tíng le yī liàng dà kǎchē.', english: 'There\'s a big truck parked outside.' },
                { speaker: 'B', chinese: '可能是送貨的。', pinyin: 'Kěnéng shì sònghuò de.', english: 'It might be delivering goods.' }
            ]
        }, {
            char: '開放',
            pinyin: 'kāifàng',
            pos: 'V',
            en: 'To open up / To be open',
            explanation: 'To make something accessible, or to become open to the public, ideas, or markets.',
            dialogue: [
                { speaker: 'A', chinese: '博物館對外開放了嗎？', pinyin: 'Bówùguǎn duìwài kāifàng le ma?', english: 'Is the museum open to the public?' },
                { speaker: 'B', chinese: '是的，每天上午九點到下午五點。', pinyin: 'Shì de, měitiān shàngwǔ jiǔ diǎn dào xiàwǔ wǔ diǎn.', english: 'Yes, from 9 AM to 5 PM every day.' }
            ]
        }, {
            char: '開花',
            pinyin: 'kāihuā',
            pos: 'Vp-sep',
            en: 'To bloom / To flower',
            explanation: 'A verb particle (separable) meaning for flowers to open or bloom.',
            dialogue: [
                { speaker: 'A', chinese: '這棵樹什麼時候開花？', pinyin: 'Zhè kē shù shénme shíhou kāihuā?', english: 'When does this tree bloom?' },
                { speaker: 'B', chinese: '通常在春天開花。', pinyin: 'Tōngcháng zài chūntiān kāihuā.', english: 'It usually blooms in spring.' }
            ]
        }, {
            char: '開朗',
            pinyin: 'kāilǎng',
            pos: 'Vs',
            en: 'Cheerful / Outgoing',
            explanation: 'Describes a person who is optimistic, lively, and easy to get along with.',
            dialogue: [
                { speaker: 'A', chinese: '她的性格很開朗。', pinyin: 'Tā de xìnggé hěn kāilǎng.', english: 'She has a very cheerful personality.' },
                { speaker: 'B', chinese: '大家都喜歡和她在一起。', pinyin: 'Dàjiā dōu xǐhuān hé tā zài yīqǐ.', english: 'Everyone likes to be with her.' }
            ]
        }];

        // ------------------------------------------------------------
        // RENDER ENGINE
        // ------------------------------------------------------------
        const grid = document.getElementById('vocabGrid');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const countDisplay = document.getElementById('countDisplay');
        const legendContainer = document.getElementById('legendContainer');
        const pinyinGlobalToggle = document.getElementById('pinyinGlobalToggle');
        const pinyinToggleLabel = document.getElementById('pinyinToggleLabel');

        let globalPinyinRevealed = false;

        // Legend
        const posSet = new Set(vocabData.map(d => d.pos));
        const posLabels = {
            'N': 'Noun',
            'V': 'Verb',
            'Vs': 'Stative Verb',
            'Vst': 'Stative/Transitive Verb',
            'Adv': 'Adverb',
            'Prep': 'Preposition',
            'M': 'Measure Word',
            'Ptc': 'Particle',
            'N/V': 'Noun / Verb',
            'Conj': 'Conjunction',
            'V-sep': 'Separable Verb',
            'Vp-sep': 'Verb Particle (Sep.)',
            'Vi': 'Intransitive Verb'
        };
        const dotColorMap = {
            'N': '#7ba9c9',
            'V': '#7fb06a',
            'Vs': '#5ba884',
            'Vst': '#5ba884',
            'Adv': '#c9a86a',
            'Prep': '#c97a9a',
            'M': '#9a7ac9',
            'Ptc': '#c9b86a',
            'N/V': '#7ba9c9',
            'Conj': '#f0d0b0',
            'V-sep': '#6ab06a',
            'Vp-sep': '#6a9a6a',
            'Vi': '#6a9a9a'
        };

        function buildLegend() {
            const sorted = Array.from(posSet).sort();
            let html = '';
            sorted.forEach(label => {
                const display = posLabels[label] || label;
                const color = dotColorMap[label] || '#b8aa98';
                html += `<span class="legend-item"><span class="legend-dot" style="background:${color};"></span>${display}</span>`;
            });
            legendContainer.innerHTML = html;
        }
        buildLegend();

        // Render function
        function render(filter = '') {
            const term = filter.trim().toLowerCase();
            let filtered = vocabData;

            if (term) {
                filtered = vocabData.filter(item => {
                    let dialogueSearch = '';
                    item.dialogue.forEach(line => {
                        dialogueSearch += line.chinese + ' ' + line.pinyin + ' ' + line.english + ' ';
                    });
                    const searchable = item.char + ' ' + item.pinyin + ' ' + item.en + ' ' + item.explanation + ' ' + dialogueSearch;
                    return searchable.toLowerCase().includes(term);
                });
            }

            countDisplay.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty">🔍 No matches found.</div>`;
                return;
            }

            let html = '';
            filtered.forEach((item, index) => {
                const posClass = 'pos-' + item.pos.replace('/', '-');
                const posDisplay = posLabels[item.pos] || item.pos;

                // Build dialogue HTML
                let dialogueHtml = '';
                dialogueHtml += `
                        <div class="dialogue-toggle-wrapper">
                            <strong>💬 Dialogue:</strong>
                            <button class="dialogue-toggle-btn" data-dialogue-idx="${index}">Show Pinyin & Translation</button>
                        </div>
                        <div class="dialogue-lines">
                    `;

                item.dialogue.forEach(line => {
                    const speakerClass = line.speaker === 'A' ? 'speaker-a' : 'speaker-b';
                    dialogueHtml += `
                            <div class="line">
                                <span class="${speakerClass}">${line.speaker}:</span>
                                <span class="zh">${line.chinese}</span>
                                <span class="dialogue-details">
                                    <span class="sep">·</span>
                                    <span class="pinyin-text">${line.pinyin}</span>
                                    <span class="sep">·</span>
                                    <span class="en-text">${line.english}</span>
                                </span>
                            </div>
                        `;
                });

                dialogueHtml += `</div>`;

                html += `
                        <div class="vocab-card" data-index="${index}">
                            <div class="char-row">
                                <span class="char">${item.char}</span>
                                <span class="pinyin-container" data-pinyin="${item.pinyin}" data-revealed="false">
                                    <span class="pinyin-value">${item.pinyin}</span>
                                </span>
                            </div>
                            <span class="pos ${posClass}">${posDisplay}</span>

                            <button class="details-toggle" data-target="details-${index}">
                                <span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)
                            </button>

                            <div id="details-${index}" class="details-content">
                                <div class="explanation">
                                    <div class="meaning-line">📘 ${item.en}</div>
                                    <br />
                                    <strong>📖 Usage:</strong> ${item.explanation}
                                </div>
                                <div class="dialogue-box" id="dialogue-box-${index}">
                                    ${dialogueHtml}
                                </div>
                            </div>
                        </div>
                    `;
            });

            grid.innerHTML = html;

            // ---- Click on the Hanzi toggles its pinyin ----
            document.querySelectorAll('.char').forEach(charEl => {
                charEl.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const row = this.closest('.char-row');
                    const pinyinContainer = row ? row.querySelector('.pinyin-container') : null;
                    if (!pinyinContainer) return;
                    const isRevealed = pinyinContainer.dataset.revealed === 'true';
                    const newState = !isRevealed;
                    pinyinContainer.dataset.revealed = newState ? 'true' : 'false';
                    pinyinContainer.classList.toggle('revealed', newState);
                });
            });

            // ---- Apply global state to all pinyin containers ----
            document.querySelectorAll('.pinyin-container').forEach(el => {
                const shouldReveal = globalPinyinRevealed;
                el.dataset.revealed = shouldReveal ? 'true' : 'false';
                el.classList.toggle('revealed', shouldReveal);
            });

            // ---- Toggle main details (Meaning/Explanation) ----
            document.querySelectorAll('.details-toggle').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const targetId = this.dataset.target;
                    const content = document.getElementById(targetId);
                    if (!content) return;

                    const isOpen = content.classList.contains('open');
                    if (isOpen) {
                        content.classList.remove('open');
                        this.classList.remove('active');
                        this.innerHTML = '<span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)';
                    } else {
                        content.classList.add('open');
                        this.classList.add('active');
                        this.innerHTML = '<span class="arrow">▲</span> Hide Details';
                    }
                });
            });

            // ---- Toggle dialogue pinyin/translation ----
            document.querySelectorAll('.dialogue-toggle-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = this.dataset.dialogueIdx;
                    const dialogueBox = document.getElementById(`dialogue-box-${idx}`);
                    if (!dialogueBox) return;

                    const isShowing = dialogueBox.classList.contains('show-translation');
                    if (isShowing) {
                        dialogueBox.classList.remove('show-translation');
                        this.textContent = 'Show Pinyin & Translation';
                    } else {
                        dialogueBox.classList.add('show-translation');
                        this.textContent = 'Hide Pinyin & Translation';
                    }
                });
            });

            updateGlobalToggleLabel();
        }

        // ---- Global Pinyin Toggle ----
        function updateGlobalToggleLabel() {
            if (globalPinyinRevealed) {
                pinyinToggleLabel.textContent = 'Hide All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔓';
            } else {
                pinyinToggleLabel.textContent = 'Show All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔊';
            }
        }

        pinyinGlobalToggle.addEventListener('click', function() {
            globalPinyinRevealed = !globalPinyinRevealed;
            document.querySelectorAll('.pinyin-container').forEach(el => {
                el.dataset.revealed = globalPinyinRevealed ? 'true' : 'false';
                el.classList.toggle('revealed', globalPinyinRevealed);
            });
            updateGlobalToggleLabel();
        });

        // ---- Search & Clear ----
        searchInput.addEventListener('input', () => render(searchInput.value));
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            render('');
            searchInput.focus();
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') clearBtn.click();
        });

        // ---- Initial render ----
        render('');
    </script>
</body>
</html>
