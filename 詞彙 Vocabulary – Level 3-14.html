<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 3-14 Flashcards (Click Hanzi for Pinyin)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: #f4f2ef;
            min-height: 100vh;
            padding: 2rem 1.5rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #1e1e2a;
        }

        .header h1 span {
            background: #d9c9b4;
            padding: 0.1rem 0.8rem;
            border-radius: 12px;
            color: #2c2c3a;
        }

        .header .sub {
            font-size: 1rem;
            color: #6b5f52;
            margin-top: 0.3rem;
            font-weight: 400;
        }

        .header .badge {
            display: inline-block;
            margin-top: 0.6rem;
            background: #2c2c3a;
            color: white;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            background: #ffffffd9;
            backdrop-filter: blur(6px);
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 2.2rem;
            border: 1px solid #e8e0d6;
        }

        .stats {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c2c3a;
            white-space: nowrap;
        }

        .stats strong {
            background: #ece6de;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-weight: 600;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f3efe9;
            padding: 0.1rem 0.1rem 0.1rem 1.2rem;
            border-radius: 40px;
            transition: 0.2s;
            border: 1px solid transparent;
            flex: 1;
            min-width: 180px;
        }

        .search-box:focus-within {
            background: #ffffff;
            border-color: #b8aa98;
            box-shadow: 0 0 0 3px rgba(184, 170, 152, 0.2);
        }

        .search-box input {
            border: none;
            background: transparent;
            font-size: 0.9rem;
            padding: 0.5rem 0;
            width: 100%;
            outline: none;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #1e1e2a;
        }

        .search-box input::placeholder {
            color: #a89b8c;
            font-weight: 400;
        }

        .search-box button {
            background: #2c2c3a;
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .search-box button:hover {
            background: #1a1a26;
        }

        .pinyin-global-toggle {
            background: #ece6de;
            border: 1px solid #d5cbbc;
            border-radius: 40px;
            padding: 0.3rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .pinyin-global-toggle:hover {
            background: #d5cbbc;
            border-color: #b8aa98;
        }

        .pinyin-global-toggle .icon {
            font-size: 1rem;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.2rem;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 0.6rem 1.2rem;
            background: #ffffffd9;
            border-radius: 40px;
            border: 1px solid #e8e0d6;
            font-size: 0.75rem;
            font-weight: 500;
            color: #2c2c3a;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .vocab-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid #ebe5dd;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .vocab-card:hover {
            border-color: #d0c3b2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .vocab-card .char-row {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.2rem;
        }

        .vocab-card .char {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1e1e2a;
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.2;
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease;
            padding: 0.1rem 0.4rem;
            border-radius: 8px;
            user-select: none;
        }

        .vocab-card .char:hover {
            color: #4a3f33;
            background: #f0ebe4;
        }

        .vocab-card .char:active {
            transform: scale(0.95);
        }

        .pinyin-container {
            display: inline-flex;
            align-items: center;
            min-width: 2.2rem;
            justify-content: center;
        }

        .pinyin-container .pinyin-value {
            font-size: 1rem;
            color: #6b5f52;
            font-weight: 400;
            letter-spacing: 0.3px;
            display: none;
        }

        .pinyin-container.revealed .pinyin-value {
            display: inline;
        }

        .vocab-card .pos {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            align-self: flex-start;
            margin-top: 0.6rem;
            background: #f0ebe4;
            color: #4a4037;
        }

        .pos-N {
            background: #dbe9f0;
            color: #1f5a7a;
        }
        .pos-V {
            background: #e6f0db;
            color: #3d6b2b;
        }
        .pos-Vs {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Vst {
            background: #ddf0e6;
            color: #1e6b4a;
        }
        .pos-Adv {
            background: #f0e6db;
            color: #7a5a2b;
        }
        .pos-Prep {
            background: #f0dbe6;
            color: #7a2b4a;
        }
        .pos-M {
            background: #e6dbf0;
            color: #4a2b7a;
        }
        .pos-Ptc {
            background: #f0e8db;
            color: #7a6b2b;
        }
        .pos-N\/V {
            background: #dbe8f0;
            color: #1f5a7a;
        }
        .pos-Conj {
            background: #f0e0d0;
            color: #7a5a3a;
        }
        .pos-Det {
            background: #f0d4d4;
            color: #7a3a3a;
        }
        .pos-V-sep {
            background: #d4e8d4;
            color: #2d6b2d;
        }
        .pos-Vpt {
            background: #d4d8e8;
            color: #3a4a7a;
        }
        .pos-Vi {
            background: #d4e0e0;
            color: #2d5a5a;
        }
        .pos-Vp {
            background: #d4d0d8;
            color: #3a3a5a;
        }
        .pos-Vaux {
            background: #d4d8e0;
            color: #3a4a5a;
        }
        .pos-Vs-attr {
            background: #d0e0d0;
            color: #2d6b3d;
        }

        .details-toggle {
            margin-top: 1.2rem;
            background: none;
            border: 1px solid #d5cbbc;
            border-radius: 30px;
            padding: 0.5rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #4a4037;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
            align-self: flex-start;
            background: #faf8f5;
        }

        .details-toggle:hover {
            background: #e8e0d6;
            border-color: #b8aa98;
        }

        .details-toggle .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .details-toggle.active .arrow {
            transform: rotate(180deg);
        }

        .details-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
        }

        .details-content.open {
            max-height: 900px;
            opacity: 1;
            margin-top: 1.2rem;
        }

        .details-content .explanation {
            background: #f8f6f2;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #2c2c3a;
            border-left: 4px solid #d0c3b2;
            margin-bottom: 1rem;
        }

        .details-content .explanation strong {
            color: #1e1e2a;
        }

        .details-content .explanation .meaning-line {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e1e2a;
            background: #e8e0d6;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 0.4rem;
        }

        .dialogue-box {
            background: #f0f4f8;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.8;
        }

        .dialogue-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 0.3rem;
        }

        .dialogue-toggle-btn {
            background: #e8e0d6;
            border: none;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2c2c3a;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .dialogue-toggle-btn:hover {
            background: #d5cbbc;
        }

        .dialogue-box .speaker-a {
            color: #1f5a7a;
            font-weight: 600;
        }

        .dialogue-box .speaker-b {
            color: #3d6b2b;
            font-weight: 600;
        }

        .dialogue-box .line {
            margin-bottom: 0.2rem;
        }
        .dialogue-box .line:last-child {
            margin-bottom: 0;
        }

        .dialogue-box .zh {
            font-family: 'Noto Sans SC', sans-serif;
            margin-right: 0.3rem;
        }

        .dialogue-details {
            display: none;
            margin-left: 0.3rem;
        }

        .dialogue-details .pinyin-text {
            font-weight: 400;
            color: #6b5f52;
        }

        .dialogue-details .en-text {
            font-style: italic;
            color: #4a4037;
        }

        .dialogue-details .sep {
            color: #b8aa98;
            margin: 0 0.2rem;
        }

        .dialogue-box.show-translation .dialogue-details {
            display: inline;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1.1rem;
            color: #8f8172;
            background: #faf8f5;
            border-radius: 30px;
            border: 1px dashed #d5cbbc;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.8rem 3rem;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                border-radius: 28px;
                padding: 1rem 1.2rem;
                gap: 0.8rem;
            }
            .stats {
                text-align: center;
            }
            .search-box {
                padding: 0.1rem 0.1rem 0.1rem 1rem;
            }
            .search-box button {
                padding: 0.4rem 1rem;
                font-size: 0.8rem;
            }
            .vocab-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .vocab-card .char {
                font-size: 1.8rem;
            }
            .pinyin-global-toggle {
                justify-content: center;
            }
        }

        @media (min-width: 641px) and (max-width: 900px) {
            .vocab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 詞彙 <span>Level 3-14</span></h1>
            <div class="sub">Flashcard Mode · <strong>Click the Hanzi</strong> to reveal Pinyin</div>
            <div class="badge">🔍 Click the character to show pinyin · "Show Details" for meaning & dialogue</div>
        </div>

        <div class="toolbar">
            <div class="stats">
                <strong id="countDisplay">0</strong> words
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Chinese, Pinyin, or English..." autocomplete="off" />
                <button id="clearBtn">✕</button>
            </div>
            <button class="pinyin-global-toggle" id="pinyinGlobalToggle">
                <span class="icon">🔊</span>
                <span id="pinyinToggleLabel">Show All Pinyin</span>
            </button>
        </div>

        <div class="legend" id="legendContainer"></div>

        <div class="vocab-grid" id="vocabGrid"></div>
    </div>

    <script>
        // ------------------------------------------------------------
        // DATA — Level 3-14 Vocabulary (Traditional Hanzi)
        // ------------------------------------------------------------
        const vocabData = [{
            char: '公寓',
            pinyin: 'gōngyù',
            pos: 'N',
            en: 'Apartment',
            explanation: 'A housing unit in a building, often rented or owned. Common in cities.',
            dialogue: [
                { speaker: 'A', chinese: '我住在公寓裡。', pinyin: 'Wǒ zhù zài gōngyù lǐ.', english: 'I live in an apartment.' },
                { speaker: 'B', chinese: '那邊的公寓很新。', pinyin: 'Nàbiān de gōngyù hěn xīn.', english: 'The apartments over there are very new.' }
            ]
        }, {
            char: '工作',
            pinyin: 'gōngzuò',
            pos: 'Vi',
            en: 'To work / Job',
            explanation: 'As a verb, to be employed or engaged in a task. As a noun, one\'s job or occupation.',
            dialogue: [
                { speaker: 'A', chinese: '你在哪裡工作？', pinyin: 'Nǐ zài nǎlǐ gōngzuò?', english: 'Where do you work?' },
                { speaker: 'B', chinese: '我在一家銀行工作。', pinyin: 'Wǒ zài yī jiā yínháng gōngzuò.', english: 'I work at a bank.' }
            ]
        }, {
            char: '共同',
            pinyin: 'gòngtóng',
            pos: 'Vs-attr',
            en: 'Common / Shared',
            explanation: 'Describes something that is shared or done together by multiple people or groups.',
            dialogue: [
                { speaker: 'A', chinese: '我們有共同的目標。', pinyin: 'Wǒmen yǒu gòngtóng de mùbiāo.', english: 'We have a common goal.' },
                { speaker: 'B', chinese: '那我們一起努力吧。', pinyin: 'Nà wǒmen yīqǐ nǔlì ba.', english: 'Then let\'s work together.' }
            ]
        }, {
            char: '貢獻',
            pinyin: 'gòngxiàn',
            pos: 'N / V',
            en: 'Contribution / To contribute',
            explanation: 'As a noun, something given or offered to help achieve a goal. As a verb, to give one\'s time, effort, or resources.',
            dialogue: [
                { speaker: 'A', chinese: '他對社會貢獻很大。', pinyin: 'Tā duì shèhuì gòngxiàn hěn dà.', english: 'He has made great contributions to society.' },
                { speaker: 'B', chinese: '我敬佩他的付出。', pinyin: 'Wǒ jìngpèi tā de fùchū.', english: 'I admire his dedication.' }
            ]
        }, {
            char: '溝通',
            pinyin: 'gōutōng',
            pos: 'V',
            en: 'To communicate',
            explanation: 'To exchange information, ideas, or feelings effectively between people.',
            dialogue: [
                { speaker: 'A', chinese: '我們需要更多的溝通。', pinyin: 'Wǒmen xūyào gèng duō de gōutōng.', english: 'We need more communication.' },
                { speaker: 'B', chinese: '對，這樣才能避免誤解。', pinyin: 'Duì, zhèyàng cáinéng bìmiǎn wùjiě.', english: 'Yes, so we can avoid misunderstandings.' }
            ]
        }, {
            char: '夠',
            pinyin: 'gòu',
            pos: 'Adv',
            en: 'Enough / Sufficiently',
            explanation: 'Indicates that a quantity or degree is adequate. Often used with adjectives or verbs.',
            dialogue: [
                { speaker: 'A', chinese: '這筆錢夠嗎？', pinyin: 'Zhè bǐ qián gòu ma?', english: 'Is this amount of money enough?' },
                { speaker: 'B', chinese: '夠了，謝謝！', pinyin: 'Gòu le, xièxie!', english: 'Enough, thanks!' }
            ]
        }, {
            char: '購買',
            pinyin: 'gòumǎi',
            pos: 'V',
            en: 'To purchase',
            explanation: 'A formal verb for buying something, often used in business or written contexts.',
            dialogue: [
                { speaker: 'A', chinese: '我們需要購買新設備。', pinyin: 'Wǒmen xūyào gòumǎi xīn shèbèi.', english: 'We need to purchase new equipment.' },
                { speaker: 'B', chinese: '預算夠嗎？', pinyin: 'Yùsuàn gòu ma?', english: 'Is the budget enough?' }
            ]
        }, {
            char: '姑娘',
            pinyin: 'gūniang',
            pos: 'N',
            en: 'Girl / Young woman',
            explanation: 'A term for a young unmarried woman, often used in a warm or respectful way.',
            dialogue: [
                { speaker: 'A', chinese: '那位姑娘很漂亮。', pinyin: 'Nà wèi gūniang hěn piàoliang.', english: 'That young lady is very pretty.' },
                { speaker: 'B', chinese: '她是新來的同事。', pinyin: 'Tā shì xīn lái de tóngshì.', english: 'She is the new colleague.' }
            ]
        }, {
            char: '古',
            pinyin: 'gǔ',
            pos: 'Vs-attr',
            en: 'Ancient / Old (attributive)',
            explanation: 'Used to describe something from a distant past, like history, culture, or artifacts.',
            dialogue: [
                { speaker: 'A', chinese: '這是一座古建築。', pinyin: 'Zhè shì yī zuò gǔ jiànzhú.', english: 'This is an ancient building.' },
                { speaker: 'B', chinese: '它的歷史很悠久。', pinyin: 'Tā de lìshǐ hěn yōujiǔ.', english: 'It has a long history.' }
            ]
        }, {
            char: '古代',
            pinyin: 'gǔdài',
            pos: 'N',
            en: 'Ancient times',
            explanation: 'Refers to a historical period before modern times, often in the context of Chinese or world history.',
            dialogue: [
                { speaker: 'A', chinese: '古代中國有很多發明。', pinyin: 'Gǔdài Zhōngguó yǒu hěnduō fāmíng.', english: 'Ancient China had many inventions.' },
                { speaker: 'B', chinese: '我對古代歷史很感興趣。', pinyin: 'Wǒ duì gǔdài lìshǐ hěn gǎn xìngqù.', english: 'I am very interested in ancient history.' }
            ]
        }, {
            char: '古蹟',
            pinyin: 'gǔjī',
            pos: 'N',
            en: 'Historical site / Ruins',
            explanation: 'A place or structure that has historical significance, often preserved as a cultural heritage.',
            dialogue: [
                { speaker: 'A', chinese: '我們去參觀古蹟吧。', pinyin: 'Wǒmen qù cānguān gǔjī ba.', english: 'Let\'s go visit some historical sites.' },
                { speaker: 'B', chinese: '好，我知道附近有一個。', pinyin: 'Hǎo, wǒ zhīdào fùjìn yǒu yī gè.', english: 'OK, I know there is one nearby.' }
            ]
        }, {
            char: '古老',
            pinyin: 'gǔlǎo',
            pos: 'Vs',
            en: 'Ancient / Very old',
            explanation: 'Describes something that has existed for a very long time, often with a sense of tradition or wisdom.',
            dialogue: [
                { speaker: 'A', chinese: '這個村子很古老。', pinyin: 'Zhège cūnzi hěn gǔlǎo.', english: 'This village is very old.' },
                { speaker: 'B', chinese: '我們要保護它。', pinyin: 'Wǒmen yào bǎohù tā.', english: 'We need to protect it.' }
            ]
        }, {
            char: '顧',
            pinyin: 'gù',
            pos: 'V',
            en: 'To look after / To consider',
            explanation: 'Can mean to take care of (顧孩子) or to consider (顧全大局). Often used in compound words.',
            dialogue: [
                { speaker: 'A', chinese: '你應該顧及別人的感受。', pinyin: 'Nǐ yīnggāi gùjí biérén de gǎnshòu.', english: 'You should consider other people\'s feelings.' },
                { speaker: 'B', chinese: '你說得對，我會注意。', pinyin: 'Nǐ shuō de duì, wǒ huì zhùyì.', english: 'You\'re right, I\'ll pay attention.' }
            ]
        }, {
            char: '顧客',
            pinyin: 'gùkè',
            pos: 'N',
            en: 'Customer',
            explanation: 'A person who buys goods or services from a store or business.',
            dialogue: [
                { speaker: 'A', chinese: '我們要把顧客放在第一位。', pinyin: 'Wǒmen yào bǎ gùkè fàng zài dì yī wèi.', english: 'We should put customers first.' },
                { speaker: 'B', chinese: '對，這樣才能贏得信任。', pinyin: 'Duì, zhèyàng cáinéng yíngdé xìnrèn.', english: 'Yes, that\'s how we earn trust.' }
            ]
        }, {
            char: '故意',
            pinyin: 'gùyì',
            pos: 'Vs',
            en: 'Deliberate / On purpose',
            explanation: 'Describes an action done intentionally, not by accident.',
            dialogue: [
                { speaker: 'A', chinese: '他是故意這麼做的。', pinyin: 'Tā shì gùyì zhème zuò de.', english: 'He did it on purpose.' },
                { speaker: 'B', chinese: '為什麼他要這樣？', pinyin: 'Wèishénme tā yào zhèyàng?', english: 'Why would he do that?' }
            ]
        }, {
            char: '刮',
            pinyin: 'guā',
            pos: 'V',
            en: 'To scrape / To blow (wind)',
            explanation: 'To scrape a surface, or to describe wind blowing (刮風).',
            dialogue: [
                { speaker: 'A', chinese: '外面在颳風。', pinyin: 'Wàimiàn zài guā fēng.', english: 'It\'s windy outside.' },
                { speaker: 'B', chinese: '我們別出門了。', pinyin: 'Wǒmen bié chūmén le.', english: 'Let\'s not go out.' }
            ]
        }, {
            char: '乖',
            pinyin: 'guāi',
            pos: 'Vs',
            en: 'Well-behaved / Obedient',
            explanation: 'Describes a child or person who is good, obedient, and pleasant.',
            dialogue: [
                { speaker: 'A', chinese: '你的孩子真乖。', pinyin: 'Nǐ de háizi zhēn guāi.', english: 'Your child is so well-behaved.' },
                { speaker: 'B', chinese: '謝謝，他平時也很聽話。', pinyin: 'Xièxie, tā píngshí yě hěn tīnghuà.', english: 'Thanks, he is usually very obedient too.' }
            ]
        }, {
            char: '怪',
            pinyin: 'guài',
            pos: 'V / Vs',
            en: 'To blame / Strange',
            explanation: 'As a verb, to blame someone (怪他). As a stative verb, to be strange or odd.',
            dialogue: [
                { speaker: 'A', chinese: '這不能怪他。', pinyin: 'Zhè bùnéng guài tā.', english: 'You can\'t blame him for this.' },
                { speaker: 'B', chinese: '但他做的事很奇怪。', pinyin: 'Dàn tā zuò de shì hěn qíguài.', english: 'But what he did is very strange.' }
            ]
        }, {
            char: '關',
            pinyin: 'guān',
            pos: 'Vp',
            en: 'To close / To turn off',
            explanation: 'To shut or close something, such as a door, window, or electronic device.',
            dialogue: [
                { speaker: 'A', chinese: '請把門關上。', pinyin: 'Qǐng bǎ mén guān shàng.', english: 'Please close the door.' },
                { speaker: 'B', chinese: '好的，我順便關燈。', pinyin: 'Hǎo de, wǒ shùnbiàn guān dēng.', english: 'OK, I\'ll turn off the light as well.' }
            ]
        }, {
            char: '觀察',
            pinyin: 'guānchá',
            pos: 'V',
            en: 'To observe / To watch',
            explanation: 'To carefully watch and study something or someone in order to learn more.',
            dialogue: [
                { speaker: 'A', chinese: '他正在觀察鳥兒。', pinyin: 'Tā zhèngzài guānchá niǎor.', english: 'He is observing the birds.' },
                { speaker: 'B', chinese: '他有耐心，很適合做研究。', pinyin: 'Tā yǒu nàixīn, hěn shìhé zuò yánjiū.', english: 'He is patient and very suited for research.' }
            ]
        }];

        // ------------------------------------------------------------
        // RENDER ENGINE
        // ------------------------------------------------------------
        const grid = document.getElementById('vocabGrid');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const countDisplay = document.getElementById('countDisplay');
        const legendContainer = document.getElementById('legendContainer');
        const pinyinGlobalToggle = document.getElementById('pinyinGlobalToggle');
        const pinyinToggleLabel = document.getElementById('pinyinToggleLabel');

        let globalPinyinRevealed = false;

        // Legend
        const posSet = new Set(vocabData.map(d => d.pos));
        const posLabels = {
            'N': 'Noun',
            'V': 'Verb',
            'Vs': 'Stative Verb',
            'Vst': 'Stative/Transitive Verb',
            'Adv': 'Adverb',
            'Prep': 'Preposition',
            'M': 'Measure Word',
            'Ptc': 'Particle',
            'N/V': 'Noun / Verb',
            'Conj': 'Conjunction',
            'Det': 'Determiner',
            'V-sep': 'Separable Verb',
            'Vpt': 'Verb Particle (Trans.)',
            'Vi': 'Intransitive Verb',
            'Vp': 'Verb Particle',
            'Vaux': 'Auxiliary Verb',
            'Vs-attr': 'Attributive Stative Verb'
        };
        const dotColorMap = {
            'N': '#7ba9c9',
            'V': '#7fb06a',
            'Vs': '#5ba884',
            'Vst': '#5ba884',
            'Adv': '#c9a86a',
            'Prep': '#c97a9a',
            'M': '#9a7ac9',
            'Ptc': '#c9b86a',
            'N/V': '#7ba9c9',
            'Conj': '#f0d0b0',
            'Det': '#f0b0b0',
            'V-sep': '#6ab06a',
            'Vpt': '#6a7ab0',
            'Vi': '#6a9a9a',
            'Vp': '#7a7a9a',
            'Vaux': '#6a7a8a',
            'Vs-attr': '#80b080'
        };

        function buildLegend() {
            const sorted = Array.from(posSet).sort();
            let html = '';
            sorted.forEach(label => {
                const display = posLabels[label] || label;
                const color = dotColorMap[label] || '#b8aa98';
                html += `<span class="legend-item"><span class="legend-dot" style="background:${color};"></span>${display}</span>`;
            });
            legendContainer.innerHTML = html;
        }
        buildLegend();

        // Render function
        function render(filter = '') {
            const term = filter.trim().toLowerCase();
            let filtered = vocabData;

            if (term) {
                filtered = vocabData.filter(item => {
                    let dialogueSearch = '';
                    item.dialogue.forEach(line => {
                        dialogueSearch += line.chinese + ' ' + line.pinyin + ' ' + line.english + ' ';
                    });
                    const searchable = item.char + ' ' + item.pinyin + ' ' + item.en + ' ' + item.explanation + ' ' + dialogueSearch;
                    return searchable.toLowerCase().includes(term);
                });
            }

            countDisplay.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty">🔍 No matches found.</div>`;
                return;
            }

            let html = '';
            filtered.forEach((item, index) => {
                const posClass = 'pos-' + item.pos.replace('/', '-');
                const posDisplay = posLabels[item.pos] || item.pos;

                // Build dialogue HTML
                let dialogueHtml = '';
                dialogueHtml += `
                        <div class="dialogue-toggle-wrapper">
                            <strong>💬 Dialogue:</strong>
                            <button class="dialogue-toggle-btn" data-dialogue-idx="${index}">Show Pinyin & Translation</button>
                        </div>
                        <div class="dialogue-lines">
                    `;

                item.dialogue.forEach(line => {
                    const speakerClass = line.speaker === 'A' ? 'speaker-a' : 'speaker-b';
                    dialogueHtml += `
                            <div class="line">
                                <span class="${speakerClass}">${line.speaker}:</span>
                                <span class="zh">${line.chinese}</span>
                                <span class="dialogue-details">
                                    <span class="sep">·</span>
                                    <span class="pinyin-text">${line.pinyin}</span>
                                    <span class="sep">·</span>
                                    <span class="en-text">${line.english}</span>
                                </span>
                            </div>
                        `;
                });

                dialogueHtml += `</div>`;

                html += `
                        <div class="vocab-card" data-index="${index}">
                            <div class="char-row">
                                <span class="char">${item.char}</span>
                                <span class="pinyin-container" data-pinyin="${item.pinyin}" data-revealed="false">
                                    <span class="pinyin-value">${item.pinyin}</span>
                                </span>
                            </div>
                            <span class="pos ${posClass}">${posDisplay}</span>

                            <button class="details-toggle" data-target="details-${index}">
                                <span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)
                            </button>

                            <div id="details-${index}" class="details-content">
                                <div class="explanation">
                                    <div class="meaning-line">📘 ${item.en}</div>
                                    <br />
                                    <strong>📖 Usage:</strong> ${item.explanation}
                                </div>
                                <div class="dialogue-box" id="dialogue-box-${index}">
                                    ${dialogueHtml}
                                </div>
                            </div>
                        </div>
                    `;
            });

            grid.innerHTML = html;

            // ---- Click on the Hanzi toggles its pinyin ----
            document.querySelectorAll('.char').forEach(charEl => {
                charEl.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const row = this.closest('.char-row');
                    const pinyinContainer = row ? row.querySelector('.pinyin-container') : null;
                    if (!pinyinContainer) return;
                    const isRevealed = pinyinContainer.dataset.revealed === 'true';
                    const newState = !isRevealed;
                    pinyinContainer.dataset.revealed = newState ? 'true' : 'false';
                    pinyinContainer.classList.toggle('revealed', newState);
                });
            });

            // ---- Apply global state to all pinyin containers ----
            document.querySelectorAll('.pinyin-container').forEach(el => {
                const shouldReveal = globalPinyinRevealed;
                el.dataset.revealed = shouldReveal ? 'true' : 'false';
                el.classList.toggle('revealed', shouldReveal);
            });

            // ---- Toggle main details (Meaning/Explanation) ----
            document.querySelectorAll('.details-toggle').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const targetId = this.dataset.target;
                    const content = document.getElementById(targetId);
                    if (!content) return;

                    const isOpen = content.classList.contains('open');
                    if (isOpen) {
                        content.classList.remove('open');
                        this.classList.remove('active');
                        this.innerHTML = '<span class="arrow">▼</span> Show Details (Meaning, Explanation & Dialogue)';
                    } else {
                        content.classList.add('open');
                        this.classList.add('active');
                        this.innerHTML = '<span class="arrow">▲</span> Hide Details';
                    }
                });
            });

            // ---- Toggle dialogue pinyin/translation ----
            document.querySelectorAll('.dialogue-toggle-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = this.dataset.dialogueIdx;
                    const dialogueBox = document.getElementById(`dialogue-box-${idx}`);
                    if (!dialogueBox) return;

                    const isShowing = dialogueBox.classList.contains('show-translation');
                    if (isShowing) {
                        dialogueBox.classList.remove('show-translation');
                        this.textContent = 'Show Pinyin & Translation';
                    } else {
                        dialogueBox.classList.add('show-translation');
                        this.textContent = 'Hide Pinyin & Translation';
                    }
                });
            });

            updateGlobalToggleLabel();
        }

        // ---- Global Pinyin Toggle ----
        function updateGlobalToggleLabel() {
            if (globalPinyinRevealed) {
                pinyinToggleLabel.textContent = 'Hide All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔓';
            } else {
                pinyinToggleLabel.textContent = 'Show All Pinyin';
                pinyinGlobalToggle.querySelector('.icon').textContent = '🔊';
            }
        }

        pinyinGlobalToggle.addEventListener('click', function() {
            globalPinyinRevealed = !globalPinyinRevealed;
            document.querySelectorAll('.pinyin-container').forEach(el => {
                el.dataset.revealed = globalPinyinRevealed ? 'true' : 'false';
                el.classList.toggle('revealed', globalPinyinRevealed);
            });
            updateGlobalToggleLabel();
        });

        // ---- Search & Clear ----
        searchInput.addEventListener('input', () => render(searchInput.value));
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            render('');
            searchInput.focus();
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') clearBtn.click();
        });

        // ---- Initial render ----
        render('');
    </script>
</body>
</html>
